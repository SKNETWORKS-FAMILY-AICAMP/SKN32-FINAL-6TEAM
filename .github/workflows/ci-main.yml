# main 관문 — 내보내기 전에 전부 본다(2026-09-23 신설).
#   develop 관문(ci-develop.yml)이 보는 것에 더해 integration·e2e·security 와 Docker 빌드를 본다.
#   실제 LLM 호출 시험(live)은 pytest.ini 가 기본으로 뺀다 — 실제 키가 필요해서 CI 에 두지 않는다.
name: CI (main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (F·E9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check . --output-format=github

  test:
    name: 전체 시험 (live 제외)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acop_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 값은 전부 시험용 가짜다. 실제 키·서버 주소는 넣지 않는다.
      ACOP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/acop_ci
      ACOP_LLM_PROVIDER: mock
      ACOP_OPENAI_API_KEY: sk-dummy-for-ci
      ACOP_LLM_MODEL: gpt-4o-mini
      ACOP_EMBEDDING_MODEL: text-embedding-3-small
      ACOP_TENANT_ID: demo
      ACOP_SECRET_KEY: dummy-secret-key-for-ci-0123456789abcdef
      ACOP_COMPOSER_JWT_SECRET: dummy-composer-jwt-secret-for-ci-0123456789
      ACOP_COMPOSER_ISSUER_SECRET: dummy-composer-issuer-secret-for-ci-0123456789
      # acop_composer 는 final_project_sample/ 에 있다 — 이유는 ci-develop.yml 의 같은 줄 참고.
      PYTHONPATH: ${{ github.workspace }}/final_project_sample
    defaults:
      run:
        working-directory: final_project_cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: final_project_cs/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: DB 스키마 만들기
        run: python -m app.infrastructure.db.migrate
      - name: 프롬프트 등록
        run: python -m scripts.register_prompts
      # 기본 테넌트(demo)와 여행 데모 데이터. 승인 흐름 통합 시험이 이 테넌트를 전제한다.
      # 재실행 안전하고 DB 만 쓴다(외부 호출 없음).
      - name: 데모 데이터
        run: python -m scripts.seed_travel
      - name: 아키텍처 시험 (먼저 본다 — 가장 싸고 어기면 되돌리기 비싸다)
        run: python -m pytest tests/architecture -q
      # ★빼는 것 두 가지 — 둘 다 코드가 아니라 CI 에 없는 자원을 요구한다.
      #   tests/integration/rag: 정책 문서 코퍼스가 적재돼 있어야 한다(쇼핑몰 25문서·306청크,
      #     여행 12문서·130청크). 적재에는 실제 임베딩(OpenAI 키 · 로컬 1024칸 모델)이 필요해
      #     키·모델이 없는 CI 에서는 만들 수 없다. live 시험처럼 로컬·수동으로 돌린다.
      #   test_deactivating_does_not_erase_history: 새 DB 에는 과거 기록이 없다(ci-develop.yml 참고).
      - name: 전체 시험
        run: >-
          python -m pytest -q
          --ignore=tests/integration/rag
          --deselect tests/contract/test_active_prompts_are_the_deployed_set.py::test_deactivating_does_not_erase_history

  docker:
    name: Docker 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ★릴리스 대상은 final_project_cs 인데 아직 Dockerfile 이 없다(2026-09-23 확인).
      #   생기기 전까지는 참고 구현체(final_project_sample)의 것을 빌드해 빌드 경로만 지킨다.
      #   cs 에 Dockerfile 이 생기면 이 단계가 자동으로 그쪽을 빌드한다.
      - name: 빌드 대상 고르기
        id: pick
        run: |
          if [ -f final_project_cs/Dockerfile ]; then
            echo "context=final_project_cs" >> "$GITHUB_OUTPUT"
            echo "빌드 대상: final_project_cs"
          else
            echo "context=final_project_sample" >> "$GITHUB_OUTPUT"
            echo "::warning::final_project_cs 에 Dockerfile 이 없어 final_project_sample 을 빌드한다"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.pick.outputs.context }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
