# main 관문 — 내보내기 전에 전부 본다(2026-09-23 신설).
#   develop 관문(ci-develop.yml)이 보는 것에 더해 integration·e2e·security 와 Docker 빌드를 본다.
#   실제 LLM 호출 시험(live)은 pytest.ini 가 기본으로 뺀다 — 실제 키가 필요해서 CI 에 두지 않는다.
#
# ★언제 도나 `[2026-10-19 사용자 결정 — 「develop 테스트 너무 많다, 풀 테스트는 main 만」]`
#   **main 에 push 할 때와 main 으로 오는 PR 만.** develop 은 빠른 관문(ci-develop.yml)만 본다.
#   role-manager 는 검사하지 않는다(10-13 사용자: 「롤매니저는 검사 필요 없어」).
#   다른 가지에서 전체를 보고 싶으면 손으로 돌린다(Actions 탭 → CI (main) → Run workflow → 가지 고르기).
#   ☆이력: 처음(09-24)은 main 에서만. 10-08 통합 커밋이 이유 기록 없이 빠른·전체 관문을 role-manager · develop
#     모두로 넓혀 같은 커밋에 4번 → 10-12 1차 정리 2번 → 10-13 develop · main 에서 1번 → 10-19 다시 main 만.
#   ★저장소 맨 위 문서(wiki/ · program/ · 맨 위 *.md)만 바뀐 push 는 건너뛴다 — 파이썬 시험·린트가 읽지 않는 곳이다.
#     final_project_cs/wiki 는 건너뛰지 않는다(계약 시험이 그 문서를 코드와 대조한다).
#     PR 에는 이 필터를 걸지 않는다 — 필수 검사가 「대기」로 남아 병합이 막히는 것을 피한다.
#   ★main 의 필수 검사가 이 파일의 job 이름(「ruff (F·E9)」「전체 시험 (live 제외)」「Docker 빌드」)을 본다 — 이름을 바꾸지 않는다.
name: CI (main)

on:
  push:
    branches: [main]
    paths-ignore:
      - "wiki/**"
      - "program/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (F·E9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check . --output-format=github
      - name: Validate AWS deployment workflow expressions
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/cd-aws.yml

  test:
    name: 전체 시험 (live 제외)
    runs-on: ubuntu-latest
    # 평소 약 7분. 기본 제한(6시간) 대신 여러 배 여유로 끊는다 — 이유는 ci-develop.yml 의 같은 줄 참고.
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acop_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 서버 시각을 한국 시간으로 — 이유는 ci-develop.yml 의 같은 줄 참고.
      TZ: Asia/Seoul
      # DB 세션 시간대도 한국 시간으로 — 이유는 ci-develop.yml 의 같은 줄 참고.
      PGTZ: Asia/Seoul
      # 값은 전부 시험용 가짜다. 실제 키·서버 주소는 넣지 않는다.
      ACOP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/acop_ci
      # 진단 회귀는 명시한 시험 DB의 연결별 TEMP 표만 사용한다. 업무 DB로 대체하지 않는다.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/acop_ci
      ACOP_LLM_PROVIDER: mock
      ACOP_OPENAI_API_KEY: sk-dummy-for-ci
      ACOP_LLM_MODEL: gpt-4o-mini
      ACOP_EMBEDDING_MODEL: text-embedding-3-small
      ACOP_TENANT_ID: demo
      ACOP_SECRET_KEY: dummy-secret-key-for-ci-0123456789abcdef
      ACOP_COMPOSER_JWT_SECRET: dummy-composer-jwt-secret-for-ci-0123456789
      ACOP_COMPOSER_ISSUER_SECRET: dummy-composer-issuer-secret-for-ci-0123456789
      # acop_composer 는 final_project_sample/ 에 있다 — 이유는 ci-develop.yml 의 같은 줄 참고.
      PYTHONPATH: ${{ github.workspace }}/final_project_sample
    defaults:
      run:
        working-directory: final_project_cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: final_project_cs/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: DB 세션 시간대 확인 (Asia/Seoul 이 아니면 멈춘다)
        run: >-
          python -c "import psycopg; from app.infrastructure.db.session import database_dsn;
          tz = psycopg.connect(database_dsn()).execute('SHOW TIME ZONE').fetchone()[0];
          print('DB session TimeZone =', tz); assert tz == 'Asia/Seoul', tz"
      - name: DB 스키마 만들기
        run: python -m app.infrastructure.db.migrate
      - name: 프롬프트 등록
        run: python -m scripts.register_prompts
      # 기본 테넌트(demo)와 여행 데모 데이터. 승인 흐름 통합 시험이 이 테넌트를 전제한다.
      # 재실행 안전하고 DB 만 쓴다(외부 호출 없음).
      - name: 데모 데이터
        run: python -m scripts.seed_travel
      - name: 아키텍처 시험 (먼저 본다 — 가장 싸고 어기면 되돌리기 비싸다)
        run: python -m pytest tests/architecture -q
      # ★빼는 것 하나 — 코드가 아니라 CI 에 없는 자원을 요구한다.
      #   tests/integration/rag: 정책 문서 코퍼스가 적재돼 있어야 한다(쇼핑몰 25문서·306청크,
      #     여행 12문서·130청크). 적재에는 실제 임베딩(OpenAI 키 · 로컬 1024칸 모델)이 필요해
      #     키·모델이 없는 CI 에서는 만들 수 없다. live 시험처럼 로컬·수동으로 돌린다.
      #   ☆test_deactivating_does_not_erase_history 는 2026-09-24 고쳐 다시 넣었다(ci-develop.yml 참고).
      # --durations: 가장 오래 걸린 시험 25개를 로그 끝에 적는다 — 관문이 느려질 때 어디서 늘었는지 바로 보이게.
      # ★병렬 `[2026-10-12]` -n auto = 러너 CPU 수만큼 일꾼(GitHub 공개 저장소 ubuntu-latest 는 4개).
      #   일꾼마다 위에서 만든 DB 를 틀로 복사한 자기 DB 를 쓴다(final_project_cs/conftest.py).
      #   --dist loadfile: 한 파일의 시험은 한 일꾼이 순서대로 돈다 — 파일 안에서 앞 시험이 만든 상태를 뒤 시험이 쓰는 경우를 지킨다.
      #   병렬 전 1회 실측: 시험 5,122개 515초(실행 38256217003).
      - name: 전체 시험
        run: >-
          python -m pytest -q
          --ignore=tests/integration/rag
          -n auto --dist loadfile
          --durations=25

  docker:
    name: Docker 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ★`[2026-10-12 정정]` cs 의 배포 이미지를 빌드한다 — x600 서버의 cs 프로젝트 서버(api · worker)가 쓰는
      #   `final_project_cs/deploy/Dockerfile.api`(빌드 맥락 = final_project_cs/, docker-compose.yml 과 같다).
      #   ☆앞 판은 `final_project_cs/Dockerfile` 이 없으면 참고 구현체(final_project_sample)를 빌드했다. cs 의 Dockerfile 은
      #     처음부터 deploy/ 아래에 생겨 그 조건이 한 번도 참이 되지 않았고, 이 필수 검사는 배포와 무관한 이미지를 지키고 있었다.
      # 알림 문구 저장 파일은 git 밖(var/)이라 새 checkout 에 없다. 배포 스크립트(deploy/auto_deploy.sh)처럼 없으면 빈 표로 만든다.
      - name: 빌드에 필요한 git 밖 파일 채우기
        working-directory: final_project_cs
        run: |
          mkdir -p var
          [ -f var/notice_phrasebook.json ] || echo '{}' > var/notice_phrasebook.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: final_project_cs
          file: final_project_cs/deploy/Dockerfile.api
          push: false
          load: true
          tags: tripilot-validation:checking
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute checking regression in deployment AMD64 image
        run: >-
          docker run --rm --platform linux/amd64 --network none
          -e ACOP_LLM_PROVIDER=mock
          -e ACOP_OPENAI_API_KEY=sk-dummy-for-ci
          -e ACOP_LLM_MODEL=gpt-4o-mini
          -e ACOP_EMBEDDING_MODEL=text-embedding-3-small
          -e ACOP_TENANT_ID=demo
          -e ACOP_COMPOSER_JWT_SECRET=dummy-composer-jwt-secret-for-ci-0123456789
          -e ACOP_COMPOSER_ISSUER_SECRET=dummy-composer-issuer-secret-for-ci-0123456789
          -e ACOP_DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/acop_ci
          -e ACOP_SECRET_KEY=dummy-secret-key-for-ci-0123456789abcdef
          -e PYTHONPATH=/srv:/reference
          -v "$PWD/final_project_cs/tests:/srv/tests:ro"
          -v "$PWD/final_project_cs/pytest.ini:/srv/pytest.ini:ro"
          -v "$PWD/final_project_sample:/reference:ro"
          --entrypoint python tripilot-validation:checking
          -c 'import platform,subprocess,sys; assert platform.machine()=="x86_64", platform.machine(); print(platform.platform()); sys.exit(subprocess.call([sys.executable,"-m","pytest","tests/unit/travel/test_intake_risk_query_selection.py","tests/unit/travel/test_intake_risks.py","tests/unit/travel/test_intake_risks_parallel.py","tests/unit/travel/test_intake_its_snapshot.py","tests/unit/travel/test_response_cache.py","tests/unit/intake/test_intake_risks_trip_date.py","-q","--override-ini=cache_dir=/tmp/pytest-cache"]))'
