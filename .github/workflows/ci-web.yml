# 웹(고객 화면) 관문 — final_project_cs/frontend/apps/web 의 시험을 돌린다(2026-09-28 신설, ST4F-161).
#   check: 린트 · 타입 검사 · 단위 시험(Vitest) · 프로덕션 빌드
#   e2e:   데모 빌드를 브라우저로(Playwright). 백엔드 없이 돈다
#   live:  실제 연결 빌드를 mock 서버(tests/live/stub-server.mjs)에 붙여 브라우저로
#   ★`[2026-10-19 사용자 결정 — 「풀 테스트는 main 만」]` develop 에서는 check 만 돈다. live(브라우저 시험 4묶음, 약 15분)는
#     main 에 push · main 으로 오는 PR · 손으로 돌릴 때만 돈다(아래 env FULL).
#   ★웹 파일이 바뀐 PR·push 에서만 돈다. 이 시험들은 백엔드 없이 돌아서 다른 팀 변경으로는 결과가 바뀌지 않는다.
#     서버가 /v1/web/* 나 설문 모양을 바꿔 웹이 깨지는 것은 develop 관문의
#     tests/contract/test_web_client_contract.py 가 잡는다.
#   ★실서버 시험(test:real)은 넣지 않는다 — 팀 채팅 알림 · 외부 호출 · DB 에 시험 여행이 남는다
#     (playwright.real.config.ts 머리 주석).
# ★`[2026-10-13 사용자 결정]` GitHub 검사는 develop · main 에서만 돈다 — role-manager 는 검사하지 않는다(ci-main.yml 과 같다).
# ★`[2026-10-16 사용자 결정 — CI 시간 줄이기]` 한 작업에서 check → live(833개 · worker 1) 를 차례로 돌려 50분 안팎이 걸렸다.
#   check 와 live 를 따로 띄우고, live 는 독립된 실행 환경 4개로 나눠 동시에 돈다(Playwright --shard). 묶음마다 모방 서버 ·
#   빌드가 따로라 서로 상태를 건드리지 않는다. 한 묶음 안은 지금처럼 하나씩(workers 1) — workers 를 늘리면 모방 서버의
#   일정 · 로그 · 세션 상태를 시험끼리 나눠 써서 깨진다. 마지막 「web (check · e2e · live)」가 결과를 모아 하나라도 실패면 실패다.
# ★`[2026-10-27 — AWS 배포 대기 줄이기]` 4묶음 → 8묶음. main 실측(실행 40270328504): 시험 파일 147개 · 실행 합 3,493초인데
#   묶음 1이 1,100초(가장 짧은 묶음 632초)라 CI (web) 20분이 AWS 배포(CI (main) 9분 뒤)를 11분 더 붙잡았다. 묶음을 늘리면
#   묶음당 시험 시간이 약 440초로 준다(가장 긴 파일 233초). 묶음 안은 그대로 workers 1 — 시험 수 · 내용은 바꾸지 않는다.
#   필수 검사 이름(main 보호 규칙)은 이 묶음 이름을 보지 않는다(2026-10-27 확인: ruff · 전체 시험 · Docker 빌드).
name: CI (web)

on:
  push:
    branches: [develop, main]
    paths:
      - "final_project_cs/frontend/apps/web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "final_project_cs/frontend/apps/web/**"
      - ".github/workflows/ci-web.yml"
  # `[2026-10-16]` 다른 가지(role-manager 등)에서 손으로 돌려 볼 수 있게 — ci-main.yml 과 같다
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  # 전체(브라우저 시험까지) 볼 때 — main push · main 으로 오는 PR · 손으로 돌릴 때. develop 은 'false'
  FULL: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}

jobs:
  check:
    name: web check (린트 · 타입 · 단위 · 빌드)
    runs-on: ubuntu-latest
    env:
      # ★.env.local 은 저장소에 없다. 값이 없으면 프로덕션 빌드는 데이터 모드가 unconfigured 가 되어
      #   데모 시험이 전부 깨진다(src/lib/data-mode.ts).
      NEXT_PUBLIC_DATA_MODE: demo
      NEXT_PUBLIC_MAP_PROVIDER: demo
      # 로컬(KST)과 같은 시간대에서 돌린다 — 이유는 ci-develop.yml 의 같은 줄 참고.
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: final_project_cs/frontend/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json engines: >=22 <25
          node-version: 22
          cache: npm
          cache-dependency-path: final_project_cs/frontend/apps/web/package-lock.json
      - run: npm ci
      - name: 린트 · 타입 · 단위 시험 · 빌드
        run: npm run check

  live:
    name: web live ${{ matrix.shard }}/8
    # develop 에서는 건너뛴다(위 env FULL 과 같은 식 — job 의 if 에서는 env 를 읽지 못해 다시 쓴다)
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      # 한 묶음이 실패해도 나머지 묶음은 끝까지 돈다 — 실패를 한 번에 모두 본다
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # live 시험은 serve.mjs 가 데이터 모드를 live 로 덮어쓴다(값이 없어도 되지만 check 와 같은 바탕을 둔다)
      NEXT_PUBLIC_DATA_MODE: demo
      NEXT_PUBLIC_MAP_PROVIDER: demo
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: final_project_cs/frontend/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: final_project_cs/frontend/apps/web/package-lock.json
      - run: npm ci
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저 시험 (mock 서버) — ${{ matrix.shard }}/8 묶음
        run: npm run test:live -- --shard=${{ matrix.shard }}/8

  web:
    # 예전 단일 작업과 같은 이름 — 결과를 한 줄로 본다. check · live 여덟 묶음 중 하나라도 성공이 아니면 실패
    # develop(FULL=false)에서는 live 가 건너뜀(skipped)이라 check 만 본다
    name: web (check · e2e · live)
    needs: [check, live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 결과 모으기
        run: |
          echo "check: ${{ needs.check.result }} · live(8묶음): ${{ needs.live.result }} · 전체 관문: $FULL"
          test "${{ needs.check.result }}" = "success"
          if [ "$FULL" = "true" ]; then test "${{ needs.live.result }}" = "success"; fi
