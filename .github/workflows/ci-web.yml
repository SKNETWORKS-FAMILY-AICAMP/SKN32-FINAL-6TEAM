# 웹(고객 화면) 관문 — final_project_cs/frontend/apps/web 의 시험을 돌린다(2026-09-28 신설, ST4F-161).
#   check: 린트 · 타입 검사 · 단위 시험(Vitest) · 프로덕션 빌드
#   live:  실제 연결 빌드를 가짜 서버(tests/live/stub-server.mjs)에 붙여 브라우저로(Playwright). 백엔드 없이 돈다
#   ★`[2026-10-08]` 데모 빌드 시험(test:e2e)은 없다 — 2026-10-03 에 웹의 데모(모방) 모드와 tests/e2e 를 없앴다(src/lib/data-mode.ts:
#     NEXT_PUBLIC_DATA_MODE 는 live 하나, 아니면 「서버 연결이 설정되지 않았어요」 한 화면). 이 파일은 그동안 develop 에만 남아
#     옛 test:e2e 를 불렀다 — role-eval-ui 로 가져와 맞췼다(ST4F-202).
#   ★웹 파일이 바뀐 PR·push 에서만 돈다. 이 시험들은 백엔드 없이 돌아서 다른 팀 변경으로는 결과가 바뀌지 않는다.
#     서버가 /v1/web/* 나 설문 모양을 바꿔 웹이 깨지는 것은 develop 관문의
#     tests/contract/test_web_client_contract.py 가 잡는다.
#   ★실서버 시험(test:real)은 넣지 않는다 — 팀 채팅 알림 · 외부 호출 · DB 에 시험 여행이 남는다
#     (playwright.real.config.ts 머리 주석).
name: CI (web)

on:
  push:
    branches: [develop, main]
    paths:
      - "final_project_cs/frontend/apps/web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "final_project_cs/frontend/apps/web/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (check · live)
    runs-on: ubuntu-latest
    env:
      # ★.env.local 은 저장소에 없다. check 의 프로덕션 빌드를 실제 배포와 같은 모양(live · 무료 지도)으로 만든다 — 값이 없으면
      #   데이터 모드가 unconfigured 인 빌드가 되어 빌드는 통과하지만 배포판과 다르다(src/lib/data-mode.ts).
      #   live 시험은 tests/live/serve.mjs 가 live · 가짜 서버 주소 · osm 으로 따로 빌드한다(.next-live).
      NEXT_PUBLIC_DATA_MODE: live
      NEXT_PUBLIC_MAP_PROVIDER: osm
      # 로컬(KST)과 같은 시간대에서 돌린다 — 이유는 ci-develop.yml 의 같은 줄 참고.
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: final_project_cs/frontend/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json engines: >=22 <25
          node-version: 22
          cache: npm
          cache-dependency-path: final_project_cs/frontend/apps/web/package-lock.json
      - run: npm ci
      - name: 린트 · 타입 · 단위 시험 · 빌드
        run: npm run check
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저 시험 (가짜 서버)
        run: npm run test:live
