# develop 관문 — 빠르게 도는 것만 둔다(2026-09-23 신설).
#   린트: 버그만 잡는 최소 규칙(F·E9). 규칙 범위는 루트 ruff.toml 이 정한다.
#   시험: **DB 없이** 도는 architecture·contract·unit·security 만 돈다. `[2026-10-22]`
#         DB 가 있어야 도는 12개 파일은 tests/conftest.py 의 DB_TEST_FILES 로 `db` 표시를 붙여 `-m "not db"` 로 건너뛴다.
#         파일당 몇 초씩 걸리는 6개 파일은 `slow` 표시로 같이 건너뛴다(DB_TEST_FILES 옆 SLOW_TEST_FILES).
#         건너뛴 시험과 통합·e2e 와 Docker 빌드는 DB 가 있는 main 관문(ci-main.yml)에서 본다.
#         PostgreSQL 을 띄우고 스키마·프롬프트를 넣던 단계도 함께 뺐다.
#   실제 LLM 호출 시험(live)은 pytest.ini 가 기본으로 빼 둔다.
#
# ★언제 도나 `[2026-10-19 사용자 결정 — 「develop 테스트 너무 많다, 풀 테스트는 main 만」]`
#   **develop 에 push 할 때와 develop 으로 오는 PR** 에서 이 빠른 관문만 돈다. 전체 관문(ci-main.yml)은 main 에서만 돈다.
#   손으로도 돌릴 수 있다(Actions 탭 → Run workflow). role-manager 는 검사하지 않는다(10-13 결정 그대로).
#   저장소 맨 위 문서(wiki/ · program/ · 맨 위 *.md)만 바뀐 push 는 건너뛴다 — ci-main.yml 과 같은 이유.
#   ☆이력: 10-13 ~ 10-19 에는 손으로만 돌고, develop push 마다 전체 관문(약 8분) · 웹 브라우저 시험 4묶음(약 15분) ·
#     관리자 브라우저 시험이 함께 돌았다.
name: CI (develop)

on:
  push:
    branches: [develop]
    paths-ignore:
      - "wiki/**"
      - "program/**"
      - "*.md"
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (F·E9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 판을 고정한다 — 새 판이 규칙을 넓히면 관문이 갑자기 붉어진다.
      - run: pip install ruff==0.16.8
      - run: ruff check . --output-format=github

  test:
    name: architecture · contract · unit
    runs-on: ubuntu-latest
    # 기본 제한은 6시간이다 — 멈춘 시험 하나가 러너를 6시간 붙잡지 않게 짧게 끊는다(DB 없는 빠른 단계).
    timeout-minutes: 10
    env:
      # ★서버 시각을 한국 시간으로(2026-09-28). GitHub 러너는 UTC 인데, 시각을 현지 시간으로 다루는
      #   코드·시험이 9시간씩 밀려 main 관문에서 43건이 깨졌다(경복궁 09:00 → 00:00). 로컬(KST)과 맞춘다.
      TZ: Asia/Seoul
      # ★TZ 는 이 job 의 파이썬에만 먹는다. DB 는 별도 컨테이너(UTC)라 세션 시간대가 UTC 로 남아
      #   DB 에서 다시 읽은 시각(timestamptz)이 9시간 밀린다(코덱스 검증 2026-09-28). 로컬 DB 는 서버
      #   기본값이 Asia/Seoul 이라 안 드러났다. libpq 가 읽는 PGTZ 로 모든 연결의 세션 시간대를 맞춘다.
      PGTZ: Asia/Seoul
      # 값은 전부 시험용 가짜다. 실제 키·서버 주소는 넣지 않는다.
      ACOP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/acop_ci
      ACOP_LLM_PROVIDER: mock
      ACOP_OPENAI_API_KEY: sk-dummy-for-ci
      ACOP_LLM_MODEL: gpt-4o-mini
      ACOP_EMBEDDING_MODEL: text-embedding-3-small
      ACOP_TENANT_ID: demo
      ACOP_SECRET_KEY: dummy-secret-key-for-ci-0123456789abcdef
      ACOP_COMPOSER_JWT_SECRET: dummy-composer-jwt-secret-for-ci-0123456789
      ACOP_COMPOSER_ISSUER_SECRET: dummy-composer-issuer-secret-for-ci-0123456789
      # ★acop_composer(설정 변경 관리 채널)의 소스는 final_project_sample/ 에 있고
      #   requirements.txt 에는 없다. sample 을 pip 로 깔면 sample 의 app 패키지까지 깔려
      #   cs 의 app 과 이름이 겹치므로, 경로 뒤쪽에 붙여 acop_composer 만 찾게 한다.
      #   (로컬은 sample 이 편집 모드로 설치돼 있어서 이 문제가 안 드러났다 — 2026-09-24)
      PYTHONPATH: ${{ github.workspace }}/final_project_sample
    defaults:
      run:
        working-directory: final_project_cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: final_project_cs/requirements.txt
      - run: python -m pip install -r requirements.txt
      # ☆2026-09-24 test_deactivating_does_not_erase_history 를 여기서 빼 두었다가 되돌렸다 —
      #   「DB 에 비활성 프롬프트가 있나」(개발 DB 이력)를 세던 시험을, 시험 안에서 한 판을 올리고
      #   바꾼 뒤 옛 판이 남는지 보게(롤백되는 트랜잭션 안에서) 고쳤다. 빈 DB 에서도 성립한다.
      - name: 시험 (DB 없이)
        run: >-
          python -m pytest tests/architecture tests/contract tests/unit tests/security
          -q -m "not live and not db and not slow"
