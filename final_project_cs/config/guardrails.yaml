  # -- 구글 호출 예산 (2026-09-25 사용자 지시: 무료 한도를 **무조건** 넘지 않는다) --
  # ★키는 지도 API 전체에 열어 두고(나중에 경로·지오코딩 등을 쓸 수 있다), 제한은 **여기서 요금 단위마다** 건다.
  #   표에 없는 요금 단위는 **부르지 않는다**(`call_budget.CallBudget` — 한도를 모르면 막는다).
  # 무료 한도 = 공식 요금표의 「free usage cap」(월) `[확인 2026-09-25]`
  #   https://developers.google.com/maps/billing-and-pricing/pricing — null 은 무제한(세기만 한다).
  # ★상한 규칙(코드가 계산한다): **하루 = 무료 ÷ 32(내림), 월 = 무료 − 하루.**
  #   월 경계 시간대를 구글이 적어 두지 않았다 → UTC 월로 세고 월 + 하루 ≤ 무료 한도로 둔다
  #   (경계가 하루 어긋나 두 달에 걸쳐 세어져도 넘지 않게). 예: 1,000 → 하루 31 · 월 969.
  # 실패한 호출도 한 칸으로 센다(보수적). DB(`external_call_budget`, 027)에서 모든 프로세스가 같이 센다.
  # ★요금표가 바뀌면 이 표만 고친다. 호출하는 코드는 자기 요금 단위 이름만 안다.
