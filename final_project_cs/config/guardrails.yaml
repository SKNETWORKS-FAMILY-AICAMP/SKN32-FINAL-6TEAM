  # -- 관광공사 목록 운영시간 새벽 읽기 (2026-09-29 사용자 지시 — 「장소 갱신은 새벽 3시, 요청은 DB 만」, 마이그레이션 036) --
  # ★처음 보는 곳 · 목록 수정 시각이 바뀐 곳만 읽는다. 관광지·문화시설·레포츠 먼저, 쇼핑은 뒤.
  # ★출처: **우리가 고른 값** — 관광공사 개발 계정은 하루 1,000건(데이터 포털 확인 2026-09-29). 하룻밤 600건이면 낮에 400건이
  #   남는다(일정 짜기 · 1분 장소 채우기 · 채팅 조회). 한 번에(한 틱) 10곳 — 1분 작업이 길게 물지 않게.
  #   못 읽은 곳은 retry_days 뒤에 다시 본다. 목록 5,832곳을 처음 다 읽는 데 약 10밤(추정)
