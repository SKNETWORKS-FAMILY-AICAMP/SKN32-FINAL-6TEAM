# A-COP 가드레일 수치 — 단일 출처
#
# ★이 파일이 v5 수치의 유일한 정의처다. 같은 숫자를 코드에 다시 쓰지 않는다(RULE.md §3.1).
#   파이썬에서는 app.core.settings.guardrails 로만 읽는다.
# 계약 문서: docs/handoff/06_가드레일_수치.md
# 기준선:   ../A-COP_구현계획서_v5.md  §9-1, §10-4, §11, §12, §14-3, §15

version: "1.0"

# ── Context Pack 토큰 예산 (v5 §9-1) ────────────────────────────────
# ★12,000 의 근거는 모델 context window 한계가 아니다.
#   (1) 건당 LLM 비용 통제 (2) lost-in-the-middle 품질 저하 완화 (3) 실험 재현성.
context:
  token_budget: 12000
  sections:
    system_instruction: 1800   # 고정 — 제거하지 않음
    case_state:         2400   # 고정 — 제거하지 않음
    tool_facts:         2400
    policy_rag:         3600
    history_summary:    1200
    similar_cases:       600
  # 예산 초과 시 이 순서로 제거한다 (deterministic)
  eviction_order:
    - similar_cases
    - history_detail
    - low_score_rag
    - duplicate_tool_facts
  # 어떤 경우에도 제거하지 않는다
  never_evict:
    - case_state
    - latest_safety_policy
  max_evidence_items: 40
  max_similar_cases: 3
  max_history_summary_chars: 10000

# ── 신뢰성 가드레일 (v5 §11) ────────────────────────────────────────
reliability:
  llm_call_timeout_seconds: 20
  # ★로컬 파인튜닝 추론은 원격 API 보다 느리다. 같은 20초를 물리면
  #   그 경로가 타임아웃난다 — 그래서 **키를 나눈다.** 값을 코드에
  #   박아 두면 설정이 통제하지 못한다(2026-09-03).
  local_ft_call_timeout_seconds: 120
  llm_retry_attempts: 2          # exponential
  llm_fallback_attempts: 1
  malformed_json_repair_attempts: 1
  team_timeout_seconds: 90
  case_wall_clock_seconds: 180
  # ★아래 셋은 **아직 강제되지 않는다**(2026-09-03 실측). Controller 는 Case 당
  #   Team 을 한 번 실행하고(+리뷰 1회) 끝나므로 셀 반복 자체가 없다. 다단계
  #   그래프 런타임이 생기면 그때 여기를 읽어 강제한다.
  #   ★적어 두는 이유: 설정에 값이 있으면 그게 지켜지는 줄 알게 된다. 안 지켜지면
  #   안 지켜진다고 적는 것이 이 파일의 일이다.
  graph_max_steps: 12
  max_team_tasks_per_case: 6
  max_tool_calls_per_case: 12
  # 동일 tool + 정규화 arguments signature 가 이 횟수만큼 반복되면 escalated (v5 §10-4)
  # ★이 값 자체는 코드가 읽지 않는다. `ReadToolbox` 가 같은 tool+arguments 를
  #   두 번째로 부르면 `ToolLoopExceeded` 를 던지는 방식으로 **2 를 구현**한다.
  #   숫자를 바꿔도 동작은 안 바뀐다 — 바꾸려면 코드를 고쳐야 한다.
  repeated_tool_signature_limit: 2
  daily_cost_limit_usd_per_tenant: 50
  outbox_stale_processing_seconds: 300
  # ★분류가 멈춘 Case 를 되잡는 기준 (2026-09-03). Case 생성 커밋과 분류
  #   사이에 프로세스가 죽으면 `classifying` 에 남는다 — outbox 의 stale
  #   처리와 같은 성격이라 같은 자리에 둔다.
  classification_stuck_after_seconds: 300
  classification_sweep_limit: 100
  # ★접수 뒤 실행이 시작조차 못 한 Case 를 되잡는 기준 (2026-09-03).
  #   `run_case` 를 응답 뒤로 뺀 뒤 생긴 틈이다. 분류 쪽보다 길게 잡는다 —
  #   에이전트 실행은 원래 수십 초 걸리므로 짧으면 정상 실행을 되잡는다.
  routing_stuck_after_seconds: 600
  routing_sweep_limit: 50

# ── 동시성 (v5 §6-1) ────────────────────────────────────────────────
concurrency:
  max_recompute_attempts: 2      # StateConflict 시 최신 Case 를 읽어 재계산
  max_active_runs_per_case: 1

# ── WAIT / RESUME (v5 §5-4) ─────────────────────────────────────────
resume:
  token_ttl_hours: 24
  single_use: true
  store_plaintext: false         # ★hash 만 저장. true 로 바꾸지 않는다
  # TTL 만료는 자동 종료가 아니라 escalated + 운영자 알림
  on_expiry: escalate

# ── RAG (v5 §9-2) ───────────────────────────────────────────────────
rag:
  document_count: 25
  chunk_total_min: 300
  chunk_total_max: 400
  chunks_per_document_min: 12
  chunks_per_document_max: 16
  top_k: 8
  embedding_model: text-embedding-3-small
  embedding_dim: 1536            # DDL vector(1536) 과 일치. 바꾸면 DDL·적재분도 함께 바꾼다
  index: hnsw_vector_cosine_ops
  # Phase 2 — feature flag 뒤. 기본 경로에 넣지 않는다 (v5 §3)
  hybrid_bm25_enabled: false
  rerank_enabled: false

# ── VOC 급증 정의 (v5 §14-3) ────────────────────────────────────────
# 급증 =  today >= max(surge_min_count, surge_ratio * avg7)  AND  today - avg7 >= surge_min_delta
# ★z-score / embedding clustering / topic modeling 금지 (v5 §3 Out)
feedback_analytics:
  batch_time_utc: "00:10"
  lookback_days: 7
  surge_min_count: 5
  surge_ratio: 1.5
  surge_min_delta: 3

# ── 보안 · scope (v5 §12) ───────────────────────────────────────────
security:
  scopes:
    - case:read
    - case:write
    - order:read
    - return:read
    - action:approve
    - mcp:read
    - composer:read
    - composer:validate
    - composer:write
    # ★선언 **전체**를 갈아끼우거나 이력의 revision 으로 되돌리는 scope
    #   (`POST /composer/apply`·`/composer/restore`). composer:write(항목 하나
    #   단위 `/toggle`·`/changes`)와 분리한다 — 통째 교체는 설치·복원·이관용
    #   관리자 도구이지 운영자 화면의 버튼이 아니다. 두 운영자가 전체본을
    #   동시에 보내면 한쪽이 남의 변경을 덮거나 항상 409 로 튕긴다
    #   (v9 §8-D · D-011, 2026-09-06).
    - composer:admin
    - ops:introspect
    # ★바뀐 선언을 **실행 중인 프로세스**에 반영시키는 scope
    #   (`POST /admin/reload`). composer:write(저장)와 분리한다 — 저장은 되돌릴
    #   수 있지만 반영은 그 순간 트래픽이 받는 것을 바꾼다. 저장하는 사람과
    #   반영 시점을 정하는 사람이 같아야 할 이유도 없다 (2026-09-06, sample 이식).
    - ops:reload
    # ★여행(Trip) — 일정 등록·조회와 고객 신고·재요청(다른 안 교체·되돌림).
    #   `case:*` 와 나눈다 — Trip 은 Case 보다 오래 살고(여행 끝까지), 쓰기가
    #   일정 버전을 올린다(v11 §4-B · §6-C-6). 2026-09-14 추가.
    - trip:read
    - trip:write
  composer_jwt_ttl_minutes: 30
  # ★MCP 에는 mcp:read 외 어떤 scope 도 부여하지 않는다
  mcp_allowed_scopes:
    - mcp:read
  retention_days: 90
  # audit 에 원문으로 기록하지 않는 것
  audit_forbidden_fields:
    - api_key
    - payment_identifier

# ── 평가 (v5 §15) ───────────────────────────────────────────────────
evaluation:
  golden_size: 60                # order 15 / shipping 15 / return 15 / exchange 15
  holdout_size: 20               # ★평가 기간 중 프롬프트 수정에 쓰지 않는다
  repeats: 3
  seed: 7
  bootstrap_iterations: 10000
  bootstrap_ci: 0.95
  mcnemar_exact_threshold: 25    # discordant 셀 수 < 25 면 exact
  judge_pass_rule: "safety>=3 and correctness>=3 and total>=16"
  ablations:
    - no_context_broker
    - no_team_split
    - no_approval
    - no_rag
    - no_feedback_inline

# ── 여행 외부 소스 (2026-09-09 신설) ────────────────────────────────
travel:
  # 바깥 호출 상한(초). ★reliability.team_timeout_seconds(90) 보다 작아야 한다 —
  #   안 그러면 Team 이 먼저 죽어 어느 소스가 늦었는지 못 가른다.
  source_timeout_seconds: 8
  # ★같은 요청의 응답을 몇 초 동안 재사용하나. 감시 루프 한 틱이 항목 여럿을 점검할 때
  #   특보(인자 없음)·대기질(시도 단위)·지진(날짜 단위)이 같은 요청을 연달아 보냈고,
  #   둘째부터 속도 제한에 걸려 「모름」→ 치명이 됐다(2026-09-14 실측). 0 이면 끈다.
  # ★출처: **우리가 고른 값**이다. 특보·대기질이 대개 시간 단위로 갱신되니 5분이면
  #   놓치는 것이 작다고 봤다 — 측정은 안 했다.
  source_cache_seconds: 300
  # ★재난문자만 길게 둔다 — 하루 한도가 100 으로 낮다(`[미확인]`, 같은 플랫폼 다른 API
  #   사용기). 20분이면 하루 최대 72회. 감시 루프는 90분 앞을 보니 20분 늦음은 견딘다고 봤다.
  # ★출처: **우리가 고른 값**이다.
  disaster_msg_cache_seconds: 1200
  # ★한 번에 몰려 나갈 수 있는 호출 수(소스마다). 하루 합계는 여전히 한도 안이다
  #   (`ratelimit.interval_for` 가 몰림만큼 보충을 줄인다). 1 이면 고정 간격 그대로다.
  # ★출처: **우리가 고른 값** — 한 틱에 점검할 항목 수(90분 안에 시작하는 일정)를 넉넉히 덮는 수.
  rate_burst: 10
  weather:
    # ★★이 둘은 **판정 기준이 아니라 주의 문구 기준**이다.
    #   운영 규정(취소·순연 기준)은 `read.policy` 가 대야 하고, 그게 없으면
    #   Team 은 "규정 기준은 확인되지 않았다" 라고 말한다. 여기 숫자로
    #   「불가」를 만들지 않는다 — 근거 없는 확정이 되기 때문이다
    #   (CLAUDE.md §0.1).
    # ★출처: 정해진 것이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    #   여행 정책 코퍼스가 생기면 이 둘은 사라지고 규정이 그 자리를 받는다.
    advisory_precipitation_probability: 60   # %
    advisory_wind_speed_kmh: 40
  earthquake:
    # ★지진은 **사건**이라 일정 변경 사유(이상)가 될 수 있다. 다만 전국 어디 지진이든
    #   바꾸면 안 되니 거리·규모로 가른다. 반경 안 + 규모 이상 → 이상, 반경 안 + 규모
    #   미만 → 주의, 반경 밖 → 무시(국외 지진은 대개 여기서 걸러진다).
    # ★출처: 정해진 기준이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    #   운영 규정(시설 점검·운영 중단 기준)이 생기면 그것으로 바꾼다.
    magnitude_min: 4.0          # 규모
    radius_km: 100              # 진앙 ~ 장소
    lookback_hours: 24          # 일정 시각(또는 지금) 전 몇 시간의 지진을 보나
