    gate:
      # soft: 밀도를 나쁘게 만드는 안은 순위에서 뒤로 밀고, **더 나은 안이 하나도 없을 때만** 감수하며 알림에 적는다(고장 난 항목을 그대로 두는 것이 더 나쁘다).
      # hard: 구조 위반(겹침 · 이동 불가)처럼 막는다 — 다 걸리면 「그대로 두었어요」.
      mode: soft
      # 이미 목표를 넘은 날에서 이 비율보다 더 넘기면 「더 나빠졌다」로 본다. 0.02 = 하루 12시간 창에서 약 14분. 이보다 작은 흔들림은 일정 하나를 바꿀 때마다 생기는 잡음이라 본다.
      worsen_tolerance: 0.02
  # ★`[2026-10-03]` 일정 **품질 경고**(`itinerary_quality`) — 거절하지 않고 화면 「살펴볼 점」(`warnings`)으로 알린다. 체크리스트 T7(끼니) · T8(같은 곳 두 번) · T9(왔다 갔다).
  #   ★아래 값은 **우리가 고른 값**이다(측정 안 함). 외부 연구(AI 일정 하루의 같은 곳 두 번 5.1% · 지그재그 9.5%)가 흔한 결함이라고 한 것을 잡되, 잡음을 줄이려고 넉넉히 잡았다.
  #   재볼 방법: `eval/` 에서 결함일 비율을 재 보고(체크리스트 v2 §7) 이 값을 조정한다.
  quality:
    # 끼니 — 그날의 첫 일정이 창 시작 이전이고 마지막 일정이 창 끝 이후인데(하루가 창을 통째로 덮는데) 식사(`dining`)가 창과 겹치지 않으면 알린다
    meal_windows:
      lunch: ["11:30", "14:00"]
      dinner: ["17:30", "20:30"]
    # 하루 항목(이동 제외)이 이보다 적으면 부분 일정(도착 저녁 · 반일 투어)으로 보고 끼니를 안 본다
    meal_min_items: 2
    # ★`[2026-10-03 적대 검토]` 그 시간대에 **식사 항목은 없어도 비어 있는 틈이 이만큼(분) 이상이면** 끼니 경고를 내지 않는다 — 점심을 일정표에 안 적고 자유 시간으로 두는 일정이 흔하다.
    #   틈이 이보다 짧아 다른 일정이 시간대를 채우면 「식사할 틈이 없다」로 알린다. 한 끼 길이(`planner.MEAL_MIN` 60분)와 같다. **우리가 고른 값**(측정 안 함)
    meal_min_gap_minutes: 60
    # 왔다 갔다 — 그날 활동 장소를 도는 길이가 가장 짧은 순서의 길이보다 `ratio` 배 이상이고 `min_extra_m` 이상 더 멀면 알린다.
    #   `max_stops` 초과는 안 본다(순서를 다 세어 보는 방식이라 8곳이 4만 가지) · 시간이 정해진 일정(예약 · 고객이 고정)이 둘 이상이면 순서를 못 바꾸므로 안 본다
    zigzag:
      min_stops: 3
      max_stops: 8
      min_extra_m: 3000
      ratio: 1.5
  # 바깥 호출 상한(초). ★reliability.team_timeout_seconds(90) 보다 작아야 한다 —
  #   안 그러면 Team 이 먼저 죽어 어느 소스가 늦었는지 못 가른다.
  source_timeout_seconds: 8
  # ★같은 요청의 응답을 몇 초 동안 재사용하나. 감시 루프 한 틱이 항목 여럿을 점검할 때
  #   특보(인자 없음)·대기질(시도 단위)·지진(날짜 단위)이 같은 요청을 연달아 보냈고,
  #   둘째부터 속도 제한에 걸려 「모름」→ 치명이 됐다(2026-09-14 실측). 0 이면 끈다.
  # ★출처: **우리가 고른 값**이다. 특보·대기질이 대개 시간 단위로 갱신되니 5분이면
  #   놓치는 것이 작다고 봤다 — 측정은 안 했다.
  source_cache_seconds: 300
  # ★`[2026-10-03 사용자]` 응답 캐시를 **프로세스를 건너 공유**한다(true) — DB 표 `source_response_cache`(마이그레이션 042). 일꾼이 회차마다 새 프로세스라 메모리 캐시는 틱 사이에 비어 있었고
  #   고객 요청 경로와도 나누지 못했다. 공개 소스(기상 · 대기질 · 특보 · 지진 · 재난문자 · 교통 · 공휴일)만 담고, DB 가 안 되면 메모리 캐시로 계속한다. false 면 전처럼 메모리만.
  # ★효과(계산 — 측정 아님): 위 유지 시간(300초)이 감시 주기(180초)보다 길어 **틱 둘에 한 번만** 새로 받는다 — 받아 쓰는 값은 늘 180초 이하다. 재난문자만 위 20분을 그대로 쓴다(설계값).
  source_cache_shared: true
  # ★재난문자만 길게 둔다 — 하루 한도가 100 으로 낮다(`[미확인]`, 같은 플랫폼 다른 API
  #   사용기). 20분이면 하루 최대 72회. 감시 루프는 90분 앞을 보니 20분 늦음은 견딘다고 봤다.
  # ★출처: **우리가 고른 값**이다.
  disaster_msg_cache_seconds: 1200
  # ★관광공사(장소 · 운영시간 원문)만 길게 — 하루 한도 1000(`[미확인]` 보수값)을 계획 읽기 · 일정 짜기 · 채팅이 나눠 쓴다.
  #   같은 장소를 되풀이해 물으면 둘째부터 한도를 안 쓴다. 프로세스 메모리에만 둔다(저장하지 않는다).
  # ★출처: **우리가 고른 값**(2026-09-28) — 운영시간이 하루 안에 바뀌는 일은 드물고, 당일 판정은 새벽 구글 확인이 한다.
  tour_api_cache_seconds: 21600
  # ★한 번에 몰려 나갈 수 있는 호출 수(소스마다). 하루 합계는 여전히 한도 안이다
  #   (`ratelimit.interval_for` 가 몰림만큼 보충을 줄인다). 1 이면 고정 간격 그대로다.
  # ★출처: **우리가 고른 값** — 한 틱에 점검할 항목 수(90분 안에 시작하는 일정)를 넉넉히 덮는 수.
  rate_burst: 10
  # ★소스마다 몰림 허용을 따로 줄 때(없으면 `rate_burst`). 하루 합계는 여전히 그 소스 한도 안이다.
  #   관광공사: 계획 읽기 한 건이 장소마다 연달아 부른다 — 9개 질의에 11번(2026-09-27 실측). 10 으로는
  #   11번째가 거절됐다. 30 이면 접수 둘이 연달아 와도 들어간다. 보충 간격은 86.4초 → 89.0초로 늘어난다.
  # ★출처: **우리가 고른 값**.
  rate_burst_by_source:
    tour_api: 30
  # ── 위임 범위 (v11 §12 DoD-18~21 · wiki `teams/booking-handoff.md` 「위임 범위」) ──
  # ★무엇을 재는 값인가. 승인 뒤 **공급자 원장을 사람 손 없이 바꾸는 분기**(자동 실행)가
  #   열리는 한계다. 여기를 하나라도 벗어나면 원장을 건드리지 않고 사람에게 간다.
  #   ★공급자 등급 게이트(`travel.delegation` 이 아니라 데이터 `supplier_bookings.tier`)와
  #   **둘 다** 통과해야 한다 — 등급은 「누구의 원장인가」, 여기는 「얼마까지 맡겼나」다.
  # ★★출처: **우리가 고른 값**이다. 측정에서 나오지 않았고 계약에서도 나오지 않았다
  #   (wiki 가 N·M·K 를 `[미확보]` 로 두고 있었다 — 값을 비워 두면 판정이 코드에 박히므로
  #   자리를 여기 만들고 고른 값을 적는다). 실제 업체 협약이 생기면 그 협약이 이 자리를 받는다.
  # ★「위임이 살아 있는가」는 여기 없다 — 데이터다(`delegations` 테이블, 마이그레이션 019).
  #   설정으로 두면 한 고객의 철회가 전원에게 적용되고, 철회 시각·주체가 남지 않는다.
  delegation:
    # M — 건당 상한. 50,000원. ★`bookings.amount_cents` 와 **같은 단위(전)** 로 둔다 —
    #   원 단위로 적어 두면 비교할 때마다 100 을 곱해야 하고 그 자리가 버그 자리가 된다.
    max_per_action_cents: 5000000
    # N — 여행(=고객) 전체 누적 상한. 150,000원. 같은 고객의 **성공한 자동 실행 금액 합**이다
    max_total_cents: 15000000
    # K — 같은 예약에 자동 실행을 몇 번까지. 2회. 3회째는 사람이 본다
    max_changes_per_booking: 2
    # 대상 종류 — `bookings.kind`. ★항공·숙박은 넣지 않는다(잠긴 예약, v11 §5)
    kinds:
      - activity
      - dining
    # 되돌림 조건 — 「무료 취소 구간 안에서만」. 출발 이만큼 앞까지가 그 구간이라고 본다.
    # ★구간을 벗어난 건은 자동 실행을 열지 않는다 — 되돌릴 수 없는 것을 사람 손 없이 하지 않는다
    free_cancellation_lead_hours: 72
    # 되돌림 기한 — 실행 시점부터 이만큼. 실제 기한은 이것과 무료 취소 구간 끝 중 **이른 쪽**이다
    revert_window_hours: 24
  weather:
    # ★★이 둘은 **판정 기준이 아니라 주의 문구 기준**이다.
    #   운영 규정(취소·순연 기준)은 `read.policy` 가 대야 하고, 그게 없으면
    #   Team 은 "규정 기준은 확인되지 않았다" 라고 말한다. 여기 숫자로
    #   「불가」를 만들지 않는다 — 근거 없는 확정이 되기 때문이다
    #   (CLAUDE.md §0.1).
    # ★출처: 정해진 것이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    #   여행 정책 코퍼스가 생기면 이 둘은 사라지고 규정이 그 자리를 받는다.
    advisory_precipitation_probability: 60   # %
    advisory_wind_speed_kmh: 40
  reminders:
    # ★일정 안내(v11 §6-B ②·③) 시각. `app/modules/travel_ops/trip_reminders.py`.
    # ★출처: 정해진 기준이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    # ★`[2026-09-24 사용자 지시]` ③ 이동 알림은 **이동을 시작하는 그 시각**에 간다 — 앞에 붙이는 분이 없다.
    #   앞 판의 `departure_lead_minutes: 15` 를 지웠다. 이동 시간·여유는 일정의 이동 항목이 품는다
    #   (출발 = 다음 일정 시작 − 이동 시간 − 여유, D-020).
    day_start_lead_minutes: 60      # 그날 첫 항목 시작 몇 분 전에 하루 시작 안내
    # ★`[결정 2026-09-24]` 전날 안내를 **끈다.** 알림은 ① 하루 시작 ② 다음 일정 ③ 이동 — 새벽 3시에 전날까지의
    #   이슈를 모아 하루 시작 알림에서 한 번에 알린다(D-020). 전날 저녁 안내는 그 구성에 없다.
    eve_hour: null                  # 전날 몇 시에 다음 날 안내. 끄려면 null
  earthquake:
    # ★지진은 **사건**이라 일정 변경 사유(이상)가 될 수 있다. 다만 전국 어디 지진이든
    #   바꾸면 안 되니 거리·규모로 가른다. 반경 안 + 규모 이상 → 이상, 반경 안 + 규모
    #   미만 → 주의, 반경 밖 → 무시(국외 지진은 대개 여기서 걸러진다).
    # ★출처: 정해진 기준이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    #   운영 규정(시설 점검·운영 중단 기준)이 생기면 그것으로 바꾼다.
    magnitude_min: 4.0          # 규모
    radius_km: 100              # 진앙 ~ 장소
    lookback_hours: 24          # 일정 시각(또는 지금) 전 몇 시간의 지진을 보나

# -- 웹 남용 방어 (2026-09-28 사용자 지시 · 계획 `wiki/records/plans/2026-09-28_2130_웹_남용방어_실행계획.md`) --
# 저장 `web_usage` · `runtime_limits`(마이그레이션 031). 코드 `app/modules/travel_ops/web_guard.py`.
# ★여기 값은 **기본값**이다. 운영 API(`/admin/limits`)로 바꾼 값이 있으면 그것이 이긴다(범위 = `bounds`).
web_guard:
  # ★`[사용자 결정 2026-09-28]` 개발 단계라 **꺼 둔다.** 꺼져 있어도 세기는 한다(운영 API 의 오늘 사용량 · 실제 비용 산정 재료).
  limits_enabled: false
  # ── 제안 기본값 산정 `[추정]` — 실제 호출 수를 재지 않았다. 재면 다시 계산한다 ──────────────────
  # 1) 아까운 것 = 공용 하루 한도. 돈은 지금 설정에서 거의 안 든다(모델은 로컬 Ollama, 유료 API 는 무료 한도 예산 027 안).
  #    관광공사 하루 1,000(`ACOP_RATE_TOUR_API_PER_DAY` — 미확인·보수적) · 카카오 하루 1,000(`travel.kakao_budget`) ·
  #    모델 시간 하루 86,400초(GPU 1대).
  # 2) 웹 몫 = 한도 × 0.5(나머지 반은 감시 루프·새벽 확인·카탈로그 동기화) × **안전 댐퍼 0.5** = 관광공사 250 · 카카오 250 · 모델 21,600초.
  # 3) 1회당 쓰는 양 `[추정 — 상한 쪽]`
  #      계획 읽기  관광공사 15(장소 5 × 좁혀 찾기 최대 3) · 카카오 5 · 모델 50초(사진 한 장 ~45초 + 가리키기)
  #      일정 짜기  관광공사 30(고른 장소 15 × 영업시간 찾기+읽기 2) · 모델 20초
  #      확인       외부 호출 0(다시 조립·판정) — 계획 읽기 한 번에 한 번이라 서비스 상한은 계획 읽기와 같게
  #      여행 만들기 관광공사 15 · 채팅 관광공사 1(주소·운영시간 질문, 6시간 캐시) · 모델 3초
  # 4) 웹 몫을 작업에 나눈다 — 계획 읽기 30% · 일정 짜기 40% · 여행 만들기 10% · 채팅 20%.
  #    서비스/일 = min(소스별 몫 ÷ 1회당) → 계획 읽기 5 · 일정 짜기 3 · 확인 5 · 여행 만들기 1 · 채팅 50.
  # 5) 키당/일 = min(보통 필요 × 2, 서비스) — 보통 필요: 계획 읽기 2 · 일정 짜기 2 · 확인 2 · 여행 만들기 1 · 채팅 30.
  #    주소당/일 = min(키당 × 3(한 집·행사장), 서비스).
  # ★병목은 관광공사 하루 한도다. 운영 계정으로 한도를 올리면(예: 10배) 서비스 상한도 같은 비율로 올린다.
  limits:
    intake:      {per_key_day: 4,  per_ip_day: 5,  service_day: 5}
    plan:        {per_key_day: 3,  per_ip_day: 3,  service_day: 3}
    confirm:     {per_key_day: 4,  per_ip_day: 5,  service_day: 5}
    trip_create: {per_key_day: 1,  per_ip_day: 1,  service_day: 1}
    message:     {per_key_day: 50, per_ip_day: 50, service_day: 50}
    # 모델 예열(2026-09-29) — 실제로 모델을 부를 때만 센다(이미 올라가 있거나 `warmup.dedupe_seconds` 안이면 안 센다).
    #   관광공사·카카오를 안 쓰고 한 토큰 생성이라 위 산정과 다르다. 출처: **우리가 고른 값** — 화면을 하루 30번 연다고 보고
    #   키당 30 · 주소당 ×3 · 서비스는 하루 1,440분 ÷ 예열 간격 1분 = 1,440 이하로 500
    warmup:      {per_key_day: 30, per_ip_day: 90, service_day: 500}
    # 장소 검색 · 대체 후보 · 사진(2026-10-02, 확인 화면 수정 화면) — 카카오 키워드 검색(하루 1,000건을 접수 읽기와 나눠 쓴다)과 관광공사 사진 조회를 부른다.
    #   출처: **우리가 고른 값**(2026-09-30 「지도에서 장소 고르기」 계획의 기본값 그대로) — 카카오 몫 절반(500)을 서비스 상한으로 두어 접수 읽기 몫을 남기고,
    #   키당 60(수정 화면을 몇 번 열어도 넉넉) · 주소당 200(한 집·행사장)
    place_search: {per_key_day: 60, per_ip_day: 200, service_day: 500}
  bounds:
    count: {min: 1, max: 100000}          # 횟수 한도가 받는 범위(0 으로 끄지 않는다 — 끄는 것은 limits_enabled)
    session_per_ip_hour: {min: 1, max: 1000}
    session_hours: {min: 1, max: 8760}    # 세션 수명 · 게스트 보존 시간(시간 단위) — 1시간 ~ 1년
  cache_seconds: 30                       # 운영이 바꾼 값을 프로세스가 이만큼 캐시 — 반영이 이만큼 늦을 수 있다
  # 화면 안 지도 종류(`[사용자 결정 2026-09-29]`) — 운영 설정 `web.map_provider` 로 바꾼다. 기본 무료 지도(OSM, 개발·시연용 —
  #   타일 정책상 많이 쓰면 막힐 수 있다). google 이면 `POST /v1/web/map-load` 가 구글 지도 예산을 확보한다
  map_provider:
    default: osm
    choices: [osm, google]
  # ── 브라우저 세션(쿠키) · 게스트 보존 — `[결정 2026-10-04 사용자]` D-CS-011 ─────────────────────────────
  # ★출처: 게스트 보존은 **재방문 간격 공식**으로 구한 초기값이다(`wiki/decisions/D-CS-011-browser-session-cookie.md` §2) —
  #   `T* = t0·[(α−1)/(ρ·t0)]^(1/α)`, t0=30분 · α=1.2(뉴스 포털 방문 간격, 여행 게스트 실측 아님) · ρ=1%/일(정책값, 근거 없음) → 6.4일 → 7일.
  #   24시간은 재방문의 54% 만 살린다(계산). **여행 게스트의 실제 재방문 간격을 못 찾았다 — 초기값일 뿐이고 관리 콘솔에서 조절한다.**
  guest_idle_hours: 168             # 로그인 안 한 사용자 — 마지막 사용 뒤 이만큼 지나면 세션이 끝나고 데이터가 지워진다
  member_idle_hours: 168            # 소셜 계정을 붙인 사용자의 세션 — 마지막 사용 뒤 이만큼. `[추정]` 구글로 한 번에 다시 로그인된다
  session_max_hours: 720            # 모든 세션의 절대 수명(만든 뒤) — 30일. 쿠키 `Max-Age` 도 이 값
  session_touch_seconds: 60         # 마지막 사용 시각을 이보다 잦게 쓰지 않는다(요청마다 쓰기를 막는다)
  guest_cleanup_enabled: true       # 게스트 정리(만료된 게스트의 여행 · 접수 · 세션 · 키 · 사용자 삭제)
  # 게스트(웹으로 만든 사용자 중 소셜 계정이 안 붙은 사용자)의 제한 — 출처: **우리가 고른 값**(사용자 「나머지는 니 제한대로」)
  guest:
    max_trips: 1                    # 여행 개수 — 사용자 행 잠금으로 동시 생성까지 막는다
    trip_start_max_days: 365        # 여행 시작일 상한(오늘부터)
    trip_length_max_days: 7         # 여행 길이 상한(일) — 기준 상품(서울 · 최대 7일 · 4인)
    trip_grace_days: 3              # 일정이 남은 게스트는 **마지막 일정 종료 뒤 이만큼**까지 지우지 않는다(계획서 링크 · 알림이 그때까지 산다)
    trip_keep_max_days: 180         # 단 마지막 사용 + 이만큼이 상한 — 날짜를 빌미로 영구 보존하지 않는다(상한은 지금이 아니라 마지막 사용 기준)
  ip_retention_hours: 48                  # 주소 해시 줄을 이만큼 뒤 지운다(개인정보 — 제한용으로만 짧게)
  usage_retention_days: 35                # 키·서비스 사용량 줄(비용 산정 재료)
  warmup:
    # 이 초 안에 이미 예열을 시작했으면 다시 부르지 않는다(프로세스 안). 출처: 우리가 고른 값 — 한 토큰 예열이
    #   식은 모델에서 35초 안팎(ui 세션 실측 35~37초)이라 그보다 길게
    dedupe_seconds: 60
  turnstile:
    # Cloudflare 문서 `[확인 2026-09-28]` developers.cloudflare.com/turnstile/get-started/server-side-validation
    verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
    timeout_seconds: 5
    max_token_chars: 2048                 # 문서: 토큰 최대 2,048자 · 5분 유효 · 한 번만 확인

# ── 이동 계산기(app/modules/travel_ops/mobility/engine) 정책 수치 ──────────────────────
# ★`[2026-09-29 이동 계산기 문제목록 #49]` 엔진 규칙 JSON(rules_v0.3.json)에 따로 있던 값을 여기로 옮겼다 — 그 JSON 에는
#   `value_from: guardrails:mobility.…` 표시만 남는다. 값은 옮기기 전과 같다(이동 담당 판정 규칙 v0.9.1).
# ★출처: 이동 담당이 고른 값(grade 추정) — 근거 문장은 규칙 JSON 의 같은 칸에 남아 있다. 합성 여행 20~30건으로 조정 예정.
mobility:
  buffer:
    by_stage:                     # 지연 흡수 여유(분) — 소요가 아니라 「성립」과 「안전하게 성립」의 차이
      planning: 10
      pre_departure: 10
      in_progress: 15             # 진행 중에는 되돌릴 시간이 없어 더 보수적으로
  limits:
    transfers:                    # 환승 상한(회) — 성립해도 이 일행에게 무리면 탈락
      default: 2
      infant: 1
      fatigue_high: 1
      elderly: 1
    walk_m:                       # 도보 상한(m, 직선) — 1.04 m/s 기준 약 19분
      default: 1200
      infant_or_luggage: 800
  staleness:
    timetable_warn_days: 30       # 시간표가 이보다 오래되면 경고(판정 불가가 아니라 재수집 신호)
    walk_speed_recheck_days: 90   # 보행 속도 가정을 다시 잴 주기
