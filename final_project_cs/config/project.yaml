modules:
  vector_rag:
    enabled: true
  graph_store:
    enabled: true
  a2a_executor:
    enabled: false
  mcp:
    enabled: true
  voc:
    enabled: true
  ops_ui:
    enabled: true
ports:
  team_executor: local
  message_broker: outbox
  graph_store: sql
teams:
- team_id: activity
  active: true
  implementation_ref: app.domains.travel_ops.instances.activity:ActivityTeam
  required: false
  capabilities:
  - activity.check_cancelable
  - activity.check_feasible
  - activity.propose_change
  - activity.itinerary
  - activity.itinerary_question
  - activity.submit_itinerary
  hooks:
  - similarity
  - watch:activity
- team_id: booking_handoff
  active: true
  implementation_ref: app.domains.travel_ops.instances.booking_handoff:BookingHandoffTeam
  required: false
  capabilities:
  - booking.verify
  - booking.prepare_change
  - booking.prepare_cancel
  - booking.prepare_revert
  hooks: []
- team_id: mobility
  active: true
  implementation_ref: app.domains.travel_ops.instances.mobility:MobilityTeam
  required: false
  capabilities:
  - mobility.check_route
  - mobility.status
  - mobility.exception
  - mobility.itinerary
  - mobility.itinerary_question
  hooks:
  - legs
  - watch:mobility
- team_id: dining
  active: true
  implementation_ref: app.domains.travel_ops.instances.dining:DiningTeam
  required: false
  capabilities:
  - dining.check_open
  - dining.check_conditions
  - dining.itinerary
  - dining.itinerary_question
  hooks:
  - dining_ledger
  - watch:dining
- team_id: lodging
  active: true
  implementation_ref: app.domains.travel_ops.instances.locked:LodgingTeam
  required: false
  capabilities:
  - lodging.status
  hooks: []
- team_id: flight
  active: true
  implementation_ref: app.domains.travel_ops.instances.locked:FlightTeam
  required: false
  capabilities:
  - flight.status
  hooks: []
response_review:
  enabled: false
  owner_team_id: travel_response_review
