modules:
  vector_rag:
    enabled: true
  graph_store:
    enabled: true
  a2a_executor:
    enabled: false
  mcp:
    enabled: true
  voc:
    enabled: true
  ops_ui:
    enabled: true
ports:
  team_executor: local
  message_broker: outbox
  graph_store: sql
teams:
- team_id: activity
  active: true
  required: false
  capabilities: [activity.check_cancelable, activity.check_feasible, activity.propose_change, activity.itinerary, activity.itinerary_question, activity.submit_itinerary]
  hooks: [similarity, activity_ledger, watch:activity]
  implementation_ref: app.domains.travel_ops.instances.activity:ActivityTeam
  required: false
  capabilities:
  - activity.check_cancelable
  - activity.check_feasible
  - activity.propose_change
  - activity.itinerary
  - activity.itinerary_question
  - activity.submit_itinerary
  hooks:
  - similarity
  - activity_ledger
  - watch:activity
- team_id: booking_handoff
  active: true
  required: false
  capabilities: [booking.verify, booking.prepare_change, booking.prepare_cancel, booking.prepare_revert]
  hooks: []
  implementation_ref: app.domains.travel_ops.instances.booking_handoff:BookingHandoffTeam
  required: false
  capabilities:
  - booking.verify
  - booking.prepare_change
  - booking.prepare_cancel
  - booking.prepare_revert
  hooks: []
- team_id: mobility
  active: true
  required: false
  capabilities: [mobility.check_route, mobility.status, mobility.exception, mobility.itinerary, mobility.itinerary_question]
  hooks: [legs, watch:mobility]
  implementation_ref: app.domains.travel_ops.instances.mobility:MobilityTeam
  required: false
  capabilities:
  - mobility.check_route
  - mobility.status
  - mobility.exception
  - mobility.itinerary
  - mobility.itinerary_question
  hooks:
  - legs
  - watch:mobility
- team_id: dining
  active: true
  required: false
  capabilities: [dining.check_open, dining.check_conditions, dining.itinerary, dining.itinerary_question]
  hooks: [dining_ledger, watch:dining]
  implementation_ref: app.domains.travel_ops.instances.dining:DiningTeam
  required: false
  capabilities:
  - dining.check_open
  - dining.check_conditions
  - dining.itinerary
  - dining.itinerary_question
  hooks:
  - dining_ledger
  - watch:dining
# ★2026-10-07 숙소 팀 — 숙소 찾기 · 내 숙소 위치 · 일정 숙소 항목(마이리얼트립 · 구글 호텔, 예약은 링크로). 본체는 instances/lodging/
- team_id: lodging
  active: true
  implementation_ref: app.domains.travel_ops.instances.lodging:LodgingTeam
  required: false
  capabilities:
  - lodging.assist
  - lodging.status
  - lodging.itinerary
  - lodging.itinerary_question
  hooks:
  - lodging_ledger
# ★2026-10-08 항공 팀 — 항공편 찾기 · 일정 항공편 항목(마이리얼트립 · Ignav · 구글 항공권, 예약은 링크로). 본체는 instances/flight/
#   옛 「등록만」 두 팀(`instances/locked/`)은 등록에서 빠졌고 코드는 그대로 둔다.
- team_id: flight
  active: true
  implementation_ref: app.domains.travel_ops.instances.flight:FlightTeam
  required: false
  capabilities:
  - flight.assist
  - flight.status
  - flight.itinerary
  - flight.itinerary_question
  hooks: []
response_review:
  enabled: false
  owner_team_id: travel_response_review
