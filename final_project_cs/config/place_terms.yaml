# 장소 설명 말 표 — 계획 글의 한 줄에서 **가게 이름이 아닌 말**(종류 · 끼니 · 지역 근처 · 예약)을 알아보는 사전이다.
# `[2026-10-03 ui 세션 요청서 「장소 해석 개선」]`
#
# ★왜 표인가: 「성수 예약 식당」 「서울역 인근 저녁 식당」 「이태원 소품숍」처럼 **이름 없이 종류 + 지역만** 적은 줄은 코드에 단어를 박아서는 끝이 없다.
#   새 말이 나오면 **이 표에 한 줄을 더한다** — 코드는 그대로다(`intake/line_parts.py` 가 이 표만 읽는다). 틀린 곳도 표를 고친다.
# ★규칙: 한 줄의 말을 위 분류로 **전부 설명할 수 있고**(남는 조각이 없고) 종류 말이나 끼니 말이 있으면 「이름 없는 줄」이다. 남는 조각(= 고유 이름)이 있으면
#   지금처럼 이름으로 찾는다(「토속촌삼계탕」 · 「광장시장 빈대떡」).
# ★지역 말(성수 · 이촌동 · 서울역 …)은 이 표에 없다 — DB 에서 만든다(`intake/areas.py`: 관광공사 목록 주소의 동 · 요식 원장의 허브 · 구).
# ★값은 모두 「우리가 고른 값」이다(실제 계획 글을 보며 넓혀 간다). 중복되는 말은 앞의 것이 이긴다.

# 종류 말 — 이름을 대신하는 일반명사. `kind` 는 일정의 종류(activity · dining), `content_type` 은 관광공사 분류 번호(후보를 같은 분류로 거를 때 쓴다)
categories:
  - label: 식당
    kind: dining
    content_type: "39"
    terms: [식당, 맛집, 레스토랑, 음식점, 밥집, 먹거리, 한식, 양식, 일식, 분식, 고깃집, 술집, 이자카야, 브런치, 노포]
  - label: 카페
    kind: dining
    content_type: "39"
    terms: [카페, 커피숍, 커피, 디저트, 디저트카페, 베이커리, 빵집]
  - label: 쇼핑
    kind: activity
    content_type: "38"
    terms: [쇼핑, 쇼핑몰, 쇼핑센터, 소품숍, 소품샵, 편집숍, 편집샵, 기념품, 기념품숍, 기념품점, 백화점, 아울렛, 면세점]
  - label: 숙소
    kind: activity
    content_type: "32"
    terms: [호텔, 숙소, 숙박, 게스트하우스, 호스텔, 모텔, 펜션]
  - label: 관광지
    kind: activity
    content_type: "12"
    terms: [관광, 관광지, 명소]
  - label: 문화시설
    kind: activity
    content_type: "14"
    terms: [박물관, 미술관, 갤러리, 전시, 전시회, 공연, 공연장]

# 끼니 말 — 먹는 때. 있으면 일정은 식사(dining)다. 종류 말과 부딪히면(호텔 조식) 끼니 말이 이긴다.
meals:
  - label: 아침
    terms: [아침, 조식, 아침식사]
  - label: 점심
    terms: [점심, 중식, 점심식사, 런치]
  - label: 저녁
    terms: [저녁, 석식, 저녁식사, 디너, 야식]
  - label: 식사
    terms: [식사, 끼니]

# 지역 근처를 뜻하는 말 — 앞의 지역 말과 함께 「그 둘레」를 가리킨다
proximity: [인근, 근처, 주변, 일대, 부근, 근방, 인접, 쪽]

# 예약 말 — 이름이 아니다. `value` 가 있으면 예약했다(true) · 안 했다(false)는 뜻이고, 없으면 그냥 군더더기다.
booking:
  - terms: [예약한, 예약된, 예약해둔, 예약해놓은, 예약완료]
    value: true
  - terms: [예약없는, 예약안한, 미예약]
    value: false
  - terms: [예약]

# 군더더기 — 조사 · 어미 · 어림말. 이것만으로는 이름도 종류도 아니다
fillers: [에서, 에서의, 에, 의, 로, 으로, 쯤, 즈음, 정도, 같은, 하는, 할만한, 곳, 장소, 한곳, 맛있는, 유명한, 좋은]

# 지역 말 설정 — 어디서 얼마나 넓게 보는가
areas:
  # 같은 말이 여러 출처에 있을 때 앞의 것이 이긴다(허브는 요식 원장이 모은 사람들이 몰리는 곳)
  priority: [hub, dong, district]
  # 같은 곳을 부르는 다른 말 — 「말: 지명 사전에 있는 이름」. 가리키는 곳이 사전에 없으면 이 줄은 쓰이지 않는다(지어내지 않는다)
  aliases:
    홍대: 서교동
    홍대입구: 서교동
    건대: 화양동
    건대입구: 화양동
    신촌: 창천동
    강남역: 역삼동
    북촌: 가회동
  # 지역 중심에서 후보를 찾는 반경(m) — 출처마다
  radius_m:
    hub: 1500
    dong: 1200
    district: 4000
  # 이름 끝에 이 글자가 붙은 지역은 그것을 뗀 짧은 말로도 부른다(성수동 → 성수 · 성동구 → 성동)
  short_forms: [동, 구]
  # 지역 말로 알아볼 최소 글자 수(한 글자 말이 이름 조각과 우연히 맞는 것을 막는다)
  min_length: 2

# 관광공사 분류 번호 → 화면에 보일 종류 이름 — 후보 · 검색 결과 · 현재 장소의 `category` 를 채운다
content_types:
  "12": 관광지
  "14": 문화시설
  "15": 축제·공연
  "25": 여행코스
  "28": 레포츠
  "32": 숙박
  "38": 쇼핑
  "39": 음식점
