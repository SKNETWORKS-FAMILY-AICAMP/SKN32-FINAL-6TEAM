# 서울 대표 장소 정답표 — 계획 글의 흔한 다른 이름을 **정해진 한 곳**으로 묶는다. `[2026-10-19 계획서 읽기 진단 포인트 2]`
#
# ★왜 표인가: 2026-10-19 세 환경(x600 · 오라클 · AWS) 계획서 기록에서 대표 장소가 엉뚱한 곳에 붙었다 —
#   창덕궁 → 서울 운현궁, 국립중앙박물관 → 서울아프리카페스티벌, 국립민속박물관 → 오촌댁, 명동 롯데호텔 서울 → 「명동」,
#   광장시장 → 삼모녀꼬마김밥(한 가게, 24회). 근거: wiki/records/reports/2026-10-19_chat-intake-secretary-review.md 「2」.
#   이름 비슷하기 찾기로는 막을 수 없다 — 고객이 가리킨 곳이 정해져 있는 대표 장소는 표로 고정한다.
# ★쓰는 법(`intake/landmarks.py`): 원문 조각이 `aliases` 의 말이면 `name` 으로 찾고, **찾은 곳의 이름이 `name`(또는 `accept`)과 같을 때만** 받는다.
#   다른 이름이 나오면 버리고 「대표 장소를 자료에서 찾지 못했다」로 둔다(엉뚱한 곳을 붙이느니 못 찾았다고 말한다).
#   좌표 · 관광공사 번호는 이 표에 적지 않는다 — 언제나 자료(우리 장소 표 · 관광공사 · 카카오)가 낸 값을 쓴다(값을 지어내지 않는다).
# ★`kind` — place(한 곳) · zone(시장 · 거리 · 동네: 가게 하나로 좁히지 않는다) · lodging(숙소: 숙소 자료에서만 찾는다).
# ★`hours` — 대표 장소의 운영시간(관광공사 운영시간 표가 비어 있을 때만 쓴다 — `intake/hours.py`). 출처 · 확인 날짜를 같이 적는다.
#   `varies` 는 「점포마다 다르다」처럼 하나로 말할 수 없다는 것이 출처의 답일 때 — 「모름」 대신 그 이유를 보인다(열려 있다고 지어내지 않는다).
#   요일 키는 mon~sun, `weekend` 는 sat · sun 을 함께 뜻한다. `months` 가 있으면 그 달에만 쓴다.
#   `conditions` 는 정말 휴무 · 입장 제한이 될 수 있는 것만(휴무 줄이 「확인해 주세요」가 된다) · `tips` 는 방문 안내(부속 시설 따로 예약 등 —
#   휴무 판정에 넣지 않고 휴무 줄 뒤에 안내로만 붙는다) · `notes` 는 출처 차이 같은 기록(화면에 안 띄운다). `[2026-10-20]`
# ★값은 「우리가 고른 값」(별칭) + 「출처가 있는 값」(운영시간)이다. 새 대표 장소는 이 표에 한 덩이를 더한다 — 코드는 그대로다.

landmarks:
  - name: N서울타워
    kind: place
    aliases: [N서울타워, 엔서울타워, 남산타워, 남산서울타워, 서울타워, N타워, 남산N타워, YTN서울타워]
    hours:
      source: "티켓 판매처 · 여행 안내 여러 곳(waug.com · timeticket.co.kr) — 공식 사이트 문장은 확인하지 못함"
      checked: "2026-10-19"
      week:
        mon: {open: "10:30", close: "22:30"}
        tue: {open: "10:30", close: "22:30"}
        wed: {open: "10:30", close: "22:30"}
        thu: {open: "10:30", close: "22:30"}
        fri: {open: "10:30", close: "22:30"}
        weekend: {open: "10:00", close: "23:00"}
      notes: ["평일 마감은 출처마다 22:00~22:30 으로 다르다 — 여러 출처가 같은 22:30 을 썼다", "매표는 마감 30분 전까지(waug.com)"]
  - name: 창덕궁과 후원
    kind: place
    aliases: [창덕궁, 창덕궁과 후원, 창덕궁 후원, 창덕궁후원, 비원]
    accept: [창덕궁]
    hours:
      source: "한국관광공사 대한민국 구석구석 등록 내용(검색 결과 요약 · 궁능유적본부 원문은 열지 못함)"
      checked: "2026-10-19"
      closed: [mon]
      seasons:
        - months: [2, 3, 4, 5, 9, 10]
          open: "09:00"
          close: "18:00"
          last_entry: "17:00"
        - months: [6, 7, 8]
          open: "09:00"
          close: "18:30"
        - months: [11, 12, 1]
          open: "09:00"
          close: "17:30"
      tips: ["후원은 따로 예약해야 들어갈 수 있어요"]
  - name: 국립중앙박물관
    kind: place
    aliases: [국립중앙박물관, 중앙박물관, 국중박]
  - name: 국립민속박물관
    kind: place
    aliases: [국립민속박물관, 민속박물관]
  - name: 경복궁
    kind: place
    aliases: [경복궁]
  - name: 청계천
    kind: zone
    aliases: [청계천, 청계천 산책로, 청계광장]
    hours:
      source: "청계광장 상시 개방 · 연중무휴(관광 정보 사이트에 옮겨진 관광공사 자료) · 비 오면 산책로가 잠길 수 있음(서울시설공단 청계천 이용 시 주의)"
      checked: "2026-10-19"
      always_open: true
      conditions: ["비가 많이 오면 산책로가 갑자기 잠길 수 있어요(서울시설공단)"]
  - name: 광장시장
    kind: zone
    aliases: [광장시장, 광장전통시장, 종로광장시장]
    hours:
      source: "한국관광공사(visitkorea.or.kr) 등록 내용 「점포 별로 상이함」 — 관광공사 자료를 옮긴 정보 페이지에서 확인"
      checked: "2026-10-19"
      varies: "시장 안 점포마다 영업시간 · 쉬는 날이 달라요(한국관광공사)"
  - name: 인사동
    kind: zone
    aliases: [인사동, 인사동길, 인사동 거리, 인사동거리]
  - name: 익선동
    kind: zone
    aliases: [익선동, 익선동 한옥거리, 익선동한옥마을, 익선동 한옥마을]
  - name: 성수동 카페거리
    kind: zone
    aliases: [성수동 카페거리, 성수 카페거리, 성수동카페거리]
  - name: 롯데호텔 서울
    kind: lodging
    aliases: [롯데호텔 서울, 명동 롯데호텔, 롯데호텔 명동, 명동 롯데호텔 서울, 소공동 롯데호텔, 롯데호텔 소공동]

# 숙소를 뜻하는 말 — 줄에 이 말이 있으면 장소는 **숙소 자료에서만** 찾는다(식당 · 관광지 후보를 버린다). `[2026-10-19]`
#   ☆경복궁스테이 · 노스텔지어 더블재 · 트레블로지가 요식 원장(인허가 자료)의 같은 이름 식당으로 찾혀 「식사」가 됐다.
#   `words` 는 띄어 쓴 한 조각과 같을 때, `suffixes` 는 한 조각의 끝이 이 말일 때(「경복궁스테이」), `brands` 는 조각이 이 말로 시작할 때.
lodging:
  words: [호텔, 숙소, 숙박, 게스트하우스, 호스텔, 모텔, 펜션, 리조트, 레지던스, 한옥스테이, 스테이, 체크인, 체크아웃, 퇴실, 입실]
  suffixes: [호텔, 스테이, 게스트하우스, 호스텔, 모텔, 레지던스, 리조트]
  brands: [트레블로지, 트래블로지, 이비스, 신라스테이, 나인트리, 코트야드, 페어필드, 글래드, 머큐어, 노보텔, 힐튼, 하얏트, 메리어트, 웨스틴, 포포인츠]
  #: 숙소 줄에서 이름이 아닌 말 — 찾을 때 뗀다(「숙소 노스텔지어 더블재」 → 「노스텔지어 더블재」)
  strip: [숙소, 숙박, 체크인, 체크아웃, 퇴실, 입실]
