<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영자 콘솔 · 로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;color:#1F1E1B;background:#F4F3EF}

<body>
<div style="box-sizing: border-box; width: 1440px; padding: 8px 16px; background: #1F1E1B; color: #F4F3EF; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px">운영자 콘솔 와이어프레임 v1.2 (2026-09-29) · S-01 로그인 · 정적 사본 — 값은 모두 자리표시, 버튼은 동작하지 않음 · <a href="index.html" style="color: #F4F3EF">화면 목록</a></div>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #F4F3EF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1F1E1B">
<main style="width: 440px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 16px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px dashed #A64B0A; color: #8A3E08; font-size: 13px; font-weight: 600">데모 데이터 — 서버에 저장되지 않음</span>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #1F1E1B; color: #F4F3EF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">t</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">triPilot 운영자 콘솔</h1>
<span style="font-size: 13px; color: #5B5953">발급받은 운영자 계정으로 로그인합니다</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="operator-id" style="font-size: 14px; font-weight: 600">운영자 ID</label>
<input id="operator-id" type="text" autocomplete="username" placeholder="[발급받은 ID]" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #BDB9AF; border-radius: 8px; background: #FFFFFF; color: #1F1E1B; font-family: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="operator-pw" style="font-size: 14px; font-weight: 600">비밀번호</label>
<input id="operator-pw" type="password" autocomplete="current-password" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #BDB9AF; border-radius: 8px; background: #FFFFFF; color: #1F1E1B; font-family: inherit; font-size: 15px">
</div>
<a href="s02-home.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #1F4E8C; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">데모로 들어가기 — 인증하지 않음</a>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #F4F3EF; border-radius: 10px; font-size: 13px; line-height: 1.55; color: #5B5953">
<span>회원가입은 없습니다. 계정은 팀에서 발급합니다.</span>
<span>로그인에 여러 번 실패하면 잠시 잠깁니다.</span>
<span>무엇을 바꿨는지는 운영 기록에 이 ID로 남습니다.</span>
</div>
</main>
</div>

</html>
