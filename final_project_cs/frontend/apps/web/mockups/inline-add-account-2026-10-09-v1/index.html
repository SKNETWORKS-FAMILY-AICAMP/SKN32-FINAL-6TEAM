<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>triPilot · 일정 사이 추가와 계정·약관</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1ed;color:#20382d;font:15px/1.65 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:32px 20px 64px}h1{font-size:26px;line-height:1.35;margin:0 0 12px}p{margin:8px 0 20px}.note{color:#58685f;font-size:13px}.choices{display:flex;gap:8px;margin:24px 0}button{font:inherit;min-height:44px;padding:8px 18px;border:1px solid #b7c8bc;border-radius:24px;color:inherit;background:#fff;cursor:pointer}button[aria-pressed=true]{background:#2d6048;color:#fff;border-color:#2d6048}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #437f63;outline-offset:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;padding:16px;background:#fff;border:1px solid #dce4de;border-radius:24px}figcaption{margin:0 0 14px;font-weight:650}img{display:block;max-width:100%;height:auto;margin:auto;border-radius:16px}figure a{display:block}.facts{padding:20px 24px;background:#fff;border-radius:20px;margin-top:24px}.facts ul{margin:0;padding-left:20px}.wide .grid{grid-template-columns:1fr}.wide img{width:100%}footer{font-size:12px;color:#5a6b60;margin-top:24px}@media(max-width:650px){main{padding:24px 14px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style><main><h1>스크롤한 자리에서 일정 추가</h1><p>일정 사이의 +, 장소 검색, 통일한 계정 버튼과 약관 관리 화면입니다. 이미지를 누르면 원본 크기로 볼 수 있습니다.</p><p class="note">실제 제품 코드를 Chrome에서 촬영했습니다. 일정·계정 응답은 mock 서버 시험 데이터이며 지도는 OpenStreetMap입니다. 공개 서비스 배포 전 화면입니다.</p><div class="choices" role="group" aria-label="촬영 화면 크기"><button type="button" data-width="375" aria-pressed="true">휴대폰 375px</button><button type="button" data-width="1280" aria-pressed="false">넓은 화면 1280px</button></div><div class="grid"><figure><figcaption>이동 → 일정 사이의 +</figcaption><p class="note">스크롤한 목록의 가운데에 가장 가까운 경계에만 표시합니다.</p><a href="01-after-travel-plus-375.png"><img data-shot="01-after-travel-plus" src="01-after-travel-plus-375.png" alt="이동 → 일정 사이의 +"></a></figure>
<figure><figcaption>일정 → 이동 사이의 +</figcaption><p class="note">다른 경계가 가운데로 오면 +도 그 자리로 옮겨집니다.</p><a href="02-before-travel-plus-375.png"><img data-shot="02-before-travel-plus" src="02-before-travel-plus-375.png" alt="일정 → 이동 사이의 +"></a></figure>
<figure><figcaption>그 자리에서 장소 검색</figcaption><p class="note">추가할 경계 아래에 입력 화면이 열리고 실제 장소 검색 결과를 고릅니다.</p><a href="03-place-results-375.png"><img data-shot="03-place-results" src="03-place-results-375.png" alt="그 자리에서 장소 검색"></a></figure>
<figure><figcaption>고른 장소와 시간 확인</figcaption><p class="note">장소 이름·좌표·출처를 함께 저장합니다. 날짜와 시간은 수정할 수 있습니다.</p><a href="04-place-selected-375.png"><img data-shot="04-place-selected" src="04-place-selected-375.png" alt="고른 장소와 시간 확인"></a></figure>
<figure><figcaption>같은 형식의 계정 버튼</figcaption><p class="note">Google과 Kakao의 공식 아이콘, 회사 이름, 같은 크기와 정렬입니다.</p><a href="05-social-accounts-375.png"><img data-shot="05-social-accounts" src="05-social-accounts-375.png" alt="같은 형식의 계정 버튼"></a></figure>
<figure><figcaption>선택 동의 항목만 관리</figcaption><p class="note">필수 항목의 요약과 철회 버튼은 빼고 전문 확인 버튼을 제공합니다.</p><a href="06-optional-consents-375.png"><img data-shot="06-optional-consents" src="06-optional-consents-375.png" alt="선택 동의 항목만 관리"></a></figure>
<figure><figcaption>필수 약관 전문 확인</figcaption><p class="note">이용약관과 개인정보 전문을 전환해 읽고 닫습니다. 동의 변경은 없습니다.</p><a href="07-required-terms-375.png"><img data-shot="07-required-terms" src="07-required-terms-375.png" alt="필수 약관 전문 확인"></a></figure></div><footer>장소 정보 ⓒ한국관광공사 · 지도 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>. 2026-10-09 로컬 개발 화면 촬영.</footer></main><script>
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const width=button.dataset.width;document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.body.classList.toggle('wide',width==='1280');document.querySelectorAll('[data-shot]').forEach(img=>{const path=`${img.dataset.shot}-${width}.png`;img.src=path;img.parentElement.href=path;});}));
