<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일정 추가 검색 초점·제자리 화살표</title><style>body{margin:0;padding:24px;background:#edf2ef;color:#213b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto}section{background:white;border:1px solid #d7e1db;border-radius:20px;padding:24px;margin:24px 0}h1{font-size:26px}h2{font-size:22px;margin-top:0}figure{margin:20px 0}img{display:block;max-width:100%;height:auto;border:1px solid #d7e1db;border-radius:16px}figure:first-of-type img{width:375px}figcaption{font-size:14px;color:#53665d}</style><main><h1>일정 추가는 검색창에 바로 초점</h1><p>입력 폼을 유지하면서 상단 검색창에 초점을 줍니다. 실제 Chrome 촬영 화면입니다.</p><section><h2>일정 추가를 열면 검색창에 초점</h2><p>빈 검색어에서는 입력 폼을 유지합니다. 접힌 지도 화살표는 같은 자리에서 &lt;로 표시됩니다.</p><figure><a href="add-initial-375.png"><img src="add-initial-375.png" alt="일정 추가를 열면 검색창에 초점 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="add-initial-1280.png"><img src="add-initial-1280.png" alt="일정 추가를 열면 검색창에 초점 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>지도 단추를 펼친 상태</h2><p>화살표는 옆으로 이동하지 않고 같은 자리에서 &gt;로 바뀝니다.</p><figure><a href="add-map-open-375.png"><img src="add-map-open-375.png" alt="지도 단추를 펼친 상태 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="add-map-open-1280.png"><img src="add-map-open-1280.png" alt="지도 단추를 펼친 상태 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>검색어를 입력하면 결과 표시</h2><p>입력한 일정 초안을 유지하며 장소를 검색합니다.</p><figure><a href="add-search-375.png"><img src="add-search-375.png" alt="검색어를 입력하면 결과 표시 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="add-search-1280.png"><img src="add-search-1280.png" alt="검색어를 입력하면 결과 표시 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>장소를 고르면 입력 폼으로 복귀</h2><p>장소 선택 후 일정 이름에 초점을 돌리고 작성 중인 값을 유지합니다.</p><figure><a href="add-selected-375.png"><img src="add-selected-375.png" alt="장소를 고르면 입력 폼으로 복귀 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="add-selected-1280.png"><img src="add-selected-1280.png" alt="장소를 고르면 입력 폼으로 복귀 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section></main></html>
