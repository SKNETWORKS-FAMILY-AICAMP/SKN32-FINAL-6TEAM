<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도의 위치 동의와 브라우저 권한</title>
<style>body{margin:0;background:#fbfcfd;color:#161c28;font:16px/1.6 system-ui}main{max-width:900px;margin:auto;padding:24px}h1{font-size:26px}svg{width:100%;height:auto;background:#f1f4f8;border-radius:16px}text{font-family:system-ui;fill:#161c28;font-size:16px;text-anchor:middle}path.line{fill:none;stroke:#6b7488;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:13px;fill:#6b7488}rect,ellipse,polygon{fill:#fbfcfd;stroke:#dbe0ea;stroke-width:1.5}</style>
<main><h1>서비스 동의는 한 번, 브라우저 권한은 별도로</h1><p>최초 약관에서 위치 이용에 동의했다면 지도에서 같은 동의 창을 다시 띄우지 않습니다. 지도가 열리면 브라우저에 위치를 요청합니다. 미동의 상태에서는 ‘내 위치’ 버튼을 눌러 동의할 수 있습니다.</p>
<svg viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">지도 위치 요청 흐름</title><desc id="desc">지도가 열리면 서비스 동의를 확인합니다. 미동의면 위치 없이 이용합니다. 동의했다면 브라우저 권한에 따라 표시하거나 권한을 요청하거나 차단 설정을 안내합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b7488"/></marker></defs>
<path class="line" d="M380 70V100"/><path class="line" d="M380 190V245"/><path class="line" d="M290 145H30V555H45"/>
<path class="line" d="M470 300H650V370"/><path class="line" d="M290 300H150V370"/><path class="line" d="M380 355V370"/>
<path class="line" d="M480 400H540"/><path class="line" d="M380 430V490H150V525"/><path class="line" d="M150 430V525"/><path class="line" d="M650 430V525"/>
<ellipse cx="380" cy="45" rx="90" ry="25"/><text x="380" y="51">지도 열림 · 시작</text>
<polygon points="380,100 470,145 380,190 290,145" style="stroke:#a8720c;fill:rgba(168,114,12,.10)"/><text x="380" y="140">위치 이용에</text><text x="380" y="161">동의했나요?</text>
<text class="label" x="411" y="218">동의함</text><text class="label" x="166" y="132">미동의 · 읽지 않음</text>
<polygon points="380,245 470,300 380,355 290,300"/><text x="380" y="295">브라우저</text><text x="380" y="317">위치 권한</text>
<text class="label" x="564" y="287">허용됨</text><text class="label" x="211" y="287">차단됨</text><text class="label" x="416" y="365">미결정</text>
<rect x="45" y="370" width="210" height="60" rx="6"/><text x="150" y="406">차단 설정 안내</text>
<rect x="280" y="370" width="200" height="60" rx="6"/><text x="380" y="406">브라우저 권한 요청</text>
<rect x="540" y="370" width="205" height="60" rx="6"/><text x="643" y="406">지도에 내 위치 표시</text>
<text class="label" x="510" y="388">허용</text><text class="label" x="275" y="478">거절·취소</text>
<ellipse cx="150" cy="555" rx="105" ry="30"/><text x="150" y="551">내 위치 없이 이용</text><text class="label" x="150" y="573">종료</text>
<ellipse cx="650" cy="555" rx="95" ry="30"/><text x="650" y="551">위치 표시 완료</text><text class="label" x="650" y="573">종료</text>
</svg><p>브라우저 설정을 웹앱이 임의로 허용으로 바꾸지는 않습니다. 이미 허용했다면 브라우저 권한 창이 다시 뜨지 않을 수 있습니다. 위치 제공 실패·시간 초과는 별도 오류 안내와 재시도로 처리합니다.</p></main></html>
