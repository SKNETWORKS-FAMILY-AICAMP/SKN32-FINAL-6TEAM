<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>triPilot · 일정 카드 장소·시간 수정 목업</title>
<style>
:root{color-scheme:light;--color-text:#24392f;--color-muted:#6d7c73;--color-border:#dce3dd;--color-surface:#fff;--color-background:#f3f5f3;--color-primary:#2e6047;--color-primary-hover:#254f3a;--color-on-primary:#fff;--color-soft:#e9f2eb;--color-subtle:#f6f7f5;--color-warning:#82693e;--color-warning-soft:#faf6ec;--color-warning-border:#e5d9c1;--color-error:#965640;--color-error-soft:#fdf3ed;--color-error-border:#ecd2c7;--font-sans:"Segoe UI","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);font-size:13px;line-height:1.65;font-synthesis:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 검토용 막대 — 제품 화면 밖 */
.reviewbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:10px 24px;background:var(--color-subtle);border-bottom:1px solid var(--color-border);font-size:12px}
.reviewbar strong{font-weight:650}
.reviewbar small{color:var(--color-muted);font-size:11px;margin-left:8px}
.review-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.review-tools label{display:inline-flex;align-items:center;gap:6px;color:var(--color-muted);font-size:11px}
.review-tools select,.review-tools button{min-height:32px;border:1px solid var(--color-border);border-radius:8px;background:#fff;padding:3px 10px;font-size:12px}

/* 계획 확인 화면 */
main{max-width:680px;margin:0 auto;padding:36px 16px 56px}
.eyebrow{display:block;color:var(--color-primary);font-size:10px;font-weight:700;letter-spacing:1.25px;margin:0 0 9px}
.page-head h1{font-size:24px;line-height:1.4;letter-spacing:-.8px}
.page-head p{margin-top:8px;color:var(--color-muted)}
.credit{margin-top:14px;font-size:11px;color:var(--color-muted)}
.credit a{text-decoration:underline}
.empty{padding:22px;border:1px dashed var(--color-border);border-radius:16px;color:var(--color-muted);text-align:center}

/* 개수 요약 — 데모 검증 결과와 같은 모양 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}
.stat{min-width:0;border:1px solid var(--color-border);border-radius:20px;background:#fffffff5;padding:18px 18px 16px}
.stat strong{display:block;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.5px;color:var(--color-primary)}
.stat strong small{margin-left:3px;font-size:13px;font-weight:500}
.stat p{margin-top:6px;font-size:12px;color:var(--color-muted)}

/* 여행 계획 살펴보기 */
.plan{margin-top:12px;border:1px solid var(--color-border);border-radius:20px;background:#fffffff5;padding:22px}
.plan-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan-head h2{font-size:18px;letter-spacing:-.4px}
.days{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.day{min-height:42px;padding:8px 15px;border:1px solid var(--color-border);border-radius:12px;background:#fff;font-size:12px;font-weight:650;color:var(--color-muted)}
.day small{margin-left:6px;font-size:10px;font-weight:400}
.day[aria-selected=true]{border-color:var(--color-primary);background:var(--color-primary);color:#fff}
.cards{display:grid;gap:10px}

/* 배지 */
.badge{display:inline-flex;align-items:center;border-radius:7px;padding:4px 8px;font-size:10px;line-height:1.6;font-weight:600;white-space:nowrap}
.badge.count{background:var(--color-soft);color:var(--color-primary)}
.badge.keep{background:#fff;color:var(--color-primary);box-shadow:inset 0 0 0 1px var(--color-primary)}
.badge.adjusted{background:#d3e7d9;color:var(--color-primary)}
.badge.review{background:#f3e2bd;color:var(--color-warning)}
.badge.neutral{background:var(--color-subtle);color:var(--color-muted);box-shadow:inset 0 0 0 1px var(--color-border)}

/* 일정 카드 */
.card{position:relative;min-width:0;border:1px solid var(--color-border);border-radius:16px;background:#fff;transition:border-color .18s,box-shadow .18s}
.card[data-status=adjusted]{border-color:#bcd7c3;background:#eff7f1}
.card[data-status=review]{border-color:#e6cf9f;background:#fcf5e6}
.card[data-open=true]{box-shadow:0 8px 26px #25392f14}
.card[data-status=review] .overlap{background:#fff}
.toggle{display:block;width:100%;padding:14px 16px 8px;border-radius:16px;text-align:left}
.toggle:hover{background:#24392f08}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:24px;padding-right:84px;font-size:12px;font-weight:600;color:var(--color-primary);font-variant-numeric:tabular-nums}
.card[data-open=true] .when{padding-right:150px}
.when .dur{font-weight:400;color:var(--color-muted)}
.when .pending{font-weight:600;color:var(--color-warning)}
.name-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:3px}
.name-row strong{min-width:0;font-size:16px;letter-spacing:-.3px}
.category{flex-shrink:0;font-size:12px;color:var(--color-muted)}
.facts{margin-top:3px;font-size:12px;line-height:1.75;color:var(--color-muted);overflow-wrap:anywhere}
.facts .unresolved{color:var(--color-warning)}
.flash{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--color-primary)}
.chev{display:flex;justify-content:flex-end;color:var(--color-muted)}
.corner{position:absolute;top:13px;right:14px;display:flex;align-items:center;gap:6px}
.del{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:3px 10px;border:1px solid var(--color-border);border-radius:9px;background:#fff;font-size:11px;font-weight:600;color:var(--color-muted)}
.del:hover{border-color:var(--color-error-border);background:var(--color-error-soft);color:var(--color-error)}

/* 펼친 수정 영역 */
.edit{display:grid;gap:10px;margin:0 16px;padding:14px 0 16px;border-top:1px solid var(--color-border)}
.block-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650}
.gap{height:4px}
.minimap{position:relative;overflow:hidden;border:1px solid var(--color-border);border-radius:12px;background:#eef1ea}
.minimap svg,.bigmap svg{display:block}
.map-note{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 12px;border:1px solid var(--color-border);border-radius:999px;background:#fff;font-size:12px;color:var(--color-muted);white-space:nowrap}
.map-btn{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--color-border);border-radius:10px;background:#fff;color:var(--color-text)}
.map-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.chosen{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--color-border);border-radius:12px;background:#fff}
.chosen:focus{outline:none}
.chosen:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
.chosen>.i{margin-top:3px;color:var(--color-primary)}
.chosen .body{flex:1;min-width:0}
.chosen strong{display:block;font-size:13px;font-weight:650}
.chosen .body span{display:block;font-size:12px;color:var(--color-muted)}
.chosen[data-new=true]{border-color:#9fbea8;background:var(--color-soft)}
.chosen[data-empty=true]{border-style:dashed;background:#fff}
.chosen[data-empty=true]>.i{color:var(--color-muted)}
.search-entry{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:0 12px;border:1px solid var(--color-border);border-radius:10px;background:#fff;color:var(--color-muted);font-size:13px;text-align:left}
.search-entry:hover{border-color:var(--color-primary)}
.search-entry .end{margin-left:auto;display:flex}
.recs-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-size:11px;color:var(--color-muted)}
.recs-head strong{font-size:12px;font-weight:650;color:var(--color-text)}
.rec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rec{display:grid;align-content:start;gap:2px;min-width:0;padding:10px 10px 9px;border:1px solid var(--color-border);border-radius:12px;background:#fff;text-align:left}
.rec:hover{border-color:#9fbea8}
.rec .name{display:flex;justify-content:space-between;align-items:center;gap:4px;min-width:0;font-size:12px;font-weight:650}
.rec .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .name .i{width:15px;height:15px;color:var(--color-primary);visibility:hidden}
.rec .addr{overflow:hidden;font-size:11px;color:var(--color-muted);white-space:nowrap;text-overflow:ellipsis}
.rec .dist{justify-self:start;margin-top:3px;padding:1px 7px;border-radius:999px;background:var(--color-soft);font-size:10px;color:var(--color-primary);font-variant-numeric:tabular-nums}
.rec[aria-pressed=true]{border-color:var(--color-primary);background:var(--color-soft)}
.rec[aria-pressed=true] .name .i{visibility:visible}
.rec[aria-pressed=true] .dist{background:#fff}
input{min-width:0;min-height:42px;border:1px solid var(--color-border);border-radius:10px;padding:6px 10px;background:#fff;color:var(--color-text);font-size:13px}
input[aria-invalid=true]{border-color:var(--color-error)}
.when-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.when-row label{display:grid;gap:3px;min-width:0;font-size:11px;color:var(--color-muted)}
.when-row input{width:100%}
.field-error{font-size:12px;color:var(--color-error)}
.overlap{padding:12px 14px;border:1px solid var(--color-warning-border);border-radius:12px;background:var(--color-warning-soft);font-size:12px;color:var(--color-warning)}
.overlap-title{display:flex;align-items:center;gap:6px;font-weight:650}
.overlap ul{display:grid;gap:3px;margin-top:7px}
.overlap li{display:flex;gap:12px;color:var(--color-text)}
.overlap time{min-width:96px;color:var(--color-warning);font-variant-numeric:tabular-nums}
.overlap .hint{margin-top:7px;font-size:11px}
.save-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}

/* 버튼 — 앱 Button과 같은 값 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 16px;border:1px solid transparent;border-radius:12px;font-size:12px;font-weight:650;line-height:1.5;text-align:center;transition:background .18s,border-color .18s,color .18s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.48}
.btn.primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn.primary:hover:not(:disabled){background:var(--color-primary-hover)}
.btn.secondary{background:var(--color-surface);color:var(--color-primary);border-color:var(--color-border)}
.btn.secondary:hover:not(:disabled){border-color:var(--color-primary);background:#f8fbf8}

/* 아래 고정 버튼 — 재검사 / 여행 등록 */
.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding:16px 0;border-top:1px solid var(--color-border)}
.actions.sticky{position:sticky;bottom:0;z-index:5;background:#f3f5f3f2;backdrop-filter:blur(12px)}
.action-note{flex:1;font-size:12px;line-height:1.7;color:var(--color-muted)}
.action-note strong{color:var(--color-text);font-weight:650}
.actions .btn{flex-shrink:0}
.actions .btn.primary{min-width:168px}
.recheck-done{display:flex;align-items:center;gap:6px;margin-top:16px;padding:11px 14px;border-radius:12px;background:var(--color-soft);font-size:12px;color:var(--color-primary)}

/* 계획 읽기 대기 — 라이브 계획 확인 화면의 reading 상태와 같은 모양 */
.panel{min-width:0;border:1px solid var(--color-border);border-radius:20px;background:#fffffff5;padding:23px}
.waiting{display:grid;gap:12px;justify-items:start;margin-top:8px}
.waiting h1{font-size:22px;letter-spacing:-.6px}
.waiting p{font-size:13px;line-height:1.8;color:var(--color-muted)}

/* 계획 다시 올리기 — 라이브 계획 등록 화면과 같은 모양 */
.upload{display:grid;gap:16px;margin-top:24px}
.label-row label{font-size:14px;font-weight:700}
.plan-input{display:block;width:100%;min-height:300px;margin-top:12px;padding:19px;resize:vertical;border:1px solid var(--color-border);border-radius:14px;background:var(--color-subtle);font-size:13px;line-height:2;color:var(--color-text)}
.plan-input::placeholder{color:#859087;opacity:1}
.input-meta{display:flex;justify-content:space-between;gap:12px;margin-top:11px;font-size:10px;color:var(--color-muted)}
.files{display:grid;gap:8px;margin-top:14px;font-size:12px;color:var(--color-muted)}
.files label{font-weight:600;color:var(--color-text)}
.files p{font-size:11px}
.upload-error{margin-top:12px;padding:13px 15px;border:1px solid var(--color-error-border);border-radius:12px;background:var(--color-error-soft);font-size:11px;line-height:1.8;color:var(--color-error)}
.tips h2{margin-bottom:9px;font-size:18px;line-height:1.5;letter-spacing:-.65px}
.tip-list{display:grid;gap:18px}
.tip-list li{position:relative;padding-left:17px;font-size:12px;line-height:1.85;color:var(--color-muted)}
.tip-list li::before{content:"";position:absolute;left:0;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--color-primary)}

/* 지도 페이지 — 화면 전체 지도 위에 검색창과 결과 시트를 띄운다 */
.map-page{position:fixed;inset:0;z-index:30;overflow:hidden;background:#eef1ea;--sheet-visible:0px}
.bigmap{position:absolute;inset:0}
.bigmap:focus{outline:none}
.map-float{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:center;padding:14px 12px;pointer-events:none}
.map-float-inner{display:flex;gap:8px;width:100%;max-width:680px;pointer-events:auto}
.icon-btn{display:grid;place-items:center;flex-shrink:0;width:44px;height:44px;border:1px solid var(--color-border);border-radius:12px;background:#fff;color:var(--color-text);box-shadow:0 4px 14px #25392f1f}
.icon-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.map-search{display:flex;flex:1;gap:6px;min-width:0}
.map-search .field{position:relative;flex:1;min-width:0}
.map-search .field .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-muted);pointer-events:none}
.map-search input{width:100%;min-height:44px;padding-left:36px;box-shadow:0 4px 14px #25392f1f}
.map-search .btn{box-shadow:0 4px 14px #25392f1f}
.loc-btn{position:absolute;right:16px;bottom:calc(var(--sheet-visible) + 16px);z-index:2;display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--color-border);border-radius:50%;background:#fff;color:var(--color-text);box-shadow:0 4px 14px #25392f24;transition:bottom .25s ease}
.loc-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;max-width:680px;max-height:min(58vh,520px);margin:0 auto;border-radius:20px 20px 0 0;background:#fff;box-shadow:0 -8px 28px #25392f26;transition:transform .25s ease}
.sheet.dragging{transition:none}
.sheet-handle{display:grid;justify-items:center;gap:6px;width:100%;padding:10px 16px 12px;cursor:grab;touch-action:none;user-select:none}
.sheet-handle:active{cursor:grabbing}
.grip{width:42px;height:5px;border-radius:999px;background:#cfd8d1}
.sheet-sum{font-size:12px;color:var(--color-muted)}
.sheet-body{overflow-y:auto;padding:0 16px 18px}
.sheet-body:empty{display:none}
.result-list{overflow:hidden;border:1px solid var(--color-border);border-radius:12px;background:#fff}
.result{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--color-border);background:#fff;text-align:left}
.result-list li:last-child .result{border-bottom:0}
.result:hover{background:#f8fbf8}
.result .num{display:grid;place-items:center;flex-shrink:0;width:24px;height:24px;border:1.5px solid var(--color-primary);border-radius:50%;font-size:11px;font-weight:650;color:var(--color-primary)}
.result .body{flex:1;min-width:0}
.result strong{display:block;font-size:13px;font-weight:650}
.result .body span{display:block;font-size:12px;color:var(--color-muted)}
.result .dist{flex-shrink:0;font-size:11px;color:var(--color-muted);font-variant-numeric:tabular-nums}
.result .chev-i{color:var(--color-muted)}
.state-box{padding:14px;border:1px dashed var(--color-border);border-radius:12px;font-size:12px;color:var(--color-muted)}
.state-box.blocked{border-style:solid;border-color:var(--color-warning-border);background:var(--color-warning-soft);color:var(--color-warning)}
.state-box .btn{margin-top:10px}

@media(max-width:560px){
  .reviewbar{padding:10px 16px}
  .reviewbar small{display:block;margin:2px 0 0}
  main{padding:24px 16px 48px}
  .page-head h1{font-size:21px}
  .stats{gap:8px}
  .stat{padding:14px 12px 12px;border-radius:16px}
  .stat strong{font-size:22px}
  .plan{padding:16px;border-radius:16px}
  .toggle{padding:13px 14px 8px}
  .corner{right:12px}
  .edit{margin:0 14px}
  .rec-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .rec-grid::-webkit-scrollbar{display:none}
  .rec{scroll-snap-align:start}
  .when-row{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
  input{font-size:16px}
  .when-row input{padding:6px}
  .when-row input::-webkit-calendar-picker-indicator{display:none}
  .actions{flex-wrap:wrap;gap:8px;padding:12px 0}
  .action-note{flex-basis:100%;order:-1}
  .actions .btn,.actions .btn.primary{flex:1;min-width:0}
  .panel{padding:18px;border-radius:16px}
  .plan-input{min-height:260px;padding:15px;font-size:16px}
}
@media(max-width:420px){
  .when-row input{padding:6px 5px;font-size:14px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>

function duration(start, end) {
  const total = minutes(end) - minutes(start);

  return [h && `${h}시간`, m && `${m}분`].filter(Boolean).join(" ");

function metres(a, b) {

  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

  return [prev, next].filter(Boolean);
}

  if (basis.length) pool.sort((a, b) => a.d - b.d);
  return { label, average: basis.length === 2, list: pool.slice(0, 3) };
}

/* ── 지도(위치 개념도) ───────────────────────── */
const ROADS = [[0, .3, 1, .26, 12], [0, .74, 1, .8, 8], [.24, 0, .28, 1, 10], [.7, 0, .64, 1, 8], [0, .06, .6, 1, 5], [.46, 0, .5, 1, 5]];
function mapSVG(W, H, points, { minSpanKm = 1.4, padX = 56, padTop = 56, padBottom = 56 } = {}) {
  const kx = 111.32 * Math.cos(37.55 * Math.PI / 180), ky = 110.57;
  const P = points.map((p) => ({ ...p, X: p.lon * kx, Y: p.lat * ky }));
  const xs = P.map((p) => p.X), ys = P.map((p) => p.Y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const spanX = Math.max(Math.max(...xs) - Math.min(...xs), minSpanKm), spanY = Math.max(Math.max(...ys) - Math.min(...ys), minSpanKm);
  const k = Math.min((W - 2 * padX) / spanX, Math.max(40, H - padTop - padBottom) / spanY);
  const midY = padTop + (H - padTop - padBottom) / 2;
  P.forEach((p) => { p.x = W / 2 + (p.X - cx) * k; p.y = midY - (p.Y - cy) * k + (p.kind === "place" ? 16 : 0); });
  const roads = ROADS.map(([x1, y1, x2, y2, w]) => `<line x1="${x1 * W}" y1="${y1 * H}" x2="${x2 * W}" y2="${y2 * H}" stroke="#fff" stroke-width="${w}" stroke-linecap="round"/>`).join("");
  const draw = { current: [], result: [], place: [] };
  for (const p of P) {
    if (p.kind === "current") {
      draw.current.push(`<circle cx="${p.x}" cy="${p.y}" r="18" fill="#3b6fd6" opacity=".16"/><circle cx="${p.x}" cy="${p.y}" r="7" fill="#3b6fd6" stroke="#fff" stroke-width="2.5"/>`);
    } else if (p.kind === "result") {
      draw.result.push(`<circle cx="${p.x}" cy="${p.y}" r="13" fill="#fff" stroke="#2e6047" stroke-width="1.6"/><text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="12" font-weight="650" fill="#2e6047">${p.n}</text>`);
    } else {
      const w = p.label.length * 13 + 24;
      const lx = p.x + 22 + w > W - 6 ? p.x - 22 - w : p.x + 22;
      draw.place.push(`<g transform="translate(${p.x},${p.y})"><ellipse cx="0" cy="1" rx="8" ry="3" fill="#24392f" opacity=".18"/><path d="M0 0C-4-11-17-18-17-31A17 17 0 1 1 17-31C17-18 4-11 0 0Z" fill="#2e6047"/><circle cx="0" cy="-31" r="6" fill="#fff"/></g>
        <rect x="${lx}" y="${p.y - 46}" width="${w}" height="28" rx="9" fill="#fff" stroke="#b9cdbd"/><text x="${lx + 12}" y="${p.y - 27}" font-size="13" font-weight="650" fill="#2e6047">${esc(p.label)}</text>`);
    }
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(points.map((p) => p.label).filter(Boolean).join(", ") || "지도")}">
    <rect width="${W}" height="${H}" fill="#eef1ea"/>
    <ellipse cx="${W * .82}" cy="${H * .95}" rx="${W * .2}" ry="${H * .22}" fill="#dde9d8"/>
    <ellipse cx="${W * .1}" cy="${H * .05}" rx="${W * .18}" ry="${H * .2}" fill="#dde9d8"/>
    <path d="M-20 ${H * .62}C${W * .2} ${H * .55} ${W * .35} ${H * .7} ${W * .55} ${H * .62}S${W * .85} ${H * .5} ${W + 20} ${H * .56}" fill="none" stroke="#d4e3ea" stroke-width="14" stroke-linecap="round"/>
    ${roads}${draw.current.join("")}${draw.result.join("")}${draw.place.join("")}
  </svg>`;
}

  return `<article class="card" data-key="${item.key}" data-status="${item.status}" data-open="${s.open}">

      <span class="when">${icon("calendar")}${item.start}–${item.end}${dur ? `<span class="dur">· ${dur}</span>` : ""}${item.changed ? `<span class="pending">· 재검사 전</span>` : ""}</span>
      <span class="name-row"><strong>${esc(nameOf(item))}</strong>${place ? `<span class="category">${esc(place.category)}</span>` : ""}</span>
      <span class="facts" style="display:block">${facts}</span>
      ${s.flash ? `<span class="flash">${icon("check")}저장했어요</span>` : ""}
      <span class="chev">${icon(s.open ? "up" : "down")}<span class="sr-only">${s.open ? "접기" : "펼쳐서 고치기"}</span></span>
    </button>
    <div class="corner"><span class="badge ${item.status}">${STATUS[item.status]}</span>${s.open ? `<button type="button" class="del" data-act="delete">${icon("trash")}삭제</button>` : ""}</div>
    ${s.open ? editHTML(item, s) : ""}
  </article>`;
}

function chosenHTML(item, draft) {
  const place = placeOf(draft.place);
  const fresh = draft.place !== item.place;
  if (!place) {
    return `<div class="chosen" data-empty="true" tabindex="-1">${icon("pin")}
      <div class="body"><strong>아직 정하지 못했어요</strong><span>추천 후보에서 고르거나 업체 이름으로 찾아 주세요</span></div></div>`;
  }
  return `<div class="chosen" data-new="${fresh}" tabindex="-1">${icon("pin")}
    <div class="body"><strong>${esc(place.name)}</strong><span>${esc(place.address)}</span></div>
    <span class="badge ${fresh ? "keep" : "neutral"}">${fresh ? "새로 고름" : "지금 장소"}</span></div>`;
}

function recsHTML(item, draft) {
  const recs = recommendations(item);
  if (!recs.list.length) return "";
  return `<div class="recs-head"><strong>추천 후보 ${recs.list.length}곳</strong>${recs.label ? `<span>${esc(recs.label)}</span>` : ""}</div>
    <div class="rec-grid">${recs.list.map(({ id, p, d }) => `<button type="button" class="rec" data-act="pick" data-place="${id}" aria-pressed="${draft.place === id}">
      <span class="name"><span>${esc(p.name)}</span>${icon("check-circle")}</span>
      <span class="addr">${esc(p.address)}</span>
      ${d === null ? "" : `<span class="dist">${recs.average ? "평균 " : ""}${distLabel(d)}</span>`}
    </button>`).join("")}</div>`;
}

function editHTML(item, s) {
  const d = s.draft;
  return `<section class="edit" id="edit-${item.key}" aria-label="${esc(nameOf(item))} 고치기">
    <p class="block-label">${icon("pin")}장소</p>
    <div class="minimap" data-map="${item.key}">
      <div class="canvas"></div>
      ${placeOf(d.place) ? "" : `<span class="map-note">장소를 고르면 여기에 표시돼요</span>`}
      <button type="button" class="map-btn" data-act="map-expand" aria-label="지도 크게 보기">${icon("expand")}</button>
    </div>
    ${chosenHTML(item, d)}
    <button type="button" class="search-entry" data-act="map-search">${icon("search")}<span>업체 이름으로 찾기</span><span class="end">${icon("chev")}</span></button>

      <label for="date-${item.key}">방문 날짜<input id="date-${item.key}" type="date" data-field="date" value="${d.date}"></label>
      <label for="start-${item.key}">시작<input id="start-${item.key}" type="time" data-field="start" value="${d.start}"></label>
      <label for="end-${item.key}">끝<input id="end-${item.key}" type="time" data-field="end" value="${d.end}"></label>
    </div>

    <div class="save-row">
      <button type="button" class="btn secondary" data-act="cancel">취소</button>
      <button type="button" class="btn primary" data-act="save">${icon("check")}저장</button>
    </div>
  </section>`;
}

/** 입력 중에는 카드를 다시 그리지 않고 겹침 안내·오류·저장 버튼만 고친다 */
function refreshLive(key) {
  const s = ui[key], el = cardEl(key), item = itemOf(key);
  if (!s?.open || !el) return;
  const d = s.draft;
  const bad = Boolean(d.start && d.end && d.end <= d.start);
  el.querySelector('[data-slot="error"]').hidden = !bad;
  el.querySelector('[data-field="end"]').setAttribute("aria-invalid", String(bad));
  const hits = overlapping(key, d);
  el.querySelector('[data-slot="overlap"]').innerHTML = hits.length ? `<div class="overlap">
      <p class="overlap-title">${icon("alert")}겹치는 일정이 있습니다</p>
      <ul>${hits.map((o) => `<li><time>${o.start} – ${o.end}</time><span>${esc(nameOf(o))}</span></li>`).join("")}</ul>
      <p class="hint">시간을 옮기거나, 이대로 저장할 수 있어요.</p>
    </div>` : "";
  el.querySelector('[data-act="save"]').disabled = bad || !d.date || !d.start || !d.end || !changed(item, d);
}

function save(key) {
  const item = itemOf(key), s = ui[key], d = s.draft;
  Object.assign(item, { place: d.place, date: d.date, start: d.start, end: d.end, changed: true });
  Object.assign(s, { open: false, draft: draftOf(item), flash: true });
  recheckNote = null;
  view.day = item.date;
  renderList();
  document.getElementById(`toggle-${key}`)?.focus();
  announce(`「${nameOf(item)}」을 저장했어요`);
  setTimeout(() => {
    if (!ui[key]?.flash) return;
    ui[key].flash = false;
    cardEl(key)?.querySelector(".flash")?.remove();
  }, 3500);
}

/* ── 계획 읽기 · 재검사 · 다시 올리기 · 등록 ───────────────────────── */
/** 라이브 계획 확인 화면의 읽는 중(reading) 상태 — 서버 단계 이름(STAGES)을 그대로 보여 준다. 사진이 있으면 글자로 옮기는 단계가 낀다 */
function startReading(after) {
  for (const s of Object.values(ui)) s.open = false;
  view.page = "reading";
  window.scrollTo(0, 0);
  const steps = ["받았어요", ...(after === "upload" && uploadFiles.length ? ["글자로 옮기는 중"] : []), "규칙으로 읽는 중"];
  let n = 0;
  const next = () => {
    if (n < steps.length) {
      renderReading(steps[n++]);
      readingTimer = setTimeout(next, n === 1 ? 900 : 1600);
    } else if (after === "upload") finishUpload();
    else finishRecheck();
  };
  next();
}

function renderReading(label) {
  app.innerHTML = `<section class="panel waiting" role="status">
    <span class="eyebrow">계획을 읽고 있어요</span>
    <h1>${label}</h1>
    <p>사진은 한 장에 1분쯤 걸려요. 이 화면을 열어 두면 끝나는 대로 보여 드려요.</p>
  </section>`;
}

/** 다시 올리기 — 라이브 계획 등록 화면(/trips/new)과 같은 입력 칸 */
function renderUpload() {

/** 다시 읽은 결과 — 목업은 글을 해석하지 않으므로 처음 예시로 되돌린다 */
function finishUpload() {
  items = START.map((item) => ({ ...item }));
  ui = {};
  deletedSinceCheck = 0;
  recheckNote = null;
  view = { page: "list", day: null };
  renderList();
  announce("계획을 다시 읽었어요");
}

/** 목업의 규칙은 라이브 `check` 와 같은 수준 — 장소가 없으면 확인 필요. 고친 일정은 유지로 본다 */
function finishRecheck() {
  for (const item of items) {
    if (!item.place) item.status = "review";
    else if (item.changed) item.status = "keep";
    item.changed = false;
  }
  deletedSinceCheck = 0;
  const review = items.filter((i) => i.status === "review").length;
  recheckNote = review ? `재검사를 마쳤어요 · 확인이 필요한 일정 ${review}개가 남았어요` : "재검사를 마쳤어요 · 고칠 곳이 없어요";
  view.page = "list";
  renderList();
  announce(recheckNote);
}

function register() {
  view.page = "done";
  window.scrollTo(0, 0);
  renderDone();
  announce("여행을 등록했어요");
}

function renderDone() {
  const days = new Set(items.map((i) => i.date)).size;
  app.innerHTML = `
    <header class="page-head">
      <span class="eyebrow">WITH YOU, ALONG THE WAY</span>
      <h1>여행을 등록했어요.</h1>
      <p>일정 ${items.length}개 · ${days}일. 이제 여행이 끝날 때까지 지켜볼게요.</p>
    </header>`;
}

/* ── 지도 페이지 ───────────────────────── */
function openMap(key, focusSearch) {
  const place = placeOf(ui[key].draft.place);
  map = { key, anchor: place ? "place" : "current", query: "", state: null, hits: [], run: 0, sheet: "open" };
  view.page = "map";
  document.body.style.overflow = "hidden";
  render();
  document.getElementById(focusSearch ? "map-q" : "big-map").focus();
  announce(place ? `「${place.name}」 위치의 지도를 열었어요` : "현재 위치의 지도를 열었어요");
}
function anchorPoint() {
  const place = placeOf(ui[map.key].draft.place);
  return map.anchor === "place" && place ? { ...place, kind: "place", label: place.name } : { ...CURRENT, kind: "current", label: "현재 위치" };
}
function bigMapPoints() {
  const anchor = anchorPoint();
  const points = [anchor];
  const place = placeOf(ui[map.key].draft.place);
  if (anchor.kind === "current" && place && map.state !== "done") points.push({ ...place, kind: "place", label: place.name });
  if (map.state === "done") map.hits.forEach(({ p }, n) => points.push({ ...p, kind: "result", label: p.name, n: n + 1 }));
  return points;
}

function renderMap() {
  const r = map;
  let sum = "", body = "";
  if (r.state === "loading") sum = "찾는 중…";
  else if (r.state === "blocked") {
    sum = "장소 조회가 잠시 막혔어요";
    body = `<div class="state-box blocked">없는 곳이라는 뜻은 아니에요 — 잠시 뒤 다시 찾아 주세요.<div><button type="button" class="btn secondary" data-act="retry">다시 찾기</button></div></div>`;
  } else if (r.state === "done" && !r.hits.length) {
    sum = `「${esc(r.query)}」 검색 결과 없음`;
    body = `<p class="state-box">「${esc(r.query)}」에 맞는 곳을 찾지 못했어요. 이름을 바꿔 다시 찾아 주세요.</p>`;
  } else if (r.state === "done") {
    sum = `「${esc(r.query)}」 주변 검색 결과 ${r.hits.length}곳`;
    body = `<ul class="result-list">${r.hits.map(({ id, p, d }, n) => `<li><button type="button" class="result" data-act="pick-result" data-place="${id}">
      <span class="num">${n + 1}</span><span class="body"><strong>${esc(p.name)}</strong><span>${esc(p.address)}</span></span>
      <span class="dist">${distLabel(d)}</span><span class="chev-i">${icon("chev")}</span>
    </button></li>`).join("")}</ul>`;
  }
  const open = r.sheet === "open";
  app.innerHTML = `<section class="map-page" aria-label="장소 찾기 지도">
    <div class="bigmap" data-map="big" id="big-map" tabindex="-1" aria-label="장소 지도"><div class="canvas"></div></div>
    <div class="map-float"><div class="map-float-inner">
      <button type="button" class="icon-btn" data-act="map-back" aria-label="일정 카드로 돌아가기">${icon("back")}</button>
      <form class="map-search" role="search">
        <div class="field">${icon("search")}<label class="sr-only" for="map-q">장소·업체 검색</label><input id="map-q" value="${esc(r.query)}" placeholder="장소·업체 검색" maxlength="80" autocomplete="off"></div>
        <button type="submit" class="btn secondary">검색</button>
      </form>
    </div></div>
    <button type="button" class="loc-btn" data-act="locate" aria-label="현재 위치로 새로고침">${icon("locate")}</button>
    ${r.state ? `<section class="sheet" aria-label="검색 결과">
      <button type="button" class="sheet-handle" data-act="sheet-toggle" aria-expanded="${open}" aria-controls="sheet-body">
        <span class="grip" aria-hidden="true"></span><span class="sheet-sum" aria-live="polite">${sum}</span><span class="sr-only">${open ? "결과 접기" : "결과 펼치기"}</span>
      </button>
      <div class="sheet-body" id="sheet-body">${body}</div>
    </section>` : ""}
  </section>`;
  layoutSheet();
  drawMaps();
  bindSheetDrag();
}

/** 결과 시트 — 펼침이면 다 보이고, 접힘이면 손잡이 줄만 남는다. 현재 위치 버튼은 시트 위로 따라 올라간다 */
function layoutSheet() {
  const page = app.querySelector(".map-page"), sheet = app.querySelector(".sheet");
  if (!page) return;
  if (!sheet) { page.style.setProperty("--sheet-visible", "0px"); return; }
  const full = sheet.offsetHeight, peek = sheet.querySelector(".sheet-handle").offsetHeight;
  const y = map.sheet === "collapsed" ? full - peek : 0;
  sheet.style.transform = `translateY(${y}px)`;
  page.style.setProperty("--sheet-visible", `${full - y}px`);
}
function setSheet(next) {
  map.sheet = next;
  const handle = app.querySelector(".sheet-handle");
  handle.setAttribute("aria-expanded", String(next === "open"));
  handle.querySelector(".sr-only").textContent = next === "open" ? "결과 접기" : "결과 펼치기";
  layoutSheet();
  announce(next === "open" ? "검색 결과를 펼쳤어요" : "검색 결과를 접었어요");
}
/** 손잡이를 끌어 내리면 접히고 끌어 올리면 펼쳐진다. 누르기·Enter는 접기와 펼치기를 바꾼다 */
let sheetDragged = false;
function bindSheetDrag() {
  const sheet = app.querySelector(".sheet");
  if (!sheet) return;
  const handle = sheet.querySelector(".sheet-handle");
  let startY = 0, base = 0, y = 0, max = 0, active = false;
  handle.addEventListener("pointerdown", (event) => {
    active = true;
    sheetDragged = false;
    startY = event.clientY;
    max = sheet.offsetHeight - handle.offsetHeight;
    base = y = map.sheet === "collapsed" ? max : 0;
    sheet.classList.add("dragging");
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", (event) => {
    if (!active) return;
    const dy = event.clientY - startY;
    if (Math.abs(dy) > 4) sheetDragged = true;
    y = Math.min(max, Math.max(0, base + dy));
    sheet.style.transform = `translateY(${y}px)`;
  });
  const end = () => {
    if (!active) return;
    active = false;
    sheet.classList.remove("dragging");
    if (!sheetDragged) return;
    setSheet(y > max / 2 ? "collapsed" : "open");
    setTimeout(() => { sheetDragged = false; }, 0);
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
}

function runSearch() {
  const query = map.query.trim();
  if (!query) return;
  const run = ++map.run;
  map.state = "loading";
  map.sheet = "open";
  renderMap();
  setTimeout(() => {
    if (!map || map.run !== run) return;
    if (searchMode === "blocked") map.state = "blocked";
    else {
      const norm = (s) => s.replace(/\s+/g, "").toLowerCase();
      const q = norm(query), from = anchorPoint();
      map.hits = searchMode === "empty" ? [] : Object.entries(PLACES)
        .filter(([, p]) => norm(p.name).includes(q) || norm(p.category).includes(q))
        .map(([id, p]) => ({ id, p, d: metres(p, from) })).sort((a, b) => a.d - b.d).slice(0, 8);
      map.state = "done";
    }
    renderMap();
  }, 450);
}

function backToList(focus) {
  const key = map.key;
  map = null;
  view.page = "list";
  document.body.style.overflow = "";
  view.day = itemOf(key).date;
  renderList();
  cardEl(key)?.scrollIntoView({ block: "start" });
  cardEl(key)?.querySelector(focus)?.focus();
}

/* ── 이벤트 ───────────────────────── */
app.addEventListener("click", (event) => {
  // 날짜·시간 칸은 어디를 눌러도 선택 창을 연다 — 크롬 데스크톱은 작은 아이콘을 눌러야만 열린다
  const picker = event.target.closest('input[type="date"], input[type="time"]');
  if (picker) {
    try { picker.showPicker(); } catch { /* 브라우저가 선택 창을 막으면 칸에 직접 입력한다 */ }
    return;
  }
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  if (act === "day") { view.day = button.dataset.day; renderList(); app.querySelector(`[data-day="${view.day}"]`)?.focus(); return; }
  if (act === "map-back") { backToList(".toggle"); return; }
  if (act === "locate") { map.anchor = "current"; drawMaps(); announce("현재 위치로 지도를 옮겼어요"); return; }
  if (act === "retry") { runSearch(); return; }
  if (act === "sheet-toggle") { if (!sheetDragged) setSheet(map.sheet === "open" ? "collapsed" : "open"); return; }
  if (act === "recheck") { startReading("recheck"); return; }
  if (act === "register") { register(); return; }
  if (act === "reupload") { view.page = "upload"; window.scrollTo(0, 0); renderUpload(); document.getElementById("plan-source").focus(); return; }
  if (act === "upload-back") { view.page = "list"; renderList(); return; }
  if (act === "pick-result") {
    const s = ui[map.key];
    s.draft.place = button.dataset.place;
    s.open = true;
    announce(`「${PLACES[button.dataset.place].name}」을 골랐어요. 저장하면 바뀌어요`);
    backToList(".chosen");
    return;
  }
  const key = button.closest("[data-key]")?.dataset.key;
  if (!key) return;
  const item = itemOf(key), s = state(item);
  switch (act) {
    case "toggle":
      s.open = !s.open;
      s.flash = false;
      if (s.open && !changed(item, s.draft)) s.draft = draftOf(item);
      renderList();
      document.getElementById(`toggle-${key}`)?.focus();
      break;
    case "cancel":
      Object.assign(s, { open: false, draft: draftOf(item) });
      renderList();
      document.getElementById(`toggle-${key}`)?.focus();
      break;
    case "save": save(key); break;
    case "delete":
      items = items.filter((i) => i.key !== key);
      delete ui[key];
      deletedSinceCheck++;
      recheckNote = null;
      renderList();
      announce(`「${nameOf(item)}」을 일정에서 지웠어요`);
      break;
    case "pick":
      s.draft.place = button.dataset.place;
      renderList();
      cardEl(key).querySelector(`.rec[data-place="${button.dataset.place}"]`)?.focus();
      announce(`「${PLACES[button.dataset.place].name}」을 골랐어요. 저장하면 바뀌어요`);
      break;
    case "map-expand": openMap(key, false); break;
    case "map-search": openMap(key, true); break;
  }
});
app.addEventListener("submit", (event) => {
  event.preventDefault();
  if (event.target.id === "upload-form") {
    const empty = !uploadText.trim() && !uploadFiles.length;
    document.getElementById("plan-error").hidden = !empty;
    if (empty) { document.getElementById("plan-source").focus(); return; }
    startReading("upload");
    return;
  }
  if (!map) return;
  map.query = document.getElementById("map-q").value;
  runSearch();
});
app.addEventListener("change", (event) => {
  if (event.target.id !== "plan-files") return;
  uploadFiles = Array.from(event.target.files ?? []).slice(0, 5).map((file) => file.name);
  document.getElementById("plan-file-names").textContent = uploadFiles.join(" · ");
  document.getElementById("plan-error").hidden = true;
});
app.addEventListener("input", (event) => {
  if (event.target.id === "plan-source") {
    uploadText = event.target.value;
    document.getElementById("plan-count").textContent = `${uploadText.length.toLocaleString()} / 12,000`;
    document.getElementById("plan-error").hidden = true;
    return;
  }
  const field = event.target.dataset.field;
  const key = event.target.closest("[data-key]")?.dataset.key;
  if (!field || !key) return;
  ui[key].draft[field] = event.target.value;
  refreshLive(key);
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layoutSheet(); drawMaps(); }, 120); });

document.getElementById("searchMode").addEventListener("change", (event) => { searchMode = event.target.value; });
document.getElementById("resetAll").addEventListener("click", reset);

function reset() {
  items = START.map((item) => ({ ...item }));
  ui = {};
  map = null;
  view = { page: "list", day: null };
  clearTimeout(readingTimer);
  deletedSinceCheck = 0;
  recheckNote = null;
  uploadText = SAMPLE_PLAN;
  uploadFiles = [];
  document.body.style.overflow = "";
  render();
}
reset();
</script>
</body>
</html>
