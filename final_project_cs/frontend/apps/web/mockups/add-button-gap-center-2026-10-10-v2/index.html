<main><h1>추가 버튼을 일정 사이 중앙으로</h1><p>원형 +는 유지하고, 일정 카드 끝과 다음 이동 행 사이의 빈 공간 중앙으로 내렸습니다. 제품 코드에 반영하기 전 배치 목업입니다.</p>
