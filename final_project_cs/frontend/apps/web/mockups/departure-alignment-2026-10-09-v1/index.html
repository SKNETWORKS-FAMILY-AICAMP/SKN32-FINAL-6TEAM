<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>triPilot — 출발 시각 정렬</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:#203b30;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px;line-height:1.3}h2{font-size:20px}section{background:white;border:1px solid #d8e1db;border-radius:24px;padding:22px;margin:24px 0}figure{margin:18px 0 0}img{display:block;max-width:100%;height:auto;margin:auto;border-radius:20px}label{margin-right:12px}select{font:inherit;padding:10px 14px;min-height:44px;border:1px solid #bdcdc3;border-radius:12px;background:white;color:inherit}a:focus-visible,select:focus-visible{outline:3px solid #377a60;outline-offset:4px}body[data-width="375"] img{width:375px}body[data-width="1280"] img{width:1280px}@media(max-width:550px){main{padding:16px}section{padding:16px}}</style>
<body data-width="375"><main><h1>출발 시각·화살표·이동 설명을 한 줄로</h1><p>출발 시각에는 시각만 표시합니다. 원형 점 대신 시작선에서 오른쪽으로 나가는 화살표를 사용합니다. 이미지를 누르면 원본을 볼 수 있습니다.</p>
<label for="width">촬영 화면</label><select id="width"><option value="375">375px 휴대폰</option><option value="1280">1280px 데스크톱</option></select>
<section><h2>출발 시각이 있는 경우</h2><p>시각·출발 화살표·이동 설명이 같은 높이에 놓입니다. 점선 위의 일정 끝 시각과 아래 도착 시각은 유지합니다.</p><figure><a href="01-departure-375.png"><img src="01-departure-375.png" data-shot="01-departure" alt="출발 시각 10:30과 출발 화살표, 이동 설명의 한 줄 정렬"></a></figure></section>
<section><h2>시각이 없는 경우와 스크롤한 상태</h2><p>시각이 없어도 같은 위치에 대시를 표시합니다. 떠 있는 일차 단추 아래로 스크롤해도 출발 표시가 이동 설명을 따라갑니다.</p><figure><a href="02-no-time-375.png"><img src="02-no-time-375.png" data-shot="02-no-time" alt="시각 없는 호텔 출발 표시와 이동 설명의 한 줄 정렬"></a></figure></section>
</main><script>document.querySelector('#width').addEventListener('change',event=>{const width=event.target.value;document.body.dataset.width=width;document.querySelectorAll('[data-shot]').forEach(img=>{const path=`${img.dataset.shot}-${width}.png`;img.src=path;img.parentElement.href=path;});});</script></body></html>
