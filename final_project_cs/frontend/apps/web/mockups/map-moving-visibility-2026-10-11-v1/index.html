<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도 안 마커 분리 확인</title><style>body{margin:0;background:#eef2ef;color:#203a30;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}section{background:white;border:1px solid #d3ded8;border-radius:20px;padding:24px;margin:24px 0}img{display:block;max-width:100%;height:auto;border-radius:16px;border:1px solid #d3ded8}h1{font-size:26px}h2{font-size:20px}a{color:#276047}</style><main><h1>지도 안 마커는 그대로 표시</h1><p>지도 안의 2번은 마커로 남고, 실제 화면 밖의 1번·3번만 거리 버튼으로 표시됩니다. 로딩·이동·확대축소 중에도 같은 규칙을 검사했습니다.</p><p>Chrome 실제 촬영 · 일정 동작은 mock 서버 · 지도는 OpenStreetMap 타일. 공개 cs 프로젝트 서버 배포 확인은 하지 않았습니다.</p><section><h2>375px 휴대폰 화면</h2><a href="moving-map-375.png"><img src="moving-map-375.png" width="375" alt="지도 안의 2번 마커와 화면 밖의 1번·3번 거리 버튼"></a></section><section><h2>1280px 화면</h2><a href="moving-map-1280.png"><img src="moving-map-1280.png" width="1280" alt="넓은 화면에서도 지도 안 2번은 거리 버튼과 분리"></a></section></main></html>
