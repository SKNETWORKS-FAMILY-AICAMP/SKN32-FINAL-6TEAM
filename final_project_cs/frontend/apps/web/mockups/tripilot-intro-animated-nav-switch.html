  transition: transform .65s cubic-bezier(.22,.8,.25,1);
}
.scene-layer { position: absolute; inset: 0; opacity: 0; transform: scale(1.025); transition: opacity 1s ease, transform 1.4s ease; }

.scene-layer img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }

  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #f9faf659 0%, #f9faf608 50%, #eaf0e31a 100%);
}
.scene-light {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(ellipse at 76% 75%, #fffdf5c7, transparent 58%);
}
.phone {
  background: #f7f9f3c9;
  border-color: #ffffffc7;
  box-shadow: 0 24px 80px #24392f14;
}
.intro { text-shadow: 0 1px 10px #ffffffe6; }
.top-note, .intro p, .bottom-note { color: #506659; }

.bottom-note { text-shadow: 0 1px 8px #ffffff; }

  .phone { background: #f7f9f366; }

}

<script>
/* Decorative background only: no form data, storage, or network services. */
(() => {
  'use strict';

  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
  const scene = document.createElement('div');
  scene.className = 'onboarding-scene';
  scene.setAttribute('aria-hidden', 'true');
  const camera = document.createElement('div');
  camera.className = 'scene-camera';
  scene.append(camera);

  const sources = [
    ['paper', 'tripilot-home-02-paper-seoul.png'],
    ['river', 'tripilot-home-01-han-river.png'],
    ['journey', 'tripilot-home-03-journey.png'],
  ];
  const layers = sources.map(([name, source], index) => {
    const layer = document.createElement('div');
    layer.className = 'scene-layer' + (index === 0 ? ' is-active' : '');
    layer.dataset.scene = name;
    const image = document.createElement('img');
    image.alt = '';
    image.draggable = false;
    image.decoding = 'async';
    image.fetchPriority = index === 0 ? 'high' : 'low';
    image.addEventListener('load', () => layer.classList.add('is-loaded'), { once: true });
    image.src = source;
    layer.append(image);
    camera.append(layer);
    return layer;
  });
  const veil = document.createElement('div');
  veil.className = 'scene-veil';
  const light = document.createElement('div');
  light.className = 'scene-light';
  scene.append(veil, light);
  document.body.prepend(scene);

  let stage = 0;
  let step = 0;
  let totalSteps = 1;
  let complete = false;
  let pointerX = 0;
  let pointerY = 0;
  let frame = 0;
  let pulse = null;

  function paintPosition() {
    frame = 0;
    const scrollRange = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const scroll = Math.min(1, Math.max(0, window.scrollY / scrollRange));
    const moving = !motion.matches;
    scene.style.setProperty('--scene-x', (moving ? pointerX * 7 : 0) + 'px');
    scene.style.setProperty('--scene-y', (moving ? pointerY * 5 - scroll * 9 : 0) + 'px');
    scene.style.setProperty('--scene-progress', (moving && stage === 2 ? (step / Math.max(1, totalSteps - 1) - .5) * 12 : 0) + 'px');
  }

  function queuePosition() {
    if (!frame && !document.hidden) frame = window.requestAnimationFrame(paintPosition);
  }

  function feedback(kind) {
    if (!kind || motion.matches || document.hidden) return;
    pulse?.cancel();
    const finishing = kind === 'complete';
    pulse = light.animate([
      { opacity: 0, transform: 'scale(.98)' },
      { opacity: finishing ? .7 : .32, transform: 'scale(1)', offset: .35 },
      { opacity: 0, transform: 'scale(1.025)' },
    ], { duration: finishing ? 1250 : 700, easing: 'ease-out' });
  }

  window.triPilotScene = {
    update(next) {
      if ([0, 1, 2].includes(next.stage)) stage = next.stage;
      if (Number.isInteger(next.totalSteps) && next.totalSteps > 0) totalSteps = next.totalSteps;
      if (Number.isFinite(next.step)) step = Math.max(0, Math.min(totalSteps - 1, next.step));
      complete = Boolean(next.complete);
      // Return to the welcoming paper landscape when setup is complete.
      const active = complete ? 0 : stage;
      layers.forEach((layer, index) => layer.classList.toggle('is-active', index === active));
      scene.dataset.stage = String(stage);
      scene.dataset.step = String(step);
      scene.dataset.complete = String(complete);
      scene.dataset.scene = sources[active][0];
      queuePosition();
      feedback(next.feedback);
    },
  };

  document.addEventListener('pointermove', event => {
    if (!finePointer.matches || motion.matches || event.pointerType === 'touch') return;
    pointerX = Math.max(-1, Math.min(1, event.clientX / window.innerWidth * 2 - 1));
    pointerY = Math.max(-1, Math.min(1, event.clientY / window.innerHeight * 2 - 1));
    queuePosition();
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => {
    pointerX = 0;
    pointerY = 0;
    queuePosition();
  });
  window.addEventListener('scroll', queuePosition, { passive: true });
  window.addEventListener('resize', queuePosition, { passive: true });
  motion.addEventListener('change', () => {
    pulse?.cancel();
    pointerX = 0;
    pointerY = 0;
    queuePosition();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      window.cancelAnimationFrame(frame);
      frame = 0;
      pulse?.cancel();
    } else queuePosition();
  });
  window.triPilotScene.update({ stage: 0, step: 0, complete: false });
})();

18:00 Dinner in Yongsan · no reservation
20:00 Return to the hotel · Packing`,

  function sample(lang) {
    return plans[lang === 'en' ? 'en' : 'ko'];
  }

  function validDate(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;

  function parse(source, lang) {

    if (typeof source !== 'string' || !source.trim()) {

    const stops = [];
    let date = '';
    let firstDate = '';

    function inputError(index, ko, en) {
      return new Error(t(`${index + 1}번째 줄: ${ko}`, `Line ${index + 1}: ${en}`));

    for (const [index, raw] of text.split('\n').entries()) {
      const line = raw.trim();
      if (!line) continue;
      const heading = line.match(/^(?:\[)?(?:(\d+)일차|DAY\s*(\d+))(?:\s|[·:：\]-]|$)/i);
      if (heading || /^\d{4}-\d{2}-\d{2}$/.test(line)) {
        const explicit = line.match(/\d{4}-\d{2}-\d{2}/)?.[0];
        const day = heading ? Number(heading[1] || heading[2]) : 1;
        if (!Number.isSafeInteger(day) || day < 1 || day > 366) {

        }

      }

        throw inputError(index, '먼저 일차와 날짜를 적어 주세요. 예: 1일차 · 2026-09-15', 'Start with a day and date, for example: DAY 1 · 2026-09-15.');
      }

      const time = match ? match[1].padStart(5, '0') : '';
      if (!match || !validTime(time)) {
        throw inputError(index, '시작 시각과 장소를 적어 주세요. 예: 09:00 호텔 조식', 'Add a valid start time and place, for example: 09:00 Hotel breakfast.');

      const title = notes.split(/\s*[·|]\s*/)[0].trim();
      if (!title) throw inputError(index, '장소를 적어 주세요.', 'Enter a place.');
      const endMatch = notes.match(/(\S+)\s*종료|\bends?(?:\s+at)?\s+(\S+)/i);

        throw inputError(index, '종료 시각은 같은 날의 시작 시각보다 뒤여야 해요.', 'Use a valid end time after the start time on the same day.');
      }

        reason: t('[시연] 이동 여유 15분을 더한 조정 예시예요. 실제 이동 시간은 조회하지 않았어요.', '[Preview] This example adds a 15-minute buffer. Actual travel times have not been checked.'),
        impact: t('시연된 시작 시각 변경이 여행 일정에 반영돼요. 예약 변경은 실행하지 않아요.', 'The example start-time change appears in your itinerary. No bookings are changed.'),
      };

        ...base, status: 'unchanged', proposedValue: stop.time,
        reason: stop.booking === 'booked'

          : t('[시연] 입력한 시작 시각을 유지하는 결과예요. 실제 운영·이동 정보는 확인하지 않았어요.', '[Preview] This example keeps the entered start time. Actual opening hours and travel information have not been checked.'),
        impact: t('입력한 일정 유지 · 예약 변경 및 취소 실행 없음', 'Entered schedule preserved; no bookings changed or cancelled.'),

    });
    return {
      stops: stops.map(stop => adjusted.has(stop.id)
        ? { ...stop, originalTime: stop.time, time: addFifteen(stop.time) }
        : { ...stop }),
      results,
    };
  }

  window.triPilotJourneyData = { sample, parse, verify };
})();

            ${state.messages.length ? state.messages.map(message => `<article class="j-message" data-role="${message.role === 'user' ? 'user' : 'assistant'}"><p class="j-message-meta">${message.role === 'user' ? t('나', 'You') : 'triPilot'}</p><p class="j-message-bubble">${e(message.text)}</p></article>`).join('') : `<article class="j-message" data-role="assistant"><p class="j-message-meta">triPilot</p><p class="j-message-bubble">${t('등록한 일정에서 궁금한 내용을 골라 주세요. 하루 요약, 선택한 장소와 다음 일정을 함께 살펴볼 수 있어요.', 'Explore your saved itinerary. Ask for a day summary, details of your selected stop, or what comes next.')}</p></article>`}

    </div>`;
  }

  function reply(intent, ctx) {
    const { t } = ctx;
    const { day, stops, selected } = view(ctx);
    if (intent === 'change') return t('이 데모에서는 실제 일정·예약을 변경하거나 취소하지 않아요. 「일정 수정」에서 계획을 고치고 다시 검증할 수 있어요.', 'This demo does not change or cancel actual plans or bookings. Use “Edit itinerary” to revise your plan and check it again.');
    if (!stops.length) return t('이 날짜에는 등록된 일정이 없어요. 일정 수정에서 계획을 추가해 주세요.', 'No stops are saved for this date. Add your plans with “Edit itinerary”.');
    if (intent === 'day') return `${day}\n${stops.map((stop, index) => `${index + 1}. ${stop.time} · ${stop.title}`).join('\n')}`;
    if (intent === 'selected' && selected) {
      const next = stops[stops.indexOf(selected) + 1];
      return `${selected.date} ${selected.time} · ${selected.title}\n${bookingLabel(selected, t)}\n${selected.notes || t('등록된 메모가 없어요.', 'No notes added.')}${selected.originalTime && selected.originalTime !== selected.time ? `\n${t('시간 조정', 'Time adjustment')}: ${selected.originalTime} → ${selected.time}` : ''}\n${next ? t(`다음 일정: ${next.time} · ${next.title}`, `Next stop: ${next.time} · ${next.title}`) : t('이날 마지막 일정이에요.', 'This is the last stop of the day.')}`;
    }
    if (intent === 'next' && selected) {
      const next = stops[stops.indexOf(selected) + 1];
      return next ? t(`${selected.title} 다음은 ${next.time} · ${next.title}입니다. 실제 이동 경로와 소요 시간은 이 개념도에서 계산하지 않아요.`, `After ${selected.title}: ${next.time} · ${next.title}. The diagram does not calculate actual routes or travel times.`) : t(`${selected.title}는 이날 마지막으로 등록한 일정이에요.`, `${selected.title} is the last saved stop for this day.`);
    }
    if (intent === 'booking') {
      const booked = stops.filter(stop => stop.booking === 'booked');
      return booked.length ? `${t('예약 있음으로 입력된 일정:', 'Stops marked as booked:')}\n${booked.map(stop => `${stop.time} · ${stop.title}`).join('\n')}\n${t('입력한 표시이며 실제 예약 내역을 조회한 결과는 아닙니다.', 'These are your entered notes, not a live booking lookup.')}` : t('이 날짜에는 예약 있음으로 입력된 일정이 없어요. 실제 예약 여부는 예약 내역에서 확인해 주세요.', 'No stops on this date are marked as booked. Check your booking records for actual reservations.');
    }
    return t('이 화면은 등록된 일정의 하루 요약·선택 일정·다음 일정·예약 표시를 조회하는 시연입니다. 아래 질문 버튼으로 확인할 내용을 골라 주세요. 자유로운 요청에 대한 실제 조회나 변경은 실행되지 않아요.', 'This preview provides day summaries, selected-stop details, next stops, and booking notes from your itinerary. Choose a question below. Open-ended requests do not run live lookups or changes.');
  }

  function intentFor(text) {
    if (/변경|취소|환불|바꿔|미뤄|앞당|예약해|change|cancel|refund|reschedule|book (?:it|this|the)/i.test(text)) return 'change';
    if (/다음|next/i.test(text)) return 'next';
    if (/선택|상세|selected|detail/i.test(text)) return 'selected';
    if (/예약|booking|reservation|booked/i.test(text)) return 'booking';
    if (/요약|일정|오늘|summary|schedule|today|day/i.test(text)) return 'day';
    return 'unknown';
  }

  function refresh(ctx, focusId) {
    ctx.render();
    if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
  }

  function send(ctx, text, intent, clearDraft) {
    ctx.state.messages.push({ role: 'user', text }, { role: 'assistant', text: reply(intent, ctx) });
    if (clearDraft) ctx.state.draft = '';
    ctx.state.pane = 'chat';
    refresh(ctx, 'j-chat-message');
    const log = document.getElementById('j-chat-log');
    if (log) log.scrollTop = log.scrollHeight;
  }

  function action(name, el, ctx) {
    const { state, t } = ctx;
    const { days, day, stops, selected } = view(ctx);
    const stop = state.stops.find(item => item.id === el.dataset.id);
    switch (name) {
      case 'w-day': {
        if (!days.includes(el.dataset.value)) return true;
        state.day = el.dataset.value;
        state.selectedId = state.stops.find(item => item.date === state.day)?.id || null;
        state.expandedId = null;
        refresh(ctx, `j-day-${days.indexOf(state.day)}`);
        return true;
      }
      case 'w-pane':
        if (!['schedule', 'map', 'chat'].includes(el.dataset.value)) return true;
        state.pane = el.dataset.value;
        refresh(ctx, navMode==='floating'?'j-nav-toggle':`j-pane-button-${state.pane}`);
        return true;
      case 'w-stop':
        if (!stop) return true;
        state.selectedId = stop.id;
        state.expandedId = state.expandedId === stop.id ? null : stop.id;
        refresh(ctx, `j-stop-trigger-${stops.indexOf(stop)}`);
        return true;
      case 'w-map':
        if (!stop) return true;
        state.day = stop.date;
        state.selectedId = stop.id;
        state.pane = 'map';
        refresh(ctx, `j-map-point-${view(ctx).stops.indexOf(stop)}`);
        return true;
      case 'w-details':

        refresh(ctx, `j-stop-trigger-${view(ctx).stops.indexOf(stop)}`);

          selected: selected ? t(`${selected.title} 일정의 상세를 알려 주세요.`, `Tell me about the ${selected.title} stop.`) : '',

      if (error) error.textContent = ctx.t('메시지를 입력해 주세요.', 'Enter a message.');

      input?.focus();
      return true;
    }
    send(ctx, text, intentFor(text), true);
    return true;
  }

  window.triPilotWorkspace = { render, action, submit };

  }
  function render(focus=false) {
    if(state.view==='home')return;

    ${state.view!=='trip'?`<ol class="j-steps">${[t('계획 담기','Your plan'),t('함께 확인','Check together'),t('여행 시작','Your journey')].map((label,i)=>`<li ${i===step?'aria-current="step"':''} ${i<step?'data-done="true"':''}><span>${i<step?icon('check'):'0'+(i+1)}</span>${label}</li>`).join('')}</ol>`:''}
    ${state.view==='registration'?registrationMarkup():state.view==='checking'?verificationMarkup():state.view==='results'?resultsMarkup():window.triPilotWorkspace.render(context())}
    <footer class="j-footer"><span>${icon('leaf')}${t('당신의 취향대로, 더 편안하게.','More you. A little more at ease.')}</span><p class="j-demo-note">${t('인터랙션 목업 · 검증과 채팅은 시연 응답이며 실제 서비스에 연결되지 않아요.','Interactive preview · Checks and chat use demo responses, without a live service connection.')}</p></footer></div>`;
    if(focus){const target=shell.querySelector('h1');if(target){target.tabIndex=-1;target.focus({preventScroll:true})}}
  }
  function refreshResults() {

  });
  shell.addEventListener('input',event=>{
    if(event.target.id==='j-plan-source'){state.source=event.target.value;state.error='';shell.querySelector('#j-source-count').textContent=state.source.length.toLocaleString()+' / 12,000';shell.querySelector('#j-plan-error').textContent='';event.target.setAttribute('aria-invalid','false')}
    if(event.target.id==='j-chat-message')state.draft=event.target.value;
  });
  shell.addEventListener('change',event=>{
    if(event.target.id==='j-scenario')state.scenario=event.target.value;
    if(event.target.id==='j-scope'){state.scope=event.target.checked;const next=shell.querySelector('[data-j-action="activate"]');if(next)next.disabled=!state.scope||state.results.some(r=>r.status==='needs_review')}
  });
  shell.addEventListener('submit',event=>{
    const form=event.target;if(!form.dataset.jForm)return;event.preventDefault();
    if(form.dataset.jForm==='chat'){window.triPilotWorkspace.submit(form,context());return}
    if(form.dataset.jForm==='plan'){
      try{state.rawStops=window.triPilotJourneyData.parse(state.source,state.lang);state.error='';beginVerification()}
      catch(error){state.error=error.message;render();shell.querySelector('#j-plan-source')?.focus()}
    }
  });
  window.addEventListener('popstate',event=>{
    if(!onHome)return;
    let view=event.state?.tripilotView||'home';
    if(!['home','registration','checking','results','trip'].includes(view))view='home';
    if(view==='trip'&&state.status!=='active')view=state.verification==='completed'?'results':'registration';
    if(view==='results'&&state.verification!=='completed')view='checking';
    show(view);
  });
  try{history.replaceState({tripilotView:'home'},'',location.pathname+location.search);}catch(e){}
  window.triPilotJourney={
    open(options){state.lang=options.lang;state.answers={...options.answers};onHome=options.onHome;if(state.verification==='completed')refreshResults();navigate(state.status==='active'?'trip':'registration')},
    setLanguage(lang){
      if(!['en','ko'].includes(lang))return;
      state.lang=lang;
      if(state.verification==='completed')refreshResults();
      if(state.view!=='home')render();
    },
    hasTrip(){return state.status==='active'},
  };
})();

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const embedded = true;
  document.documentElement.classList.toggle('embedded-onboarding',embedded);
  const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const checkIcon=()=>'<svg class="drawn-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="m3 8 3 3 7-7"/></svg>';
  function selectionFeedback(selector){
    const control=$(selector);if(!control)return;
    control.focus({preventScroll:true});
    syncScene('selection');
    if(reducedMotion())return;
    control.classList.add('selection-feedback');
    control.animate([{transform:'scale(.97)',boxShadow:'0 0 0 0 #2E604700'},{transform:'scale(1.015)',boxShadow:'0 0 0 3px #2E604714',offset:.6},{transform:'scale(1)',boxShadow:'0 0 0 0 #2E604700'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  function completionFeedback(selector){syncScene(selector==='.consent-mark'?'consent':'complete');if(!reducedMotion())$(selector)?.classList.add('completion-motion')}

  const state = {lang:'ko',languageChosen:false,open:null,agreed:false,step:0,complete:false,busy:false,answers:{themes:[],companions:[],adults:1,children:0,infants:0,allergies:[],diet:[],foodReligion:[],foodNone:false,foodSkip:false,transport:[],budget:'',budgetCustom:'',citizen:'',priority:'',detailFood:'',detailActivity:'',detailTransport:'',religion:''}};
  function syncScene(feedback){window.triPilotScene.update({stage:state.open,step:state.step,totalSteps:questions.length,complete:state.complete,lang:state.lang,feedback})}
  // Carry the introduction language into setup; standalone previews stay Korean.
  state.lang='@@TRIPILOT_INITIAL_LANG@@';
  if(embedded){state.languageChosen=true;state.open=null;}
  const t=(ko,en)=>state.lang==='ko'?ko:en;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const svg=(name)=>{const paths={down:'<path d="m4 6 4 4 4-4"/>',arrow:'<path d="M3 8h10M9 4l4 4-4 4"/>',lock:'<rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/>',leaf:'<path d="M13 2C5 1 1 5 3 11c5 4 10 0 10-9Z"/><path d="m2 14 8-9"/>',food:'<path d="M4 2v5m-2-5v3c0 3 4 3 4 0V2M4 8v6M11 2v12M11 2c-3 1-4 6 0 6"/>',nature:'<path d="m1 13 5-9 4 9H1Zm7 0 4-6 3 6H8Z"/><circle cx="12" cy="3" r="1"/>',culture:'<path d="m2 5 6-3 6 3H2Zm1 3v4m5-4v4m5-4v4M1 14h14"/>',activity:'<path d="m2 13 4-6 3 3 5-8M10 2h4v4"/>',shopping:'<path d="M3 6h10l1 8H2l1-8ZM5 6V4a3 3 0 0 1 6 0v2"/>',local:'<path d="m1 7 7-5 7 5M3 6v8h10V6M6 14v-4h4v4"/>',public:'<rect x="3" y="1" width="10" height="12" rx="3"/><path d="M3 7h10M5 13l-1 2m7-2 1 2M6 10h0m4 0h0"/>',walk:'<circle cx="9" cy="2" r="1"/><path d="m5 7 3-3 2 3 3 1M8 5l-2 5-3 4m4-4 4 4"/>',car:'<path d="m2 7 2-4h8l2 4M2 7h12v6H2V7Zm2 6v2m8-2v2M4 10h1m6 0h1"/>',taxi:'<path d="m2 7 2-4h8l2 4M2 7h12v6H2V7Zm2 6v2m8-2v2M6 1h4M4 10h1m6 0h1"/>'};return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.leaf)+'</svg>'};
  const opts={themes:[['food','맛집 탐방','Food discoveries'],['nature','자연과 힐링','Nature & rest'],['culture','문화와 역사','Culture & history'],['activity','액티비티','Adventure'],['shopping','쇼핑','Shopping'],['local','로컬 일상','Local life']],companions:[['alone','혼자','Solo'],['partner','연인','Partner'],['friends','친구','Friends'],['family','가족','Family'],['other','기타','Other']],allergies:[['nuts','견과류','Nuts'],['shellfish','갑각류','Shellfish'],['milk','우유','Milk'],['egg','달걀','Eggs'],['wheat','밀','Wheat'],['other','기타','Other']],diet:[['vegetarian','채식','Vegetarian'],['vegan','비건','Vegan']],foodReligion:[['pork','돼지고기','Pork'],['beef','소고기','Beef'],['alcohol','술','Alcohol'],['other','기타','Other']],transport:[['public','대중교통','Public transit'],['walk','도보','Walking'],['car','렌터카','Rental car'],['taxi','택시','Taxi']],budget:[['low','30만 원 이하','Up to ₩300k'],['mid','30–60만 원','₩300k–600k'],['high','60–100만 원','₩600k–1m'],['premium','100만 원 이상','Over ₩1m'],['custom','직접 입력','Enter an amount']],citizen:[['domestic','내국인','Korean national'],['foreign','외국인','Foreign national']],priority:[['food','음식','Food'],['activity','활동','Activities'],['transport','이동','Getting around']],detailFood:[['taste','맛','Taste'],['kindness','친절','Kindness'],['clean','청결','Cleanliness']],detailActivity:[['extreme','익스트림','Extreme'],['healing','힐링','Relaxation'],['diy','DIY','DIY'],['shopping','쇼핑','Shopping']],detailTransport:[['public','대중교통','Public transit'],['walk','도보','Walking'],['car','차','Car']],religion:[['none','없음','None'],['christian','기독교','Protestant'],['catholic','천주교','Catholic'],['buddhist','불교','Buddhist'],['muslim','이슬람교','Muslim'],['hindu','힌두교','Hindu'],['other','기타','Other'],['skip','응답하지 않음','Prefer not to say']]};
  const stepNames=[['여행 테마','Travel themes'],['여행자 구성','Your companions'],['기피 음식','Food preferences'],['선호 이동수단','Transport'],['예산','Budget'],['내국인 여부','Nationality'],['여행 우선순위','Your priority'],['세부 우선순위','The finer details'],['종교','Religious considerations']];
  const questions=[['어떤 여행을 좋아하세요?','What’s your kind of trip?','마음에 드는 테마를 모두 골라 주세요.','Choose all the themes that speak to you.'],['누구와 함께 떠나나요?','Who’s coming along?','동행인과 아이를 포함해 알려 주세요.','Tell us who’s joining, including little ones.'],['피하고 싶은 음식이 있나요?','Any foods to avoid?','필요한 식사 조건만 선택해 주세요.','Share only the food preferences you want to.'],['어떻게 이동하고 싶나요?','How will you get around?','편한 이동수단을 모두 골라 주세요.','Choose all the ways you enjoy getting around.'],['여행 예산은 얼마인가요?','What’s your travel budget?','1인 기준 전체 여행 예산이에요.','Your total trip budget, per person.'],['한국 국적이신가요?','Are you a Korean national?','여행에 필요한 안내를 맞춰 드릴게요.','This helps tailor the travel information.'],['가장 중요한 것은 무엇인가요?','What matters most to you?','여행에서 중요한 한 가지를 골라 주세요.','Choose the one thing that matters most.'],['어떤 점을 더 중요하게 보나요?','It’s all in the details.','음식 · 활동 · 이동에서 각각 하나씩 골라 주세요.','Choose one preference in each category.'],['종교적 고려가 필요한가요?','Any religious considerations?','여행에 반영하고 싶을 때만 알려 주세요.','Share only if you’d like this considered.']];
  function chosenLabel(group,val){const o=(opts[group]||[]).find(x=>x[0]===val);return o?t(o[1],o[2]):t('미선택','Not selected')}
  function chip(group,o,multi=false,icon=false){const v=state.answers[group],selected=Array.isArray(v)?v.includes(o[0]):v===o[0];return `<button type="button" class="chip${selected?' selected':''}" data-group="${group}" data-value="${o[0]}" data-multi="${multi}" aria-pressed="${selected}"><span class="option-check" aria-hidden="true">${checkIcon()}</span>${icon?`<span class="option-icon">${svg(o[0])}</span>`:''}${esc(t(o[1],o[2]))}</button>`}
  function chips(group,list=opts[group],multi=false,grid=false,icon=false){return `<div class="chips${grid?' grid':''}" role="group">${list.map(o=>chip(group,o,multi,icon)).join('')}</div>`}
  function label(ko,en){return `<p class="group-label">${t(ko,en)}</p>`}
  function input(key,ko,en,type='text',placeholder=''){return `<label class="field">${t(ko,en)}<input type="${type}" data-field="${key}" value="${esc(state.answers[key])}" ${placeholder?`placeholder="${esc(placeholder)}"`:''} ${type==='number'?'min="1" inputmode="numeric"':''}></label>`}
  function counter(key,ko,en,capKo,capEn,min){let a=state.answers;return `<div class="counter-row"><span class="counter-label">${t(ko,en)}<span class="counter-caption">${t(capKo,capEn)}</span></span><div class="counter"><button type="button" data-count="${key}" data-delta="-1" aria-label="${t(ko+' 인원 줄이기','Fewer '+en.toLowerCase())}" ${a[key]<=min?'disabled':''}>−</button><output aria-label="${t(ko+' 인원',en+' count')}">${a[key]}</output><button type="button" data-count="${key}" data-delta="1" aria-label="${t(ko+' 인원 늘리기','More '+en.toLowerCase())}" ${a[key]>=20?'disabled':''}>+</button></div></div>`}
  function questionBody(index=state.step){let a=state.answers;switch(index){
    case 0:return chips('themes',opts.themes,true,true,true);
    case 1:return chips('companions',opts.companions,true)+`<div class="counter-list">${counter('adults','성인','Adults','만 13세 이상','Ages 13+',1)}${counter('children','어린이','Children','만 2–12세','Ages 2–12',0)}${counter('infants','유아','Infants','만 2세 미만','Under 2',0)}</div>`;
    case 2:return label('알레르기','Allergies')+chips('allergies',opts.allergies,true)+label('식단','Diet')+chips('diet',opts.diet,true)+label('종교상 피하는 음식','Religious food restrictions')+chips('foodReligion',opts.foodReligion,true)+`<div class="chips" style="margin-top:17px"><button type="button" data-action="food-none" class="chip${a.foodNone?' selected':''}" aria-pressed="${a.foodNone}">${t('해당 없음','None apply')}</button></div>`;
    case 3:return chips('transport',opts.transport,true,true,true);
    case 4:return `<div class="question-progress" style="margin:0 0 11px"><span>${t('전체 여행 · 1인','Entire trip · per person')}</span><span>₩ KRW</span></div>`+chips('budget',opts.budget,false,true)+(a.budget==='custom'?input('budgetCustom','예산 입력 (원)','Budget amount (KRW)','number',t('예: 800000','e.g. 800000')):'');
    case 5:return chips('citizen',opts.citizen,false,true);
    case 6:return chips('priority',opts.priority,false,true,true);
    case 7:return label('음식','Food')+chips('detailFood')+label('활동','Activities')+chips('detailActivity')+label('이동','Getting around')+chips('detailTransport');
    case 8:return chips('religion',opts.religion,false,true);
  }}
  function valid(index=state.step){const a=state.answers;switch(index){case 0:return a.themes.length>0;case 1:return a.companions.length>0&&a.adults>=1&&(a.companions.includes('alone')?a.adults===1&&a.children===0&&a.infants===0:a.adults+a.children+a.infants>=2);case 2:return true;case 3:return a.transport.length>0;case 4:return !!a.budget&&(a.budget!=='custom'||Number.isFinite(Number(a.budgetCustom))&&Number(a.budgetCustom)>0);case 5:return !!a.citizen;case 6:return !!a.priority;case 7:return !!a.detailFood&&!!a.detailActivity&&!!a.detailTransport;case 8:return true;default:return false}}
  function validationHint(index=state.step){const a=state.answers;if(index===1&&a.companions.length&& !a.companions.includes('alone')&&a.adults+a.children+a.infants<2)return t('동행하는 여행은 총인원을 2명 이상으로 설정해 주세요.','Set at least two travelers when traveling with others.');return ''}
  function answeredCount(){const a=state.answers;return questions.filter((_,index)=>{if(index===2)return a.foodNone||a.allergies.length||a.diet.length||a.foodReligion.length;if(index===questions.length-1)return !!a.religion;return valid(index)}).length}
  function updateProgress(){
    const count=answeredCount(),label=t('답변한 질문','Answered questions');
    document.querySelectorAll('.slide-count').forEach(counter=>{counter.textContent=String(count).padStart(2,'0')+' / '+questions.length;counter.setAttribute('aria-label',label+' '+count+' / '+questions.length)});
    document.querySelectorAll('.question-slide .progress-track').forEach(track=>{track.setAttribute('aria-label',label);track.setAttribute('aria-valuenow',String(count));track.querySelector('.progress-fill').style.width=(count/questions.length*100)+'%'});
  }
  function updateValidation(){
    updateProgress();
    const slide=$('#slide-'+state.step);if(!slide)return;
    const b=slide.querySelector('[data-action="next"]');if(b)b.disabled=!valid();
    const e=slide.querySelector('.error');if(e)e.textContent=validationHint();
    fitCarousel();
  }
  function questionMarkup(index){
    const q=questions[index],optional=[2,questions.length-1].includes(index),active=index===state.step,count=answeredCount();
    return `<article class="question-slide" id="slide-${index}" data-slide="${index}" role="group" aria-roledescription="${t('슬라이드','slide')}" aria-labelledby="question-title-${index}" aria-hidden="${!active}" ${active?'':'inert'}><button type="button" class="slide-top" data-card="2" aria-expanded="${state.open===2}" aria-controls="content-2"><span class="step-number">${embedded?'02':'03'}</span><span class="step-copy"><span class="step-title">${t('여행 취향 알아보기','Your travel preferences')}</span><span class="step-sub">${t(stepNames[index][0],stepNames[index][1])}</span></span><span class="slide-count" aria-label="${t('답변한 질문','Answered questions')} ${count} / ${questions.length}">${String(count).padStart(2,'0')} / ${questions.length}</span><span class="chevron">${svg('down')}</span></button><div class="progress-track" role="progressbar" aria-label="${t('답변한 질문','Answered questions')}" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${count}"><div class="progress-fill" style="width:${count/questions.length*100}%"></div></div><div class="question"><h2 tabindex="-1" id="question-title-${index}">${t(q[0],q[1])}</h2><p class="helper">${t(q[2],q[3])}${optional?`<span class="optional">${t('선택','Optional')}</span>`:''}</p><div class="question-body">${questionBody(index)}</div><p class="error" id="validation-${index}" role="status">${validationHint(index)}</p><div class="question-nav"><button type="button" class="previous" data-action="previous">${t('이전','Back')}</button><button type="button" class="next" data-action="next" ${valid(index)?'':'disabled'}>${index===questions.length-1?t('설정 완료','Finish setup'):t('다음','Next')}${svg('arrow')}</button></div>${optional?`<button type="button" class="skip" data-action="skip">${t('응답하지 않고 넘어가기','Skip this question')}</button>`:''}</div></article>`;
  }
  function renderQuestion(){
    const slide=$('#slide-'+state.step);if(!slide)return;
    const focused=document.activeElement;
    const focusKey=focused?.dataset.group ? `[data-group="${focused.dataset.group}"][data-value="${focused.dataset.value}"]`
      : focused?.dataset.count ? `[data-count="${focused.dataset.count}"][data-delta="${focused.dataset.delta}"]`
      : focused?.dataset.action ? `[data-action="${focused.dataset.action}"]` : null;
    slide.querySelector('.question-body').innerHTML=questionBody();
    updateValidation();
    if(focusKey)slide.querySelector(focusKey)?.focus({preventScroll:true});
  }
  let resizeObserver=null,releaseTimer=null,gesture=null,suppressClickUntil=0;
  function fitCarousel(){
    const viewport=$('#question-viewport'),slide=$('#slide-'+state.step);
    const card=$('#card-2'),footer=card?.querySelector('.carousel-footer');
    if(card?.classList.contains('active')&&footer){
      // Reserve the actual footer height inside the card, rather than adding it below a viewport-sized slide.
      card.style.setProperty('--question-card-height',Math.max(0,card.clientHeight-footer.offsetHeight-1)+'px');
    }
    if(viewport&&slide&&slide.offsetHeight)viewport.style.height=slide.offsetHeight+'px';
  }
  function positionTrack(drag=0){
    const track=$('#question-track');if(track)track.style.transform=`translateX(calc(${-state.step*100}% - ${state.step*12}px + ${drag}px))`;
  }
  function mountCarousel(){
    if(resizeObserver)resizeObserver.disconnect();
    const viewport=$('#question-viewport');if(!viewport)return;
    viewport.innerHTML=`<div class="question-track" id="question-track">${questions.map((_,i)=>questionMarkup(i)).join('')}</div>`;
    viewport.setAttribute('aria-label',t('여행 취향 질문 카드','Travel preference question cards'));
    viewport.setAttribute('aria-roledescription',t('캐러셀','carousel'));
    syncCarousel();
    updateProgress();
    if(typeof ResizeObserver!=='undefined'){
      resizeObserver=new ResizeObserver(()=>fitCarousel());
      document.querySelectorAll('.question-slide').forEach(slide=>resizeObserver.observe(slide));
    }
  }
  function syncCarousel(){
    positionTrack();
    document.querySelectorAll('.question-slide').forEach((slide,i)=>{
      slide.inert=i!==state.step;slide.setAttribute('aria-hidden',String(i!==state.step));
    });
    document.querySelectorAll('.carousel-dot').forEach((dot,i)=>{
      if(i===state.step)dot.setAttribute('aria-current','step');else dot.removeAttribute('aria-current');
    });
    requestAnimationFrame(fitCarousel);
    syncScene();
  }
  function finishTransition(){
    clearTimeout(releaseTimer);state.busy=false;fitCarousel();
    if(state.open===2&&!state.complete)$('#question-title-'+state.step)?.focus({preventScroll:true});

    <header class="header"><button type="button" class="brand brand-home" data-label="home"><span class="mark" aria-hidden="true">t</span>triPilot</button><label class="language-box"><span data-copy="language"></span><select id="language" data-label="language"><option value="en" lang="en">English</option><option value="ko" lang="ko">한국어</option></select></label></header>
    <main class="pages" tabindex="0" data-label="pages">
      <section class="page hero" aria-labelledby="intro-title"><div class="hero-copy"><p class="eyebrow">YOUR TRAVEL, OUR JOURNEY</p><h1 id="intro-title" data-copy="intro"></h1><p class="description" data-copy="introDescription"></p></div><div class="hero-badge"><small>A LITTLE MORE YOU</small><strong data-copy="badge"></strong></div>${down(1)}</section>
      <section class="page how" aria-labelledby="how-title"><p class="eyebrow">HOW IT WORKS</p><h2 id="how-title" data-copy="how"></h2><p class="description" data-copy="howDescription"></p><div class="steps">${[1,2,3].map(i=>`<article class="step"><span class="step-no">0${i}</span><div><h3 data-copy="step${i}"></h3><p data-copy="detail${i}"></p></div></article>`).join('')}</div><p class="how-note" data-copy="howNote"></p>${down(2)}</section>
      ${inlineCards ? '<section class="page inline-card-page" data-label="setup"></section>' : `<section class="page start" aria-labelledby="start-title"><p class="eyebrow">LET’S MAKE IT YOURS</p><h2 id="start-title" data-copy="start"></h2><p class="description" data-copy="startDescription"></p><div class="ticket"><span class="ticket-label">YOUR NEXT JOURNEY</span><div class="ticket-route"><strong data-copy="taste"></strong><span class="route-line" aria-hidden="true">····· →</span><strong data-copy="trip"></strong></div><div class="ticket-bottom"><span>TRAVEL PARTNER</span><span>triPilot</span></div></div><div class="action-area"><button class="primary" id="start"><span data-copy="cta"></span><span aria-hidden="true">↗</span></button><p class="action-note" data-copy="actionNote"></p></div></section>`}
    </main><nav class="pagination" data-label="navigation">${[0,1,2].map(i=>`<button class="dot" data-go="${i}" ${i===0?'aria-current="step"':''}></button>`).join('')}</nav>
    <section class="setup" hidden data-label="setup"><iframe></iframe></section>
  </div>`;
  const pages = document.querySelector('.pages');
  const sections = [...pages.children];
  const selector = document.querySelector('#language');
  const setup = document.querySelector('.setup');
  const frame = setup.querySelector('iframe');
  const pagination = document.querySelector('.pagination');
  function translate() {
    const text = copy[language];
    document.documentElement.lang = language;
    document.title = text.title;
    document.querySelectorAll('[data-copy]').forEach(element => {element.innerHTML = text[element.dataset.copy];});
    document.querySelectorAll('[data-label]').forEach(element => element.setAttribute('aria-label',text[element.dataset.label]));
    document.querySelectorAll('.dot').forEach((dot,i)=>dot.setAttribute('aria-label',`${i+1}. ${text.labels[i]}`));
    frame.title = text.frame;
    if(inlineCards)document.querySelectorAll('.dot')[2].setAttribute('aria-label',`3. ${text.setup}`);
  }
  function syncFrameLanguage(){
    if(frame.hasAttribute('src')||frame.hasAttribute('srcdoc'))frame.contentWindow?.postMessage({type:'tripilot:set-language',lang:language},'*');
  }
  frame.addEventListener('load',()=>{syncFrameLanguage();frame.contentWindow?.postMessage({type:'tripilot:set-nav',mode:document.body.dataset.navigation},'*');});
  selector.addEventListener('change',()=>{language=selector.value;translate();syncFrameLanguage();});
  const go = index => pages.scrollTo({top:sections[index].offsetTop,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
  document.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>go(Number(button.dataset.go))));
  const observer = new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(!entry.isIntersecting || entry.intersectionRatio < .6)return;
    const index=sections.indexOf(entry.target);
    if(inlineCards){
      setup.hidden=index!==2;
      if(index===2)loadOnboarding();
    }
    document.querySelectorAll('.dot').forEach((dot,i)=>{if(i===index)dot.setAttribute('aria-current','step');else dot.removeAttribute('aria-current');});
  }),{root:pages,threshold:.6});
  sections.forEach(section=>observer.observe(section));
  pages.addEventListener('keydown',event=>{
    if(event.target!==pages)return;
    const current=Math.round(pages.scrollTop/pages.clientHeight);
    const keys={ArrowDown:Math.min(2,current+1),PageDown:Math.min(2,current+1),ArrowUp:Math.max(0,current-1),PageUp:Math.max(0,current-1),Home:0,End:2};
    if(event.key in keys){event.preventDefault();go(keys[event.key]);}
  });
  let onboardingBlobUrl=null;
  function getOnboardingBlobUrl(){
    if(onboardingBlobUrl)return onboardingBlobUrl;
    const raw=document.getElementById('onboarding-template').textContent
      .replace(/@@TRIPILOT_ENDSCRIPT_PLACEHOLDER@@/g,'<'+'/script>')
      .replace('@@TRIPILOT_INITIAL_LANG@@',language);
    const blob=new Blob([raw],{type:'text/html'});
    onboardingBlobUrl=URL.createObjectURL(blob);
    return onboardingBlobUrl;
  }
  // blob: 주소 대신 srcdoc 사용 — 모바일 미리보기/웹뷰의 보안 정책(CSP)에서 빈 화면이 되는 문제 방지
  let onboardingHtml=null;
  function getOnboardingHtml(){
    if(onboardingHtml)return onboardingHtml;
    onboardingHtml=document.getElementById('onboarding-template').textContent
      .replace(/@@TRIPILOT_ENDSCRIPT_PLACEHOLDER@@/g,'<'+'/script>')
      .replace('@@TRIPILOT_INITIAL_LANG@@',language)
      .replace('@@TRIPILOT_NAV_MODE@@',document.body.dataset.navigation==='floating'?'floating':'fixed');
    return onboardingHtml;
  }
  function loadOnboarding(){
    if(!frame.hasAttribute('srcdoc'))frame.srcdoc=getOnboardingHtml();
    else syncFrameLanguage();
  }
  document.querySelector('#start')?.addEventListener('click',()=>{
    loadOnboarding();
    setup.hidden=false;pages.inert=true;pagination.inert=true;frame.focus();
  });
  document.querySelector('.brand-home').addEventListener('click',()=>{
    setup.hidden=true;pages.inert=false;pagination.inert=false;
    pages.scrollTo({top:0,behavior:'instant'});
    document.querySelectorAll('.dot').forEach((dot,i)=>{if(i===0)dot.setAttribute('aria-current','step');else dot.removeAttribute('aria-current');});
  });
  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow || event.data?.type!=='tripilot:terms-view' || typeof event.data.open!=='boolean')return;
    const expanded=event.data.open && !setup.hidden;
    setup.classList.toggle('terms-expanded',expanded);
    document.querySelector('.header').inert=expanded;

  });
  translate();
})();

</script>
<style id="tripilot-scroll-fx">
/* ===== Scroll-snap motion layer (added) ===== */
.fx-progress{position:absolute;top:0;left:0;height:3px;width:100%;z-index:7;pointer-events:none;
  background:linear-gradient(90deg,#9cc7a6,#2e6047);transform-origin:left;transform:scaleX(var(--fx-p,0));transition:transform .25s linear}

/* 섹션 배경: 들어올 때 천천히 줌아웃 (Ken Burns) */
body[data-variant="start"] .device.fx .page{background-size:100% 100%,auto 100%;
  transition:background-size 2.6s cubic-bezier(.2,.8,.2,1)}
body[data-variant="start"] .device.fx .page:not(.in){background-size:100% 100%,auto 112%}

/* 공통 등장 */
.device.fx [data-fx]{opacity:0;transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.device.fx [data-fx="up"]{transform:translateY(28px)}
.device.fx [data-fx="fade"]{transform:none}
.device.fx [data-fx="scale"]{transform:translateY(18px) scale(.9)}
.device.fx [data-fx="flip"]{transform:perspective(700px) rotateX(-38deg) translateY(22px);transform-origin:top center}
.device.fx .page.in [data-fx]{opacity:1;transform:none}

/* 제목 글자/단어 단위 리빌 */
.fx-w{display:inline-block;white-space:nowrap}
.fx-ch{display:inline-block;opacity:0;transform:translateY(.55em) rotate(7deg);
  transition:opacity .6s ease,transform .75s cubic-bezier(.2,.9,.2,1);transition-delay:var(--d,0s)}
.page.in .fx-ch{opacity:1;transform:none}

/* 반복 모션 (등장 끝난 뒤 시작) */
@keyframes fx-bob{50%{transform:translateY(-6px)}}
@keyframes fx-nudge{50%{transform:translateY(5px)}}
@keyframes fx-route{50%{transform:translateX(6px)}}
@keyframes fx-shine{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}
@keyframes fx-glow{0%{box-shadow:0 8px 22px #2e604719,0 0 0 0 #2e604755}100%{box-shadow:0 8px 22px #2e604719,0 0 0 12px #2e604700}}
.page.in .hero-badge{animation:fx-bob 4.5s ease-in-out 1.8s infinite}
.page.in .down-arrow span{display:inline-block;animation:fx-nudge 1.6s ease-in-out 1.2s infinite}
.route-line{display:inline-block}
.page.in .route-line{animation:fx-route 1.8s ease-in-out 1.4s infinite}
.ticket-route strong{transition:opacity .7s ease .75s,transform .8s cubic-bezier(.2,.8,.2,1) .75s}
.device.fx .page:not(.in) .ticket-route strong:first-child{opacity:0;transform:translateX(-18px)}
.device.fx .page:not(.in) .ticket-route strong:last-child{opacity:0;transform:translateX(18px)}
.device.fx .primary{background:linear-gradient(110deg,transparent 42%,#ffffff33 50%,transparent 58%) var(--green);
  background-size:260% 100%;background-position:130% 0}
.page.in .primary{animation:fx-shine 3.4s ease 1.4s infinite,fx-glow 2.4s ease-out 1.6s infinite}
.step{transition:transform .2s ease,box-shadow .2s ease}
.step:active{transform:scale(.98)}

@media(prefers-reduced-motion:reduce){
  .device.fx [data-fx],.fx-ch,.device.fx .ticket-route strong{opacity:1!important;transform:none!important;transition:none!important}
  .device.fx .page,.device.fx .page *{animation:none!important}
  body[data-variant="start"] .device.fx .page{transition:none!important;background-size:100% 100%,auto 100%!important}
}
</style>
<script id="tripilot-scroll-fx-js">
(() => {
  'use strict';
  const device = document.querySelector('.device');
  const pages = document.querySelector('.pages');
  if (!device || !pages) return;
  const sections = [...pages.children];

  device.classList.add('fx');

  // 1) 상단 진행바
  const bar = document.createElement('div');
  bar.className = 'fx-progress';
  bar.setAttribute('aria-hidden', 'true');
  device.appendChild(bar);
  const syncBar = () => {
    const max = pages.scrollHeight - pages.clientHeight;
    bar.style.setProperty('--fx-p', max > 0 ? (pages.scrollTop / max).toFixed(3) : 0);
  };
  pages.addEventListener('scroll', syncBar, {passive: true});

  // 2) 요소별 등장 타입 / 딜레이 지정
  const tag = (sel, type, delay, step = 0) =>
    device.querySelectorAll(sel).forEach((el, i) => {
      el.dataset.fx = type;
      el.style.setProperty('--d', (delay + i * step).toFixed(2) + 's');
    });
  tag('.page .eyebrow', 'up', .05);
  tag('.page .description', 'up', .5);
  tag('.hero-badge', 'scale', .8);
  tag('.how .step', 'flip', .45, .14);
  tag('.how-note', 'fade', 1);
  tag('.ticket', 'scale', .45);
  tag('.action-area', 'up', .95);
  tag('.page .intro-controls', 'fade', 1.1);

  // 3) 제목 글자(h1) / 단어(h2) 단위 쪼개기 — <br> 유지
  function split(el, mode) {
    let n = 0;
    const base = mode === 'char' ? .12 : .15, gap = mode === 'char' ? .035 : .08;
    const walk = node => [...node.childNodes].forEach(child => {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        child.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
          const w = document.createElement('span');
          w.className = 'fx-w';
          const units = mode === 'char' ? [...part] : [part];
          units.forEach(u => {
            const s = document.createElement('span');
            s.className = 'fx-ch';
            s.textContent = u;
            s.style.setProperty('--d', (base + n++ * gap).toFixed(3) + 's');
            w.appendChild(s);
          });
          frag.appendChild(w);
        });
        child.replaceWith(frag);
      } else if (child.nodeType === 1 && child.tagName !== 'BR') walk(child);
    });
    walk(el);
  }
  const splitTitles = () => {
    const h1 = device.querySelector('#intro-title');
    if (h1) split(h1, 'char');
    device.querySelectorAll('#how-title,#start-title').forEach(h => split(h, 'word'));
  };
  splitTitles();

  // 4) 섹션 진입/이탈 → 애니메이션 재생/리셋
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.intersectionRatio >= .6) e.target.classList.add('in');
    else if (e.intersectionRatio < .12) e.target.classList.remove('in');
  }), {root: pages, threshold: [0, .12, .6]});
  sections.forEach(s => io.observe(s));

  // 4-b) 백업: 스크롤 위치로 현재 화면 계산 (일부 모바일 브라우저에서 IO가 안 불리는 경우 대비)
  let ticking = false;
  const syncActive = () => {
    ticking = false;
    const h = pages.clientHeight || 1, top = pages.scrollTop;
    sections.forEach(s => {
      const diff = Math.abs(s.offsetTop - top);
      if (diff < h * .4) s.classList.add('in');
      else if (diff > h * .9) s.classList.remove('in');
    });
  };
  const queue = () => { if (!ticking) { ticking = true; requestAnimationFrame(syncActive); } };
  pages.addEventListener('scroll', queue, {passive: true});
  pages.addEventListener('scrollend', syncActive);
  device.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    [350, 800, 1400].forEach(t => setTimeout(syncActive, t));
  }));
  window.addEventListener('resize', queue);
  syncActive();

  // 5) 언어 변경 시 제목 다시 쪼개고 현재 화면 애니메이션 재생
  document.querySelector('#language')?.addEventListener('change', () => {
    splitTitles();
    const cur = sections.find(s => s.classList.contains('in'));
    if (cur) { cur.classList.remove('in'); void cur.offsetWidth; requestAnimationFrame(() => cur.classList.add('in')); }
  });

  // 홈 버튼으로 돌아올 때 첫 화면 재생
  document.querySelector('.brand-home')?.addEventListener('click', () => {
    sections.forEach(s => s.classList.remove('in'));
    requestAnimationFrame(() => sections[0].classList.add('in'));
  });

  syncBar();
})();
</script>
<style id="tripilot-nav-switch">
.nav-switch{display:flex;flex-direction:column;align-items:center;gap:3px;color:#526858;font-size:9px;letter-spacing:.5px}
.nav-switch .seg{position:relative;display:flex;padding:3px;border:1px solid #cbd8cd;border-radius:999px;background:#ffffffd9}
.nav-switch .seg::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--green);
  transition:transform .32s cubic-bezier(.22,.8,.2,1)}
.nav-switch[data-mode="floating"] .seg::before{transform:translateX(100%)}
.nav-switch button{position:relative;z-index:1;border:0;background:none;min-width:46px;min-height:30px;padding:4px 8px;border-radius:999px;font-size:11px;color:#2e6047;transition:color .25s}
.nav-switch button[aria-pressed="true"]{color:#fff;font-weight:650}
@media(max-width:370px){.nav-switch button{min-width:40px;padding:4px 6px;font-size:10px}}
@media(prefers-reduced-motion:reduce){.nav-switch .seg::before,.nav-switch button{transition:none}}
</style>
<script id="tripilot-nav-switch-js">
(() => {
  'use strict';
  const header = document.querySelector('.header');
  const langBox = header && header.querySelector('.language-box');
  if (!header || !langBox) return;
  const frame = document.querySelector('.setup iframe');
  const L = {
    ko: {label: '내비게이션', fixed: '고정', floating: '플로팅'},
    en: {label: 'Nav bar', fixed: 'Fixed', floating: 'Float'}
  };
  const box = document.createElement('div');
  box.className = 'nav-switch';
  box.innerHTML = '<span class="nav-label"></span><div class="seg" role="group"><button type="button" data-mode="fixed"></button><button type="button" data-mode="floating"></button></div>';
  header.insertBefore(box, langBox);
  const lang = () => document.documentElement.lang === 'ko' ? 'ko' : 'en';
  const paint = () => {
    const mode = document.body.dataset.navigation === 'floating' ? 'floating' : 'fixed';
    const text = L[lang()];
    box.dataset.mode = mode;
    box.querySelector('.nav-label').textContent = text.label;
    box.querySelector('.seg').setAttribute('aria-label', text.label);
    box.querySelectorAll('button').forEach(b => {
      b.textContent = text[b.dataset.mode];
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
  };
  const setMode = mode => {
    document.body.dataset.navigation = mode;
    paint();
    frame?.contentWindow?.postMessage({type: 'tripilot:set-nav', mode}, '*');
  };
  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
  document.querySelector('#language')?.addEventListener('change', paint);
  paint();
})();
</script>
