<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설문을 로딩 화면에서 받는 흐름 — 목업 v8 (항로 지킴이 카드 · 아이콘 복원)</title>
<style>
/* 토큰 — 색은 실제 제품(src/styles/tokens.css, 2026-10-03 사용자 확정 값)과 같다. 테마는 초록(기본)·흰색 두 가지뿐이고 다크 테마는 없다.
   간격(4/8 격자) · 글자(12/14/16, 굵기 400/500/600) · 움직임(100/150/200/300ms) · 화면 폭(375/768/1280)은 이 목업이 더한 제안이다. */
:root,[data-theme="green"]{
  color-scheme:light;
  --color-text:#24392f; --color-muted:#6d7c73; --color-border:#dce3dd; --color-surface:#ffffff; --color-background:#f3f5f3; --color-paper:#f7f9f3;
  --color-primary:#2e6047; --color-primary-hover:#254f3a; --color-on-primary:#ffffff; --color-soft:#e9f2eb; --color-subtle:#f6f7f5;
  --color-warning:#82693e; --color-warning-soft:#faf6ec; --color-warning-border:#e5d9c1;
  --color-error:#965640; --color-error-soft:#fdf3ed; --color-error-border:#ecd2c7;
  --color-text-secondary:#4a5d52; --color-faint:#a5b1a9; --color-divider:#e8ede9; --color-subtle-strong:#e4e9e5; --color-border-strong:#c3cdc6;
  --color-success:#3d7a56; --color-success-soft:#e3f0e7;
  --color-selected:#2e6047; --color-selected-soft:#dcebe1;
  --color-inverse:#24392f; --color-on-inverse:#ffffff;
  --color-scrim:rgba(36,57,47,.45);
}
[data-theme="neutral"]{
  --color-text:#1c1c1e; --color-muted:#86868c; --color-border:#dadad6; --color-surface:#ffffff; --color-background:#f2f2ef; --color-paper:#ffffff;
  --color-primary:#1c1c1e; --color-primary-hover:#2c2c2e; --color-on-primary:#ffffff; --color-soft:#ececea; --color-subtle:#f6f6f4;
  --color-warning:#a35a00; --color-warning-soft:#fff0d4; --color-warning-border:#e9c27a;
  --color-error:#c03a1a; --color-error-soft:#fde5de; --color-error-border:#f2b8a8;
  --color-text-secondary:#48484d; --color-faint:#b9b9bd; --color-divider:#ebebe7; --color-subtle-strong:#ececea; --color-border-strong:#c2c2c6;
  --color-success:#4f7a63; --color-success-soft:#e8f1ec;
  --color-selected:#2457d6; --color-selected-soft:#e1e9ff;
  --color-inverse:#26262a; --color-on-inverse:#ffffff;
  --color-scrim:rgba(28,28,30,.45);
}
/* 제안: 글자 대비 보정안(켜고 끌 수 있음). 실제 값은 흐린 글자가 4.5:1 에 못 미친다 — 점검 기록 참고 */
[data-contrast="fix"]{--color-muted:#5d6d64;--color-success:#2f6a47}
[data-contrast="fix"][data-theme="neutral"]{--color-muted:#68686e;--color-success:#3f6b53}
:root{
  --focus:var(--color-primary);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --text-meta:12px; --text-secondary:14px; --text-body:16px;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  --motion-100:100ms; --motion-150:150ms; --motion-200:200ms; --motion-300:300ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --vp-narrow:375px; --vp-medium:768px; --vp-wide:1280px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-background);color:var(--color-text);font:var(--w-regular) var(--text-body)/1.6 "Segoe UI","Malgun Gothic",sans-serif}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-weight:var(--w-semibold);line-height:1.25}
h1{font-size:24px}
h2{font-size:20px}
h3{font-size:16px}
.meta{font-size:var(--text-meta);line-height:1.4;color:var(--color-muted)}
button{font-family:inherit;font-size:var(--text-secondary);font-weight:var(--w-medium);line-height:1.4;color:inherit;cursor:pointer;min-height:44px;min-width:44px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface);padding:var(--space-2) var(--space-4)}
button:hover{border-color:var(--color-border-strong);background:var(--color-subtle)}
button:disabled{cursor:default;color:var(--color-muted);background:var(--color-subtle-strong);border-color:var(--color-subtle-strong)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--space-2);top:-48px;z-index:20;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:8px;padding:var(--space-2) var(--space-3);font-size:var(--text-secondary);color:var(--color-text)}
.skip:focus{top:var(--space-2)}
.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary);font-weight:var(--w-semibold)}
.primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.primary[aria-disabled="true"]{background:var(--color-subtle-strong);border-color:var(--color-subtle-strong);color:var(--color-text-secondary)}
.full{width:100%}
.text-button{border-color:var(--color-surface);background:var(--color-surface);color:var(--color-muted);font-size:var(--text-meta);font-weight:var(--w-regular);text-decoration:underline;text-underline-offset:4px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:12px;background:none;color:var(--color-text-secondary)}
.icon-btn svg{display:block;width:24px;height:24px}
.icon-btn:hover{background:var(--color-subtle)}
.icon-btn:disabled{opacity:.35;background:none}
svg.ic{display:inline-block;vertical-align:-3px;flex-shrink:0}
/* 도구 설명(툴팁) */
.tip{position:fixed;z-index:30;display:flex;align-items:center;gap:var(--space-2);background:var(--color-inverse);color:var(--color-on-inverse);font-size:var(--text-meta);font-weight:var(--w-medium);line-height:1.4;border-radius:8px;padding:var(--space-1) var(--space-2);pointer-events:none;white-space:nowrap}
.tip[hidden]{display:none}
.tip kbd{font:inherit;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 var(--space-1)}
/* 시연 틀(제품 화면이 아님) */
.page-head{max-width:var(--vp-wide);margin:0 auto;padding:var(--space-8) var(--space-6) var(--space-4)}
.intro{color:var(--color-muted);margin-top:var(--space-2);font-size:var(--text-secondary)}
.demo-nav{display:flex;gap:var(--space-3);align-items:center;margin-top:var(--space-6);flex-wrap:wrap}
.tabs{display:flex;gap:var(--space-2);flex-wrap:wrap;flex:1}
.tabs button{font-size:var(--text-meta);padding:var(--space-2) var(--space-3)}
.tabs button[aria-selected="true"]{background:var(--color-selected-soft);border-color:var(--color-primary);color:var(--color-primary);font-weight:var(--w-semibold)}
.steps-nav{display:flex;gap:var(--space-2)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 408px minmax(0,1fr);gap:var(--space-6);max-width:var(--vp-wide);margin:0 auto var(--space-12);padding:0 var(--space-6);align-items:start}
.stage.wide{display:block}
.phone{grid-column:2;position:relative;isolation:isolate;width:408px;max-width:100%;height:824px;border:1px solid var(--color-border-strong);border-radius:32px;background:var(--color-paper);overflow:hidden}
.phone.desk{width:100%;height:auto;border-radius:24px}
.side{grid-column:3;width:100%;min-width:0;padding-top:var(--space-2)}
.stage.wide .side{margin-top:var(--space-6);padding-top:0}
.rules{padding:var(--space-6);background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px}
.rules h2{font-size:16px}
.rules ul{list-style:disc;padding-left:var(--space-4);margin-top:var(--space-4);font-size:var(--text-secondary);color:var(--color-text-secondary)}
.rules li+li{margin-top:var(--space-3)}
.rules .flag{display:block;background:var(--color-warning-soft);border:1px solid var(--color-warning-border);border-radius:8px;padding:var(--space-2) var(--space-3);color:var(--color-warning)}
.rules code{font-size:var(--text-meta)}
.demo-tools{margin-top:var(--space-6)}
.demo-tools p{margin-bottom:var(--space-2)}
/* 휴대폰 폭 화면 */
.phone-content{height:100%;display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:center;padding:var(--space-1) var(--space-2) var(--space-1) var(--space-6);min-height:56px;color:var(--color-primary);font-weight:var(--w-semibold)}
.brand .right{display:flex;align-items:center;gap:var(--space-1);font-weight:var(--w-regular)}
.app-head{padding:var(--space-2) var(--space-4) var(--space-4)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:0 var(--space-4) var(--space-6);scrollbar-width:thin;scrollbar-color:var(--color-border-strong) var(--color-paper)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;padding:var(--space-4);margin-bottom:var(--space-3)}
.footer{padding:var(--space-4);background:var(--color-surface);border-top:1px solid var(--color-border);flex-shrink:0}
.footer .help{margin-top:var(--space-2);text-align:center}
.help{font-size:var(--text-meta);line-height:1.5;color:var(--color-muted);margin-top:var(--space-2)}
.loading-head{padding:var(--space-2) 0 var(--space-4)}
.eyebrow{color:var(--color-muted);font-size:var(--text-secondary);margin-bottom:var(--space-2)}
.progress-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin-top:var(--space-6)}
.step{color:var(--color-muted);font-size:var(--text-meta);line-height:1.4;text-align:center}
.step[aria-current="step"]{color:var(--color-primary);font-weight:var(--w-semibold)}
.track{height:4px;border-radius:4px;background:var(--color-subtle-strong);overflow:hidden;margin-bottom:var(--space-2)}
.fill{height:100%;width:100%;background:var(--color-primary)}
.step[aria-current="step"] .fill{transform-origin:left;animation:read-progress 14s linear forwards}
.step.pending .fill{width:0}
@keyframes read-progress{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
.notice{font-size:var(--text-secondary);line-height:1.6;color:var(--color-text-secondary);padding:var(--space-3) 0 var(--space-4)}
.success-line{display:flex;align-items:center;gap:var(--space-2);background:var(--color-success-soft);color:var(--color-success);border-radius:12px;padding:var(--space-3) var(--space-4);font-size:var(--text-secondary);font-weight:var(--w-semibold);margin-bottom:var(--space-4)}
/* 질문 슬라이드 */
.pager-top{display:flex;align-items:center;justify-content:space-between}
.pager-top .count{font-size:var(--text-meta);color:var(--color-muted)}
.question h3{font-size:20px}
.reason{font-size:var(--text-secondary);color:var(--color-muted);margin-top:var(--space-2);line-height:1.5}
.choices{display:grid;gap:var(--space-2);margin-top:var(--space-4)}
.choices button{display:flex;align-items:center;gap:var(--space-2);min-height:48px;text-align:left;font-size:var(--text-body);font-weight:var(--w-regular)}
button.selected{background:var(--color-selected-soft);border-color:var(--color-selected);color:var(--color-selected);font-weight:var(--w-semibold)}
.slide{touch-action:pan-y;user-select:none}
.slide.from-right{animation:slide-in-right var(--motion-200) var(--ease-out)}
.slide.from-left{animation:slide-in-left var(--motion-200) var(--ease-out)}
@keyframes slide-in-right{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}
@keyframes slide-in-left{from{opacity:.4;transform:translateX(-8px)}to{opacity:1;transform:none}}
.saved{min-height:24px;margin-top:var(--space-2);color:var(--color-success);font-size:var(--text-secondary);text-align:center}
.question .text-button{display:block;margin:var(--space-1) auto 0}
.dots{display:flex;justify-content:center;gap:var(--space-2);margin-top:var(--space-2)}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--color-subtle-strong)}
.dots span.on{background:var(--color-primary)}
.swipe-hint{margin-top:var(--space-2);text-align:center}
.pager-status{padding:var(--space-3) var(--space-1);text-align:center;font-size:var(--text-secondary);color:var(--color-text-secondary);line-height:1.5}
/* 아래 단추 — 읽는 중에는 눌러도 아무 일 없는 단추 대신 「읽는 중」 상태를 보여 줌 */
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.done-line{display:flex;align-items:center;justify-content:center;gap:var(--space-2);color:var(--color-success);font-size:var(--text-secondary);font-weight:var(--w-semibold)}
.done-sub{margin-top:var(--space-1);text-align:center;font-size:var(--text-secondary);color:var(--color-text-secondary)}
.finish-track{height:4px;background:var(--color-subtle-strong);border-radius:4px;overflow:hidden;margin:var(--space-3) 0 var(--space-4)}
.finish-fill{height:100%;background:var(--color-primary);transform-origin:left;animation:finish var(--finish-ms,3000ms) linear forwards}
@keyframes finish{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.footer .text-button{display:block;margin:var(--space-2) auto 0}
/* 가만히 있을 때(시간 경고 — 알림 대화) */
.modal-layer{position:absolute;inset:0;background:var(--color-scrim);z-index:5;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--color-surface);border:1px solid var(--color-border);border-radius:24px 24px 0 0;padding:var(--space-6);animation:rise var(--motion-200) var(--ease-out)}
.sheet .text-button{display:block;margin:var(--space-2) auto 0}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.countdown{text-align:center;font-size:48px;font-weight:var(--w-semibold);line-height:1.2;color:var(--color-primary);font-variant-numeric:tabular-nums;margin-bottom:var(--space-3)}
.count-copy{font-size:var(--text-body);text-align:center;margin-bottom:var(--space-6);word-break:keep-all}
/* 계획 확인(기존) 자리표시 */
.skeleton span{display:block;height:8px;border-radius:4px;background:var(--color-subtle-strong);margin-top:var(--space-3)}
.skeleton span:nth-child(2){width:80%}
.skeleton span:nth-child(3){width:56%}
/* ① 계획 담기 — 실제 화면 폭(양식 화면) */
.site-head{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2) var(--space-4) var(--space-2) var(--space-8);border-bottom:1px solid var(--color-divider);min-height:64px}
.site-head .right{display:flex;align-items:center;gap:var(--space-2)}
.logo{display:flex;align-items:center;gap:var(--space-2);font-size:20px;font-weight:var(--w-semibold)}
.logo-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--color-primary);color:var(--color-on-primary);font-size:20px;font-weight:var(--w-semibold)}
.site-body{padding:var(--space-6) var(--space-8) var(--space-6)}
.stepper{display:flex;gap:var(--space-6);margin-bottom:var(--space-8);flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:var(--space-2);color:var(--color-muted);font-size:var(--text-secondary)}
.stepper .num{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--color-subtle-strong);color:var(--color-text-secondary);font-size:var(--text-meta);font-weight:var(--w-semibold)}
.stepper .current{color:var(--color-primary);font-weight:var(--w-semibold)}
.stepper .current .num{background:var(--color-primary);color:var(--color-on-primary)}
.caps{font-size:var(--text-meta);font-weight:var(--w-semibold);letter-spacing:.08em;color:var(--color-text-secondary)}
.site-body h1{font-size:40px;letter-spacing:-.02em;margin:var(--space-2) 0 var(--space-3)}
.lede{color:var(--color-muted);max-width:70ch;margin-bottom:var(--space-6)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--space-6);align-items:start}
.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:24px;padding:var(--space-6);margin-bottom:var(--space-4)}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-2)}
.label-row label{font-weight:var(--w-semibold);font-size:var(--text-body)}
.link-button{border:0;background:none;color:var(--color-text-secondary);font-weight:var(--w-regular)}
.plan-input{display:block;width:100%;height:192px;resize:vertical;border:1px solid var(--color-border);border-radius:16px;background:var(--color-subtle);padding:var(--space-4);font:inherit;font-size:var(--text-secondary);line-height:2;color:var(--color-text)}
.plan-input[aria-invalid="true"]{border-color:var(--color-error);background:var(--color-error-soft)}
.inline-error{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--color-error-border);border-radius:12px;background:var(--color-error-soft);color:var(--color-error);font-size:var(--text-secondary);line-height:1.5}
.inline-error button{flex-shrink:0;border-color:var(--color-error-border);color:var(--color-error);background:var(--color-surface)}
.gk-toast.is-error{border-color:var(--color-error-border);background:var(--color-error-soft);color:var(--color-error)}
.gk-toast.is-error .text-button{background:transparent;border-color:transparent;color:var(--color-error);font-size:var(--text-secondary);font-weight:var(--w-medium)}
.field-error{margin-top:var(--space-2);color:var(--color-error);font-size:var(--text-secondary)}
.demo-set{border:0;padding:0;margin:var(--space-4) 0 0}
.demo-set legend{padding:0;margin-bottom:var(--space-1)}
.demo-set label,.demo-check{display:flex;align-items:center;gap:var(--space-2);min-height:44px;font-size:var(--text-secondary);cursor:pointer}
.demo-check{margin-top:var(--space-1)}
.input-meta{display:flex;justify-content:space-between;gap:var(--space-4);margin:var(--space-2) 0 var(--space-4)}
.file-box{border:1px dashed var(--color-border-strong);border-radius:16px;background:var(--color-subtle);padding:var(--space-4)}
.file-trigger{display:inline-flex;align-items:center;gap:var(--space-2);background:var(--color-soft);border-color:var(--color-selected-soft);color:var(--color-primary);font-weight:var(--w-semibold)}
.settings h2{font-size:18px}
.settings .lead{color:var(--color-muted);margin-top:var(--space-1);font-size:var(--text-secondary)}
.setting-group{margin-top:var(--space-4)}
.setting-group .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);margin-top:var(--space-3)}
.setting-group .chips button{display:flex;align-items:center;justify-content:center;gap:var(--space-1);min-height:48px;white-space:nowrap}
.hint{margin-top:var(--space-3);font-size:var(--text-secondary);color:var(--color-text-secondary)}
.tips h2{font-size:18px;margin-bottom:var(--space-3)}
.tips ol{list-style:decimal;padding-left:var(--space-6);color:var(--color-text-secondary);font-size:var(--text-secondary);line-height:1.8}
.pref-note{padding-bottom:var(--space-4);margin-bottom:var(--space-4);border-bottom:1px solid var(--color-divider)}
.pref-note .caps{display:block;margin-bottom:var(--space-2)}
.pref-note h3{margin-bottom:var(--space-2)}
.pref-note p{font-size:var(--text-secondary);color:var(--color-text-secondary);line-height:1.6}
.actions{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);border-top:1px solid var(--color-divider);margin-top:var(--space-2);padding-top:var(--space-6)}
.actions .note{color:var(--color-muted);font-size:var(--text-secondary);text-align:center}
.actions button{display:inline-flex;align-items:center;gap:var(--space-2)}
.actions .primary{padding:var(--space-3) var(--space-6)}
/* 항로 지킴이 */
.gk-icon{position:relative;color:var(--color-muted)}
.gk-icon.is-on{background:var(--color-soft);color:var(--color-primary)}
.gk-icon.is-on:hover{background:var(--color-selected-soft)}

const escapeHTML = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tipButton(label,attrs='',kbd=''){return `data-tip="${label}" ${kbd?`data-kbd="${kbd}"`:''} aria-label="${label}" ${attrs}`}
function showTip(target){
  const label=target.dataset.tip;
  if(!label)return;
  tipEl.innerHTML=`<span>${escapeHTML(label)}</span>${target.dataset.kbd?`<kbd>${escapeHTML(target.dataset.kbd)}</kbd>`:''}`;
  tipEl.hidden=false;
  const r=target.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
  let left=Math.min(Math.max(8,r.left+r.width/2-t.width/2),window.innerWidth-t.width-8);
  let top=r.bottom+8;
  if(top+t.height>window.innerHeight-8)top=r.top-t.height-8;
  tipEl.style.left=`${left}px`;tipEl.style.top=`${top}px`;
  target.setAttribute('aria-describedby','tip');
}
function hideTip(){tipEl.hidden=true;document.querySelectorAll('[aria-describedby="tip"]').forEach(el=>el.removeAttribute('aria-describedby'))}
phone.addEventListener('pointerover',event=>{const t=event.target.closest('[data-tip]');if(t)showTip(t)});
phone.addEventListener('pointerout',event=>{if(event.target.closest('[data-tip]'))hideTip()});
phone.addEventListener('focusin',event=>{const t=event.target.closest('[data-tip]');if(t&&event.target.matches(':focus-visible'))showTip(t)});
phone.addEventListener('focusout',hideTip);

let slideTrigger=null;

function closeSlide(){
  const layer=phone.querySelector('[data-overlay]');

function screenCheck(){
  phone.innerHTML=shell(`<section class="card"><p class="eyebrow">02 함께 확인</p><h3>기존 계획 확인 화면이에요</h3>
    <p class="help">읽어 온 일정을 확인하고 고치는 화면이에요. 이 목업에서는 바뀌는 것이 없어서 모양만 보여 드려요.</p>
    <div class="skeleton" aria-label="일정 목록 미리보기"><span></span><span></span><span></span></div></section>`,
    '','<h2 tabindex="-1" id="screenTitle">계획 확인</h2>');
}
function screenLink(){
  screenCheck();
  openSlide(gkPanelHTML('notice'));
}
/* 알림줄(되돌릴 수 있는 알림) */
function gkToastHTML(kind){
  if(kind==='error')return `<div class="gk-toast is-error"><span role="alert">${COPY.guardianFail}</span><button class="text-button" type="button" data-action="gk-retry">${COPY.retry}</button><button class="icon-btn" type="button" data-action="gk-close" ${tipButton('알림 닫기')}>${icon('close')}</button></div>`;
  return `<div class="gk-toast"><span role="status" aria-atomic="true">${kind==='off'?'항로 지킴이를 껐어요. 문제가 생기면 물어볼게요.':'항로 지킴이를 켰어요.'}</span><button class="text-button" type="button" data-action="gk-undo">되돌리기</button><button class="icon-btn" type="button" data-action="gk-close" ${tipButton('알림 닫기')}>${icon('close')}</button></div>`;
}
function showToast(kind){hideToast();state.toast=kind;phone.insertAdjacentHTML('beforeend',gkToastHTML(kind))}
function hideToast(){state.toast=null;hideTip();phone.querySelector('.gk-toast')?.remove()}
function refreshGuardian(){phone.querySelectorAll('.gk-slot').forEach(slot=>{slot.innerHTML=gkHeaderButton()})}
function setGuardian(on,withToast){
  if(state.failSim){
    state.guardianRetry=on;
    announce(COPY.guardianFail);
    showToast('error');
    return;
  }
  state.guardianRetry=null;
  state.guardian=on;
  refreshGuardian();
  announce(on?'항로 지킴이를 켰어요':'항로 지킴이를 껐어요');
  if(withToast)showToast(on?'on':'off');
}
const RENDER = {plan:screenPlan,card:screenCard,read:screenRead,late:screenLate,idle:screenIdle,done:screenDone,check:screenCheck,link:screenLink};
function go(id,preview=false){
  clearTimers();hideToast();hideTip();
  state.screen=id;state.busy=false;state.saved=false;slideTrigger=null;
  document.getElementById('countAnnouncement').textContent='';
  if(preview){
    if(id==='read'){state.answers=[null,null];state.skipped=[false,false];state.view=0;state.touched=false}
    if(id==='late'||id==='idle'){state.answers=[state.answers[0]||'대중교통',null];state.skipped=[false,false];state.view=1}
    if(id==='done'){state.answers=[state.answers[0]||'대중교통',state.answers[1]||'볼거리'];state.view=1}
    if(['read','late','idle','done','check'].includes(id)&&state.guardian===null)state.guardian=true;
    if(id==='link')state.guardian=false;
  }
  document.querySelectorAll('[data-screen]').forEach(button=>{
    const active=button.dataset.screen===id;
    button.setAttribute('aria-selected',active);
    button.setAttribute('aria-controls','phone');
    button.tabIndex=active?0:-1;
  });
  const index=SCREENS.indexOf(id);
  phone.setAttribute('aria-labelledby',`tab-${id}`);
  const wide=id==='plan'||id==='card';
  phone.classList.toggle('desk',wide);
  stage.classList.toggle('wide',wide);
  document.getElementById('previous').disabled=index===0;
  document.getElementById('next').disabled=index===SCREENS.length-1;
  document.getElementById('rules').innerHTML=rules[id].map(line=>`<li>${line}</li>`).join('');
  RENDER[id]();
  if(!phone.querySelector('[data-overlay],[data-idle]')){
    const focusTarget=phone.querySelector('#screenTitle')||phone;
    focusTarget.focus({preventScroll:true});
  }else if(phone.querySelector('[data-idle] button')){
    phone.querySelector('[data-idle] button').focus({preventScroll:true});
  }
  if(id==='card'||id==='link')phone.scrollIntoView({block:'start',behavior:'auto'});
}
function refreshQuestion(focus=false){
  const slot=document.getElementById('questionSlot');
  if(!slot)return;
  slot.innerHTML=questionCard();
  state.slide='';
  if(state.busy)slot.querySelectorAll('button').forEach(button=>button.disabled=true);
  if(focus)(slot.querySelector('h3')||phone).focus({preventScroll:true});
}
function navigate(delta){
  const next=Math.min(questions.length-1,Math.max(0,state.view+delta));
  if(next===state.view||state.busy)return;
  cancelDone();
  state.view=next;state.saved=false;state.slide=delta>0?'from-right':'from-left';
  refreshQuestion(true);
  resetIdle();
}
function answer(index,skip=false){
  if(state.busy)return;
  cancelDone();
  state.touched=true;
  const q=state.view,wasAll=allAnswered();
  state.saveError=null;
  if(skip){state.skipped[q]=true;state.saved=false}
  else if(state.failSim){
    state.answers[q]=questions[q].options[index];state.skipped[q]=false;state.saved=false;
    state.saveError={q,index};
    refreshQuestion(false);
    announce(COPY.answerFail);
    return;
  }
  else{state.answers[q]=questions[q].options[index];state.skipped[q]=false;state.saved=true}
  state.busy=true;
  refreshQuestion();
  later(()=>{
    state.busy=false;
    if(state.screen==='late'&&!state.stopAuto){
      if(!wasAll&&allAnswered()){go('done');return}
      if(skip&&openIndexes().length===0){go('check');return}
    }
    const others=openIndexes().filter(i=>i!==q);
    if(others.length){
      const after=others.find(i=>i>q);
      state.view=after!==undefined?after:others[0];
      state.slide='from-right';
    }
    refreshQuestion(others.length>0);
    if(state.screen==='late')phone.querySelector('.footer').innerHTML=resultFooter(true);
    resetIdle();
  },skip?0:400);
}
/* 계획 담기 — 비활성 단추 없이, 눌렀을 때 이유를 보여 준다 */
function planIsEmpty(){const ta=phone.querySelector('#planInput');return ta?!ta.value.trim():!state.plan.trim()}
function showPlanError(){
  state.planError=true;
  const ta=phone.querySelector('#planInput'),err=phone.querySelector('#planError');
  if(ta){ta.setAttribute('aria-invalid','true');ta.focus()}
  if(err){err.hidden=false;err.textContent=COPY.planError}
}
function clearPlanError(){
  if(!state.planError)return;
  state.planError=false;
  phone.querySelector('#planInput')?.removeAttribute('aria-invalid');
  const err=phone.querySelector('#planError');
  if(err)err.hidden=true;
}
let draftTimer=null;
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify({plan:state.plan,density:state.density,at:Date.now()}))}catch(error){}},500);
}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(error){}}
phone.addEventListener('click',event=>{
  if(event.target.matches('[data-overlay]')&&state.screen==='card'){closeSlide();state.screen='plan';return}
  if(event.target.matches('[data-overlay]')){closeSlide();return}
  const button=event.target.closest('button[data-action]');
  if(!button||button.disabled)return;
  const {action,index}=button.dataset;
  if(action==='result'&&button.getAttribute('aria-disabled')==='true'){
    const help=document.getElementById('footHelp');
    if(help)help.textContent=COPY.stillReading;
    announce(COPY.stillReading);
    return;
  }
  if(action==='density'){
    state.density=densityOptions[Number(index)];
    button.parentElement.innerHTML=choiceButtons(densityOptions,'density',state.density,true);
    phone.querySelector('[data-action=density][aria-checked=true]')?.focus();
    saveDraft();
  }else if(action==='start'){
    if(planIsEmpty()){showPlanError();return}
    go('card');
  }
  else if(action==='sample'){state.plan=samplePlan;state.restored=false;clearDraft();screenPlan()}
  else if(action==='clear-draft'){state.plan=samplePlan;state.density=densityOptions[1];state.restored=false;clearDraft();screenPlan()}
  else if(action==='back')document.getElementById('tab-plan').focus();
  else if(action==='gk-on'){state.guardian=true;go('read')}
  else if(action==='gk-skip'){state.guardian=false;go('read')}
  else if(action==='gk-close-panel'){const wasCard=state.screen==='card';closeSlide();if(wasCard){state.screen='plan';phone.querySelector('[data-action=start]')?.focus()}}
  else if(action==='gk-toggle'){
    if(state.guardian===true)setGuardian(false,true);
    else if(state.guardian===false)openSlide(gkPanelHTML('notice'));
  }
  else if(action==='gk-confirm'){closeSlide();setGuardian(true,true)}
  else if(action==='gk-decline')closeSlide();
  else if(action==='gk-undo'){const was=state.toast;hideToast();setGuardian(was==='off',false)}
  else if(action==='gk-close')hideToast();
  else if(action==='gk-retry'){const target=state.guardianRetry;hideToast();setGuardian(target===true,true)}
  else if(action==='retry-answer'){const e=state.saveError;state.saveError=null;if(e){state.view=e.q;answer(e.index)}}
  else if(action==='answer')answer(Number(index));
  else if(action==='skip')answer(0,true);
  else if(action==='prev')navigate(-1);
  else if(action==='next')navigate(1);
  else if(action==='result')go('check');
  else if(action==='continue'){state.seconds=TIMING.countdownS;go('late')}
  else if(action==='stop'){
    state.stopAuto=true;
    go('late');announce(COPY.stopped);
  }
});
phone.addEventListener('input',event=>{
  if(event.target.id==='planInput'){
    state.plan=event.target.value;
    clearPlanError();
    document.getElementById('planCount').textContent=`${state.plan.length.toLocaleString()} / 12,000`;
    saveDraft();
  }
});
phone.addEventListener('focusout',event=>{
  if(event.target.id==='planInput'&&!event.target.value.trim()&&!phone.querySelector('[data-overlay]'))showPlanError();
});
/* 밀어서 보기(포인터) */
let swipe=null;
phone.addEventListener('pointerdown',event=>{
  swipe=event.target.closest('[data-slide]')?{x:event.clientX,y:event.clientY}:null;
  if(state.screen==='read')state.touched=true;
  if(event.target.closest('.pager'))cancelDone();
  resetIdle();
});
phone.addEventListener('pointerup',event=>{
  if(!swipe)return;
  const dx=event.clientX-swipe.x,dy=event.clientY-swipe.y;swipe=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)navigate(dx<0?1:-1);
});
phone.addEventListener('pointercancel',()=>{swipe=null});
['keydown','input','scroll','wheel','touchstart'].forEach(type=>phone.addEventListener(type,()=>{if(state.screen==='read')state.touched=true;resetIdle()},{capture:true,passive:true}));
phone.addEventListener('keydown',event=>{
  if(event.key==='Escape')hideTip();
  const radio=event.target.closest('[role="radio"]');
  if(radio&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
    event.preventDefault();
    const group=[...radio.parentElement.querySelectorAll('[role="radio"]')];
    const at=group.indexOf(radio),step=(event.key==='ArrowLeft'||event.key==='ArrowUp')?-1:1;
    group[(at+step+group.length)%group.length].click();
    return;
  }
  if((event.key==='ArrowLeft'||event.key==='ArrowRight')&&event.target.closest('.pager')&&!phone.querySelector('[role="dialog"],[role="alertdialog"]')){
    event.preventDefault();navigate(event.key==='ArrowRight'?1:-1);return;
  }
  const dialog=phone.querySelector('[data-overlay] [role="dialog"],[data-idle] [role="alertdialog"]');
  if(!dialog)return;
  if(event.key==='Escape'){
    if(phone.querySelector('[data-idle]')){go('late');return}
    const wasCard=state.screen==='card';
    closeSlide();
    if(wasCard){state.screen='plan';phone.querySelector('[data-action=start]')?.focus()}
    return;
  }
  if(event.key==='Tab'){
    const buttons=[...dialog.querySelectorAll('button:not(:disabled),[data-initial]')];
    if(!buttons.length){event.preventDefault();return}
    const first=buttons[0],last=buttons[buttons.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
});
const tabsEl=document.getElementById('tabs');
tabsEl.innerHTML=SCREENS.map(id=>`<button id="tab-${id}" role="tab" data-screen="${id}">${LABELS[id]}</button>`).join('');
tabsEl.addEventListener('click',event=>{
  const button=event.target.closest('[data-screen]');
  if(button)go(button.dataset.screen,true);
});
tabsEl.addEventListener('keydown',event=>{
  const tabs=[...document.querySelectorAll('[data-screen]')];
  const index=tabs.indexOf(document.activeElement);
  if(index<0)return;
  let next=index;
  if(event.key==='ArrowRight')next=(index+1)%tabs.length;
  else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=tabs.length-1;
  else return;
  event.preventDefault();go(SCREENS[next],true);tabs[next].focus();
});
document.getElementById('previous').onclick=()=>go(SCREENS[Math.max(0,SCREENS.indexOf(state.screen)-1)],true);
document.getElementById('next').onclick=()=>go(SCREENS[Math.min(SCREENS.length-1,SCREENS.indexOf(state.screen)+1)],true);
document.getElementById('restart').onclick=()=>{clearTimers();hideToast();clearDraft();state=initial();state.failSim=document.getElementById('failSim').checked;announce('처음부터 시작해요');go('plan')};
document.querySelectorAll('input[name=theme]').forEach(input=>input.addEventListener('change',()=>{document.documentElement.dataset.theme=input.value}));
document.getElementById('contrastFix').addEventListener('change',event=>{document.documentElement.dataset.contrast=event.target.checked?'fix':''});
document.getElementById('failSim').addEventListener('change',event=>{state.failSim=event.target.checked});
window.addEventListener('pagehide',clearTimers);
go('plan');
document.getElementById('tab-plan').focus({preventScroll:true});
</script>
