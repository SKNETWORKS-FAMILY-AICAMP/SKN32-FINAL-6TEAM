<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>목록 끝에서 제출 버튼 표시</title><style>body{margin:0;background:#edf2ee;color:#203a30;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px}section{margin:24px 0;padding:24px;background:#fff;border:1px solid #d6e0d9;border-radius:18px}.shots{display:flex;flex-wrap:wrap;gap:24px}figure{flex:1;min-width:240px;margin:0}img{max-width:100%;max-height:812px;height:auto;display:block;border-radius:12px}figcaption{margin-bottom:12px;font-weight:600}a{color:#2b614d}</style></head><body><main><h1>목록을 끝까지 내리면 제출 버튼 표시</h1><p>맨 아래에서는 스크롤 중에도 제출 버튼을 바로 표시합니다. 위로 올라가면 기존처럼 스크롤 중 숨고, 멈추면 돌아옵니다. 스크롤만으로 일정이 제출되지는 않습니다.</p><p>실제 Chrome · mock 서버 촬영입니다. 공개 서비스 반영 전 로컬 검증 결과입니다.</p><section><h2>375px 휴대폰</h2><div class="shots"><figure><figcaption>일반 동작</figcaption><a href="bottom-375-normal.png"><img src="bottom-375-normal.png" alt="휴대폰에서 목록 끝에 나타난 다시 제출 버튼"></a></figure><figure><figcaption>동작 줄이기 설정</figcaption><a href="bottom-375-reduce.png"><img src="bottom-375-reduce.png" alt="동작 줄이기 설정에서도 표시되는 제출 버튼"></a></figure></div></section><section><h2>1280px PC</h2><div class="shots"><figure><figcaption>일반 동작</figcaption><a href="bottom-1280-normal.png"><img src="bottom-1280-normal.png" alt="PC 목록 끝 제출 버튼"></a></figure><figure><figcaption>동작 줄이기 설정</figcaption><a href="bottom-1280-reduce.png"><img src="bottom-1280-reduce.png" alt="PC 동작 줄이기 설정의 제출 버튼"></a></figure></div></section></main></body></html>
