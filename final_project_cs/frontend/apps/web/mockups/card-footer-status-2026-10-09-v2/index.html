<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드 하단 확인 필요·되돌리기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1ed;color:#213c32;font:15px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px 16px}h1{font-size:24px}h2{font-size:18px}p{color:#53665c}select{font:inherit;padding:8px 12px;min-height:44px;background:white;border:1px solid #ccd7cf;border-radius:12px}section{background:white;border:1px solid #d9e1dc;border-radius:20px;margin:24px 0;padding:20px}figure{margin:16px 0 0;text-align:center}img{max-width:100%;width:375px;border-radius:16px}body[data-wide] img{width:100%}a{color:inherit}</style>
<main><h1>카드 하단 확인 필요·되돌리기</h1><p>제목 옆의 확인 필요 표시를 없애고, 하단 오른쪽 한 자리에 확인 필요 또는 되돌리기 하나만 표시합니다. Chrome의 실제 프론트 화면이며 일정 응답은 로컬 mock 서버를 사용했습니다. 공개 서비스에는 아직 배포하지 않았습니다.</p>
<label for="size">화면 크기</label> <select id="size"><option value="375">375px 휴대폰</option><option value="1280">1280px 넓은 화면</option></select>
<section><h2>확인이 필요한 일정</h2><p>접힌 카드·펼친 카드 모두 하단 오른쪽에 표시합니다.</p><figure><a data-shot="review"><img alt="카드 하단 오른쪽 확인 필요 표시"></a></figure></section>
<section><h2>시간을 바꾼 일정</h2><p>같은 자리에는 되돌리기만 표시합니다. 되돌리면 원래 시간이 복원되고 확인 필요가 다시 표시됩니다.</p><figure><a data-shot="undo"><img alt="같은 하단 자리의 되돌리기 버튼"></a></figure></section></main>
<script>const size=document.getElementById('size');function render(){document.body.toggleAttribute('data-wide',size.value==='1280');document.querySelectorAll('[data-shot]').forEach(a=>{a.href=a.dataset.shot+'-'+size.value+'.png';a.querySelector('img').src=a.href;});}size.addEventListener('change',render);render();</script></html>
