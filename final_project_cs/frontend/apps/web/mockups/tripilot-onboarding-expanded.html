:var(--muted);line-height:1.55;margin-top:4px}.chevron{width:16px;height:16px;color:var(--muted);transition:transform .4s}.active .chevron{transform:rotate(180deg)}.card-head:disabled{opacity:.67}.card-content{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.22,.8,.2,1),opacity .35s}.active .card-content{grid-template-rows:1fr;opacity:1}.content-inner{min-height:0;overflow:hidden}.card-padding{padding:0 18px 20px}.divider{height:1px;background:var(--line);margin:0 0 19px}.language-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.language-option{padding:19px 15px 16px;text-align:left;min-height:127px;border:1px solid var(--line);border-radius:14px;background:var(--surface);position:relative;transition:.18s}.language-option:hover,.chip:hover{border-color:var(--green)}.language-option.selected{border-color:var(--green);background:var(--tint)}.language-symbol{font-size:25px;font-weight:550;line-height:1.4;display:block;margin-bottom:12px}.language-name{display:block;font-size:14px;font-weight:650}.language-native{font-size:11px;color:var(--muted);display:block;margin-top:3px}.selection-dot{position:absolute;right:12px;top:13px;width:15px;height:15px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.selected .selection-dot{border-color:var(--green);background:var(--green);color:white}.selected .selection-dot::after{content:'✓';font-size:10px}.microcopy{color:var(--muted);font-size:10px;line-height:1.7;margin:15px 0 0;display:flex;gap:6px;align-items:flex-start}.tiny-icon{width:13px;height:13px;flex-shrink:0;margin-top:2px}.terms-intro{font-size:14px;font-weight:650;line-height:1.6;margin:0 0 12px}.terms-summary{padding:14px;border-radius:12px;background:var(--surface);font-size:12px;line-height:1.85;color:var(--muted);margin-bottom:16px}.terms-summary p{margin:0}.terms-summary strong{display:block;color:var(--ink);font-weight:600;margin-bottom:5px}.terms-check{min-height:60px;display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.8;cursor:pointer}.terms-check input{width:19px;height:19px;flex-shrink:0;margin:2px 0 0}.draft-note{font-size:10px;color:var(--muted);margin:7px 0 0;line-height:1.6}.question-progress{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.3px;font-weight:650;margin-bottom:8px;color:var(--green)}.progress-track{height:3px;background:var(--surface);border-radius:5px;overflow:hidden;margin-bottom:24px}.progress-fill{height:100%;background:var(--green);border-radius:5px;transition:width .3s}.question-viewport{position:relative;overflow:hidden}.question{width:100%;padding:0 2px}.question h2{font-size:21px;font-weight:700;line-height:1.45;letter-spacing:-.9px;margin:0 0 9px}.question .helper{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 21px}.question .helper .optional{display:inline-block;background:var(--tint);color:var(--green);padding:1px 6px;border-radius:4px;margin-left:4px;font-size:10px}.group-label{font-size:11px;line-height:1.6;font-weight:650;color:var(--muted);margin:20px 0 9px}.group-label:first-child{margin-top:0}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.grid{display:grid;grid-template-columns:1fr 1fr}.chip{background:var(--white);border:1px solid var(--line);border-radius:11px;min-height:46px;padding:11px 13px;font-size:12px;font-weight:500;line-height:1.4;text-align:center;transition:background .14s,border-color .14s}.chip.selected{background:var(--tint);border-color:var(--green);color:var(--green);font-weight:650}.chips.grid .chip{min-height:55px}.option-icon{display:block;height:23px;margin-bottom:5px;color:var(--green)}.option-icon svg{height:20px;width:20px}.question label.field{display:block;font-size:11px;font-weight:600;margin:15px 0 0;color:var(--muted)}.field input,.field select{display:block;width:100%;min-width:0;min-height:46px;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:var(--white);padding:11px 10px;margin-top:7px;font-size:12px}.field input::placeholder{color:var(--muted);opacity:.65}.field input[type="file"]{font-size:10px;padding:9px 8px}.field input::file-selector-button{font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);margin-right:8px}.two-columns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.counter-list{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:17px}.counter-row{display:flex;align-items:center;justify-content:space-between;min-height:65px;border-bottom:1px solid var(--line)}.counter-row:last-child{border-bottom:0}.counter-label{font-size:12px;font-weight:600}.counter-caption{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:3px}.counter{display:flex;align-items:center;gap:4px}.counter button{height:44px;width:44px;background:none;color:var(--green);font-size:21px;border-radius:9px}.counter button:disabled{color:var(--line)}.counter output{min-width:19px;text-align:center;font-size:13px;font-weight:650}.question-nav{display:flex;gap:9px;margin-top:23px}.previous{width:60px;min-height:47px;border:1px solid var(--line);border-radius:11px;background:white;font-size:12px}.next{flex:1;min-height:47px;border-radius:11px;background:var(--green);color:white;font-size:12px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}.next:disabled{background:var(--line);color:var(--muted)}.next svg{width:15px;height:15px}.skip{width:100%;min-height:44px;background:none;font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}.error{font-size:10px;line-height:1.6;color:var(--muted);margin:12px 0 0;min-height:0}.bottom-note{margin:25px 28px 29px;color:var(--muted);font-size:10px;line-height:1.9;text-align:center}.bottom-note .leaf{font-size:16px;display:block;margin-bottom:5px;color:var(--green)}.success{text-align:center;padding:7px 0 0}.success-symbol{width:58px;height:58px;bord @keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card.done:not(.active) .card-head{min-height:64px;padding:14px 18px}.card.done:not(.active) .step-sub{display:none}.phone:has(#card-2.active) .intro{padding-top:5px;padding-bottom:18px}.phone:has(#card-2.active) .intro .eyebrow{margin-bottom:8px;font-size:10px}.phone:has(#card-2.active) .intro h1{font-size:24px;line-height:1.4}.phone:has(#card-2.active) .intro p{margin-top:7px;font-size:11px;line-height:1.65}
@media(max-width:450px){.phone{margin:0;border:0;border-radius:0;box-shadow:none;min-height:100svh}.topbar{padding-top:23px;height:77px}.intro{padding-top:20px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Each question remains a separate card while the complete track moves. */
#card-2.active:not(.done){background:transparent;border-color:transparent;box-shadow:none;overflow:visible}
#card-2.active:not(.done)>.card-head{display:none}
#card-2:not(.done)>.card-content>.content-inner>.card-padding{padding:0}
#card-2:not(.done)>.card-content>.content-inner>.card-padding>.divider{display:none}
.question-viewport{overflow:hidden;touch-action:pan-y pinch-zoom;transition:height .34s ease;outline:0;border-radius:20px}
.question-track{display:flex;align-items:flex-start;gap:12px;width:100%;transition:transform .36s cubic-bezier(.22,.8,.25,1.06);will-change:transform}
.question-track.dragging{transition:none}
.question-slide{flex:0 0 100%;min-width:0;border:1px solid var(--green);border-radius:20px;background:var(--white);padding:19px 18px 20px;box-shadow:0 6px 18px #24392f07}
.slide-top{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0;background:none;text-align:left;margin-bottom:17px}.slide-top .chevron{flex-shrink:0}
.slide-top .step-number{background:var(--tint);color:var(--green)}
.slide-top .step-title{font-size:13px}
.slide-top .step-sub{font-size:10px}
.slide-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--green);white-space:nowrap}
.question-slide .progress-track{margin-bottom:23px}
.question-slide .question{padding:0}
.carousel-footer{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 0}
.carousel-dots{display:flex;align-items:center;justify-content:center;gap:6px;height:18px}
.carousel-dot{width:4px;height:4px;background:var(--line);border-radius:99px;transition:width .36s cubic-bezier(.22,.8,.25,1.06),background .24s}
.carousel-dot[aria-current="step"]{width:18px;background:var(--green)}
.carousel-hint{margin:0;font-size:10px;color:var(--muted);line-height:1.7}
@media(prefers-reduced-motion:reduce){.question-track,.question-viewport{transition:none!important}}


/* Short feedback stays local to the control the traveler just used. */
.first-render .card{animation:arrive .6s both}
.language-option,.chip,.next,.previous{transition:transform .14s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
.language-option:active:not(:disabled),.chip:active:not(:disabled),.next:active:not(:disabled),.previous:active:not(:disabled){transform:scale(.97)}
.chip{position:relative;padding-right:30px}
.option-check{position:absolute;right:9px;top:50%;width:13px;height:13px;transform:translateY(-50%);opacity:0;pointer-events:none}
.chip.selected .option-check{opacity:1}
.drawn-check{display:block;width:100%;height:100%}
.drawn-check path{stroke-dasharray:1;stroke-dashoffset:0}
.selection-feedback.selected{animation:selectionTint .22s ease-out both}
.selection-feedback:not(.selected){animation:deselectionTint .22s ease-out both}
.selection-feedback .drawn-check path{animation:drawCheck .2s ease-out both}
.selection-feedback .selection-dot::after{animation:checkPop .22s ease-out both}
.progress-fill{transition:width .36s cubic-bezier(.22,.8,.25,1)}
.terms-check{position:relative}
.terms-check input{position:absolute;width:1px;height:1px;margin:0;opacity:0}
.consent-mark{position:relative;flex:0 0 19px;width:19px;height:19px;margin-top:2px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--white);color:var(--white)}
.consent-mark .drawn-check{opacity:0}
.terms-check input:checked + .consent-mark{background:var(--green);border-color:var(--green)}
.terms-check input:checked + .consent-mark .drawn-check{opacity:1}
.terms-check input:focus-visible + .consent-mark{outline:3px solid var(--green);outline-offset:3px}
.success-symbol{position:relative}
.success-symbol .drawn-check{width:30px;height:30px}
.completion-motion{animation:checkPop .32s cubic-bezier(.2,.8,.3,1) both}
.completion-motion .drawn-check path{animation:drawCheck .24s ease-out both}
.success-symbol.completion-motion .drawn-check path{animation-duration:.32s;animation-delay:.08s}
.success-symbol.completion-motion::after{content:'';position:absolute;inset:0;border:1px solid var(--green);border-radius:50%;pointer-events:none;animation:completionRing .6s ease-out both}
@keyframes selectionTint{from{background-color:var(--surface)}}
@keyframes deselectionTint{from{background-color:var(--tint)}}
@keyframes drawCheck{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes checkPop{0%{transform:scale(.85)}65%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes completionRing{from{transform:scale(.9);opacity:.3}to{transform:scale(1.48);opacity:0}}
@media(prefers-reduced-motion:reduce){.language-option:active,.chip:active,.next:active,.previous:active{transform:none!important}.success-symbol.completion-motion::after{display:none}}

n class="language-name">English</span><span class="language-native">${t('영어','English')}</span></button></div><div class="question-nav" style="margin-top:16px"><button type="button" class="next" data-action="language-next" ${state.languageChosen?'':'disabled'}>${state.languageChosen?t('한국어로 계속','Continue in English'):t('언어를 선택해 주세요','Choose a language')}${svg('arrow')}</button></div><p class="microcopy"><span class="tiny-icon">${svg('lock')}</span>${t('선택한 언어로 모든 화면을 안내해 드려요.','All following screens will use your chosen language.')}</p></div></div></div></section><section class="card ${state.open===1?'active ':''}${state.agreed?'done':''}" id="card-1">${cardHeader(1,t('약관 동의','Terms & consent'),state.agreed?t('필수 내용을 확인했어요.','Required consent completed.'):t('시작하기 전에 확인해 주세요.','A quick check before you begin.'),!state.languageChosen,state.agreed)}<div class="card-content" id="content-1" ${state.open===1?'':'inert'} aria-hidden="${state.open!==1}"><div class="content-inner"><div class="card-padding"><div class="divider"></div><p class="terms-intro">${t('여행을 시작하기 전에','Before we begin')}</p><button type="button" class="terms-summary" data-action="read-terms" aria-haspopup="dialog"><strong>${t('서비스 이용 및 개인정보 안내','Service & personal data')}</strong><p>${t('입력한 일정과 취향을 여행 지원에 활용합니다. 종교와 식사 관련 정보는 원하는 경우에만 입력할 수 있습니다.','Your schedule and preferences are used to support your travel. Religion and food information are optional.')}</p><span class="terms-read-link">${t('전체 약관 읽기 ↗','Read full terms ↗')}</span></button><label class="terms-check"><input type="checkbox" id="terms-check" ${window.triPilotTerms.hasRead()?'':'disabled'} ${state.agreed?'checked':''}><span class="consent-mark" aria-hidden="true">${checkIcon()}</span><span>${t('[필수] 서비스 이용약관 및 개인정보 수집·이용 내용을 확인하고 동의합니다.','[Required] I have reviewed and agree to the terms of service and the collection and use of personal data.')}</span></label><p class="draft-note">${t('목업용 약관 요약 · 실제 약관 검토 전','Draft terms summary for the mockup · not final terms')}</p><button type="button" class="next terms-continue" data-action="terms-next" ${state.agreed?'':'disabled'}>${t('동의하고 다음으로','Agree and continue')}${svg('arrow')}</button></div></div></div></section><section class="card ${state.open===2?'active ':''}${state.complete?'done':''}" id="card-2">${cardHeader(2,t('여행 취향 알아보기','Your travel preferences'),state.complete?t(questions.length+'가지 질문을 모두 마쳤어요.','All '+questions.length+' questions completed.'):t(questions.length+'가지 질문으로 더 나다운 여행.',questions.length+' questions for a trip that fits you.'),!state.agreed,state.complete)}<div class="card-content" id="content-2" ${state.open===2?'':'inert'} aria-hidden="${state.open!==2}"><div class="content-inner"><div class="card-padding"><div class="divider"></div>${state.complete?successMarkup():`<div class="question-viewport" id="question-viewport"></div><div class="carousel-footer"><div class="carousel-dots" aria-hidden="true">${questions.map((_,i)=>`<span class="carousel-dot" ${i===state.step?'aria-current="step"':''}></span>`).join('')}</div><p class="carousel-hint">${t('← 카드를 좌우로 밀어 이동하세요 →','← Swipe the cards to move →')}</p></div>`}</div></div></div></section></div><footer class="bottom-note"><span class="leaf">${svg('leaf')}</span>${t('정답은 없어요. 당신이 좋아하는 여행이면 충분해요.','There’s no right answer. Just the journey you love.')}</footer>`;if(resizeObserver)resizeObserver.disconnect();if(!state.complete)mountCarousel();$('.bottom-note .leaf svg').style.cssText='width:17px;height:17px';syncScene();window.triPilotTerms.bind(state.lang);syncExpandedCard();}
  function syncExpandedCard(){
    const active=document.querySelector('.card.active');
    document.body.classList.toggle('card-expanded',!!active);
    document.querySelectorAll('#app > .intro,#app > .bottom-note').forEach(element=>{element.inert=!!active;});
    document.querySelectorAll('.card').forEach(element=>{element.inert=!!active && element!==active;});
    if(active)requestAnimationFrame(()=>{active.querySelector('button:not(:disabled)')?.focus({preventScroll:true});});
  }
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape' && !document.querySelector('.terms-dialog[open]') && state.open!==null){
      const previous=state.open;openCard(null);document.querySelector('#card-'+previous+' > .card-head')?.focus({preventScroll:true});
    }
  });
  let autoOpenTimer=null;
  function openCard(n){if(n===1&&!state.languageChosen||n===2&&!state.agreed)return;state.open=n;document.querySelectorAll('.card').forEach((c,i)=>{c.classList.toggle('active',i===n);c.querySelectorAll('[data-card]').forEach(head=>head.setAttribute('aria-expanded',String(i===n)));const content=c.querySelector('.card-content');content.inert=i!==n;content.setAttribute('aria-hidden',String(i!==n))});syncScene('toggle');syncExpandedCard();if(n===2){requestAnimationFrame(fitCarousel);setTimeout(()=>{fitCarousel();ensureVisible()},420)}}
  function ensureVisible(){if(document.querySelector('.card.active'))return;const target=$('#card-'+state.open);if(!target)return;const rect=target.getBoundingClientRect();if(rect.top<12||rect.top>innerHeight*.6)target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
  function announce(){const q=questions[state.step];$('#announcer').textContent=(state.step+1)+' / '+questions.length+'. '+t(q[0],q[1])}
  function changeStep(dir,fromSwipe=false){
    if(state.busy||state.complete||state.open!==2||!state.agreed)return;
    if(dir>0&&!valid()){
      const error=$('#validation-'+state.step);
      if(error)error.textContent=validationHint()||t('이 카드의 선택을 마치면 다음으로 이동할 수 있어요.','Complete this card before moving forward.');
      fitCarousel();positionTrack();return;
    }
    if(dir<0&&state.step===0){if(!fromSwipe)openCard(1);positionTrack();return;}
    if(dir>0&&state.step===questions.length-1){
      if(fromSwipe){positionTrack();return;}
      const missing=questions.findIndex((_,i)=>!valid(i));
      if(missing>=0){state.step=missing;syncCarousel();syncScene('advance');announce();return;}
      state.complete=true;state.open=2;render();completionFeedback('.success-symbol');ensureVisible();
      $('#announcer').textContent=t('여행 취향 설정을 완료했어요.','Your preferences are complete.');return;
    }
    state.busy=true;state.step+=dir;
    syncCarousel();syncScene('advance');announce();
    if(reducedMotion())finishTransition();else releaseTimer=setTimeout(finishTransition,400);
  }
  document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled||Date.now()<suppressClickUntil)return;
    if(state.busy||gesture?.dragging)return;
    if(el.dataset.language){clearTimeout(releaseTimer);state.busy=false;gesture=null;state.lang=el.dataset.language;state.languageChosen=true;state.open=0;render();selectionFeedback('[data-language="'+state.lang+'"]');return}
    if(el.dataset.card!==undefined){clearTimeout(autoOpenTimer);const n=Number(el.dataset.card),closing=state.open===n;openCard(closing?null:n);if(closing)$('#card-'+n+' > .card-head').focus({preventScroll:true});return}
    if(el.dataset.group){const key=el.dataset.group,value=el.dataset.value,a=state.answers;if(el.dataset.multi==='true'){if(key==='companions'){if(value==='alone'){a.companions=a.companions.includes('alone')?[]:['alone'];a.adults=1;a.children=0;a.infants=0}else{a.companions=a.companions.filter(v=>v!=='alone');a.companions=a.companions.includes(value)?a.companions.filter(v=>v!==value):[...a.companions,value];if(a.companions.length&&a.adults+a.children+a.infants===1)a.adults=2}}else{a[key]=a[key].includes(value)?a[key].filter(v=>v!==value):[...a[key],value]}if(['allergies','diet','foodReligion'].includes(key)){a.foodNone=false;a.foodSkip=false}}else a[key]=a[key]===value?'':value;renderQuestion();selectionFeedback('[data-group="'+key+'"][data-value="'+value+'"]');return}
    if(el.dataset.count){const key=el.dataset.count,a=state.answers;a[key]=Math.max(key==='adults'?1:0,Math.min(20,a[key]+Number(el.dataset.delta)));if(a.companions.includes('alone')&&a.adults+a.children+a.infants>1)a.companions=[];renderQuestion();syncScene('selection');return}
    switch(el.dataset.action){case 'read-terms':window.triPilotTerms.open();break;case 'terms-next':if(state.agreed)openCard(2);break;case 'language-next':openCard(state.agreed?2:1);break;case 'next':changeStep(1);break;case 'previous':changeStep(-1);break;case 'skip':if(state.step===2){state.answers.allergies=[];state.answers.diet=[];state.answers.foodReligion=[];state.answers.foodNone=false;state.answers.foodSkip=true}else if(state.step===questions.length-1)state.answers.religion='';renderQuestion();changeStep(1);break;case 'food-none':{const a=state.answers;a.foodNone=!a.foodNone;a.foodSkip=false;if(a.foodNone){a.allergies=[];a.diet=[];a.foodReligion=[]}renderQuestion();selectionFeedback('[data-action="food-none"]');break}case 'journey-start':window.triPilotJourney.open({lang:state.lang,answers:state.answers,onHome:lang=>{state.lang=lang;render();ensureVisible()}});break;case 'edit':state.complete=false;state.step=0;state.open=2;render();ensureVisible();break}
  });
  document.addEventListener('input',event=>{if(event.target.dataset.field){state.answers[event.target.dataset.field]=event.target.value;updateValidation()}});
  document.addEventListener('change',event=>{if(event.target.id==='terms-check'){if(!window.triPilotTerms.hasRead()){event.target.checked=false;return;}clearTimeout(autoOpenTimer);state.agreed=event.target.checked;state.open=1;if(!state.agreed)state.complete=false;render();if(state.agreed)completionFeedback('.consent-mark');else syncScene('consent');/* Remain on the consent card to show the synchronized state. */}});

  document.addEventListener('transitionend',event=>{
    if(event.target.id==='question-track'&&event.propertyName==='transform'&&state.busy)finishTransition();
  });
  document.addEventListener('pointerdown',event=>{
    const viewport=event.target.closest('#question-viewport');
    if(!viewport||state.open!==2||state.complete||state.busy||event.isPrimary===false||event.button!==0)return;
    if(event.target.closest('input,select,textarea,label,a,.question-nav,.skip'))return;
    gesture={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,dragging:false,viewport};
  });
  document.addEventListener('pointermove',event=>{
    if(!gesture||gesture.id!==event.pointerId)return;
    const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
    if(!gesture.dragging){
      if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){gesture=null;return;}
      if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.25)return;
      gesture.dragging=true;gesture.viewport.setPointerCapture(event.pointerId);
      $('#question-track').classList.add('dragging');
    }
    gesture.dx=dx;
    if(event.cancelable)event.preventDefault();
    const edge=dx>0&&state.step===0||dx<0&&(state.step===questions.length-1||!valid());
    positionTrack(edge?dx*.2:dx);
  },{passive:false});
  function endGesture(event,cancelled=false){
    if(!gesture||gesture.id!==event.pointerId)return;
    const g=gesture;gesture=null;
    if(g.viewport.hasPointerCapture(event.pointerId))g.viewport.releasePointerCapture(event.pointerId);
    $('#question-track')?.classList.remove('dragging');
    if(g.dragging)suppressClickUntil=Date.now()+350;
    const threshold=Math.max(42,Math.min(70,g.viewport.clientWidth*.16));
    if(!cancelled&&g.dragging&&Math.abs(g.dx)>=threshold)changeStep(g.dx<0?1:-1,true);
    positionTrack();
  }
  document.addEventListener('pointerup',event=>endGesture(event));
  document.addEventListener('pointercancel',event=>endGesture(event,true));
  document.addEventListener('keydown',event=>{
    if(state.open!==2||state.complete||!event.target.closest('#question-viewport'))return;
    if(event.target.closest('input,select,textarea'))return;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();changeStep(event.key==='ArrowRight'?1:-1,true);}
  });
  addEventListener('resize',()=>{gesture=null;$('#question-track')?.classList.remove('dragging');positionTrack();fitCarousel()});

  render();if(!embedded)autoOpenTimer=setTimeout(()=>openCard(0),650);
  window.addEventListener('message',event=>{
    if(!embedded || event.source!==window.parent || event.data?.type!=='tripilot:set-language' || !['en','ko'].includes(event.data.lang))return;
    if(state.lang===event.data.lang)return;
    state.lang=event.data.lang;
    if(!$('#app').hidden){
      const scrollPosition=window.scrollY;
      const cardScroll=$('#card-'+state.open)?.scrollTop||0;
      render();
      requestAnimationFrame(()=>{window.scrollTo({top:scrollPosition,behavior:'instant'});const card=$('#card-'+state.open);if(card)card.scrollTop=cardScroll;});
    }
    window.triPilotJourney.setLanguage(state.lang);
  });
  // Page-only state; this prototype does not send or persist submitted information.
})();
