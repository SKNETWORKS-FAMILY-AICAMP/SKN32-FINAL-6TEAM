<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>손잡이 접근 페이드·완전 가림</title><style>body{margin:0;padding:24px;background:#edf2ef;color:#213b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto}section{background:white;border:1px solid #d7e1db;border-radius:20px;padding:24px;margin:24px 0}h1{font-size:26px}h2{font-size:22px;margin-top:0}figure{margin:20px 0}img{display:block;max-width:100%;height:auto;border:1px solid #d7e1db;border-radius:16px}figure:first-of-type img{width:375px}figcaption{font-size:14px;color:#53665d}</style><main><h1>손잡이에서 목록 완전히 가리기</h1><p>손잡이 아래 32px에서 서서히 사라지고, 손잡이 영역에는 목록 내용이 남지 않습니다. 실제 코드의 Chrome 촬영 화면입니다.</p><section><h2>접근 중</h2><p>추천 버튼이 손잡이 아래 페이드 구간으로 들어옵니다.</p><figure><a href="approach-375.png"><img src="approach-375.png" alt="접근 중 375px" loading="lazy"></a><figcaption>375px 휴대폰</figcaption></figure><figure><a href="approach-1280.png"><img src="approach-1280.png" alt="접근 중 1280px" loading="lazy"></a><figcaption>1280px 넓은 화면</figcaption></figure></section><section><h2>점진적으로 사라짐</h2><p>손잡이에 가까운 내용은 더 흐리게 보입니다.</p><figure><a href="fading-375.png"><img src="fading-375.png" alt="점진적으로 사라짐 375px" loading="lazy"></a><figcaption>375px 휴대폰</figcaption></figure><figure><a href="fading-1280.png"><img src="fading-1280.png" alt="점진적으로 사라짐 1280px" loading="lazy"></a><figcaption>1280px 넓은 화면</figcaption></figure></section><section><h2>손잡이에서 완전히 가림</h2><p>추천 버튼은 손잡이 아래로 올라가 완전히 가려집니다.</p><figure><a href="hidden-375.png"><img src="hidden-375.png" alt="손잡이에서 완전히 가림 375px" loading="lazy"></a><figcaption>375px 휴대폰</figcaption></figure><figure><a href="hidden-1280.png"><img src="hidden-1280.png" alt="손잡이에서 완전히 가림 1280px" loading="lazy"></a><figcaption>1280px 넓은 화면</figcaption></figure></section><section><h2>펼친 일정도 같은 경계</h2><p>카드 내용도 같은 경계에서 사라집니다. 날짜와 손잡이는 선명하게 유지합니다.</p><figure><a href="card-375.png"><img src="card-375.png" alt="펼친 일정도 같은 경계 375px" loading="lazy"></a><figcaption>375px 휴대폰</figcaption></figure><figure><a href="card-1280.png"><img src="card-1280.png" alt="펼친 일정도 같은 경계 1280px" loading="lazy"></a><figcaption>1280px 넓은 화면</figcaption></figure></section></main></html>
