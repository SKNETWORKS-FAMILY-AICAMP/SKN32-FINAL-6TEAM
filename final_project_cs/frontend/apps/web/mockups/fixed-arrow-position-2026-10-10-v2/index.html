<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도 화살표 제자리 전환</title><style>body{margin:0;background:#eef2ef;color:#20352e;font:16px/1.65 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}header{position:sticky;top:0;z-index:1;background:#eef2ef;padding:12px 0}select{font:inherit;padding:10px;border:1px solid #c8d5cf;border-radius:12px}section{margin:24px 0;padding:24px;background:white;border:1px solid #d4ded8;border-radius:24px}h1{font-size:26px}h2{font-size:21px;margin:0}p{margin:8px 0 20px}figure{margin:0;text-align:center}img{max-width:100%;width:auto;max-height:812px;border-radius:20px}a{color:inherit}</style><main><header><h1>지도 화살표 제자리 전환</h1><label>촬영 화면 <select id="width"><option value="375">375px 휴대폰</option><option value="1280">1280px 화면</option></select></label></header><p>실제 웹 코드와 mock 서버의 촬영본입니다. 공개 배포 상태를 나타내는 화면은 아닙니다.</p><section><h2>세로 공간이 넉넉할 때</h2><p>기존처럼 거리 글자 아래에서 아래/위 방향을 표시합니다.</p><figure><a data-key="01-column" href="01-column-375.png"><img data-key="01-column" src="01-column-375.png" alt="세로 공간이 넉넉할 때"></a></figure></section><section><h2>상하 공간이 좁아졌을 때</h2><p>화살표는 같은 자리에 두고 왼쪽(&lt;)으로 방향만 바꿉니다.</p><figure><a data-key="02-row" href="02-row-375.png"><img data-key="02-row" src="02-row-375.png" alt="상하 공간이 좁아졌을 때"></a></figure></section><section><h2>가로 단추를 펼쳤을 때</h2><p>거리 글자는 그대로이며 화살표만 오른쪽(&gt;)을 가리킵니다.</p><figure><a data-key="03-row-open" href="03-row-open-375.png"><img data-key="03-row-open" src="03-row-open-375.png" alt="가로 단추를 펼쳤을 때"></a></figure></section></main><script>document.getElementById('width').addEventListener('change',e=>document.querySelectorAll('[data-key]').forEach(n=>{const file=n.dataset.key+'-'+e.target.value+'.png';if(n.tagName==='IMG')n.src=file;else n.href=file}));</script></html>
