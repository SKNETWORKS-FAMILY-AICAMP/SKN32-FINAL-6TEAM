<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좌표 안내도 목록과 함께 스크롤</title><style>body{margin:0;padding:24px;background:#edf2ef;color:#213b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto}section{background:white;border:1px solid #d7e1db;border-radius:20px;padding:24px;margin:24px 0}h1{font-size:26px}h2{font-size:22px;margin-top:0}figure{margin:20px 0}img{display:block;max-width:100%;height:auto;border:1px solid #d7e1db;border-radius:16px}figure:first-of-type img{width:375px}figcaption{font-size:14px;color:#53665d}</style><main><h1>좌표 안내도 목록과 함께 사라집니다</h1><p>고정 머리말에서 목록 첫머리로 옮겼습니다. 실제 Chrome 촬영 화면입니다.</p><section><h2>지도에 안내 표시</h2><p>목록 높이가 보통일 때 안내는 지도 메뉴 아래에 보입니다.</p><figure><a href="empty-map-half-375.png"><img src="empty-map-half-375.png" alt="지도에 안내 표시 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="empty-map-half-1280.png"><img src="empty-map-half-1280.png" alt="지도에 안내 표시 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>펼친 목록 첫머리</h2><p>지도 공간이 좁아지면 안내를 스크롤 목록 첫머리로 옮깁니다.</p><figure><a href="empty-map-full-top-375.png"><img src="empty-map-full-top-375.png" alt="펼친 목록 첫머리 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="empty-map-full-top-1280.png"><img src="empty-map-full-top-1280.png" alt="펼친 목록 첫머리 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>스크롤하면 안내도 사라짐</h2><p>안내를 고정하지 않습니다. 목록과 함께 위로 사라집니다.</p><figure><a href="empty-map-full-375.png"><img src="empty-map-full-375.png" alt="스크롤하면 안내도 사라짐 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="empty-map-full-1280.png"><img src="empty-map-full-1280.png" alt="스크롤하면 안내도 사라짐 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>최상단으로 돌아오면 복귀</h2><p>안내가 다시 보이고 날짜 탭은 기존 위치를 유지합니다.</p><figure><a href="empty-map-full-return-375.png"><img src="empty-map-full-return-375.png" alt="최상단으로 돌아오면 복귀 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="empty-map-full-return-1280.png"><img src="empty-map-full-return-1280.png" alt="최상단으로 돌아오면 복귀 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section><section><h2>접으면 지도에 안내 복귀</h2><p>목록은 손잡이만 남고 좌표 안내는 지도에서 보입니다.</p><figure><a href="empty-map-collapsed-375.png"><img src="empty-map-collapsed-375.png" alt="접으면 지도에 안내 복귀 375px" loading="lazy"></a><figcaption>375px</figcaption></figure><figure><a href="empty-map-collapsed-1280.png"><img src="empty-map-collapsed-1280.png" alt="접으면 지도에 안내 복귀 1280px" loading="lazy"></a><figcaption>1280px</figcaption></figure></section></main></html>
