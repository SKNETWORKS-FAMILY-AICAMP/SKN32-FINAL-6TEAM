<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>triPilot 관리 앱 — 오류 대응 시나리오 목업</title>
<style>
:root{color-scheme:light;--bg:#f3f6f4;--surface:#fff;--text:#253c30;--muted:#637369;--border:#dce4de;--soft:#eaf2ec;--primary:#2e6047;--on-primary:#fff;--warning:#865d20;--warning-soft:#faf1df;--danger:#a34636;--danger-soft:#fbece7;--info:#2f5d8a;--info-soft:#e6eef7;--mono:ui-monospace,SFMono-Regular,Consolas,"D2Coding",monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151c18;--surface:#1c2620;--text:#e2eee6;--muted:#a7b9ad;--border:#3b4c41;--soft:#2a3c30;--primary:#b3d9be;--on-primary:#193223;--warning:#ebc785;--warning-soft:#3c3323;--danger:#f1b1a7;--danger-soft:#412c27;--info:#a9c8ea;--info-soft:#243142}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
h1{font-size:22px;margin:2px 0 4px;font-weight:650}
h2{font-size:16px;margin:0 0 10px;font-weight:650}
h3{font-size:14px;margin:0 0 6px;font-weight:650}
p{margin:0 0 8px}
code,.mono{font-family:var(--mono);font-size:12.5px}
a{color:inherit}
button,select,input,textarea{font:inherit;color:var(--text)}
button{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
button:hover{background:var(--soft)}
button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
button.small{padding:2px 8px;font-size:12px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--info);outline-offset:2px}
select,input[type=text],textarea{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;color:var(--muted);margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border)}
.pill.warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.pill.env{background:var(--info-soft);color:var(--info);border-color:transparent}
.guide{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--soft);border-bottom:1px solid var(--border)}
.guide .g-l{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-width:0;flex:1}
.g-n{font-size:12px;color:var(--muted);font-family:var(--mono)}
.guide .g-r{display:flex;gap:6px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;min-height:calc(100vh - 120px)}
body.nopanel .shell{grid-template-columns:230px minmax(0,1fr)}
body.nopanel #panel{display:none}
nav{background:var(--surface);border-right:1px solid var(--border);padding:12px 10px}
.nav-g{font-size:11px;color:var(--muted);margin:14px 8px 4px}
.nav-g:first-child{margin-top:4px}
.nav-i{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--text)}
.nav-i:hover{background:var(--soft)}
.nav-i.on{background:var(--soft);font-weight:650}
.nav-i small{font-size:11px;color:var(--muted);font-family:var(--mono)}
main{padding:22px 26px 40px;min-width:0}
#panel{background:var(--surface);border-left:1px solid var(--border);padding:18px 16px 40px;min-width:0}
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.metric span{font-size:12px;color:var(--muted)}
.metric b{display:block;font-size:24px;font-weight:650}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--border);white-space:nowrap}
.chip.ok{background:var(--soft);border-color:transparent}
.chip.warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.chip.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--primary);vertical-align:0}
.dot.warn{background:var(--warning)}.dot.down{background:var(--danger)}.dot.off{background:var(--muted)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tbl tr.hl td{background:var(--warning-soft)}
.tbl a{text-decoration:none;font-weight:600}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
pre{margin:0;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.hint{border-left:3px solid var(--info);background:var(--info-soft);padding:10px 12px;border-radius:0;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;padding-top:6px}
.bars i{flex:1;background:var(--border);border-radius:3px 3px 0 0;min-height:2px}
.bars i.hot{background:var(--warning)}
.bars-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ev{display:flex;flex-direction:column;gap:6px}
.ev button{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ev button.on{border-color:var(--primary);background:var(--soft)}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--border);margin-left:8px}
.tl li{position:relative;padding:0 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.tl li.err::before{border-color:var(--danger)}
.tl li.warn::before{border-color:var(--warning)}
.tl .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl .box{margin-top:6px}
.band{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--warning-soft);color:var(--warning);margin-bottom:14px}
.band.ok{background:var(--soft);color:var(--text)}
.phone{max-width:380px;border:1px solid var(--border);border-radius:24px;background:var(--surface);padding:14px;margin:6px 0}
.phone-top{font-size:13px;font-weight:650;padding:4px 6px 10px;border-bottom:1px solid var(--border)}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px 4px}
.bubble{padding:10px 12px;border-radius:14px;max-width:88%;font-size:14px}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--on-primary)}
.bubble.sys{align-self:flex-start;background:var(--warning-soft);color:var(--text)}
.ref{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.api{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.api .m{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--info-soft);color:var(--info);margin-right:6px}
.api .p{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.api .perm{font-size:12px;color:var(--muted);margin:4px 0}
.api table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.api td{padding:3px 4px;border-top:1px solid var(--border);vertical-align:top}
.api td:first-child{font-family:var(--mono);white-space:nowrap}
.q{border-top:1px solid var(--border);padding:10px 0}
.q p{font-size:13px;margin-bottom:6px}
.dec{display:flex;gap:4px;flex-wrap:wrap}
.dec button{padding:2px 9px;font-size:12px}
.dec button.on-ok{background:var(--soft);border-color:var(--primary);font-weight:650}
.dec button.on-change{background:var(--warning-soft);border-color:var(--warning);color:var(--warning);font-weight:650}
.dec button.on-hold{background:var(--bg);border-color:var(--muted);font-weight:650}
.later{border:1px dashed var(--border);border-radius:12px;padding:18px}
.spot{outline:3px solid var(--warning);outline-offset:4px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){.spot{animation:spot 1.4s ease-out 2}@keyframes spot{0%{outline-color:transparent}50%{outline-color:var(--warning)}100%{outline-color:var(--warning)}}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:10}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.actions label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow span{padding:4px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
@media (max-width:1180px){.shell{grid-template-columns:210px minmax(0,1fr)}#panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}}
@media (max-width:760px){.shell{grid-template-columns:1fr}nav{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.nav-g{display:none}.nav-i{white-space:nowrap}.g4,.g3,.g2{grid-template-columns:1fr 1fr}main{padding:16px}.kv{grid-template-columns:1fr}}
</style>
</head>

}

function renderPanel(){
  const r=route();const key=r.a==='later'?null:r.a;const s=key&&SPEC[key];
  if(r.a==='agree'){$('#panel').innerHTML=`<h2>백엔드 합의</h2><p class="muted">이 화면이 전체 합의 목록입니다.</p>`;return;}
  if(!s){$('#panel').innerHTML=`<h2>백엔드 합의</h2><p class="muted">다음 차수 화면이라 이번 합의 대상이 아닙니다.</p>`;return;}
  $('#panel').innerHTML=`<p class="eyebrow">백엔드 합의 · 모두 제안</p><h2>${s.title}</h2>
  <h3>필요한 API</h3>${s.apis.map(a=>`<div class="api"><span class="m">${a.m}</span><span class="p">${esc(a.p)}</span><div class="perm">권한 ${a.perm}</div><div style="font-size:13px">${a.d}</div>${a.f?`<table>${a.f.map(([n,d])=>`<tr><td>${n}</td><td>${d}</td></tr>`).join('')}</table>`:''}</div>`).join('')}
  <h3 style="margin-top:14px">정할 것</h3>${s.q.map(([id,q])=>qRow(id,q)).join('')}
  <p class="note">공통 결정은 「합의 정리」 화면에 있습니다.</p>`;
}

function renderGuide(){
  const g=$('#guide');
  if(!S.guide){g.hidden=true;return;}
  g.hidden=false;const st=STEPS[S.step];const here=route().h===st.r;
  g.innerHTML=`<div class="g-l"><span class="g-n">시나리오 ${S.step+1} / ${STEPS.length}</span><b>${st.t}</b><span class="muted">${st.d}</span></div>
  <div class="g-r"><button data-act="g-prev">이전</button>${here?'':'<button data-act="g-go">이 화면으로</button>'}<button class="primary" data-act="g-next">${S.step===STEPS.length-1?'처음부터':'다음'}</button></div>`;
}

const VIEWS={web:V_web,ops:V_ops,home:V_home,errors:V_errors,detail:V_detail,trace:V_trace,jobs:V_jobs,health:V_health,bench:V_bench,later:V_later,agree:V_agree};
function render(){
  const r=route();const v=VIEWS[r.a]||V_web;
  $('#main').innerHTML=v(r.b);
  renderNav();renderPanel();renderGuide();
  document.body.classList.toggle('nopanel',!S.panel);
  $('#btn-guide').textContent=S.guide?'시나리오 가이드 끄기':'시나리오 가이드 켜기';
  $('#btn-panel').textContent=S.panel?'백엔드 합의 숨기기':'백엔드 합의 보기';
  const st=STEPS[S.step];
  if(S.guide&&r.h===st.r){const el=$(st.spot);if(el){el.classList.add('spot');el.scrollIntoView({block:'center',behavior:'smooth'});}}
}
function goStep(i){
  S.step=(i+STEPS.length)%STEPS.length;const st=STEPS[S.step];if(st.act)st.act();
  go(st.r);
}
let tt;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},2200);}
function copyText(t,box){
  const fb=()=>{if(box){box.hidden=false;const ta=$('#export-text');ta.value=t;ta.select();}
    try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'복사했어요':'아래 칸에서 직접 복사해 주세요');}catch(_){toast('아래 칸에서 직접 복사해 주세요');}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>{toast('복사했어요');if(box){box.hidden=false;$('#export-text').value=t;}},fb);}else fb();
}
function exportMd(){
  const L={ok:'합의',change:'수정 필요',hold:'보류'};
  let s='# 관리 앱 백엔드 합의 결과 (시나리오 목업)\n\n';
  for(const [t,l] of allQs()){s+='## '+t+'\n\n';for(const [id,q] of l)s+='- ['+(L[S.dec[id]]||'미표시')+'] '+q+'\n';s+='\n';}
  if(S.memo.trim())s+='## 회의 메모\n\n'+S.memo.trim()+'\n';
  return s;
}
const ACT={
  'toggle-guide':()=>{S.guide=!S.guide;render();},
  'toggle-panel':()=>{S.panel=!S.panel;render();},
  'reset':()=>{S=INIT();go('web');toast('처음 상태로 돌렸어요');},
  'g-next':()=>goStep(S.step+1),'g-prev':()=>goStep(S.step-1),'g-go':()=>goStep(S.step),
  'copy':b=>copyText(b.dataset.v),
  'handoff':()=>copyText('ERR-7F3A2C'),
  'sel':b=>{S.sel=b.dataset.v;render();},
  'ticket':b=>{S.g[b.dataset.fp].ticket='ST4F-000 (가상)';render();toast('티켓을 발행했어요 (가상)');},
  'dec':b=>{const id=b.dataset.id,v=b.dataset.v;S.dec[id]=S.dec[id]===v?'':v;render();},
  'bench-run':()=>{S.bench=1;render();setTimeout(()=>{S.bench=2;render();},900);},
  'bench-warm':()=>{S.bench=3;render();},
  'resolve':()=>{const g=S.g.fp_llm;g.status='resolved';g.resolved='a1b2c3d (가상)';render();toast('해결로 표시했어요. 운영 콘솔에도 반영돼요');},
  'recheck':()=>toast('다시 점검했어요 (가상 — 값은 그대로)'),
  'toast':b=>toast(b.dataset.v),
  'export':()=>copyText(exportMd(),$('#export-box'))
};
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(2));return;}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b);}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.act==='set-status'){S.g[t.dataset.fp].status=t.value;if(t.value!=='resolved')S.g[t.dataset.fp].resolved='';render();}
  if(t.dataset.act==='set-assignee'){S.g[t.dataset.fp].assignee=t.value;render();}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='err-search'){S.q=t.value;const {rows,note}=errRows();$('#err-rows').innerHTML=rows;$('#err-note').innerHTML=note;}
  if(t.id==='memo')S.memo=t.value;});
window.addEventListener('hashchange',fromHash);
window.addEventListener('popstate',fromHash);
CUR=location.hash.replace(/^#\/?/,'')||'web';
render();
</script>
</body>
</html>
