[pytest]
testpaths = tests eval/tests
addopts = -m "not live"
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv _backup legacy __pycache__
markers =
    live: performs one real LLM API call; run explicitly with -m live
    db: needs a real PostgreSQL; develop's fast tier skips it with -m "not live and not db", main runs it
    slow: runs for seconds (child processes, real sleeps, whole-tree scans); develop's fast tier skips it, main runs it
