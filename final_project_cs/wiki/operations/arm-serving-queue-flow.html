<h1>Oracle ARM 기계가 직접 시험을 이어갑니다</h1>
<p>PC·Codex가 꺼져 있어도 일감을 보충하고 실행합니다. 등록한 시간은 추정이며 실제 완료 시간으로 수량을 보정합니다.</p>
<svg viewBox="0 0 720 1040" role="img" aria-labelledby="arm-queue-title arm-queue-desc">
<title id="arm-queue-title">Oracle ARM의 6시간 공급과 상시 실행</title>
<desc id="arm-queue-desc">기계 내부 타이머가 6시간분 일감을 보충하고 상시 작업자가 배포와 자원 조건을 확인하여 회차별로 실행하거나 대기합니다.</desc>

<rect class="node" x="240" y="264" width="240" height="56" rx="28"/><text x="360" y="300">공급 회차 종료</text>

<text x="360" y="932" class="label">앱 조건 대기는 시험 성공이 아닙니다. 기존 추론 시험은 별도로 계속 실행됩니다.</text>
<text x="360" y="972" class="label">반복 회차는 지연·오류·격리 안정성 검사이며 독립 정확도 표본이 아닙니다.</text>
