<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>답변 완성 검사와 순차 실행</title><style>body{margin:0;background:#fbfcfd;color:#161c28;font-family:Malgun Gothic,sans-serif}main{max-width:800px;margin:auto;padding:24px}svg{width:100%;height:auto}p{line-height:1.6}</style><main><h1>답변을 끝까지 완성하는지 확인합니다</h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-labelledby="title desc"><title id="title">답변 완성 검사와 다음 작업</title><desc id="desc">한 회차를 시작해 고정 여행 질문을 검사합니다. 800토큰 답변24개가 모두 맞으면 최대6시간 안정성을 검사하고, 실패하면 결과를 보존합니다. 두 경로 모두 회차 종료 후 준비된 다음 조건을 시작합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#6b7488"/></marker></defs><rect width="760" height="690" fill="#fbfcfd"/><g fill="#fbfcfd" stroke="#161c28" stroke-width="2"><ellipse cx="380" cy="48" rx="110" ry="26"/><rect x="220" y="108" width="320" height="66" rx="3"/><path d="M380 210 L545 282 L380 354 L215 282 Z"/><rect x="42" y="407" width="300" height="72"/><rect x="418" y="407" width="300" height="72"/><ellipse cx="380" cy="552" rx="145" ry="28"/></g><g fill="none" stroke="#6b7488" stroke-width="2" marker-end="url(#arrow)"><path d="M380 74V108"/><path d="M380 174V210"/><path d="M215 282H192V407"/><path d="M545 282H568V407"/><path d="M192 479V515H300V527"/><path d="M568 479V515H460V527"/></g><g fill="#161c28" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21"><text x="380" y="56">한 회차 시작</text><text x="380" y="137">고정 여행 질문 48개 검사</text><text x="380" y="162" font-size="16">400·800토큰 교대, 실패도 보존</text><text x="380" y="277">800토큰 답변</text><text x="380" y="305">24/24 성공?</text><text x="161" y="315" fill="#a8720c">성공</text><text x="600" y="315" fill="#a8720c">실패</text><text x="192" y="437">최대 6시간 안정성 검사</text><text x="192" y="464" font-size="16">오류·연속 실패·공간 부족 시 종료</text><text x="568" y="437">실패 답안 보존</text><text x="568" y="464" font-size="16">같은 조건 자동 재시도 안 함</text><text x="380" y="560">결과 보관 · 회차 종료</text><text x="380" y="620" font-size="18">다음 조건: 준비된 일감 + 선행 작업 종료 + 잠금 해제</text><text x="380" y="651" font-size="16" fill="#6b7488">반복 안정성 관측은 독립 정확도나 제품 채택이 아닙니다.</text></g></svg><p>고정 합성 일정 한 개에서 만든 진단입니다. 실제 Oracle ARM 앱 회귀와 사람 검수·독립 보류 검증은 따로 필요합니다.</p><p>글꼴: 기기 설치 상태에 따라 Malgun Gothic → Noto Sans KR → sans-serif 순서로 표시합니다.</p></main></html>
