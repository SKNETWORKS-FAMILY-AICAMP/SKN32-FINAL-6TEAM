<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">답안 재검토 개발 시험의 한 회차</title><desc id="desc">시작, 고정 질문과 첫 답 읽기, 원본 모델 재검토, 실패를 포함한 채점, 기준 판단을 거쳐 다음 검증 대기 또는 실패 기록으로 종료한다. 제품 반영은 아니다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#161c28"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif;fill:#161c28;text-anchor:middle;font-size:20px}.node{fill:#fbfcfd;stroke:#161c28;stroke-width:1.5}.line{fill:none;stroke:#161c28;stroke-width:1.5;marker-end:url(#arrow)}.small{font-size:16px}</style><rect width="960" height="800" fill="#fbfcfd"/><text x="480" y="38" font-size="26">학습판 답이 원본 모델에 도움이 될까요?</text><text class="small" x="480" y="68">현재는 개발 시험 · 제품 적용과 독립 검증은 별도</text><ellipse class="node" cx="480" cy="120" rx="115" ry="30"/><text x="480" y="127">한 회차 시작</text><path class="line" d="M480 150V185"/><rect class="node" x="250" y="185" width="460" height="75" rx="6"/><text x="480" y="215">고정 질문 + 보관된 첫 답 읽기</text><text class="small" x="480" y="243">정답 메타데이터는 모델에 전달하지 않음</text><path class="line" d="M480 260V295"/><rect class="node" x="250" y="295" width="460" height="60" rx="6"/><text x="480" y="332">원본 모델이 같은 질문 재검토</text><path class="line" d="M480 355V390"/><rect class="node" x="250" y="390" width="460" height="60" rx="6"/><text x="480" y="427">실패·누락을 포함해 전체 채점</text><path class="line" d="M480 450V480"/><path d="M480 480L635 555L480 630L325 555Z" fill="#fff5df" stroke="#a8720c" stroke-width="1.8"/><text x="480" y="548">사전 정확도·회귀</text><text x="480" y="576">기준을 통과했나?</text><path class="line" d="M325 555H180V680"/><text class="small" x="235" y="537">미달 / 미완료</text><path class="line" d="M635 555H780V680"/><text class="small" x="729" y="537">통과</text><ellipse class="node" cx="180" cy="715" rx="155" ry="35"/><text x="180" y="711">실패·대기 기록</text><text class="small" x="180" y="735">한 회차 종료</text><ellipse class="node" cx="780" cy="715" rx="155" ry="35"/><text x="780" y="711">반복·독립 검증 대기</text><text class="small" x="780" y="735">한 회차 종료</text></svg>