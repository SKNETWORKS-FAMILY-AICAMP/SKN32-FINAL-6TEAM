<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">실행 가능한 일감만 채우는 한 회차</title><desc id="diagram-desc">시작 후 현재 배포판과 잠금을 확인한다. 실행 가능한 일감이면 실행하고 답안과 실패를 보관한다. 차단된 일감이면 실패 기록을 보존하고 다른 준비 작업을 보충한다. 두 경로 모두 이번 회차 종료로 이어지며 다음 시각에 새 회차가 시작된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5bd8"/></marker></defs><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#161c28;font-size:18px;text-anchor:middle}.node{fill:#fbfcfd;stroke:#161c28;stroke-width:2}.edge{fill:none;stroke:#2f5bd8;stroke-width:2;marker-end:url(#arrow)}.small{font-size:15px}</style><rect width="760" height="640" fill="#fbfcfd"/><ellipse class="node" cx="380" cy="40" rx="130" ry="27"/><text x="380" y="47">점검 회차 시작</text><path class="edge" d="M380 67V95"/><rect class="node" x="235" y="100" width="290" height="55" rx="5"/><text x="380" y="134">실행판·잠금·남은 공간 확인</text><path class="edge" d="M380 155V185"/><path class="node" d="M380 190L530 260L380 330L230 260Z"/><text x="380" y="255">실행 가능한</text><text x="380" y="281">일감인가요?</text><path class="edge" d="M230 260H170V365"/><text class="small" x="187" y="248">예</text><path class="edge" d="M530 260H590V365"/><text class="small" x="565" y="248">아니요</text><rect class="node" x="40" y="370" width="260" height="65" rx="5"/><text x="170" y="398">한 작업 실행</text><text class="small" x="170" y="422">답안·실패를 함께 보관</text><rect class="node" x="460" y="370" width="260" height="65" rx="5"/><text x="590" y="398">차단 기록 보존</text><text class="small" x="590" y="422">다른 준비 작업으로 보충</text><path class="edge" d="M170 435V485H380V530"/><path class="edge" d="M590 435V485H380"/><ellipse class="node" cx="380" cy="562" rx="130" ry="27"/><text x="380" y="569">이번 회차 종료</text><text class="small" x="380" y="622">다음 점검 시각에 새 회차 시작 · 실패 작업은 원인 수정 전 재시도 금지</text></svg>