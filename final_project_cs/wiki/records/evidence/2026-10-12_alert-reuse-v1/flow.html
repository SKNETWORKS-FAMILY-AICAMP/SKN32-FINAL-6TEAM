<!doctype html>

<style>

<body><main>
<h1>실제 경보 원본 활용 순서</h1>
<p>앞으로 연결할 작업입니다. 원본 분석·후보 선정까지 수행했으며 제품 재생 시험과 대체안 검증은 미실행입니다.</p>
