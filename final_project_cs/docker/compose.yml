# 로컬 개발용 Postgres(pgvector). .gitignore 대상 — 각자 로컬에 둔다.
# 접속: postgresql+psycopg://postgres@127.0.0.1:5433/acop_cs (ACOP_DATABASE_URL)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: acop_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: acop_cs
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - acop_pgdata:/var/lib/postgresql/data
volumes:
  acop_pgdata:
    external: true
