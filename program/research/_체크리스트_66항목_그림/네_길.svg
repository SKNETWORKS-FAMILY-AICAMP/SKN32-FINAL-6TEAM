<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="paths-title paths-desc" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="paths-title">일정 확인이 도는 네 길</title>
  <desc id="paths-desc">고객이나 외부 AI가 올린 일정은 등록 길에서 처음 판정되고, 우리 서버가 짠 일정은 생성 길에서 짜는 중에 판정되며, 저장된 일정은 감시 길에서 여행 내내 반복 점검되고, 등록 거절과 변경 알림은 응답 길로 고객에게 나간다.</desc>
  <defs>
    <marker id="paths-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6d7c73"/>
    </marker>
  </defs>
  <rect width="960" height="392" fill="#f7f9f3"/>

  <!-- 연결선: 상자보다 먼저 그린다 -->
  <path d="M192 188 H272" fill="none" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>
  <path d="M440 188 H520" fill="none" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>
  <path d="M688 188 H768" fill="none" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>
  <path d="M440 56 H572 a8 8 0 0 1 8 8 V152" fill="none" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>
  <path d="M852 152 V120 a8 8 0 0 0 -8 -8 H636 a8 8 0 0 0 -8 8 V152" fill="none" stroke="#6d7c73" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#paths-arrow)"/>
  <path d="M356 224 V272" fill="none" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>
  <path d="M852 224 V272" fill="none" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>

  <!-- 연결선 이름표: 선과 6~10px 띄우고 바탕색 판을 깐다 -->
  <rect x="462" y="168" width="36" height="12" rx="2" fill="#f7f9f3"/>
  <text x="480" y="178" fill="#6d7c73" font-size="12" text-anchor="middle">통과</text>
  <rect x="704" y="168" width="48" height="12" rx="2" fill="#f7f9f3"/>
  <text x="728" y="178" fill="#6d7c73" font-size="12" text-anchor="middle">점검</text>
  <rect x="410" y="96" width="162" height="12" rx="2" fill="#f7f9f3"/>
  <text x="572" y="106" fill="#6d7c73" font-size="12" text-anchor="end">짜면서 같은 판정기로 고침</text>
  <rect x="690" y="92" width="100" height="12" rx="2" fill="#f7f9f3"/>
  <text x="740" y="102" fill="#6d7c73" font-size="12" text-anchor="middle">새 판으로 저장</text>
  <rect x="364" y="238" width="68" height="12" rx="2" fill="#f7f9f3"/>
  <text x="364" y="248" fill="#6d7c73" font-size="12">거절·이유</text>
  <rect x="860" y="238" width="68" height="12" rx="2" fill="#f7f9f3"/>
  <text x="860" y="248" fill="#6d7c73" font-size="12">변경 알림</text>

  <!-- 상자 -->
  <rect x="272" y="24" width="168" height="64" rx="6" fill="#f7f9f3"/>
  <rect x="272" y="24" width="168" height="64" rx="6" fill="#ffffff" stroke="#24392f" stroke-width="1"/>
  <text x="356" y="50" fill="#24392f" font-size="12" font-weight="600" text-anchor="middle">생성</text>
  <text x="356" y="70" fill="#6d7c73" font-size="12" text-anchor="middle">우리 서버가 일정을 짤 때</text>

  <rect x="24" y="152" width="168" height="72" rx="6" fill="#f7f9f3"/>
  <rect x="24" y="152" width="168" height="72" rx="6" fill="#6d7c73" fill-opacity="0.10" stroke="#8a968f" stroke-width="1"/>
  <text x="108" y="184" fill="#24392f" font-size="12" font-weight="600" text-anchor="middle">올린 일정</text>
  <text x="108" y="204" fill="#6d7c73" font-size="12" text-anchor="middle">고객·외부 AI가 만든 것</text>

  <rect x="272" y="152" width="168" height="72" rx="6" fill="#f7f9f3"/>
  <rect x="272" y="152" width="168" height="72" rx="6" fill="#e9f2eb" stroke="#2e6047" stroke-width="1"/>
  <text x="356" y="184" fill="#24392f" font-size="12" font-weight="600" text-anchor="middle">등록</text>
  <text x="356" y="204" fill="#6d7c73" font-size="12" text-anchor="middle">일정을 받을 때</text>

  <rect x="520" y="152" width="168" height="72" rx="6" fill="#f7f9f3"/>
  <rect x="520" y="152" width="168" height="72" rx="6" fill="#24392f" fill-opacity="0.05" stroke="#6d7c73" stroke-width="1"/>
  <text x="604" y="184" fill="#24392f" font-size="12" font-weight="600" text-anchor="middle">저장된 일정</text>
  <text x="604" y="204" fill="#6d7c73" font-size="12" text-anchor="middle">여행 내내 쓰는 판</text>

  <rect x="768" y="152" width="168" height="72" rx="6" fill="#f7f9f3"/>
  <rect x="768" y="152" width="168" height="72" rx="6" fill="#ffffff" stroke="#24392f" stroke-width="1"/>
  <text x="852" y="184" fill="#24392f" font-size="12" font-weight="600" text-anchor="middle">감시</text>
  <text x="852" y="204" fill="#6d7c73" font-size="12" text-anchor="middle">여행 중 반복 점검</text>

  <rect x="24" y="272" width="912" height="64" rx="6" fill="#f7f9f3"/>
  <rect x="24" y="272" width="912" height="64" rx="6" fill="#24392f" fill-opacity="0.03" stroke="#24392f" stroke-opacity="0.30" stroke-width="1"/>
  <text x="48" y="300" fill="#24392f" font-size="12" font-weight="600">응답</text>
  <text x="48" y="320" fill="#6d7c73" font-size="12">고객이 보는 곳 · 확인 화면 · 알림 · 여행계획서 링크 · 등록 거절 메시지</text>

  <!-- 범례: 아래 가로 띠 -->
  <line x1="24" y1="352" x2="936" y2="352" stroke="#24392f" stroke-opacity="0.10" stroke-width="0.8"/>
  <line x1="24" y1="372" x2="52" y2="372" stroke="#6d7c73" stroke-width="1.2" marker-end="url(#paths-arrow)"/>
  <text x="64" y="376" fill="#6d7c73" font-size="12">일정이 넘어가는 방향</text>
  <line x1="268" y1="372" x2="296" y2="372" stroke="#6d7c73" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#paths-arrow)"/>
  <text x="308" y="376" fill="#6d7c73" font-size="12">점선은 감시가 고친 일정을 새 판으로 저장</text>
  <rect x="648" y="364" width="16" height="16" rx="3" fill="#e9f2eb" stroke="#2e6047" stroke-width="1"/>
  <text x="676" y="376" fill="#6d7c73" font-size="12">초록 테두리는 외부 일정이 처음 닿는 입구</text>
</svg>
