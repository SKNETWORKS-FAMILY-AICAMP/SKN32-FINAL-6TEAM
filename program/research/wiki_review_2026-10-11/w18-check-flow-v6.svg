<svg viewBox="0 0 760 590" role="img" aria-labelledby="w18-flow-title w18-flow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="w18-flow-title">환경을 정한 뒤 증거로 정상 여부를 판단하는 운영 점검</title><desc id="w18-flow-desc">점검 시작, 환경과 실행판 확인, 구성·기동·준비·고객기능·자동작업 검사, 결과 일치 판단. 일치하면 범위를 붙여 정상 기록, 불일치나 미확인이면 실패 보존과 원인 분석 기록. 두 경로 모두 이번 점검 종료로 끝난다. 실제 서비스 가동을 그린 그림이 아니다.</desc>
<defs><marker id="w18-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<g fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#w18-arrow)"><path d="M380 65V95"/><path d="M380 155V185"/><path d="M380 245V275"/><path d="M465 325H592Q600 325 600 333V393"/><path d="M295 325H168Q160 325 160 333V393"/><path d="M160 459V505Q160 513 168 513H318"/><path d="M600 459V505Q600 513 592 513H442"/></g>
