<g fill="#fbfcfd" stroke="#dbe0ea"><rect x="300" y="20" width="160" height="45" rx="22"/><rect x="205" y="95" width="350" height="60" rx="6"/><rect x="160" y="185" width="440" height="60" rx="6"/><path d="M380 275L465 325L380 375L295 325Z" fill="#fff7e6" stroke="#a8720c"/><rect x="40" y="393" width="240" height="66" rx="6"/><rect x="480" y="393" width="240" height="66" rx="6"/><rect x="318" y="490" width="124" height="45" rx="22"/></g>
<g text-anchor="middle" fill="#161c28" font-size="17" font-family="Malgun Gothic, sans-serif"><text x="380" y="49">점검 시작</text><text x="380" y="121">어느 환경·어느 실행판인지 확인</text><text x="380" y="143" font-size="13">로컬 / x600 공개 배포 / ARM 실험 / GPU 연구</text><text x="380" y="210">구성 → 기동 → 준비 → 고객 기능 → 자동 작업</text><text x="380" y="232" font-size="13">확인한 범위·시각·원본 결과를 보존</text><text x="380" y="322">검사 결과가</text><text x="380" y="345">기대와 같은가?</text><text x="160" y="420">실패·미확인 보존</text><text x="160" y="442" font-size="13">영향·원인·후속 작업 기록</text><text x="600" y="420">검사 범위의 정상 기록</text><text x="600" y="442" font-size="13">전체 서비스 정상으로 확대 금지</text><text x="380" y="518">이번 점검 종료</text></g></svg>