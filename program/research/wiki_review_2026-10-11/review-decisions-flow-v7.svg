<rect x="40" y="104" width="400" height="72" rx="6" fill="#f7f2e8" stroke="#a8720c"/>
<g font-family="Geist, Noto Sans KR, Malgun Gothic, sans-serif" text-anchor="middle" fill="#161c28" font-size="16"><text x="240" y="54">질의·계획·문제 접수 시작</text><text x="240" y="132">분류 에이전트가 처리 계획 결정</text><text x="240" y="156">상황·성향 → 담당·순서·우선순위</text><text x="240" y="236">공통 실행 장치가 계획 검증</text><text x="240" y="260">등록 팀·권한·의존 관계·실행 예산</text><text x="240" y="366">실행 가능한가?</text><text x="196" y="480">배정된 에이전트 팀 실행</text><text x="196" y="504">각 팀은 자기 업무 계산·제안</text><text x="492" y="480">보류·구체적 안내</text><text x="492" y="504">실패 원인 기록</text><text x="196" y="588">전체 일정 검증·허용 변경 저장</text><text x="196" y="612">미통과 제안은 적용하지 않음</text><text x="240" y="686">이번 처리 종료</text></g>
