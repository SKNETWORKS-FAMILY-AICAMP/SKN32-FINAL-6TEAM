<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="decision-flow-title decision-flow-desc">
<title id="decision-flow-title">이번에 확정한 목표 책임: 분류 에이전트의 판단과 실행 장치</title><desc id="decision-flow-desc">입력 접수 뒤 분류 에이전트가 팀과 순서를 결정하고 실행 장치가 계약을 검사합니다. 통과하면 업무 팀 실행과 전체 검증을 거쳐 끝나고, 실패하면 보류와 안내로 끝납니다. 현재 구현 완료를 뜻하지 않습니다.</desc>
<defs><marker id="decision-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b7488"/></marker></defs>
