<style>text{font-family:Geist,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#161c28;text-anchor:middle;font-size:18px}.label{font-size:15px}rect,ellipse,polygon{stroke:#6b7488;stroke-width:1.5;fill:#fbfcfd}</style>
<rect width="940" height="620" fill="#fbfcfd" stroke="none"/>
<path d="M300 78V107" fill="none" stroke="#6b7488" stroke-width="1.8" marker-end="url(#arrow-620)"/>
<path d="M300 173V210" fill="none" stroke="#6b7488" stroke-width="1.8" marker-end="url(#arrow-620)"/>
<path d="M300 330V377" fill="none" stroke="#6b7488" stroke-width="1.8" marker-end="url(#arrow-620)"/>
