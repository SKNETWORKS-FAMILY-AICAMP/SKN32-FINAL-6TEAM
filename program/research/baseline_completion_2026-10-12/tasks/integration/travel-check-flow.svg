<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-labelledby="title-620 desc-620">
<title id="title-620">작업 한 건의 자료 확인</title><desc id="desc-620">자료가 유효하면 팀 계산 후 적용 판단으로, 아니면 해당 작업만 보류하고 회차를 끝냅니다.</desc>
