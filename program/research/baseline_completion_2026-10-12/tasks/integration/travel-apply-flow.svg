<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 730" role="img" aria-labelledby="title-730 desc-730">
<title id="title-730">변경 제안 이후의 적용 판단</title><desc id="desc-730">전체 검증 실패는 적용하지 않고 종료합니다. 자동 변경이 허용되지 않으면 고객 선택 대기로 종료하며, 허용될 때 저장하고 통지합니다.</desc>
