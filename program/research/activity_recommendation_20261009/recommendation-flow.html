<h1>조건은 코드로, 취향의 의미는 모델로</h1>
<p class="lead">고객의 취향과 중요도를 전달받은 Activity가 방문 가능 후보를 확보합니다. 의미 평가 뒤에는 코드로 순위를 계산하고, 추가 효과가 확인된 요청에서만 Luna 재정렬을 사용합니다.</p>

<p class="foot">2026-10-09 연구 제안입니다. 운영 코드에 반영한 완료 구조가 아닙니다. 이번 소액 시험은 고정 후보의 재정렬을 비교하며, 후보 검색 품질과 사람의 실제 선호 검수는 별도입니다. 문서용 가로 그림이며 작은 화면에서는 가로로 볼 수 있습니다.</p>
