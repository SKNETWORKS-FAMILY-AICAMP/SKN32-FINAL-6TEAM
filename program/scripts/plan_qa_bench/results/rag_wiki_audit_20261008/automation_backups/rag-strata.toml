거나 중단하지 말고 새 결제·임대·기존 모델 삭제 없이 처리하세요. 저장공간 또는 실행 조건 때문에 모든 유효한 일이 막혔으면 원인과 필요한 조치만 보고하세요. 최근 결과로 불필요해진 비교를 단순히 GPU 사용률을 채우려 반복하지 마세요. 자동 확인은 이제 일감 보충을 위한 지속 관리로 유지하며 옛 'B56 완료 후 중지' 지시는 이번 지시로 대체됩니다. 실행 중 숫자만 바뀌면 조용히 유지하고 완료·실패·실질 비교 결과·사용자 조치가 필요한 때만 한국어 진행표로 알리세요."
