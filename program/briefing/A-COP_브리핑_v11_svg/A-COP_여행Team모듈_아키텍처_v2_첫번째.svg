<svg viewBox="0 0 1216 704" role="img" aria-labelledby="v2-main-title v2-main-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="v2-main-title">여행 Team과 코어 계약 경계</title>
  <desc id="v2-main-desc">외부 에이전트는 POST /v1/cases로 요청한다. Controller는 선택된 로컬 팀에 TeamTask를 보내고 TeamResult와 제안을 받는다. Activity, Dining, Mobility는 MVP이고 Booking Handoff는 MVP 다음이다. Lodging과 Flight는 등록만 되어 있으며 한 파일에서 예약을 잠김 취급한다. 여섯 로컬 팀은 TravelTeamBase를 공통 부모로 사용한다. Place Verification은 미등록 원격 시뮬레이터이며 A2A 실행기는 꺼져 있다. 승인 이후 공급자 실행은 미구현이며 사람 승인과 공급자 실행의 책임 경계는 2장에 있다.</desc>

