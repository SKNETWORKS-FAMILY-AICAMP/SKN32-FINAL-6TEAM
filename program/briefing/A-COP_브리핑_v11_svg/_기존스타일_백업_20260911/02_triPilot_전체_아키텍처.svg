2" marker-end="url(#ah)"></line><rect x="26" y="140" width="1348" height="66" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="700.0" y="162.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Agent Gateway</text><text x="700.0" y="179.2" text-anchor="middle" font-size="11.5" fill="#475569">User / Client / Agent Identity · OAuth · Scope · Risk 등급 · Protocol Validation</text><rect x="38" y="148" width="118" height="22" rx="11" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"></rect><text x="97.0" y="163.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Core 2 담당</text><line x1="700" y1="206" x2="700" y2="228" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"></line><rect x="26" y="230" width="1348" height="66" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="700.0" y="252.2" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Customer Case Layer</text><text x="700.0" y="269.2" text-anchor="middle" font-size="11.5" fill="#475569">REST · MCP · A2A 요청을 모두 같은 Case lifecycle과 case_events 형식으로 정규화한다</text><rect x="38" y="238" width="118" height="22" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"></rect><text x="97.0" y="253.0" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Core 1 담당</text><line x1="700" y1="296" x2="700" y2="318" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><rect x="26" y="318" width="1348" height="234" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="6 5"></rect><text x="40" y="337" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">COORDINATION · 무엇을 알고, 누가 하고, 어떻게 실행할지 결정</text><rect x="40" y="348" width="414" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="247.0" y="370.1" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Context Broker</text><text x="247.0" y="387.1" text-anchor="middle" font-size="11" fill="#475569">현재 Task에 필요한 정보만 선택 · 조합 · 12,000 토큰 절삭</text><rect x="50.0" y="420" width="92.5" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="96.25" y="437.0" text-anchor="middle" font-size="10.2" font-weight="600" fill="#0f766e">Vector RAG</text><rect x="150.5" y="420" width="92.5" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="196.75" y="437.0" text-anchor="middle" font-size="10.2" font-weight="600" fill="#0f766e">GraphStorePort</text><rect x="251.0" y="420" width="92.5" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="297.25" y="437.0" text-anchor="middle" font-size="10.2" font-weight="600" fill="#0f766e">DB State</text><rect x="351.5" y="420" width="92.5" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="397.75" y="437.0" text-anchor="middle" font-size="10.2" font-weight="600" fill="#0f766e">Memory</text><text x="247" y="474" text-anchor="middle" font-size="11.5" font-weight="700" fill="#be123c">degraded · omissions를 숨기지 않는다</text><rect x="492" y="344" width="424" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="704.0" y="366.2" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Agentic Controller</text><text x="704.0" y="383.2" text-anchor="middle" font-size="11.5" fill="#475569">Capability 판단 · Routing · Ownership · Replan</text><text x="704.0" y="398.2" text-anchor="middle" font-size="11.5" fill="#475569">WAIT / RESUME · Local과 A2A 실행 방식 선택</text><text x="704.0" y="413.2" text-anchor="middle" font-size="11.5" fill="#475569">Case 단위 경합 정책 결정</text><rect x="502" y="420" width="76" height="22" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"></rect><text x="540.0" y="435.0" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Core 1</text><rect x="962" y="348" width="398" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="1161.0" y="370.1" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Team Registry</text><text x="1161.0" y="387.1" text-anchor="middle" font-size="11" fill="#475569">capability · execution_type · version · endpoint · Agent Card</text><rect x="972" y="420" width="176" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="1060.0" y="437.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">LOCAL Module 반환</text><rect x="1156" y="420" width="204" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="1258.0" y="437.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">A2A Remote Agent 반환</text><line x1="456" y1="380" x2="488" y2="380" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"></line><text x="472" y="372" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">Context Pack</text><line x1="958" y1="380" x2="920" y2="380" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"></line><text x="939" y="372" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">Resolve</text><text x="690" y="522" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3aed">여기까지 Team은 아직 아무것도 실행하지 않았다</text><line x1="700" y1="552" x2="700" y2="574" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><rect x="26" y="574" width="1348" height="268" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="6 5"></rect><text x="40" y="593" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">EXECUTION DISPATCH · Registry 결과로 실행 경로가 갈린다</text><text x="368.0" y="612" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c3aed">LOCAL 실행 경로</text><rect x="46.0" y="626" width="644.0" height="36" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="368.0" y="648.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#7c3aed">Controller가 TeamTask 생성</text><line x1="368.0" y1="662" x2="368.0" y2="672" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"></line><rect x="46.0" y="672" width="644.0" height="36" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="368.0" y="694.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#7c3aed">MessageBusPort (in-process → Redis · RabbitMQ 교체)</text><line x1="368.0" y1="708" x2="368.0" y2="718" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"></line><rect x="46.0" y="718" width="644.0" height="36" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="368.0" y="740.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#7c3aed">Local Team 모듈</text><line x1="368.0" y1="754" x2="368.0" y2="764" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"></line><rect x="46.0" y="764" width="644.0" height="36" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="368.0" y="786.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#7c3aed">TeamResult + ActionProposal</text><text x="368.0" y="822" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Broker는 우리 Runtime 안의 Worker 전달용이다. 외부 Agent와의 통신 규약이 아니다.</text><text x="1032.0" y="612" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">REMOTE A2A 실행 경로</text><rect x="710.0" y="626" width="644.0" height="36" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="1032.0" y="648.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#1d4ed8">Controller가 Remote TeamTask 생성</text><line x1="1032.0" y1="662" x2="1032.0" y2="672" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"></line><rect x="710.0" y="672" width="644.0" height="36" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="1032.0" y="694.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#1d4ed8">A2A Interop Adapter (Task · Auth · Endpoint 변환)</text><line x1="1032.0" y1="708" x2="1032.0" y2="718" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"></line><rect x="710.0" y="718" width="644.0" height="36" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="1032.0" y="740.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#1d4ed8">Remote Agent System (Agent Card capability)</text><line x1="1032.0" y1="754" x2="1032.0" y2="764" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"></line><rect x="710.0" y="764" width="644.0" height="36" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="1032.0" y="786.2" text-anchor="middle" font-size="11.8" font-weight="700" fill="#1d4ed8">Artifact → 같은 TeamResult로 환원</text><text x="1032.0" y="822" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">input-required가 오면 Case는 waiting_input으로 멈추고, 답이 오면 같은 Task를 이어간다.</text><line x1="700" y1="842" x2="700" y2="862" stroke="#be123c" stroke-width="2" marker-end="url(#ahr)"></line><rect x="26" y="862" width="1348" height="216" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="6 5"></rect><text x="40" y="881" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SAFETY · 제안과 실행 사이에 코드가 들어간다</text><rect x="46" y="888" width="300" height="56" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"></rect><text x="196.0" y="910.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#be123c">ActionProposal</text><text x="196.0" y="927.0" text-anchor="middle" font-size="11" fill="#475569">금액 · 식별자 · 근거를 포함한 제안</text><line x1="350" y1="916" x2="382" y2="916" stroke="#be123c" stroke-width="2" marker-end="url(#ahr)"></line><rect x="386" y="882" width="420" height="68" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"></rect><text x="596.0" y="904.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#be123c">할루시네이션 방어층</text><text x="596.0" y="921.0" text-anchor="middle" font-size="11" fill="#475569">① 제안 시점 DB 대조  ② 승인 직전 재조회</text><text x="596.0" y="936.0" text-anchor="middle" font-size="11" fill="#475569">불일치면 실행 없이 escalated + 실패필드 · hash 감사</text><line x1="810" y1="916" x2="842" y2="916" stroke="#be123c" stroke-width="2" marker-end="url(#ahr)"></line><rect x="846" y="888" width="240" height="56" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"></rect><text x="966.0" y="910.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">Human Approval</text><text x="966.0" y="927.0" text-anchor="middle" font-size="10.5" fill="#475569">고위험 Action만 · action:approve scope</text><line x1="1090" y1="916" x2="1122" y2="916" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"></line><rect x="1126" y="882" width="234" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="1243.0" y="904.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Action Gateway</text><text x="1243.0" y="921.0" text-anchor="middle" font-size="10.5" fill="#475569">Idempotency Key · Outbox</text><text x="1243.0" y="936.0" text-anchor="middle" font-size="10.5" fill="#475569">timeout은 unknown으로 남긴다</text><text x="700" y="978" text-anchor="middle" font-size="12.5" font-weight="700" fill="#be123c">Team은 여기에 손을 대지 못한다. side effect는 이 경로로만 나간다.</text><rect x="46" y="994" width="640" height="66" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.8"></rect><text x="366.0" y="1016.1" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">PostgreSQL 16 (Source of Truth)</text><text x="366.0" y="1033.1" text-anchor="middle" font-size="11" fill="#475569">customer_cases는 transition_case() 한 문으로만 바뀐다 · case_events는 append-only</text><rect x="710" y="994" width="320" height="66" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.8"></rect><text x="870.0" y="1016.1" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">pgvector</text><text x="870.0" y="1033.1" text-anchor="middle" font-size="11" fill="#475569">knowledge_chunks · vector(1536)</text><rect x="1050" y="994" width="310" height="66" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"></rect><text x="1205.0" y="1016.1" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Observability</text><text x="1205.0" y="1033.1" text-anchor="middle" font-size="11" fill="#475569">/ui/trace · evidence · approvals</text><rect x="26" y="1104" width="236.8399999999999" height="26" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"></rect><text x="144.41999999999996" y="1121.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7c3aed">Core 1 · Case Runtime &amp; Coordination</text><rect x="272.8399999999999" y="1104" width="166.0" height="26" rx="13" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"></rect><text x="355.8399999999999" y="1121.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">Core 2 · Access &amp; Action</text><rect x="448.8399999999999" y="1104" width="206.9399999999999" height="26" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"></rect><text x="552.3099999999998" y="1121.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">모델 3인 · Team 모듈 / Context</text><rect x="665.7799999999999" y="1104" width="99.07" height="26" rx="13" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"></rect><text x="715.3149999999998" y="1121.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">검증 &amp; 프론트</text><rect x="774.8499999999999" y="1104" width="77.45" height="26" rx="13" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"></rect><text x="813.5749999999999" y="1121.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#be123c">안전 경계</text><rect x="862.3" y="1104" width="62.5" height="26" rx="13" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.4"></rect><text x="893.55" y="1121.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">저장소</text></svg>