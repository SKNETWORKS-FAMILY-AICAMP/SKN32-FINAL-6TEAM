</defs><rect width="1400" height="770" fill="#ffffff"></rect><text x="26" y="38" text-anchor="start" font-size="19" font-weight="800" fill="#0f172a">구현 로드맵 — 부트캠프 공식 WBS 기준</text><text x="26" y="60" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">공식 진행기간 2026-08-28 ~ 2026-10-26. A-COPilot은 08-17에 선행 착수했다. 막대 안 숫자는 공식 산출물 21건의 번호다.</text><text x="26" y="78" text-anchor="start" font-size="11" font-weight="500" fill="#94a3b8">8W는 10/21~10/24다. 9W는 WBS 원본에 기간 표기가 없고 산출물 보완과 잔여 리소스 정리 구간이다. 최종발표는 10/26이다.</text><rect x="214.0" y="112" width="179.4" height="510" fill="#f1f5f9"></rect><line x1="214.0" y1="112" x2="214.0" y2="622" stroke="#e2e8f0" stroke-width="1"></line><text x="303.70422535211264" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7c3aed">선행</text><text x="303.70422535211264" y="142" text-anchor="middle" font-size="9.8" font-weight="500" fill="#94a3b8">8/17~8/27</text><rect x="393.4" y="112" width="114.2" height="510" fill="#ffffff"></rect><line x1="393.4" y1="112" x2="393.4" y2="622" stroke="#e2e8f0" stroke-width="1"></line><text x="450.49295774647885" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#334155">1W</text><text x="450.49295774647885" y="142" text-anchor="middle" font-size="9.8" font-weight="500" fill="#94a3b8">8/28~9/3</text><rect x="507.6" y="112" width="114.2" height="510" fill="#f8fafc"></rect><line x1="507.6" y1="112" x2="507.6" y2="622" stroke="#e2e8f0" stroke-width="1"></line><text x="564.661971830986" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#334155">2W</text><text x="564.661971830986" y="142" text-anchor="middle" font-size="9.8" font-weight="500" fill="#94a3b8">9/4~9/10</text><rect x="621.7" y="112" width="114.2" height="510" fill="#ffffff"></rect><line x1="621.7" y1="112" x2="621.7" y2="622" stroke="#e2e8f0" stroke-width="1"></line><text x="678.8309859154929" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#334155">3W</tex