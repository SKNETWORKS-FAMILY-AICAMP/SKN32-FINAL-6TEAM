</defs><rect width="1370" height="680" fill="#ffffff"></rect><rect x="20" y="20" width="520" height="640" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"></rect><text x="34" y="39" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">기존 구조 · 단계 중심 Pipeline</text><text x="280" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">단계가 A → B → C → D로 고정된다</text><rect x="150" y="86" width="260" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="280.0" y="114.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#94a3b8">고객 문의</text><line x1="280" y1="134" x2="280" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></line><rect x="150" y="160" width="260" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="280.0" y="188.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#94a3b8">감성 · 의도 · 이슈 분석</text><line x1="280" y1="208" x2="280" y2="234" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></line><rect x="150" y="234" width="260" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="280.0" y="262.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#94a3b8">검색 / RAG</text><line x1="280" y1="282" x2="280" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></line><rect x="150" y="308" width="260" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="280.0" y="336.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#94a3b8">답변 생성</text><line x1="280" y1="356" x2="280" y2="382" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></line><rect x="150" y="382" width="260" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="280.0" y="410.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#94a3b8">검수</text><line x1="280" y1="430" x2="280" y2="456" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></line><rect x="150" y="456" width="260" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="280.0" y="484.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#94a3b8">답변 1건 종료</text><rect x="40" y="528" width="480" height="84" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"></rect><text x="52" y="548" font-size="13" font-weight="700" fill="#94a3b8">남는 질문</text><text x="52" y="565.0" font-size="11.5" fill="#475569">분석 · 검색 · 생성 · 검수를 각각 Agent라고 불러도</text><text x="52" y="580.0" font-size="11.5" fill="#475569">구조는 한 방향 한 줄이다.</text><text x="52" y="595.0" font-size="11.5" fill="#475569">"왜 굳이 Multi-Agent인가"에 답이 안 된다.</text><rect x="570" y="20" width="760" height="640" rx="14" fill="#fdfcff" stroke="#c4b5fd" stroke-width="1.4" stroke-dasharray="6 5"></rect><text x="584" y="39" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">제안 구조 · 업무 책임 중심 Agentic System</text><text x="950" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">상태를 가진 Case를 끝까지 관리한다</text><rect x="820" y="78" width="260" height="44" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.8"></rect><text x="950.0" y="104.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">고객 문제</text><line x1="950" y1="122" x2="950" y2="144" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><rect x="780" y="146" width="340" height="54" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="950.0" y="168.1" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">Customer Case</text><text x="950.0" y="185.1" text-anchor="middle" font-size="11.5" fill="#475569">status · owner · version · state_json</text><line x1="950" y1="200" x2="950" y2="220" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><rect x="780" y="222" width="340" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="950.0" y="244.1" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">Agentic Controller</text><text x="950.0" y="261.1" text-anchor="middle" font-size="11.5" fill="#475569">Capability 판단 · Routing · Replan · 승인 대기</text><rect x="596" y="214" width="158" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="675.0" y="237.3" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Context Broker</text><rect x="596" y="260" width="158" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="675.0" y="283.3" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Team Registry</text><line x1="754" y1="240" x2="778" y2="240" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"></line><line x1="754" y1="266" x2="778" y2="266" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"></line><text x="675" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">Context Pack</text><text x="675" y="314" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">LOCAL / A2A 해석</text><line x1="950" y1="282" x2="950" y2="316" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><text x="962" y="304" text-anchor="start" font-size="10.5" font-weight="700" fill="#7c3aed">TeamTask 1건</text><rect x="596" y="318" width="708" height="152" rx="14" fill="#f6fefb" stroke="#0f766e" stroke-width="2.2"></rect><text x="612" y="340" text-anchor="start" font-size="13.5" font-weight="800" fill="#0f766e">Team Slot</text><text x="742" y="340" text-anchor="start" font-size="11" font-weight="600" fill="#64748b">Registry가 고른 Team 하나가 여기서 실행된다</text><rect x="610.0" y="352" width="217.33333333333334" height="76" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="718.6666666666666" y="373.9" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Team A</text><text x="718.6666666666666" y="390.9" text-anchor="middle" font-size="10.4" fill="#475569">업무 책임 A</text><text x="718.6666666666666" y="405.9" text-anchor="middle" font-size="10.4" fill="#475569">고유 Tool</text><text x="718.6666666666666" y="420.9" text-anchor="middle" font-size="10.4" fill="#475569">고유 Knowledge</text><rect x="841.3333333333334" y="352" width="217.33333333333334" height="76" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="950.0" y="373.9" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Team B</text><text x="950.0" y="390.9" text-anchor="middle" font-size="10.4" fill="#475569">업무 책임 B</text><text x="950.0" y="405.9" text-anchor="middle" font-size="10.4" fill="#475569">고유 Tool</text><text x="950.0" y="420.9" text-anchor="middle" font-size="10.4" fill="#475569">고유 Knowledge</text><rect x="1072.6666666666667" y="352" width="217.33333333333334" height="76" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="1181.3333333333335" y="373.9" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Team 모듈 C</text><text x="1181.3333333333335" y="390.9" text-anchor="middle" font-size="10.4" fill="#475569">업무 책임 C</text><text x="1181.3333333333335" y="405.9" text-anchor="middle" font-size="10.4" fill="#475569">고유 Tool</text><text x="1181.3333333333335" y="420.9" text-anchor="middle" font-size="10.4" fill="#475569">고유 Knowledge</text><text x="950.0" y="456" text-anchor="middle" font-size="11.5" font-weight="700" fill="#be123c">Team은 side effect를 실행하지 않는다. 제안만 돌려준다.</text><line x1="950" y1="470" x2="950" y2="492" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><text x="962" y="486" text-anchor="start" font-size="10.5" font-weight="700" fill="#7c3aed">TeamResult · ActionProposal</text><rect x="780" y="492" width="340" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="950.0" y="514.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c3aed">Shared State</text><text x="950.0" y="531.0" text-anchor="middle" font-size="11.5" fill="#475569">case_events append-only · 낙관적 동시성</text><line x1="950" y1="544" x2="950" y2="564" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"></line><rect x="600" y="566" width="138" height="42" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"></rect><text x="669.0" y="591.7" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">해결</text><rect x="752" y="566" width="138" height="42" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"></rect><text x="821.0" y="591.7" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">재계획</text><rect x="904" y="566" width="148" height="42" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"></rect><text x="978.0" y="591.7" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">사람 승인</text><rect x="1066" y="566" width="176" height="42" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"></rect><text x="1154.0" y="591.7" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">다른 Team 위임</text><polyline points="1242,587 1318,587 1318,252 1124,252" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahv)"></polyline><text transform="rotate(-90 1330 420)" x="1330" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">되돌아온다</text><text x="950" y="640" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">Team A · B · C는 고정된 이름이 아니다. 업무 분석 결과에 따라 Team Module을 만들고 Registry에 등록한다.</text></svg>