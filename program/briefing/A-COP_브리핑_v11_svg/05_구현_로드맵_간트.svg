2f5fa" stroke="#55708f" stroke-width="1"></rect><text x="507.5774647887324" y="244" text-anchor="middle" font-size="11.3" font-weight="600" fill="#55708f">seed · knowledge 적재, DB 설계</text><text x="507.5774647887324" y="260" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">4 · 5</text><line x1="26" y1="350" x2="1372" y2="350" stroke="#e5e8ed" stroke-width="1"></line><text x="26" y="317.0" text-anchor="start" font-size="13" font-weight="600" fill="#a8720c">데이터 전처리</text><text x="26" y="333.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#7a8599">공식 산출물 3건</text><rect x="510.6" y="294" width="222.3" height="42" rx="8" fill="#f4f0e7" stroke="#a8720c" stroke-width="1"></rect><text x="621.7464788732394" y="312" text-anchor="middle" font-size="11.3" font-weight="600" fill="#a8720c">PII masking · chunk · embedding</text><text x="621.7464788732394" y="328" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">6 · 7 · 8</text><line x1="26" y1="418" x2="1372" y2="418" stroke="#e5e8ed" stroke-width="1"></line><text x="26" y="385.0" text-anchor="start" font-size="13" font-weight="600" fill="#a8720c">모델링 및 평가</text><text x="26" y="401.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#7a8599">공식 산출물 4건</text><rect x="624.7" y="362" width="418.1" height="42" rx="8" fill="#f4f0e7" stroke="#a8720c" stroke-width="1"></rect><text x="833.7746478873239" y="380" text-anchor="middle" font-size="11.3" font-weight="600" fill="#a8720c">Graph 관계 질의 · 아키텍처 · 멀티 에이전트 테스트</text><text x="833.7746478873239" y="396" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">9 · 10 · 11 · 12</text><line x1="26" y1="486" x2="1372" y2="486" stroke="#e5e8ed" stroke-width="1"></line><text x="26" y="453.0" text-anchor="start" font-size="13" font-weight="600" fill="#2f5bd8">모델 배포</text><text x="26" y="469.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#7a8599">공식 산출물 5건</text><rect x="918.3" y="430" width="124.5" height="42" rx="8" fill="#f2f5fa" stroke="#2f5bd8" stroke-width="1"></rect><text x="980.5633802816901" y="448" text-anchor="middle" font-size="10.1" font-weight="600" fill="#2f5bd8">요구사항 갱신 · 화면설계</text><text x="980.5633802816901" y="464" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">13 · 14</text><rect x="1048.8" y="430" width="238.6" height="42" rx="8" fill="#f2f5fa" stroke="#2f5bd8" stroke-width="1"></rect><text x="1168.1267605633802" y="448" text-anchor="middle" font-size="11.3" font-weight="600" fill="#2f5bd8">웹 앱 · 시스템 구성도 · 서비스 테스트</text><text x="1168.1267605633802" y="464" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">15 · 16 · 17</text><line x1="26" y1="554" x2="1372" y2="554" stroke="#e5e8ed" stroke-width="1"></line><text x="26" y="521.0" text-anchor="start" font-size="13" font-weight="600" fill="#a8720c">발표 및 시연</text><text x="26" y="537.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#7a8599">공식 산출물 4건</text><rect x="624.7" y="498" width="108.2" height="42" rx="8" fill="#f4f0e7" stroke="#a8720c" stroke-width="1"></rect><text x="678.8309859154929" y="516" text-anchor="middle" font-size="11.3" font-weight="600" fill="#a8720c">중간 발표</text><text x="678.8309859154929" y="532" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">18</text><rect x="1179.3" y="498" width="157.1" height="42" rx="8" fill="#f4f0e7" stroke="#a8720c" stroke-width="1"></rect><text x="1257.8309859154929" y="516" text-anchor="middle" font-size="11.3" font-weight="600" fill="#a8720c">PT · 소스코드 · 시연영상</text><text x="1257.8309859154929" y="532" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7488">19 · 20 · 21</text><line x1="26" y1="622" x2="1372" y2="622" stroke="#e5e8ed" stroke-width="1"></line><text x="26" y="589.0" text-anchor="start" font-size="13" font-weight="600" fill="#6b7488">보완</text><text x="26" y="605.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#7a8599">9W · 기간 표기 없음</text><rect x="1342.4" y="566" width="26.6" height="42" rx="8" fill="#f5f7f9" stroke="#6b7488" stroke-width="1"></rect><circle cx="393.4" cy="628" r="5" fill="#a8720c"></circle><text x="393.40845070422534" y="648" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a8720c">공식 시작 8/28</text><circle cx="687.0" cy="628" r="5" fill="#9a4f45"></circle><text x="686.9859154929577" y="648" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9a4f45">중간발표 9/15</text><circle cx="1355.7" cy="628" r="5" fill="#9a4f45"></circle><text x="1355.6901408450703" y="648" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9a4f45">최종발표 10/26</text><rect x="26" y="662" width="440" height="82" rx="8" fill="#f7eeee" stroke="#9a4f45" stroke-width="1"></rect><text x="38" y="682" font-size="13" font-weight="600" fill="#9a4f45">새 기능을 멈추는 두 구간</text><text x="38" y="699.0" font-size="11" fill="#6b7488">4W(9/18~9/28, 11일)는 새 기능을 시작하지 않는다.</text><text x="38" y="714.0" font-size="11" fill="#6b7488">3W 미완료 작업과 중간발표 피드백을 처리한다.</text><text x="38" y="729.0" font-size="11" fill="#6b7488">8W(10/21~10/24, 4일)는 발표 재현 절차를 확정한다.</text><rect x="486" y="662" width="440" height="82" rx="8" fill="#f4f0e7" stroke="#a8720c" stroke-width="1"></rect><text x="498" y="682" font-size="13" font-weight="600" fill="#a8720c">일정 지연 시 범위 제외 순서</text><text x="498" y="699.0" font-size="11" fill="#6b7488">① Graph 외부 Adapter 비교, ② A2A Remote 확장 시나리오</text><text x="498" y="714.0" font-size="11" fill="#6b7488">③ MCP tool 추가와 Booking Handoff, ④ 화면 장식과 추가 Team</text><text x="498" y="729.0" font-size="11" fill="#6b7488">Activity·Dining·Mobility, 운영 UI, 평가 harness는 남긴다.</text><rect x="946" y="662" width="428" height="82" rx="8" fill="#f2f5fa" stroke="#2f5bd8" stroke-width="1"></rect><text x="958" y="682" font-size="13" font-weight="600" fill="#2f5bd8">9/15 중간발표 한 흐름</text><text x="958" y="699.0" font-size="11" fill="#6b7488">고객 메시지 또는 감시 sweeper 가 Case 를 만들고, 분류와</text><text x="958" y="714.0" font-size="11" fill="#6b7488">Context Pack 구성을 거쳐 Team 이 실행한다. 근거가 붙고,</text><text x="958" y="729.0" font-size="11" fill="#6b7488">waiting_approval에서 멈춘다. 운영자가 승인한다.</text></svg>