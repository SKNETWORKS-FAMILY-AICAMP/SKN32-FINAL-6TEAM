</defs><rect width="1400" height="770" fill="#fbfcfd"></rect><text x="26" y="38" text-anchor="start" font-size="19" font-weight="600" fill="#161c28">구현 로드맵 — 부트캠프 공식 WBS 기준</text><text x="26" y="60" text-anchor="start" font-size="12" font-weight="400" fill="#6b7488">공식 진행기간 2026-08-28 ~ 2026-10-26. A-COPilot은 08-17에 선행 착수했다. 막대 안 숫자는 공식 산출물 21건의 번호다.</text><text x="26" y="78" text-anchor="start" font-size="11" font-weight="400" fill="#7a8599">8W는 10/21~10/24다. 9W는 WBS 원본에 기간 표기가 없고 산출물 보완과 잔여 리소스 정리 구간이다. 최종발표는 10/26이다.</text><rect x="214.0" y="112" width="179.4" height="510" fill="#f3f5f8"></rect><line x1="214.0" y1="112" x2="214.0" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="303.70422535211264" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f5bd8">선행</text><text x="303.70422535211264" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">8/17~8/27</text><rect x="393.4" y="112" width="114.2" height="510" fill="#fbfcfd"></rect><line x1="393.4" y1="112" x2="393.4" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="450.49295774647885" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">1W</text><text x="450.49295774647885" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">8/28~9/3</text><rect x="507.6" y="112" width="114.2" height="510" fill="#f5f7f9"></rect><line x1="507.6" y1="112" x2="507.6" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="564.661971830986" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">2W</text><text x="564.661971830986" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">9/4~9/10</text><rect x="621.7" y="112" width="114.2" height="510" fill="#ffffff"></rect><line x1="621.7" y1="112" x2="621.7" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="678.8309859154929" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">3W</text><text x="678.8309859154929" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">9/11~9/17</text><rect x="735.9" y="112" width="179.4" height="510" fill="#f5f7f9"></rect><line x1="735.9" y1="112" x2="735.9" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="825.6197183098591" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">4W</text><text x="825.6197183098591" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">9/18~9/28</text><rect x="915.3" y="112" width="130.5" height="510" fill="#ffffff"></rect><line x1="915.3" y1="112" x2="915.3" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="980.5633802816901" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">5W</text><text x="980.5633802816901" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">9/29~10/6</text><rect x="1045.8" y="112" width="130.5" height="510" fill="#f5f7f9"></rect><line x1="1045.8" y1="112" x2="1045.8" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="1111.042253521127" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">6W</text><text x="1111.042253521127" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">10/7~10/14</text><rect x="1176.3" y="112" width="114.2" height="510" fill="#ffffff"></rect><line x1="1176.3" y1="112" x2="1176.3" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="1233.3661971830986" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">7W</text><text x="1233.3661971830986" y="142" text-anchor="middle" font-size="9.8" font-weight="400" fill="#7a8599">10/15~10/21</text><rect x="1274.1" y="112" width="65.2" height="510" fill="#f5f7f9"></rect><line x1="1274.1" y1="112" x2="1274.1" y2="622" stroke="#d9dde4" stroke-width="1"></line><text x="1306.7605633802818" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161c28">8W<