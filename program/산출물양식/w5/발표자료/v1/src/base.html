<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guguroute 멘토 발표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5f3ec; --paper:#fffdf7; --ink:#1d2a23; --muted:#5f6b64; --line:#d9ddd3;
  --g1:#2d5f48; --g2:#3f7d61; --g3:#e5efe8; --gold:#c8913a; --gold2:#f6ead4; --red:#b8503a; --red2:#f6e3dc; --blue:#2f6c9a; --blue2:#e2eef7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1713}
body{font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1600px;height:900px;background:var(--bg);border-radius:4px;padding:72px 88px;opacity:0;pointer-events:none;
  transform:translateX(40px);transition:opacity .45s ease,transform .45s ease;overflow:hidden;transform-origin:center}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.back{transform:translateX(-40px)}
.kicker{font-size:22px;letter-spacing:.18em;color:var(--g2);font-weight:700;text-transform:uppercase;margin-bottom:18px}
h1{font-size:76px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
h2{font-size:52px;line-height:1.18;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
h3{font-size:30px;font-weight:700;margin-bottom:10px}
.lead{font-size:30px;color:var(--muted);line-height:1.5}
.small{font-size:20px;color:var(--muted);line-height:1.5}
.src{position:absolute;left:88px;bottom:30px;font-size:15px;color:#8a938d}
.pg{position:absolute;right:48px;bottom:28px;font-size:16px;color:#9aa39d;font-variant-numeric:tabular-nums}
.hl{color:var(--g1)} .warn{color:var(--red)} .goldc{color:var(--gold)}
.row{display:flex;gap:28px} .col{display:flex;flex-direction:column;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 30px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;font-size:18px;font-weight:700;background:var(--g3);color:var(--g1)}
.pill.gold{background:var(--gold2);color:#8b5f1c} .pill.red{background:var(--red2);color:var(--red)} .pill.blue{background:var(--blue2);color:var(--blue)}
.big{font-size:112px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--g1);font-variant-numeric:tabular-nums}
.mid{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--g1);font-variant-numeric:tabular-nums}
/* 단계 등장 */
.step{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.step.show{opacity:1;transform:none}
/* 휴대폰 틀 */
.phone{width:260px;height:560px;border-radius:40px;background:#111;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:31px;display:block}
/* 흐름도 */
svg text{font-family:Pretendard,"Malgun Gothic",sans-serif}
.edge{fill:none;stroke:#8fa197;stroke-width:3;stroke-dasharray:8 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
.pulse{animation:pulse 2s ease-in-out infinite} @keyframes pulse{50%{opacity:.45}}
/* 발표자 메모 */
.notes{display:none}
#notebox{position:fixed;left:0;right:0;bottom:0;max-height:32vh;overflow:auto;background:rgba(15,23,19,.94);color:#e8eee9;font-size:17px;line-height:1.6;padding:16px 28px;display:none;z-index:9}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--gold);transition:width .3s;z-index:9}
#help{position:fixed;right:14px;top:10px;color:#6b776f;font-size:13px;z-index:9}
</style>
</head>
<body>
<div id="bar"></div><div id="help">← → 넘기기 · N 발표자 메모 · F 전체 화면</div>
<div class="deck" id="deck">
{{SLIDES}}
</div>
<div id="notebox"></div>
<script>
(()=>{
  const slides=[...document.querySelectorAll('.slide')];let i=0,s=0;
  const fit=()=>{const k=Math.min(innerWidth/1600,innerHeight/900)*0.98;slides.forEach(x=>x.style.scale=k)};
  addEventListener('resize',fit);fit();
  slides.forEach((x,n)=>{const p=document.createElement('div');p.className='pg';p.textContent=(n+1)+' / '+slides.length;x.appendChild(p)});
  const steps=()=>[...slides[i].querySelectorAll('.step')];
  function show(n,dir){
    slides.forEach((x,k)=>{x.classList.toggle('on',k===n);x.classList.toggle('back',k<n)});
    i=n;s=0;steps().forEach(e=>e.classList.remove('show'));
    if(dir<0||location.search.includes('all')){steps().forEach(e=>e.classList.add('show'));s=steps().length}
    document.getElementById('bar').style.width=((n+1)/slides.length*100)+'%';
    const nt=slides[n].querySelector('.notes');document.getElementById('notebox').innerHTML=nt?nt.innerHTML:'';
    location.hash=n+1;
    slides[n].dispatchEvent(new Event('enter'));
  }
  function next(){const st=steps();if(s<st.length){st[s++].classList.add('show');return}if(i<slides.length-1)show(i+1,1)}
  function prev(){if(i>0)show(i-1,-1)}
  addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
    else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
    else if(e.key==='n'||e.key==='N'){const b=document.getElementById('notebox');b.style.display=b.style.display==='block'?'none':'block'}
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
    else if(e.key==='Home')show(0,1); else if(e.key==='End')show(slides.length-1,1);
  });
  document.getElementById('deck').addEventListener('click',e=>{if(e.target.closest('a,button'))return;(e.clientX>innerWidth/3?next:prev)()});
  const h=parseInt(location.hash.slice(1));show(h>0&&h<=slides.length?h-1:0,1);
  addEventListener('hashchange',()=>{const k=parseInt(location.hash.slice(1));if(k>0&&k<=slides.length&&k-1!==i)show(k-1,1)});
})();
</script>
</body>
</html>
