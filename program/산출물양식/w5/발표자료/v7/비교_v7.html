<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표자료 v7 두 판 비교</title>
<style>
:root{--bg:#f5f3ec;--ink:#1d2a23;--muted:#5f6b64;--g1:#2d5f48;--line:#d9ddd3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a17;--ink:#e8eee9;--muted:#9aa39d;--g1:#7fbf9f;--line:#2e3833}}
:root[data-theme="dark"]{--bg:#141a17;--ink:#e8eee9;--muted:#9aa39d;--g1:#7fbf9f;--line:#2e3833}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:18px} header span{color:var(--muted);font-size:14px}
button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;gap:6px;min-height:0}
.pane h2{font-size:15px;color:var(--g1)} .pane a{color:var(--muted);font-size:13px}
iframe{flex:1;width:100%;min-height:240px;border:1px solid var(--line);border-radius:8px;background:#0f1713}
</style>
</head>
<body>
<header>
  <b>발표자료 — 두 판 비교</b>
  <span>각 화면을 클릭한 뒤 ← → 로 넘깁니다. 「같이 넘기기」는 두 판을 같은 장 번호로 맞춥니다(장 구성이 달라 내용은 다를 수 있음).</span>
  <button id="prev">◀ 같이 이전</button><button id="next">같이 다음 ▶</button>
</header>
<main>
  <div class="pane"><h2>A · Claude 판</h2><a href="triPilot_발표자료_Claude_v7.html" target="_blank">새 창으로 열기</a><iframe id="a" src="triPilot_발표자료_Claude_v7.html#1"></iframe></div>
  <div class="pane"><h2>B · 코덱스(gpt-6.1-sol) 판</h2><a href="triPilot_발표자료_Codex_v7.html" target="_blank">새 창으로 열기</a><iframe id="b" src="triPilot_발표자료_Codex_v7.html#1"></iframe></div>
</main>
<script>
let n=1;const go=d=>{n=Math.max(1,n+d);for(const id of['a','b']){const f=document.getElementById(id);try{f.contentWindow.location.hash=n}catch(e){f.src=f.src.split('#')[0]+'#'+n}}};
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
</script>
</body>
</html>
