<desc id="tp-a-desc">팀이 정한 범위는 요식 · 액티비티 워커 둘과 공용 이동 계산이다. 시작점이 둘이다. 고객 쪽에서는 고객(또는 고객이 연결한 개인 AI)이 계획을 제출하고, 채팅하고, 선택 요청에 답한다. 시간 쪽에서는 타이머가 감시와 새벽 확인과 정기 안내를 돌리고, 감시가 연 문제 건을 처리 총괄(규칙)이 워커에 맡긴다. 모든 길은 일정 판 · 선택 요청 · 알림 기록에 쓰지만 쓰는 길은 서로 다르다.</desc>
