<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" width="1500" height="1130" style="background:#ffffff;color:#161c28" viewBox="0 0 1500 1130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시스템 아키텍처"><style>
:root{--paper:#fbfcfd;--paper-2:#f1f4f8;--card:#ffffff;--ink:#161c28;--muted:#606b7e;--soft:#727d90;--rule:#dbe0ea;
--gold:#a8720c;--gold-t:rgba(168,114,12,.09);--gold-r:rgba(168,114,12,.42);--blue:#2f6c9a;--blue-t:rgba(47,108,154,.07);--blue-r:rgba(47,108,154,.38);
--red:#a33b3b;--red-t:rgba(163,59,59,.06);--red-r:rgba(163,59,59,.4);--green:#3d7a4f;--green-t:rgba(61,122,79,.07);--green-r:rgba(61,122,79,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15181d;--paper-2:#20252d;--card:#1a1f26;--ink:#e9edf3;--muted:#b0bac9;--soft:#9aa6b9;--rule:#39424f;
--gold:#e4b45c;--gold-t:rgba(228,180,92,.1);--gold-r:rgba(228,180,92,.45);--blue:#7fb2dc;--blue-t:rgba(127,178,220,.08);--blue-r:rgba(127,178,220,.4);
--red:#e08a8a;--red-t:rgba(224,138,138,.08);--red-r:rgba(224,138,138,.45);--green:#8cc79c;--green-t:rgba(140,199,156,.08);--green-r:rgba(140,199,156,.45)}}


 


.diagram{border:1px solid var(--rule);border-radius:6px;background:var(--card);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:1100px;height:auto;color:var(--ink)}
.diagram text{fill:currentColor;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px}
.diagram .h{font-size:16.5px;font-weight:700} .diagram .
.diagram .s{fill:var(--muted);font-size:13px} .diagram .s2{font-size:13.5px}
.diagram .cap{fill:var(--soft);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:12.5px;letter-spacing:.06em}
.diagram .tag{fill:var(--gold);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:11px} .diagram .tag2{fill:var(--gold);font-size:13px;font-weight:700}
.diagram .lbl{fill:var(--muted);font-size:12.5px} .diagram .lbl-g{fill:var(--gold);font-size:13px;font-weight:700} .diagram .lbl-r{fill:var(--red);font-size:13px;font-weight:700}
.diagram .node{fill:var(--card);stroke:var(--rule)} .diagram .user{fill:var(--card);stroke:var(--soft)}
.diagram .core{fill:var(--gold-t);stroke:var(--gold-r)} .diagram .agent{fill:var(--blue-t);stroke:var(--blue-r)}
.diagram .fail{fill:var(--red-t);stroke:var(--red-r);stroke-dasharray:5 4} .diagram .dia{fill:var(--card);stroke:var(--soft)}
.diagram .state{fill:var(--green-t);stroke:var(--green-r)} .diagram .band{fill:var(--paper-2);stroke:var(--rule)} .diagram .lane{fill:var(--card);stroke:var(--rule)}
.diagram .job{fill:var(--card);stroke:var(--rule)} .diagram .queue{fill:var(--gold-t);stroke:var(--gold-r);stroke-dasharray:5 4}
.diagram .db{fill:var(--green-t);stroke:var(--green-r)} .diagram .model{fill:var(--card);stroke:var(--soft);stroke-dasharray:5 4} .diagram .ext{fill:var(--paper-2);stroke:var(--rule)}
.diagram .start{fill:var(--ink)} .diagram .end{fill:none;stroke:var(--ink);stroke-width:2} .diagram .end-in{fill:var(--ink)}
.diagram .edge{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round}
.diagram .edge.loop{stroke:var(--gold);stroke-width:1.8;stroke-dasharray:8 5} .diagram .edge.bad{stroke:var(--red);stroke-dasharray:5 4}
.diagram .edge.async{stroke:var(--gold);stroke-width:1.6;stroke-dasharray:6 5} .diagram .edge.dim{stroke-dasharray:4 4}
.diagram .role{fill:var(--gold);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:12px} .diagram .role-b{fill:var(--blue);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:12px}
.diagram .pill{font-size:11.5px;font-weight:700;fill:#fff} .diagram .pill-in{fill:var(--blue)} .diagram .pill-out{fill:var(--gold)}
.diagram .agent-band{fill:var(--blue-t);stroke:var(--blue-r)} .diagram .bar{fill:var(--card);stroke:var(--blue-r)}
.diagram .out{fill:var(--card);stroke:var(--gold-r)} .diagram .out-bad{fill:var(--red-t);stroke:var(--red-r);stroke-dasharray:5 4}
.diagram .brace{fill:none;stroke:var(--blue);stroke-width:1.4}
.diagram .ah{fill:var(--muted)} .diagram .ah-g{fill:var(--gold)} .diagram .ah-r{fill:var(--red)} .diagram .ah-b{fill:var(--blue)}

</style><rect x="0" y="0" width="1500" height="1130" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah-g" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah-r" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="b" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah-b" d="M0 0 L10 5 L0 10 Z"/></marker></defs><text class="cap" x="40" y="44" text-anchor="start">그림 2 · 시스템 아키텍처 — 클라이언트 · 백엔드 서버 · 백그라운드 워커 · 저장소 · 외부 API</text><text class="s" x="40" y="66" text-anchor="start">화살표 = 데이터가 흐르는 방향 (양쪽 화살촉 = 주고받음) · 금색 점선 = 비동기(큐) · 회색 점선 = 있으나 연결 확인 안 됨 (MCP 서버: 툴 3개는 있으나 바깥 접속용 기동 경로를 코드에서 못 찾음)</text><text class="cap" x="40" y="108" text-anchor="start">클라이언트</text><rect class="user" x="40" y="120" width="260" height="70" rx="10"/><text class="h" x="170.0" y="151.5" text-anchor="middle">휴대폰 웹</text><text class="s" x="170.0" y="172.5" text-anchor="middle">Next.js 16 · React 19</text><rect class="user" x="330" y="120" width="260" height="70" rx="10"/><text class="h" x="460.0" y="151.5" text-anchor="middle">개인 AI 비서 앱</text><text class="s" x="460.0" y="172.5" text-anchor="middle">우리 API로 연결 (REST · MCP)</text><rect class="user" x="620" y="120" width="260" height="70" rx="10"/><text class="h" x="750.0" y="151.5" text-anchor="middle">여행계획서 링크</text><text class="s" x="750.0" y="172.5" text-anchor="middle">로그인 없음 · 늘 최신</text><rect class="user" x="910" y="120" width="260" height="70" rx="10"/><text class="h" x="1040.0" y="151.5" text-anchor="middle">운영자</text><text class="s" x="1040.0" y="172.5" text-anchor="middle">오류 알림 · 운영 콘솔(읽기 전용)</text><rect class="user" x="1200" y="120" width="260" height="70" rx="10"/><text class="h" x="1330.0" y="151.5" text-anchor="middle">디스코드</text><text class="s" x="1330.0" y="172.5" text-anchor="middle">고객 알림 (지금은 채널 하나)</text><rect class="band" x="40" y="240" width="1420" height="470" rx="12"/><text class="h" x="60" y="268" text-anchor="start">백엔드 서버 — FastAPI (단일 PC)</text><rect class="lane" x="60" y="286" width="300" height="404" rx="10"/><text class="h2" x="210.0" y="314" text-anchor="middle">API 레이어 — REST</text><rect class="pill-in" x="74" y="611" width="38" height="18" rx="4"/><text class="pill" x="93" y="625" text-anchor="middle">받음</text><text class="s" x="120" y="624" text-anchor="start">HTTP 요청 (웹 · AI 앱 · MCP)</text><rect class="pill-out" x="74" y="641" width="38" height="18" rx="4"/><text class="pill" x="93" y="655" text-anchor="middle">냄</text><text class="s" x="120" y="654" text-anchor="start">JSON 응답 · 계획서 페이지</text><rect class="node" x="76" y="332" width="268" height="40" rx="8"/><text class="s2" x="210.0" y="357" text-anchor="middle">웹 API</text><rect class="node" x="76" y="384" width="268" height="40" rx="8"/><text class="s2" x="210.0" y="409" text-anchor="middle">여행 API</text><rect class="node" x="76" y="436" width="268" height="40" rx="8"/><text class="s2" x="210.0" y="461" text-anchor="middle">케이스 API</text><rect class="node" x="76" y="488" width="268" height="40" rx="8"/><text class="s2" x="210.0" y="513" text-anchor="middle">여행계획서 페이지</text><rect class="node" x="76" y="540" width="268" height="40" rx="8" stroke-dasharray="6 5"/><text class="s2" x="210.0" y="565" text-anchor="middle">MCP 서버 (툴 3개)</text><rect class="lane" x="390" y="286" width="330" height="404" rx="10"/><text class="h2" x="555.0" y="314" text-anchor="middle">서비스 레이어 — 에이전트 미경유</text><rect class="pill-in" x="404" y="611" width="38" height="18" rx="4"/><text class="pill" x="423" y="625" text-anchor="middle">받음</text><text class="s" x="450" y="624" text-anchor="start">계획 원문(글 · 사진 · 파일) · 채팅 문장</text><rect class="pill-out" x="404" y="641" width="38" height="18" rx="4"/><text class="pill" x="423" y="655" text-anchor="middle">냄</text><text class="s" x="450" y="654" text-anchor="start">일정 항목(값 · 근거 줄) · 새 버전</text><rect class="core" x="406" y="332" width="298" height="40" rx="8"/><text class="s2" x="555.0" y="357" text-anchor="middle">계획서 파싱 (규칙 우선 · AI는 위치만)</text><rect class="core" x="406" y="384" width="298" height="40" rx="8"/><text class="s2" x="555.0" y="409" text-anchor="middle">일정 생성 (AI는 순서만)</text><rect class="core" x="406" y="436" width="298" height="40" rx="8"/><text class="s2" x="555.0" y="461" text-anchor="middle">채팅 처리 (분류 → 대안 선택)</text><rect class="lane" x="750" y="286" width="330" height="404" rx="10"/><text class="h2" x="915.0" y="314" text-anchor="middle">오케스트레이션 레이어</text><rect class="pill-in" x="764" y="611" width="38" height="18" rx="4"/><text class="pill" x="783" y="625" text-anchor="middle">받음</text><text class="s" x="810" y="624" text-anchor="start">케이스</text><rect class="pill-out" x="764" y="641" width="38" height="18" rx="4"/><text class="pill" x="783" y="655" text-anchor="middle">냄</text><text class="s" x="810" y="654" text-anchor="start">새 일정 버전 · 아웃박스 메시지</text><rect class="core" x="766" y="332" width="298" height="40" rx="8"/><text class="s2" x="915.0" y="357" text-anchor="middle">오케스트레이터 · 상태 머신 12개</text><rect class="core" x="766" y="384" width="298" height="40" rx="8"/><text class="s2" x="915.0" y="409" text-anchor="middle">검증기 (Validator) · 반영기 (Apply)</text><rect class="agent" x="766" y="436" width="298" height="40" rx="8"/><text class="s2" x="915.0" y="461" text-anchor="middle">에이전트 3 — 요식 · 액티비티 · 이동</text><rect class="lane" x="1110" y="286" width="330" height="404" rx="10"/><text class="h2" x="1275.0" y="314" text-anchor="middle">툴 · 통합 레이어</text><rect class="pill-in" x="1124" y="611" width="38" height="18" rx="4"/><text class="pill" x="1143" y="625" text-anchor="middle">받음</text><text class="s" x="1170" y="624" text-anchor="start">툴 이름 · 인자</text><rect class="pill-out" x="1124" y="641" width="38" height="18" rx="4"/><text class="pill" x="1143" y="655" text-anchor="middle">냄</text><text class="s" x="1170" y="654" text-anchor="start">조회 값 또는 「모름」 (지어내지 않음)</text><rect class="node" x="1126" y="332" width="298" height="40" rx="8"/><text class="s2" x="1275.0" y="357" text-anchor="middle">툴 레이어 (허용 목록 · 12회)</text><rect class="node" x="1126" y="384" width="298" height="40" rx="8"/><text class="s2" x="1275.0" y="409" text-anchor="middle">외부 API 어댑터 (1차 ↔ 폴백)</text><rect class="node" x="1126" y="436" width="298" height="40" rx="8"/><text class="s2" x="1275.0" y="461" text-anchor="middle">시간표 판정 엔진</text><path class="edge" d="M360 440 L388 440" marker-end="url(#a)"/><path class="edge" d="M720 440 L748 440" marker-end="url(#a)"/><path class="edge" d="M1080 440 L1108 440" marker-end="url(#a)"/><path class="edge" d="M170 190 L170 205 L100 205 L100 238" marker-end="url(#a)"/><path class="edge" d="M460 190 L460 215 L190 215 L190 238" marker-end="url(#a)"/><path class="edge" d="M750 190 L750 225 L280 225 L280 238" marker-end="url(#a)"/><text class="lbl" x="330" y="209" text-anchor="middle">REST · MCP 요청</text><text class="lbl" x="520" y="219" text-anchor="middle">링크 열기</text><path class="edge" d="M1040 240 L1040 192" marker-end="url(#a)"/><text class="lbl" x="1052" y="222" text-anchor="start">오류 알림</text><rect class="band" x="40" y="750" width="1420" height="104" rx="12"/><text class="h" x="60" y="778" text-anchor="start">백그라운드 워커 — 별도 프로세스 (스케줄러가 1분마다 실행)</text><rect class="job" x="60" y="790" width="250" height="54" rx="10"/><text class="h" x="185.0" y="813.5" text-anchor="middle">모니터링 · 1분</text><text class="s" x="185.0" y="834.5" text-anchor="middle">90분 안 일정 항목 점검</text><rect class="job" x="330" y="790" width="250" height="54" rx="10"/><text class="h" x="455.0" y="813.5" text-anchor="middle">새벽 점검 · 03~08시</text><text class="s" x="455.0" y="834.5" text-anchor="middle">그날 영업시간 확인</text><rect class="job" x="600" y="790" width="250" height="54" rx="10"/><text class="h" x="725.0" y="813.5" text-anchor="middle">일정 알림</text><text class="s" x="725.0" y="834.5" text-anchor="middle">하루 시작 · 다음 일정 · 출발</text><rect class="job" x="870" y="790" width="250" height="54" rx="10"/><text class="h" x="995.0" y="813.5" text-anchor="middle">복구 스위퍼</text><text class="s" x="995.0" y="834.5" text-anchor="middle">멈춘 케이스 재처리</text><rect class="queue" x="1140" y="790" width="250" height="54" rx="10"/><text class="h" x="1265.0" y="813.5" text-anchor="middle">아웃박스 워커</text><text class="s" x="1265.0" y="834.5" text-anchor="middle">큐 → 디스코드 · 재시도 3회</text><path class="edge" d="M165 750 L165 712" marker-end="url(#a)"/><text class="lbl" x="177" y="736" text-anchor="start">케이스 생성 → 오케스트레이터</text><path class="edge async" d="M1390 817 L1474 817 L1474 155 L1462 155" marker-end="url(#g)"/><text class="lbl-g" x="1466" y="738" text-anchor="end">비동기 큐</text><rect class="db" x="40" y="890" width="700" height="96" rx="10"/><text class="h" x="390.0" y="926.0" text-anchor="middle">PostgreSQL 16 + pgvector</text><text class="s" x="390.0" y="947.0" text-anchor="middle">케이스 · 실행 기록(State) · 여행 · 일정 버전 · 아웃박스 큐</text><text class="s" x="390.0" y="964.0" text-anchor="middle">장소 · 요식 DB(식당 1,225곳) · 규정 문서 임베딩</text><rect class="model" x="770" y="890" width="330" height="96" rx="10"/><text class="h" x="935.0" y="926.0" text-anchor="middle">AI 모델 — 시험 중</text><text class="s" x="935.0" y="947.0" text-anchor="middle">로컬 · API 비교 중 (아직 안 정함)</text><text class="s" x="935.0" y="964.0" text-anchor="middle">임베딩 bge-m3</text><rect class="db" x="1145" y="890" width="315" height="96" rx="10"/><text class="h" x="1302.5" y="926.0" text-anchor="middle">시간표 데이터</text><text class="s" x="1302.5" y="947.0" text-anchor="middle">지하철 · 버스 46만 행</text><text class="s" x="1302.5" y="964.0" text-anchor="middle">시간표 판정 엔진이 읽음</text><path class="edge" d="M590 712 L590 888" marker-end="url(#a)" marker-start="url(#a)"/><text class="lbl" x="602" y="874" text-anchor="start">읽기 · 쓰기</text><path class="edge dim" d="M860 712 L860 888" marker-end="url(#a)" marker-start="url(#a)"/><text class="lbl" x="872" y="874" text-anchor="start">요청 · 응답 (계획서 파싱 · 분류 · 문장만)</text><rect class="ext" x="40" y="1020" width="1420" height="70" rx="10"/><text class="h" x="750.0" y="1051.5" text-anchor="middle">외부 API</text><text class="s" x="750.0" y="1072.5" text-anchor="middle">기상(Open-Meteo ↔ 기상청) · 기상 특보 · 지진 · 재난문자 · 교통(ITS ↔ UTIC) · 대기질 · 관광공사 · 카카오 · Google 장소(새벽만)</text><path class="edge" d="M1130 1020 L1130 712" marker-end="url(#a)"/><text class="lbl" x="1118" y="1008" text-anchor="end">조회 결과 (읽기만)</text><path class="edge" d="M1145 938 L1130 938"/><text class="lbl" x="1140" y="930" text-anchor="end">시간표</text></svg>