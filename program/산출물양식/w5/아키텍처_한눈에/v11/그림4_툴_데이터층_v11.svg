<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tp-layers-title tp-layers-desc">
<title id="tp-layers-title">에이전트 · 툴 · 데이터 층 — 에이전트는 허용된 툴로만 읽는다</title>
<desc id="tp-layers-desc">위에서부터 에이전트, 툴 레이어(허용 목록), 공용 이동 판정 툴, PostgreSQL, 외부 데이터 6범주와 이동 자료가 쌓여 있다. 에이전트는 DB 와 외부 API 를 직접 열지 않고 툴 레이어를 거쳐 조회하며, 툴은 근거와 판정을 돌려준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7488"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8720c"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5bd8"/></marker><marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8599"/></marker><style>.name{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;font-weight:600;fill:#161c28;text-anchor:middle}.focal-name{fill:#a8720c}.sub{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;font-weight:400;fill:#6b7488;text-anchor:middle}.io{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;font-weight:400;fill:#161c28}.io-k{font-family:'Geist Mono', ui-monospace, monospace;font-size:12px;font-weight:600;fill:#7a8599}.tag{font-family:'Geist Mono', ui-monospace, monospace;font-size:8px;font-weight:500;letter-spacing:0.08em;text-anchor:middle}.lab{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;font-weight:500;text-anchor:middle}.lab-mono{font-family:'Geist Mono', ui-monospace, monospace;font-size:8px;letter-spacing:0.14em;text-anchor:middle}.tech{font-family:'Geist Mono', ui-monospace, monospace;font-size:12px;fill:#161c28;text-anchor:middle}.zone{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;font-weight:600;fill:#6b7488}.leg{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;fill:#6b7488}.hub-name{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:16px;font-weight:600;fill:#fbfcfd;text-anchor:middle}.hub-sub{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;fill:rgba(251,252,253,0.78);text-anchor:middle}.layer-name{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:16px;font-weight:600;fill:#161c28}.layer-note{font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:12px;fill:#6b7488}.layer-tech{font-family:'Geist Mono', ui-monospace, monospace;font-size:12px;fill:#161c28}</style></defs>
<rect width="1000" height="640" fill="#fbfcfd"/>
<!-- 화살표 먼저 -->
<!-- 이름표 -->
<!-- 상자 -->
<line x1="56" y1="80" x2="56" y2="500" stroke="#6b7488" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="88" y1="504" x2="88" y2="84" stroke="#7a8599" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<text x="56" y="56" class="lab" fill="#6b7488">조회</text>
<text x="88" y="540" class="lab" fill="#7a8599">근거 · 판정</text>
<rect x="120" y="72" width="800" height="88" fill="#ffffff"/>
<text x="136" y="92" class="tag" text-anchor="start" style="text-anchor:start" fill="#7a8599">01 · AGENT</text>
<text x="136" y="120" class="layer-name">에이전트 — 요식 · 액티비티</text>
<text x="136" y="144" class="layer-note">DB · 외부 API 를 직접 열지 않는다 — 허용된 툴만 부른다</text>
<text x="568" y="111" class="layer-tech">dining · activity</text>
<text x="568" y="129" class="layer-note">에이전트끼리 직접 부르지 않는다</text>
<rect x="120" y="160" width="800" height="88" fill="rgba(168,114,12,0.10)"/>
<text x="136" y="180" class="tag" text-anchor="start" style="text-anchor:start" fill="#a8720c">02 · TOOLS</text>
<text x="136" y="208" class="layer-name" fill="#a8720c">툴 레이어 (허용 목록)</text>
<text x="136" y="232" class="layer-note">목록 밖 거부 · 같은 툴 · 같은 인자 재호출 거부 · 12회 넘으면 멈춤</text>
<text x="568" y="190" class="layer-tech">read.itinerary · read.disruptions</text>
<text x="568" y="208" class="layer-tech">read.dining_state · read.dining_alternatives</text>
<text x="568" y="226" class="layer-tech">read.place_catalog · read.policy</text>
<line x1="120" y1="160" x2="920" y2="160" stroke="rgba(22,28,40,0.12)" stroke-width="1"/>
<rect x="120" y="248" width="800" height="88" fill="#ffffff"/>
<text x="136" y="268" class="tag" text-anchor="start" style="text-anchor:start" fill="#7a8599">03 · SHARED</text>
<text x="136" y="296" class="layer-name">이동 판정 툴 (공용 · 에이전트 아님)</text>
<text x="136" y="320" class="layer-note">두 장소 · 목표 도착 → 경로 · 소요 · 성립 / 불가 / 모름</text>
<text x="568" y="287" class="layer-note">반영할 때 앞뒤 이동 재계산</text>
<text x="568" y="305" class="layer-note">후보 재점검 연결은 아직 · 코드엔 팀 등록</text>
<line x1="120" y1="248" x2="920" y2="248" stroke="rgba(22,28,40,0.12)" stroke-width="1"/>
<rect x="120" y="336" width="800" height="88" fill="#f1f4f8"/>
<text x="136" y="356" class="tag" text-anchor="start" style="text-anchor:start" fill="#7a8599">04 · DB</text>
<text x="136" y="384" class="layer-name">PostgreSQL + pgvector</text>
<text x="136" y="408" class="layer-note">여행 · 일정 버전(이전 판 보존) · Case · 실행 기록</text>
<text x="568" y="375" class="layer-note">장소 · 요식 원장 · 규정 조각 + 임베딩</text>
<text x="568" y="393" class="layer-note">bge-m3 (로컬 기본 · 설정으로 선택)</text>
<line x1="120" y1="336" x2="920" y2="336" stroke="rgba(22,28,40,0.12)" stroke-width="1"/>
<rect x="120" y="424" width="800" height="88" fill="#ffffff"/>
<text x="136" y="444" class="tag" text-anchor="start" style="text-anchor:start" fill="#7a8599">05 · EXTERNAL</text>
<text x="136" y="472" class="layer-name">외부 데이터 6범주 + 이동 자료</text>
<text x="136" y="496" class="layer-note">기상 · 특보 · 지진 · 재난문자 · 교통(ITS+UTIC) · 대기질</text>
<text x="568" y="463" class="layer-note">지하철 시간표 · 버스 노선 444,915행</text>
<text x="568" y="481" class="layer-note">대체 소스는 일부 범주만</text>
<line x1="120" y1="424" x2="920" y2="424" stroke="rgba(22,28,40,0.12)" stroke-width="1"/>
<rect x="120" y="160" width="800" height="88" fill="none" stroke="#a8720c" stroke-width="1.2"/>
<rect x="120" y="72" width="800" height="440" fill="none" stroke="#161c28" stroke-width="1"/>
<line x1="32" y1="584" x2="968" y2="584" stroke="rgba(22,28,40,0.12)" stroke-width="0.8"/>
<text x="32" y="604" class="lab-mono" fill="#6b7488" text-anchor="start">LEGEND</text>
<rect x="104" y="592" width="28" height="16" rx="3" fill="#ffffff" stroke="#161c28" stroke-width="1"/>
<text x="140" y="604" class="leg">층</text>
<rect x="180" y="592" width="28" height="16" rx="3" fill="rgba(168,114,12,0.10)" stroke="#a8720c" stroke-width="1"/>
<text x="216" y="604" class="leg">에이전트가 닿는 유일한 문</text>
<line x1="400" y1="600" x2="428" y2="600" stroke="#6b7488" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="436" y="604" class="leg">조회 방향</text>
<line x1="520" y1="600" x2="548" y2="600" stroke="#7a8599" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<text x="556" y="604" class="leg">돌려주는 근거</text>
</svg>