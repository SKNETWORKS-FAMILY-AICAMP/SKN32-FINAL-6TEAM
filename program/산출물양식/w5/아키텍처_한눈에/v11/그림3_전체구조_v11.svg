<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tp-arch-title tp-arch-desc">
<title id="tp-arch-title">guguroute 전체 구조 — 들어오는 세 길과 하나의 반영</title>
<desc id="tp-arch-desc">여행자가 모바일 웹앱으로 계획을 올리거나 채팅하면 API 서버가 받는다. 계획은 등록 판정을 거쳐 감시 대상이 되고, 낮 감시가 연 Case 는 오케스트레이터가 요식 또는 액티비티 에이전트에 맡긴다. 채팅과 새벽 점검은 에이전트를 거치지 않는다. 세 길 모두 같은 검증 · 반영을 거쳐 알림과 계획서 링크로 여행자에게 돌아가고, 감시는 다음 1분 주기에 다시 돈다.</desc>
