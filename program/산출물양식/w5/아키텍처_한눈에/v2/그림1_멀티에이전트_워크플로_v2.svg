<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" width="1720" height="1010" style="background:#ffffff;color:#161c28" viewBox="0 0 1720 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="멀티 에이전트 워크플로"><style>
:root{--paper:#fbfcfd;--paper-2:#f1f4f8;--card:#ffffff;--ink:#161c28;--muted:#606b7e;--soft:#727d90;--rule:#dbe0ea;
--gold:#a8720c;--gold-t:rgba(168,114,12,.09);--gold-r:rgba(168,114,12,.42);--blue:#2f6c9a;--blue-t:rgba(47,108,154,.07);--blue-r:rgba(47,108,154,.38);
--red:#a33b3b;--red-t:rgba(163,59,59,.06);--red-r:rgba(163,59,59,.4);--green:#3d7a4f;--green-t:rgba(61,122,79,.07);--green-r:rgba(61,122,79,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15181d;--paper-2:#20252d;--card:#1a1f26;--ink:#e9edf3;--muted:#b0bac9;--soft:#9aa6b9;--rule:#39424f;
--gold:#e4b45c;--gold-t:rgba(228,180,92,.1);--gold-r:rgba(228,180,92,.45);--blue:#7fb2dc;--blue-t:rgba(127,178,220,.08);--blue-r:rgba(127,178,220,.4);
--red:#e08a8a;--red-t:rgba(224,138,138,.08);--red-r:rgba(224,138,138,.45);--green:#8cc79c;--green-t:rgba(140,199,156,.08);--green-r:rgba(140,199,156,.45)}}


 


.diagram{border:1px solid var(--rule);border-radius:6px;background:var(--card);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:1100px;height:auto;color:var(--ink)}
.diagram text{fill:currentColor;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px}
.diagram .h{font-size:16.5px;font-weight:700} .diagram .
.diagram .s{fill:var(--muted);font-size:13px} .diagram .s2{font-size:13.5px}
.diagram .cap{fill:var(--soft);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:12.5px;letter-spacing:.06em}
.diagram .tag{fill:var(--gold);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:11px} .diagram .tag2{fill:var(--gold);font-size:13px;font-weight:700}
.diagram .lbl{fill:var(--muted);font-size:12.5px} .diagram .lbl-g{fill:var(--gold);font-size:13px;font-weight:700} .diagram .lbl-r{fill:var(--red);font-size:13px;font-weight:700}
.diagram .node{fill:var(--card);stroke:var(--rule)} .diagram .user{fill:var(--card);stroke:var(--soft)}
.diagram .core{fill:var(--gold-t);stroke:var(--gold-r)} .diagram .agent{fill:var(--blue-t);stroke:var(--blue-r)}
.diagram .fail{fill:var(--red-t);stroke:var(--red-r);stroke-dasharray:5 4} .diagram .dia{fill:var(--card);stroke:var(--soft)}
.diagram .state{fill:var(--green-t);stroke:var(--green-r)} .diagram .band{fill:var(--paper-2);stroke:var(--rule)} .diagram .lane{fill:var(--card);stroke:var(--rule)}
.diagram .job{fill:var(--card);stroke:var(--rule)} .diagram .queue{fill:var(--gold-t);stroke:var(--gold-r);stroke-dasharray:5 4}
.diagram .db{fill:var(--green-t);stroke:var(--green-r)} .diagram .model{fill:var(--card);stroke:var(--soft);stroke-dasharray:5 4} .diagram .ext{fill:var(--paper-2);stroke:var(--rule)}
.diagram .start{fill:var(--ink)} .diagram .end{fill:none;stroke:var(--ink);stroke-width:2} .diagram .end-in{fill:var(--ink)}
.diagram .edge{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round}
.diagram .edge.loop{stroke:var(--gold);stroke-width:1.8;stroke-dasharray:8 5} .diagram .edge.bad{stroke:var(--red);stroke-dasharray:5 4}
.diagram .edge.async{stroke:var(--gold);stroke-width:1.6;stroke-dasharray:6 5} .diagram .edge.dim{stroke-dasharray:4 4}
.diagram .role{fill:var(--gold);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:12px} .diagram .role-b{fill:var(--blue);font-family:'Nanum Gothic Coding','NanumGothicCoding','D2Coding',monospace;font-size:12px}
.diagram .pill{font-size:11.5px;font-weight:700;fill:#fff} .diagram .pill-in{fill:var(--blue)} .diagram .pill-out{fill:var(--gold)}
.diagram .ah{fill:var(--muted)} .diagram .ah-g{fill:var(--gold)} .diagram .ah-r{fill:var(--red)} .diagram .ah-b{fill:var(--blue)}

</style><rect x="0" y="0" width="1720" height="1010" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah-g" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah-r" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="b" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path class="ah-b" d="M0 0 L10 5 L0 10 Z"/></marker></defs><text class="cap" x="40" y="40" text-anchor="start">그림 1 · 멀티 에이전트 워크플로 — 오케스트레이터(Supervisor) 패턴 · 상태 그래프</text><text class="s" x="40" y="62" text-anchor="start">받음 = 이 단계가 받는 것 · 냄 = 다음 단계로 넘기는 것 · 마름모 = 조건 분기 · 금색 선 = 루프 · 붉은 선 = 실패 경로 · 금색 상자 = 오케스트레이터 · 파란 상자 = 에이전트</text><circle class="start" cx="54" cy="195" r="13"/><text class="lbl" x="54" y="227" text-anchor="middle">시작</text><rect class="node" x="86" y="110" width="286" height="170" rx="10"/><text class="h" x="102" y="137" text-anchor="start">트리거</text><text class="role" x="360" y="135" text-anchor="end">Scheduler · Event</text><rect class="pill-in" x="100" y="151" width="38" height="18" rx="4"/><text class="pill" x="119" y="165" text-anchor="middle">받음</text><text class="s2" x="148" y="164" text-anchor="start">현재 일정 버전</text><text class="s2" x="148" y="183" text-anchor="start">외부 데이터 6종 점검 결과</text><rect class="pill-out" x="100" y="194" width="38" height="18" rx="4"/><text class="pill" x="119" y="208" text-anchor="middle">냄</text><text class="s2" x="148" y="207" text-anchor="start">깨진 일정 항목 + 원인</text><text class="s2" x="148" y="226" text-anchor="start">모니터링 1분 · 새벽 점검 · 고객 신고</text><rect class="core" x="400" y="110" width="270" height="170" rx="10"/><text class="h" x="416" y="137" text-anchor="start">케이스 생성</text><text class="role" x="658" y="135" text-anchor="end">Case Intake</text><rect class="pill-in" x="414" y="151" width="38" height="18" rx="4"/><text class="pill" x="433" y="165" text-anchor="middle">받음</text><text class="s2" x="462" y="164" text-anchor="start">깨진 항목 · 원인</text><rect class="pill-out" x="414" y="175" width="38" height="18" rx="4"/><text class="pill" x="433" y="189" text-anchor="middle">냄</text><text class="s2" x="462" y="188" text-anchor="start">케이스 1건 (요청 종류 · 문제 코드)</text><text class="s2" x="462" y="207" text-anchor="start">이 경로는 AI 분류를 쓰지 않음</text><rect class="core" x="698" y="110" width="316" height="170" rx="10"/><text class="h" x="714" y="137" text-anchor="start">오케스트레이터 · 라우팅</text><text class="role" x="1002" y="135" text-anchor="end">Supervisor</text><rect class="pill-in" x="712" y="151" width="38" height="18" rx="4"/><text class="pill" x="731" y="165" text-anchor="middle">받음</text><text class="s2" x="760" y="164" text-anchor="start">케이스 (문제 코드 · 요청 종류)</text><rect class="pill-out" x="712" y="175" width="38" height="18" rx="4"/><text class="pill" x="731" y="189" text-anchor="middle">냄</text><text class="s2" x="760" y="188" text-anchor="start">태스크 — 담당 · 할 일 · 허용 툴 · 90초</text><text class="s2" x="760" y="207" text-anchor="start">컨텍스트 — 상태 · 원인 · 규정</text><text class="s2" x="760" y="226" text-anchor="start">(12,000 토큰 이내)</text><path class="edge" d="M67 195 L84 195" marker-end="url(#a)"/><path class="edge" d="M372 195 L398 195" marker-end="url(#a)"/><path class="edge" d="M670 195 L696 195" marker-end="url(#a)"/><rect class="agent" x="1080" y="80" width="330" height="92" rx="10"/><text class="h" x="1096" y="106" text-anchor="start">요식 에이전트</text><text class="role-b" x="1398" y="104" text-anchor="end">Worker Agent</text><text class="s2" x="1096" y="132" text-anchor="start">점검  영업시간 · 라스트오더 · 외부 6종</text><text class="s2" x="1096" y="154" text-anchor="start">대안  요식 DB 후보 → 재점검 (최대 3곳)</text><path class="edge" d="M1014 195 L1046 195 L1046 126.0 L1078 126.0" marker-end="url(#a)"/><rect class="agent" x="1080" y="182" width="330" height="92" rx="10"/><text class="h" x="1096" y="208" text-anchor="start">액티비티 에이전트</text><text class="role-b" x="1398" y="206" text-anchor="end">Worker Agent</text><text class="s2" x="1096" y="234" text-anchor="start">점검  운영일 · 날씨 · 대기질 · 특보</text><text class="s2" x="1096" y="256" text-anchor="start">대안  같은 대분류 · 유사순 → 재점검</text><path class="edge" d="M1014 195 L1046 195 L1046 228.0 L1078 228.0" marker-end="url(#a)"/><rect class="agent" x="1080" y="284" width="330" height="92" rx="10"/><text class="h" x="1096" y="310" text-anchor="start">이동 에이전트</text><text class="role-b" x="1398" y="308" text-anchor="end">Worker Agent</text><text class="s2" x="1096" y="336" text-anchor="start">점검  계획 경로 · 교통 사건</text><text class="s2" x="1096" y="358" text-anchor="start">대안  다른 경로 → 시간표 엔진 재탐색</text><path class="edge" d="M1014 195 L1046 195 L1046 330.0 L1078 330.0" marker-end="url(#a)"/><text class="lbl" x="1040" y="302" text-anchor="end">조건 분기 — 셋 중 하나</text><rect class="agent" x="1080" y="398" width="330" height="118" rx="10"/><text class="h" x="1096" y="425" text-anchor="start">에이전트 공통</text><text class="role" x="1398" y="423" text-anchor="end">Agent Contract</text><rect class="pill-in" x="1094" y="439" width="38" height="18" rx="4"/><text class="pill" x="1113" y="453" text-anchor="middle">받음</text><text class="s2" x="1142" y="452" text-anchor="start">태스크 + 컨텍스트 (데이터는 툴로만 조회)</text><rect class="pill-out" x="1094" y="463" width="38" height="18" rx="4"/><text class="pill" x="1113" y="477" text-anchor="middle">냄</text><text class="s2" x="1142" y="476" text-anchor="start">결과 — 다음 행동 · 답변 · 근거</text><text class="s2" x="1142" y="495" text-anchor="start">변경 제안 (직접 바꾸지 않음)</text><path class="edge loop" d="M1410 354 L1440 354 L1440 102 L1412 102" marker-end="url(#g)"/><text class="lbl-g" x="1452" y="150" text-anchor="start">안쪽 루프</text><text class="lbl" x="1452" y="170" text-anchor="start">재점검에 걸리면</text><text class="lbl" x="1452" y="190" text-anchor="start">다음 후보로</text><text class="lbl-g" x="1452" y="230" text-anchor="start">종료 조건</text><text class="lbl" x="1452" y="250" text-anchor="start">후보 3곳</text><text class="lbl" x="1452" y="270" text-anchor="start">툴 12회 · 90초</text><path class="edge" d="M1245.0 516 L1245.0 593" marker-end="url(#a)"/><rect class="core" x="1080" y="595" width="330" height="170" rx="10"/><text class="h" x="1096" y="622" text-anchor="start">검증</text><text class="role" x="1398" y="620" text-anchor="end">Validator</text><rect class="pill-in" x="1094" y="636" width="38" height="18" rx="4"/><text class="pill" x="1113" y="650" text-anchor="middle">받음</text><text class="s2" x="1142" y="649" text-anchor="start">에이전트 결과</text><rect class="pill-out" x="1094" y="660" width="38" height="18" rx="4"/><text class="pill" x="1113" y="674" text-anchor="middle">냄</text><text class="s2" x="1142" y="673" text-anchor="start">통과 / 거부</text><text class="s2" x="1142" y="692" text-anchor="start">근거가 있나 · 그 고객 것인가</text><text class="s2" x="1142" y="711" text-anchor="start">케이스 버전이 그대로인가</text><path class="dia" d="M960 635.0 L1035.0 680 L960 725.0 L885.0 680 Z"/><text class="h2" x="960" y="685" text-anchor="middle">통과?</text><path class="edge" d="M1080 680 L1037 680" marker-end="url(#a)"/><rect class="core" x="520" y="595" width="340" height="170" rx="10"/><text class="h" x="536" y="622" text-anchor="start">반영</text><text class="role" x="848" y="620" text-anchor="end">Apply · Commit</text><rect class="pill-in" x="534" y="636" width="38" height="18" rx="4"/><text class="pill" x="553" y="650" text-anchor="middle">받음</text><text class="s2" x="582" y="649" text-anchor="start">변경 제안 (기준 버전 · 바뀐 항목 · 대안)</text><rect class="pill-out" x="534" y="660" width="38" height="18" rx="4"/><text class="pill" x="553" y="674" text-anchor="middle">냄</text><text class="s2" x="582" y="673" text-anchor="start">새 일정 버전 (이전 버전 보존)</text><text class="s2" x="582" y="692" text-anchor="start">또는 사용자 확인 요청 — 설문 「먼저</text><text class="s2" x="582" y="711" text-anchor="start">물어봐」 · 고정 일정 · 안전 경보일 때</text><path class="edge" d="M885 680 L862 680" marker-end="url(#a)"/><text class="lbl" x="874" y="670" text-anchor="middle">예</text><rect class="core" x="206" y="595" width="290" height="170" rx="10"/><text class="h" x="222" y="622" text-anchor="start">알림</text><text class="role" x="484" y="620" text-anchor="end">Notifier · Outbox</text><rect class="pill-in" x="220" y="636" width="38" height="18" rx="4"/><text class="pill" x="239" y="650" text-anchor="middle">받음</text><text class="s2" x="268" y="649" text-anchor="start">새 일정 버전 · 알림 문구</text><rect class="pill-out" x="220" y="660" width="38" height="18" rx="4"/><text class="pill" x="239" y="674" text-anchor="middle">냄</text><text class="s2" x="268" y="673" text-anchor="start">디스코드 알림 1회 (재시도 3회)</text><text class="s2" x="268" y="692" text-anchor="start">여행계획서 링크 갱신</text><text class="s2" x="268" y="711" text-anchor="start">→ 사용자: 다른 안 · 되돌리기 가능</text><path class="edge" d="M520 680 L498 680" marker-end="url(#a)"/><path class="dia" d="M105 638.0 L175.0 680 L105 722.0 L35.0 680 Z"/><text class="h2" x="105" y="685" text-anchor="middle">여행 끝?</text><path class="edge" d="M206 680 L177 680" marker-end="url(#a)"/><circle class="end" cx="105" cy="790" r="14"/><circle class="end-in" cx="105" cy="790" r="8"/><path class="edge" d="M105 722 L105 774" marker-end="url(#a)"/><text class="lbl" x="117" y="752" text-anchor="start">예</text><text class="lbl" x="105" y="826" text-anchor="middle">끝</text><path class="edge loop" d="M105 638 L105 340 L150 340 L150 282" marker-end="url(#g)"/><text class="lbl-g" x="117" y="430" text-anchor="start">아니오 — 바깥 루프</text><text class="lbl" x="117" y="450" text-anchor="start">여행이 끝날 때까지</text><text class="lbl" x="117" y="468" text-anchor="start">다음 모니터링 · 새벽 · 신고</text><rect class="fail" x="820" y="775" width="300" height="104" rx="10"/><text class="h" x="836" y="802" text-anchor="start">변경 없음 · 실패</text><text class="role" x="1108" y="800" text-anchor="end">Fallback</text><rect class="pill-in" x="834" y="816" width="38" height="18" rx="4"/><text class="pill" x="853" y="830" text-anchor="middle">받음</text><text class="s2" x="882" y="829" text-anchor="start">거부 · 실패 사유</text><rect class="pill-out" x="834" y="840" width="38" height="18" rx="4"/><text class="pill" x="853" y="854" text-anchor="middle">냄</text><text class="s2" x="882" y="853" text-anchor="start">일정 유지 · 오류 로그</text><text class="s2" x="882" y="872" text-anchor="start">운영자에게 오류 알림만</text><path class="edge bad" d="M960 725 L960 773" marker-end="url(#r)"/><text class="lbl-r" x="972" y="756" text-anchor="start">아니오</text><path class="edge bad" d="M820 827 L140 827 L140 702" marker-end="url(#r)"/><rect class="state" x="40" y="920" width="1640" height="74" rx="8"/><text class="h2" x="60" y="946" text-anchor="start">공유 State — PostgreSQL</text><text class="s" x="60" y="970" text-anchor="start">케이스 — 상태 12개 · 버전 · 원인 · 담당 에이전트   |   여행 — 일정 버전(이력 보존)   |   아웃박스 큐 — 보낼 알림</text><text class="s" x="60" y="988" text-anchor="start">모든 단계가 이 State 를 읽고, 버전이 맞을 때만 쓴다 (낙관적 동시성) — 사이에 다른 쓰기가 있으면 그 결과는 버린다</text><text class="tag2" x="1660" y="946" text-anchor="end">이 경로의 AI 모델 호출 0 — 판정은 전부 코드</text></svg>