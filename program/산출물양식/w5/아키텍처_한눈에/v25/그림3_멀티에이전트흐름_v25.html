<title id="tp-mas-title">guguroute 멀티 에이전트 흐름 — 케이스 하나가 지나가는 길</title>
<desc id="tp-mas-desc">일정 위험 모니터링(외부 정보 6종 · 3분 주기)이 연 케이스를 오케스트레이터(코드)가 문제 코드로 라우팅해 요식업 또는 액티비티 에이전트 하나에 태스크(할 일 · 컨텍스트 · 허용 도구 · 90초)를 맡긴다. 에이전트는 읽기 도구로 일정을 다시 점검하고 후보를 한 곳씩 다시 확인해 일정마다 변경 초안 최대 3개를 돌려준다. 바뀐 장소의 앞뒤 이동은 공용 도구인 이동 판정기가 다시 판정한다. 오케스트레이터는 기능 검증(근거 대조 · 반영 전 확인)과 체크리스트 검증을 거쳐 새 일정 버전으로 반영하고 아웃박스 워커가 알린다. 고객 문장은 분류 모델(언어 모델)이 먼저 라벨을 붙인다.</desc>
