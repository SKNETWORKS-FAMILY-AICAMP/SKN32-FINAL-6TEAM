<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 1328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tp-uc1-title tp-uc1-desc">
<title id="tp-uc1-title">UC-1 여행 계획을 확인받는다 — 에이전트 흐름</title>
<desc id="tp-uc1-desc">고객이 계획을 올리면 코드가 먼저 읽고 남은 원문만 LLM 이 돕는다. 고객은 확인 화면에서 항목을 수정(새 판 저장 · 재검사)하거나 등록을 요청한다. 등록 요청이면 코드가 체크리스트로 판정하고, 안 되면 이유와 고칠 방법을 확인 화면에 보여 준다. 되면 첫 판을 저장하고 계획서 링크를 알린다. 개인 AI 는 읽은 일정을 바로 등록 판정에 내고, 실패하면 오류를 개인 AI 가 받는다.</desc>
