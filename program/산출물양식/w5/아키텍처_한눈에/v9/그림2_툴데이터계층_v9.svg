</style><text class="ft" x="40" y="34" text-anchor="start">그림 2 · Agent 와 Tool / Data 계층</text><text class="s" x="40" y="56" text-anchor="start">에이전트는 DB · 외부 API 를 직접 열지 않고 허용된 툴로만 읽는다 · 판정은 코드</text><rect class="b-agent" x="250" y="80" width="260" height="60"/><text class="h3" x="380" y="116" text-anchor="middle">요식 에이전트</text><rect class="b-agent" x="640" y="80" width="260" height="60"/><text class="h3" x="770" y="116" text-anchor="middle">액티비티 에이전트</text><path class="e" d="M380 140 L380 160 L770 160 L770 140"/><path class="e" d="M575 160 L575 186" marker-end="url(#a)"/><text class="lbl" x="587" y="178" text-anchor="start">툴 호출 (허용된 것만 · 한 실행 최대 12회)</text><rect class="b-tool" x="150" y="188" width="850" height="214"/><text class="h2" x="575" y="216" text-anchor="middle">툴 레이어 (ReadToolbox) — 같은 서버 안 호출 · MCP 아님</text><text class="mono" x="175" y="250" text-anchor="start">read.itinerary</text><text class="s" x="365" y="250" text-anchor="start">지금 일정 버전 (고객 소유 확인)</text><text class="mono" x="595" y="250" text-anchor="start">read.disruptions</text><text class="s" x="785" y="250" text-anchor="start">외부 6범주 점검</text><text class="mono" x="175" y="280" text-anchor="start">read.dining_state</text><text class="s" x="365" y="280" text-anchor="start">그 시각 영업 · 라스트오더</text><text class="mono" x="595" y="280" text-anchor="start">read.dining_alternatives</text><text class="s" x="785" y="280" text-anchor="start">대체 식당 후보</text><text class="mono" x="175" y="310" text-anchor="start">read.place_catalog</text><text class="s" x="365" y="310" text-anchor="start">대체 장소 후보</text><text class="mono" x="595" y="310" text-anchor="start">read.policy</text><text class="s" x="785" y="310" text-anchor="start">규정 조각</text><text class="s" x="175" y="348" text-anchor="start">주요 툴 예시 — 전체 허용 목록은 에이전트 등록 정보(manifest)에 있다 (이전 버전 · 고객 문장 · 예약 툴 포함)</text><text class="s" x="175" y="370" text-anchor="start">목록 밖 툴 거부 · 같은 툴 + 같은 인자 다시 부르면 거부 · 12회 넘으면 멈춤</text><text class="s" x="175" y="390" text-anchor="start">조회가 안 되거나 값이 비면 「모름」, 정상 조회의 빈 결과는 「없음」으로 구분</text><path class="e" d="M575 402 L575 424"/><path class="e" d="M225 424 L925 424"/><path class="e" d="M225 424 L225 448" marker-end="url(#a)"/><path class="e" d="M575 424 L575 448" marker-end="url(#a)"/><path class="e" d="M925 424 L925 448" marker-end="url(#a)"/><rect class="b-api" x="80" y="450" width="290" height="170"/><text class="h3" x="225" y="476" text-anchor="middle">PostgreSQL + pgvector</text><text class="s" x="96" y="504" text-anchor="start">여행 · 일정 버전(이전 판 보존)</text><text class="s" x="96" y="526" text-anchor="start">Case · 실행 기록</text><text class="s" x="96" y="548" text-anchor="start">장소 · 요식 원장</text><text class="s" x="96" y="570" text-anchor="start">규정 조각 + 임베딩</text><text class="s" x="96" y="592" text-anchor="start">(로컬 기본 bge-m3 — 설정으로 선택)</text><rect class="b" x="430" y="450" width="290" height="170"/><text class="h3" x="575" y="476" text-anchor="middle">외부 데이터 6범주</text><text class="s" x="446" y="504" text-anchor="start">기상(Open-Meteo ↔ 기상청)</text><text class="s" x="446" y="526" text-anchor="start">기상 특보 · 지진 (기상청)</text><text class="s" x="446" y="548" text-anchor="start">재난문자 · 대기질</text><text class="s" x="446" y="570" text-anchor="start">교통: ITS + UTIC 합침</text><text class="s" x="446" y="592" text-anchor="start">대체 소스는 일부 범주만</text><rect class="b-tool" x="780" y="450" width="290" height="170"/><text class="h3" x="925" y="476" text-anchor="middle">이동 자료 + 이동 판정 툴</text><text class="s" x="796" y="504" text-anchor="start">지하철 열차 시간표</text><text class="s" x="796" y="526" text-anchor="start">버스 노선 · 배차 · 구간</text><text class="s" x="796" y="548" text-anchor="start">사용 파일 444,915행</text><text class="s" x="796" y="570" text-anchor="start">반영 때 앞뒤 이동 재계산</text><text class="s" x="796" y="592" text-anchor="start">일정 생성 때 이동 배치</text><text class="lbl" x="925" y="646" text-anchor="middle">공용 툴 · 에이전트 아님 (코드에는 아직 팀 등록)</text><path class="e" d="M225 620 L225 672"/><path class="e" d="M575 620 L575 672"/><path class="e" d="M925 620 L925 672"/><path class="e" d="M225 672 L925 672"/><path class="e" d="M575 672 L575 698" marker-end="url(#a)"/><rect class="b-core" x="375" y="700" width="400" height="44"/><text class="h3" x="575" y="728" text-anchor="middle">근거(무엇을 · 언제 확인) + 판정 → 에이전트</text></svg>