<svg style="background:#fff" class="fig" viewBox="0 0 1150 762" xmlns="http://www.w3.org/2000/svg" width="1150" height="762"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#1f2328" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#1f2328" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#6e7681" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="t" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#1f2328" d="M0 0 L10 5 L0 10 Z"/></marker></defs><style>
