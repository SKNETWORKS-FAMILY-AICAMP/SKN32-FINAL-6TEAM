<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#fff" class="fig" viewBox="0 0 1290 2372" xmlns="http://www.w3.org/2000/svg" width="1290" height="2372"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#1f2328" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#1f2328" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#6e7681" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="t" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path fill="#1f2328" d="M0 0 L10 5 L0 10 Z"/></marker></defs><style>
.fig text{font-family:'D2Coding','NanumGothicCoding','Nanum Gothic Coding','Cascadia Mono','Consolas','Malgun Gothic',monospace;fill:#1f2328}
.fig .h2{font-size:16px;font-weight:700} .fig .h3{font-size:14px;font-weight:700} .fig .sub{font-size:13px;fill:#57606a}
.fig .v{font-size:13.5px} .fig .s{font-size:12.8px;fill:#24292f} .fig .k-I,.fig .k-O{font-size:13.5px;font-weight:700;fill:#1f2328}
.fig .lbl{font-size:12.5px;fill:#57606a} .fig .lg{font-size:13px;font-weight:700;fill:#1f2328} .fig .lr{font-size:12.5px;fill:#6e7681}
.fig .ft{font-size:15px;font-weight:700;fill:#1f2328} .fig .mono{font-size:13px;font-weight:700}
.fig .tg-done,.fig .tg-wip,.fig .tg-plan,.fig .tg-look{font-size:11.5px;fill:#6e7681}
.fig rect{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.fig .frame-a,.fig .frame-w{fill:#fff;stroke:#1f2328;stroke-width:1.2} .fig .frame-w{stroke-dasharray:none}
.fig .b-fail,.fig .b-plan{stroke-dasharray:5 4;stroke:#57606a}
.fig .e{fill:none;stroke:#1f2328;stroke-width:1.2} .fig .loop{fill:none;stroke:#1f2328;stroke-width:2.6}
.fig .bus{fill:none;stroke:#1f2328;stroke-width:1.2;stroke-dasharray:6 4} .fig .bad{fill:none;stroke:#6e7681;stroke-width:1.2;stroke-dasharray:5 4}
.fig .tl{fill:none;stroke:#1f2328;stroke-width:1.2;stroke-dasharray:6 4}
</style><text class="ft" x="40" y="34" text-anchor="start">그림 1 · Multi-Agent 전체 구조도</text><text class="s" x="40" y="56" text-anchor="start">I = 받는 것 · O = 내보내는 것 · 굵은 선 = 되돌아가는 루프 · 점선 = 결과 합류 · 회색 점선 = 실패 · (구현) (진행 중) (예정) = 코드 상태</text><rect class="b-user" x="150" y="80" width="700" height="98"/><text class="h2" x="500.0" y="106" text-anchor="middle">여행자 / 모바일 웹앱 (자체 채팅)</text><text class="k-I" x="168" y="132" text-anchor="start">I:</text><text class="v" x="192" y="132" text-anchor="start">여행 계획(글 · 사진 · 파일), 채팅 질문 · 신고, 다른 안 선택 · 되돌리기</text><text class="k-O" x="168" y="152" text-anchor="start">O:</text><text class="v" x="192" y="152" text-anchor="start">판정을 통과한 일정, 바뀐 일정 + 이유 · 다른 안, Discord 알림 · 계획서 링크</text><path class="e" d="M500 178 L500 210" marker-end="url(#a)"/><rect class="b-api" x="150" y="212" width="700" height="118"/><text class="h2" x="500.0" y="238" text-anchor="middle">FastAPI 서버 (REST API)</text><text class="sub" x="500.0" y="258" text-anchor="middle">같은 서버 안에서 아래 처리 코드를 부른다</text><text class="k-I" x="168" y="284" text-anchor="start">I:</text><text class="v" x="192" y="284" text-anchor="start">HTTP 요청 + 브라우저 키 (로그인은 예정)</text><text class="k-O" x="168" y="304" text-anchor="start">O:</text><text class="v" x="192" y="304" text-anchor="start">고객 확인, 여행 ID, JSON 응답, 진행 · 변경 신호(SSE)</text><path class="e" d="M500 330 L500 362" marker-end="url(#a)"/><rect class="frame-a" x="140" y="364" width="1060" height="336"/><text class="h2" x="158" y="392" text-anchor="start">1. 계획 읽기 · 확인 · 등록</text><text class="sub" x="450" y="392" text-anchor="start">계획을 올릴 때 — 고객이 고치면 다시 확인</text><rect class="b" x="160" y="410" width="210" height="92"/><text class="h3" x="265" y="440" text-anchor="middle">계획 읽기</text><text class="s" x="265" y="462" text-anchor="middle">규칙이 먼저 · 남은 줄은 LLM</text><text class="s" x="265" y="480" text-anchor="middle">사진은 받아쓰기</text><text class="tg-done" x="310" y="426" text-anchor="start">(구현)</text><rect class="b" x="400" y="410" width="180" height="92"/><text class="h3" x="490" y="440" text-anchor="middle">장소 확인</text><text class="s" x="490" y="462" text-anchor="middle">우리 표 → 별칭 →</text><text class="s" x="490" y="480" text-anchor="middle">카카오 · 관광공사</text><text class="tg-done" x="520" y="426" text-anchor="start">(구현)</text><rect class="b-agent" x="610" y="410" width="330" height="92"/><text class="h3" x="775" y="436" text-anchor="middle">등록 판정 (코드)</text><text class="s" x="775" y="458" text-anchor="middle">시각 순서 · 겹침 · 이동 시간 · 결제 · 예산</text><text class="s" x="775" y="476" text-anchor="middle">휴무 · 영업 · 브레이크 · 마감 (값이 있을 때만)</text><text class="s" x="775" y="494" text-anchor="middle">외부 날씨는 여기서 안 봄 — 감시가 본다</text><text class="tg-done" x="880" y="426" text-anchor="start">(구현)</text><path class="e" d="M370 456 L398 456" marker-end="url(#a)"/><path class="e" d="M580 456 L608 456" marker-end="url(#a)"/><rect class="b" x="970" y="410" width="230" height="92"/><text class="h3" x="1085" y="440" text-anchor="middle">일정 짜 줘 → 생성</text><text class="s" x="1085" y="462" text-anchor="middle">후보는 우리 DB · AI는 순서 제안</text><text class="s" x="1085" y="480" text-anchor="middle">코드로 배치 · 검사 · 수정</text><text class="tg-done" x="1140" y="426" text-anchor="start">(구현)</text><path class="e" d="M970 456 L942 456" marker-end="url(#a)"/><rect class="dia" x="680.0" y="528.0" width="190" height="64"/><text class="h3" x="775" y="565" text-anchor="middle">위반 없음 ?</text><path class="e" d="M775 502 L775 527" marker-end="url(#a)"/><rect class="b-core" x="970" y="530" width="230" height="60"/><text class="h3" x="1085" y="554" text-anchor="middle">등록 + 계획서 링크</text><text class="s" x="1085" y="574" text-anchor="middle">로그인 없이 열림</text><path class="e" d="M870 560 L968 560" marker-end="url(#a)"/><text class="lbl" x="915" y="552" text-anchor="middle">예</text><rect class="b-fail" x="310" y="528" width="300" height="64"/><text class="h3" x="460" y="552" text-anchor="middle">이유 + 고칠 방법 표시</text><text class="s" x="460" y="574" text-anchor="middle">필수값 부족 · 수행 불가면 거절</text><text class="tg-done" x="550" y="544" text-anchor="start">(구현)</text><path class="bad" d="M680 560 L612 560" marker-end="url(#r)"/><text class="lr" x="646" y="552" text-anchor="middle">아니오</text><path class="loop" d="M460 528 L460 515 L740 515 L740 504" marker-end="url(#g)"/><text class="lg" x="310" y="614" text-anchor="start">↑ 고객이 고쳐서 다시 확인 (되돌림 루프)</text><text class="s" x="170" y="670" text-anchor="start">진행 상황 실시간 표시(SSE): 서버는 구현 · 웹 화면 연결은 진행 중</text><text class="tg-wip" x="760" y="670" text-anchor="start">(진행 중)</text><text class="s" x="170" y="690" text-anchor="start">실패 항목을 채팅으로 대안 추천: 아직 없음 (멘토 요청)</text><text class="tg-plan" x="760" y="690" text-anchor="start">(예정)</text><path class="e" d="M1085 590 L1085 726 L420 726 L420 764" marker-end="url(#a)"/><text class="lbl" x="430" y="750" text-anchor="start">등록된 여행을 감시 작업이 1분마다 조회</text><rect class="b" x="140" y="766" width="1060" height="122"/><text class="h2" x="158" y="792" text-anchor="start">트리거 — 다음 점검 대기</text><text class="lg" x="376" y="792" text-anchor="start">← 바깥 루프가 여기로 돌아온다</text><rect class="b-agent" x="160" y="806" width="560" height="70"/><text class="h3" x="172" y="828" text-anchor="start">낮 감시 · 1분마다</text><text class="s" x="172" y="848" text-anchor="start">I: 앞으로 90분 안 항목 + 외부 6범주 점검 결과</text><text class="s" x="172" y="866" text-anchor="start">O: 문제 항목 + 원인 → Case 1건</text><text class="tg-done" x="662" y="822" text-anchor="start">(구현)</text><rect class="b" x="900" y="806" width="145" height="70"/><text class="h3" x="972" y="828" text-anchor="middle">새벽 영업 확인</text><text class="s" x="972" y="848" text-anchor="middle">03~08시 · Google</text><text class="s" x="972" y="866" text-anchor="middle">그날 식사 · 활동</text><rect class="b" x="1055" y="806" width="145" height="70"/><text class="h3" x="1127" y="828" text-anchor="middle">고객 채팅 · 신고</text><text class="s" x="1127" y="848" text-anchor="middle">바꿔 줘 · 늦어요</text><text class="s" x="1127" y="866" text-anchor="middle">다른 안 · 되돌리기</text><path class="e" d="M420 876 L420 920" marker-end="url(#a)"/><path class="e" d="M972 876 L972 920" marker-end="url(#a)"/><path class="e" d="M1127 876 L1127 920" marker-end="url(#a)"/><rect class="b-plan" x="894" y="922" width="312" height="232"/><text class="h3" x="1050.0" y="946" text-anchor="middle">에이전트를 거치지 않는 경로</text><text class="s" x="1050.0" y="964" text-anchor="middle">같은 계산 코드 · 같은 반영을 쓴다</text><rect class="b" x="908" y="976" width="284" height="76"/><text class="h3" x="920" y="998" text-anchor="start">새벽 점검 — 직접 계산</text><text class="s" x="920" y="1018" text-anchor="start">닫힌 곳 → 같은 시각 근처 대체</text><text class="s" x="920" y="1036" text-anchor="start">→ 묻기 또는 반영</text><rect class="b" x="908" y="1062" width="284" height="82"/><text class="h3" x="920" y="1084" text-anchor="start">채팅 처리 (TripDesk)</text><text class="s" x="920" y="1104" text-anchor="start">해석 → 변경 · 제안 · 되돌리기</text><text class="s" x="920" y="1122" text-anchor="start">질문은 근거로 답만 (일정 그대로)</text><rect class="b-core" x="150" y="922" width="540" height="138"/><text class="h2" x="420.0" y="948" text-anchor="middle">오케스트레이터 (Supervisor)</text><text class="sub" x="420.0" y="968" text-anchor="middle">규칙 라우팅: 문제 코드 앞부분 + 서버가 확인한 대상</text><text class="k-I" x="168" y="994" text-anchor="start">I:</text><text class="v" x="192" y="994" text-anchor="start">Case (문제 코드 · 원인)</text><text class="k-O" x="168" y="1014" text-anchor="start">O:</text><text class="v" x="192" y="1014" text-anchor="start">담당 에이전트 1개 (요식 또는 액티비티)</text><text class="v" x="192" y="1034" text-anchor="start">할 일 + 허용 툴 + 컨텍스트 · Team 시간 제한 90초</text><path class="e" d="M420 1060 L420 1092" marker-end="url(#a)"/><rect class="frame-w" x="140" y="1094" width="720" height="640"/><text class="h2" x="158" y="1122" text-anchor="start">Worker Agent — 둘 중 하나가 받는다</text><text class="sub" x="490" y="1122" text-anchor="start">에이전트끼리 직접 안 부름 · 툴로만 조회(12회)</text><rect class="b-agent" x="160" y="1138" width="330" height="84"/><text class="h3" x="325" y="1162" text-anchor="middle">요식 에이전트</text><text class="s" x="172" y="1186" text-anchor="start">I: 식사 항목 · 원인 · 식이 조건</text><text class="s" x="172" y="1206" text-anchor="start">O: 대체 식당 1 + 다른 안 최대 2 / 그대로 / 못 함</text><rect class="b-agent" x="510" y="1138" width="330" height="84"/><text class="h3" x="675" y="1162" text-anchor="middle">액티비티 에이전트</text><text class="s" x="522" y="1186" text-anchor="start">I: 활동 항목 · 원인 · 실내 여부 · 설문</text><text class="s" x="522" y="1206" text-anchor="start">O: 대체 활동 + 다른 안 / 바꿀까요? / 못 함</text><path class="e" d="M325 1222 L325 1238 L675 1238 L675 1222"/><path class="e" d="M500 1238 L500 1256" marker-end="url(#a)"/><rect class="b" x="330" y="1258" width="340" height="46"/><text class="h3" x="500" y="1286" text-anchor="middle">현재 항목 재점검 (같은 외부 점검)</text><rect class="dia" x="415.0" y="1324.0" width="170" height="60"/><text class="h3" x="500" y="1359" text-anchor="middle">지금 상태 ?</text><path class="e" d="M500 1304 L500 1323" marker-end="url(#a)"/><rect class="b-out" x="160" y="1302" width="150" height="44"/><text class="h3" x="235" y="1329" text-anchor="middle">그대로</text><rect class="b-fail" x="160" y="1362" width="150" height="44"/><text class="h3" x="235" y="1389" text-anchor="middle">확인 실패 · 기록</text><path class="e" d="M415 1354 L380 1354 L380 1324 L312 1324" marker-end="url(#a)"/><text class="lbl" x="394" y="1316" text-anchor="start">clear</text><path class="bad" d="M380 1354 L380 1384 L312 1384" marker-end="url(#r)"/><text class="lr" x="394" y="1402" text-anchor="start">fatal</text><rect class="b-agent" x="300" y="1414" width="400" height="82"/><text class="h3" x="500" y="1438" text-anchor="middle">다음 후보 1곳 점검</text><text class="s" x="500" y="1460" text-anchor="middle">영업 · 거리 · 조건 + 같은 외부 재점검</text><text class="s" x="500" y="1480" text-anchor="middle">요식: 순위순 최대 3곳 재점검 · 통과하면 담아 둠</text><path class="e" d="M500 1384 L500 1412" marker-end="url(#a)"/><text class="lbl" x="510" y="1404" text-anchor="start">disrupted</text><rect class="dia" x="415.0" y="1514.0" width="170" height="60"/><text class="h3" x="500" y="1549" text-anchor="middle">더 볼 후보 ?</text><path class="e" d="M500 1496 L500 1513" marker-end="url(#a)"/><path class="loop" d="M585 1544 L780 1544 L780 1455 L702 1455" marker-end="url(#g)"/><text class="lg" x="650" y="1534" text-anchor="start">예</text><text class="lg" x="788" y="1510" text-anchor="start">안쪽 루프</text><text class="lbl" x="788" y="1528" text-anchor="start">다음 후보로</text><rect class="dia" x="405.0" y="1614.0" width="190" height="60"/><text class="h3" x="500" y="1649" text-anchor="middle">통과한 곳 있나 ?</text><path class="e" d="M500 1574 L500 1613" marker-end="url(#a)"/><text class="lbl" x="510" y="1596" text-anchor="start">아니오 (다 봤음)</text><rect class="b-fail" x="160" y="1622" width="150" height="44"/><text class="h3" x="235" y="1649" text-anchor="middle">못 함 · 일정 유지</text><path class="bad" d="M405 1644 L312 1644" marker-end="url(#r)"/><text class="lr" x="370" y="1636" text-anchor="middle">아니오</text><path class="e" d="M500 1674 L500 1732" marker-end="url(#a)"/><text class="lbl" x="510" y="1696" text-anchor="start">예 — 변경 제안 (최선 1 + 다른 안 최대 2)</text><path class="e" d="M500 1734 L500 1766" marker-end="url(#a)"/><rect class="b-core" x="140" y="1768" width="720" height="252"/><text class="h2" x="158" y="1796" text-anchor="start">검증 + 반영 (오케스트레이터)</text><rect class="b" x="160" y="1814" width="260" height="76"/><text class="h3" x="290" y="1838" text-anchor="middle">검증</text><text class="s" x="290" y="1860" text-anchor="middle">고객 소유 · Case 버전</text><text class="s" x="290" y="1878" text-anchor="middle">여행 기준 버전 · 항목 · 장소</text><rect class="dia" x="470.0" y="1822.0" width="150" height="60"/><text class="h3" x="545" y="1857" text-anchor="middle">묻기 조건 ?</text><path class="e" d="M420 1852 L468 1852" marker-end="url(#a)"/><rect class="b-out" x="662" y="1808" width="180" height="88"/><text class="h3" x="752" y="1832" text-anchor="middle">새 일정 버전</text><text class="s" x="752" y="1854" text-anchor="middle">