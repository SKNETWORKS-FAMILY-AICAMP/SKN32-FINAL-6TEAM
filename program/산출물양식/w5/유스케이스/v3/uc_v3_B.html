<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>guguroute 유스케이스 한 장 v3</title><style>
:root{--paper:#fbfcfd;--paper-2:#f1f4f8;--card:#ffffff;--ink:#161c28;--muted:#606b7e;--soft:#727d90;--rule-solid:#dbe0ea;
--accent:#a8720c;--accent-tint:rgba(168,114,12,.08);--accent-rule:rgba(168,114,12,.38);--blue-rule:rgba(47,108,154,.30);--blue-tint:rgba(47,108,154,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15181d;--paper-2:#20252d;--card:#1a1f26;--ink:#e9edf3;--muted:#b0bac9;--soft:#9aa6b9;
--rule-solid:#39424f;--accent:#e4b45c;--accent-tint:rgba(228,180,92,.09);--accent-rule:rgba(228,180,92,.42)}}
body{margin:0;background:var(--paper);color:var(--ink)}
.wrap{max-width:1528px;margin:0 auto;padding:16px}
.diagram{border:1px solid var(--rule-solid);border-radius:6px;background:var(--card);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:1100px;height:auto;color:var(--ink)}
.diagram .sys-frame{fill:none;stroke:var(--rule-solid);stroke-width:1.2}
.diagram .group-frame{fill:var(--paper-2);stroke:var(--rule-solid)}
.diagram .group-frame.gold{fill:var(--accent-tint);stroke:var(--accent-rule)}
.diagram .group-frame.blue{fill:var(--blue-tint);stroke:var(--blue-rule)}
.diagram .node{fill:var(--card);stroke:var(--rule-solid)}
.diagram .core-node{fill:#fbf6ec;stroke:var(--accent-rule)}
.diagram .ext-node{fill:var(--card);stroke:var(--accent-rule);stroke-dasharray:5 4}
.diagram .proxy-node{fill:var(--paper);stroke:var(--soft);stroke-dasharray:3 3}
.diagram .edge{fill:none;stroke:var(--muted);stroke-width:1.15;stroke-linejoin:round}
.diagram .edge.inc{stroke-dasharray:5 4}
.diagram .edge.ext{stroke:var(--accent);stroke-dasharray:5 4;opacity:.85}
.diagram .arrow{fill:var(--muted)} .diagram .arrow-gold{fill:var(--accent)} .diagram .tri{fill:var(--card);stroke:var(--muted);stroke-width:1.2}
.diagram .icon{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram text{fill:currentColor;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px}
.diagram .title{font-size:22px;font-weight:700}
.diagram .svg-label{fill:var(--soft);font-family:'NanumGothicCoding','Consolas',monospace;font-size:12px;letter-spacing:.08em}
.diagram .svg-note{fill:var(--muted);font-size:12px}
.diagram .svg-letter{fill:var(--accent);font-family:'NanumGothicCoding','Consolas',monospace;font-size:12px}

rect class="node" x="330" y="390" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="414">UC-08</text><text x="392" y="414">문제 알리기</text><text class="svg-note" x="346" y="434">늦음 · 휴무</text><rect class="node" x="330" y="464" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="488">UC-09</text><text x="392" y="488">다른 안 고르기 · 되돌리기</text><text class="svg-note" x="346" y="508">「선택이 필요해요」 · 앞 판</text><rect class="node" x="630" y="168" width="250" height="56" rx="6"/><text x="646" y="192">근거 찾기</text><text class="svg-note" x="646" y="212">여행 규정 · 예약 취소 조건</text><rect class="core-node" x="630" y="242" width="250" height="56" rx="6"/><text x="646" y="266">요청 읽기</text><text class="svg-note" x="646" y="286">요청 종류 · 대상 항목 · 문제 코드</text><rect class="node" x="630" y="464" width="250" height="56" rx="6"/><text x="646" y="488">새 판 저장</text><text class="svg-note" x="646" y="508">기준 판이 그대로일 때만</text><rect class="node" x="40" y="248" width="210" height="80" rx="6"/><g class="icon"><circle cx="65" cy="267" r="5"/><path d="M65 272 V286 M55 278 H75 M65 286 L58 296 M65 286 L72 296"/></g><g class="icon"><rect x="84" y="269" width="22" height="19" rx="4"/><path d="M95 262 V269 M90 277 H92 M98 277 H100 M90 283 H100"/></g><text x="120" y="274">여행자 · AI 앱</text><text class="svg-note" x="120" y="294">요청하는 쪽</text><text class="svg-note" x="120" y="312">A의 두 행위자 · 웹 · API</text><rect class="node" x="1262" y="168" width="236" height="130" rx="6"/><g class="icon"><path d="M1287 182 V208 M1274 195 H1300 M1278 186 L1296 204 M1296 186 L1278 204"/></g><text x="1312" y="194">AI 모델</text><text class="svg-note" x="1312" y="214">같은 행위자 · 시험 중</text><path class="edge" d="M250 288.0 L282 288.0 L282 196 L330 196"/><path class="edge" d="M250 270 L330 270"/><path class="edge" d="M250 288.0 L282 288.0 L282 418 L330 418"/><path class="edge" d="M250 288.0 L282 288.0 L282 492 L330 492"/><path class="edge inc" d="M580 196 L630 196" marker-end="url(#vee)"/><path class="edge inc" d="M580 212 L600 212 L600 256 L630 256" marker-end="url(#vee)"/><path class="edge inc" d="M580 270 L630 270" marker-end="url(#vee)"/><path class="edge inc" d="M580 418 L612 418 L612 286 L630 286" marker-end="url(#vee)"/><path class="edge inc" d="M455 298 L455 316" marker-end="url(#vee)"/><path class="edge inc" d="M455 390 L455 372" marker-end="url(#vee)"/><path class="edge inc" d="M580 492 L630 492" marker-end="url(#vee)"/><path class="edge" d="M880 196 L1262 196"/><path class="edge" d="M880 270 L1262 270"/><text class="svg-note" x="40" y="584">AI 모델 · 장소 정보 · 알림 채널은 같은 행위자를 구역마다 옆에 다시 그렸다. 고객 건을 사람에게 넘기는 유스케이스는 없다 — 운영자는 오류 알림만 받는다. 「AI 모델」은 아직 정하지 않았다(로컬 · API 시험 중).</text></svg></div></div></body></html>
