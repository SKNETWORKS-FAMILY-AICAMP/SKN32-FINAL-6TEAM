<?xml version="1.0" encoding="utf-8"?><svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1528 682" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="guguroute 유스케이스 전체 한 장"><defs><marker id="vee" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 Z"/></marker><marker id="vee-gold" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow-gold" d="M0 0 L8 4 L0 8 Z"/></marker><marker id="tri" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path class="tri" d="M0 0 L12 6 L0 12 Z"/></marker></defs><style>
:root{--paper:#fbfcfd;--paper-2:#f1f4f8;--card:#ffffff;--ink:#161c28;--muted:#606b7e;--soft:#727d90;--rule-solid:#dbe0ea;
--accent:#a8720c;--accent-tint:rgba(168,114,12,.08);--accent-rule:rgba(168,114,12,.38);--blue-rule:rgba(47,108,154,.30);--blue-tint:rgba(47,108,154,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15181d;--paper-2:#20252d;--card:#1a1f26;--ink:#e9edf3;--muted:#b0bac9;--soft:#9aa6b9;
--rule-solid:#39424f;--accent:#e4b45c;--accent-tint:rgba(228,180,92,.09);--accent-rule:rgba(228,180,92,.42)}}
body{margin:0;background:var(--paper);color:var(--ink)}
.wrap{max-width:1528px;margin:0 auto;padding:16px}
.diagram{border:1px solid var(--rule-solid);border-radius:6px;background:var(--card);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:1100px;height:auto;color:var(--ink)}
.diagram .sys-frame{fill:none;stroke:var(--rule-solid);stroke-width:1.2}
.diagram .group-frame{fill:var(--paper-2);stroke:var(--rule-solid)}
.diagram .group-frame.gold{fill:var(--accent-tint);stroke:var(--accent-rule)}
.diagram .group-frame.blue{fill:var(--blue-tint);stroke:var(--blue-rule)}
.diagram .node{fill:var(--card);stroke:var(--rule-solid)}
.diagram .core-node{fill:#fbf6ec;stroke:var(--accent-rule)}
.diagram .ext-node{fill:var(--card);stroke:var(--accent-rule);stroke-dasharray:5 4}
.diagram .proxy-node{fill:var(--paper);stroke:var(--soft);stroke-dasharray:3 3}
.diagram .edge{fill:none;stroke:var(--muted);stroke-width:1.15;stroke-linejoin:round}
.diagram .edge.inc{stroke-dasharray:5 4}
.diagram .edge.ext{stroke:var(--accent);stroke-dasharray:5 4;opacity:.85}
.diagram .arrow{fill:var(--muted)} .diagram .arrow-gold{fill:var(--accent)} .diagram .tri{fill:var(--card);stroke:var(--muted);stroke-width:1.2}
.diagram .icon{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram text{fill:currentColor;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px}
.diagram .title{font-size:22px;font-weight:700}
.diagram .svg-label{fill:var(--soft);font-family:'NanumGothicCoding','Consolas',monospace;font-size:12px;letter-spacing:.08em}
.diagram .svg-note{fill:var(--muted);font-size:12px}
.diagram .svg-letter{fill:var(--accent);font-family:'NanumGothicCoding','Consolas',monospace;font-size:12px}
</style><text class="svg-label" x="40" y="40">사람 · 앱</text><text class="svg-label" x="310" y="40">유스케이스 — guguroute</text><text class="svg-label" x="1262" y="40">시스템 행위자</text><text class="title" x="40" y="80">D · 자동 관리 — 시계가 깨워 여행 끝까지 돈다</text><text class="svg-note" x="40" y="104">v3 · 2026-10-02 · 실제 API · 코드 기준 · 실선 = 연관 · 회색 점선 → = 반드시 쓰는 공통 기능(«include») · 금색 점선 → = 조건이 맞을 때만(«extend») · 빈 삼각형 = 일반화 · 금색 상자 = 핵심 처리 · 점선 상자 = 다른 구역 참조</text><rect class="sys-frame" x="300" y="116" width="912" height="508" rx="10"/><rect class="group-frame blue" x="310" y="128" width="892" height="484" rx="8"/><text class="svg-label" x="328" y="152">D · 자동 관리 — 시계가 깨워 여행 끝까지 돈다</text><rect class="node" x="330" y="168" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="192">UC-10</text><text x="392" y="192">외부 변화 감시</text><text class="svg-note" x="346" y="212">3분마다</text><rect class="proxy-node" x="330" y="242" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="266">UC-12</text><text x="392" y="266">일정 조율 — C 구역</text><text class="svg-note" x="346" y="286">↑ 반드시 거친다(위 C)</text><rect class="node" x="330" y="316" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="340">UC-11</text><text x="392" y="340">새벽 정기 점검</text><text class="svg-note" x="346" y="360">03:00~08:00 · 하루 한 번</text><rect class="node" x="330" y="390" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="414">UC-15</text><text x="392" y="414">일정 알림 보내기</text><text class="svg-note" x="346" y="434">하루 시작 · 다음 일정 · 출발</text><rect class="node" x="330" y="538" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="562">UC-16</text><text x="392" y="562">오류 알림 받기</text><text class="svg-note" x="346" y="582">상시 작업이 연속 실패할 때</text><rect class="node" x="630" y="168" width="250" height="56" rx="6"/><text x="646" y="192">소스 수집</text><text class="svg-note" x="646" y="212">소스마다 한 번 · 값 · 지문</text><rect class="node" x="630" y="242" width="250" height="56" rx="6"/><text x="646" y="266">바뀐 값에 걸린 항목</text><text class="svg-note" x="646" y="286">변화 없으면 사건 0 · 알림 0</text><rect class="node" x="630" y="316" width="250" height="56" rx="6"/><text x="646" y="340">영업시간 조회</text><text class="svg-note" x="646" y="360">계획한 시각에 여나</text><rect class="node" x="630" y="390" width="250" height="56" rx="6"/><text x="646" y="414">출발 시각 계산</text><text class="svg-note" x="646" y="434">다음 시작 − 이동 − 여유</text><rect class="node" x="630" y="464" width="250" height="56" rx="6"/><text x="646" y="488">문구틀 번역</text><text class="svg-note" x="646" y="508">언어마다 처음 한 번</text><rect class="node" x="630" y="538" width="250" height="56" rx="6"/><text x="646" y="562">알림 배달</text><text class="svg-note" x="646" y="582">3번까지 다시 · 중복 0</text><rect class="ext-node" x="940" y="168" width="250" height="56" rx="6"/><text x="956" y="192">대체 소스로 다시 읽기</text><text class="svg-note" x="956" y="212">1차 실패 시 · 대체도 실패면 오류</text><rect class="node" x="40" y="252" width="210" height="80" rx="6"/><g class="icon"><circle cx="65" cy="279" r="10"/><path d="M65 273 V279 L70 282"/></g><text x="90" y="278">시계</text><text class="svg-note" x="90" y="298">3분 · 03:00 · 1분</text><text class="svg-note" x="90" y="316">알림 보낼 시각</text><rect class="node" x="40" y="535" width="210" height="62" rx="6"/><g class="icon"><circle cx="65" cy="554" r="5"/><path d="M65 559 V573 M55 565 H75 M65 573 L58 583 M65 573 L72 583"/></g><text x="90" y="561">운영자</text><text class="svg-note" x="90" y="581">오류 알림만 받는다</text><rect class="node" x="1262" y="148" width="236" height="80" rx="6"/><g class="icon"><ellipse cx="1287" cy="166" rx="10" ry="4"/><path d="M1277 166 V186 M1297 166 V186 M1277 176 Q1287 182 1297 176 M1277 186 Q1287 192 1297 186"/></g><text x="1312" y="174">외부 데이터 6종</text><text class="svg-note" x="1312" y="194">날씨 · 특보 · 예보</text><text class="svg-note" x="1312" y="212">재난문자 · 교통 2</text><rect class="node" x="1262" y="316" width="236" height="62" rx="6"/><g class="icon"><ellipse cx="1287" cy="334" rx="10" ry="4"/><path d="M1277 334 V354 M1297 334 V354 M1277 344 Q1287 350 1297 344 M1277 354 Q1287 360 1297 354"/></g><text x="1312" y="342">장소 · 영업 정보</text><text class="svg-note" x="1312" y="362">같은 행위자 · Google(새벽만)</text><rect class="node" x="1262" y="464" width="236" height="62" rx="6"/><g class="icon"><path d="M1287 478 V504 M1274 491 H1300 M1278 482 L1296 500 M1296 482 L1278 500"/></g><text x="1312" y="490">AI 모델</text><text class="svg-note" x="1312" y="510">같은 행위자 · 시험 중</text><rect class="node" x="1262" y="542" width="236" height="62" rx="6"/><g class="icon"><path d="M1279 577 V568 A8 8 0 0 1 1295 568 V577 H1276 H1298 M1285 582 H1289"/></g><text x="1312" y="568">알림 채널</text><text class="svg-note" x="1312" y="588">같은 행위자 · 디스코드</text><path class="edge" d="M250 292.0 L282 292.0 L282 188 L330 188"/><path class="edge" d="M250 292.0 L282 292.0 L282 336 L330 336"/><path class="edge" d="M250 292.0 L282 292.0 L282 410 L330 410"/><path class="edge" d="M250 292.0 L282 292.0 L282 558 L330 558"/><path class="edge" d="M250 578 L330 578"/><path class="edge inc" d="M455 224 L455 242" marker-end="url(#vee)"/><path class="edge inc" d="M455 316 L455 298" marker-end="url(#vee)"/><path class="edge inc" d="M580 196 L630 196" marker-end="url(#vee)"/><path class="edge inc" d="M580 212 L605 212 L605 270 L630 270" marker-end="url(#vee)"/><path class="edge inc" d="M580 344 L630 344" marker-end="url(#vee)"/><path class="edge inc" d="M580 418 L630 418" marker-end="url(#vee)"/><path class="edge inc" d="M580 434 L612 434 L612 492 L630 492" marker-end="url(#vee)"/><path class="edge inc" d="M612 492 L612 566 L630 566" marker-end="url(#vee)"/><path class="edge ext" d="M940 196 L882 196" marker-end="url(#vee-gold)"/><path class="edge" d="M755 168 L755 156 L1262 156"/><path class="edge" d="M1190 196 L1262 196"/><path class="edge" d="M880 344 L1262 344"/><path class="edge" d="M880 492 L1262 492"/><path class="edge" d="M880 566 L1262 570"/><text class="svg-note" x="40" y="658">AI 모델 · 장소 정보 · 알림 채널은 같은 행위자를 구역마다 옆에 다시 그렸다. 고객 건을 사람에게 넘기는 유스케이스는 없다 — 운영자는 오류 알림만 받는다. 「AI 모델」은 아직 정하지 않았다(로컬 · API 시험 중).</text></svg>