<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>triPilot 유스케이스 한 장 v3</title><style>
:root{--paper:#fbfcfd;--paper-2:#f1f4f8;--card:#ffffff;--ink:#161c28;--muted:#606b7e;--soft:#727d90;--rule-solid:#dbe0ea;
--accent:#a8720c;--accent-tint:rgba(168,114,12,.08);--accent-rule:rgba(168,114,12,.38);--blue-rule:rgba(47,108,154,.30);--blue-tint:rgba(47,108,154,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15181d;--paper-2:#20252d;--card:#1a1f26;--ink:#e9edf3;--muted:#b0bac9;--soft:#9aa6b9;
--rule-solid:#39424f;--accent:#e4b45c;--accent-tint:rgba(228,180,92,.09);--accent-rule:rgba(228,180,92,.42)}}
body{margin:0;background:var(--paper);color:var(--ink)}
.wrap{max-width:1528px;margin:0 auto;padding:16px}
.diagram{border:1px solid var(--rule-solid);border-radius:6px;background:var(--card);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:1100px;height:auto;color:var(--ink)}
.diagram .sys-frame{fill:none;stroke:var(--rule-solid);stroke-width:1.2}
.diagram .group-frame{fill:var(--paper-2);stroke:var(--rule-solid)}
.diagram .group-frame.gold{fill:var(--accent-tint);stroke:var(--accent-rule)}
.diagram .group-frame.blue{fill:var(--blue-tint);stroke:var(--blue-rule)}
.diagram .node{fill:var(--card);stroke:var(--rule-solid)}
.diagram .core-node{fill:#fbf6ec;stroke:var(--accent-rule)}
.diagram .ext-node{fill:var(--card);stroke:var(--accent-rule);stroke-dasharray:5 4}
.diagram .proxy-node{fill:var(--paper);stroke:var(--soft);stroke-dasharray:3 3}
.diagram .edge{fill:none;stroke:var(--muted);stroke-width:1.15;stroke-linejoin:round}
.diagram .edge.inc{stroke-dasharray:5 4}
.diagram .edge.ext{stroke:var(--accent);stroke-dasharray:5 4;opacity:.85}
.diagram .arrow{fill:var(--muted)} .diagram .arrow-gold{fill:var(--accent)} .diagram .tri{fill:var(--card);stroke:var(--muted);stroke-width:1.2}
.diagram .icon{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram text{fill:currentColor;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px}
.diagram .title{font-size:22px;font-weight:700}
.diagram .svg-label{fill:var(--soft);font-family:'NanumGothicCoding','Consolas',monospace;font-size:12px;letter-spacing:.08em}
.diagram .svg-note{fill:var(--muted);font-size:12px}
.diagram .svg-letter{fill:var(--accent);font-family:'NanumGothicCoding','Consolas',monospace;font-size:12px}

90" width="250" height="56" rx="6"/><text class="svg-letter" x="346" y="414">UC-05</text><text x="392" y="414">여행계획서 보기</text><text class="svg-note" x="346" y="434">로그인 없는 링크 · 늘 최신</text><rect class="node" x="630" y="242" width="250" height="56" rx="6"/><text x="646" y="266">여행 등록 · 계획서 링크</text><text class="svg-note" x="646" y="286">등록하면 링크가 바로 생김</text><rect class="core-node" x="630" y="316" width="250" height="56" rx="6"/><text x="646" y="340">계획 읽기</text><text class="svg-note" x="646" y="360">매니저의 처리 단계 · 값 + 근거</text><rect class="ext-node" x="630" y="390" width="250" height="56" rx="6"/><text class="svg-letter" x="646" y="414">UC-04</text><text x="692" y="414">일정 짜 달라고 하기</text><text class="svg-note" x="646" y="434">계획이 비었거나 「일정 짜 줘」</text><rect class="node" x="940" y="168" width="250" height="56" rx="6"/><text x="956" y="192">장소 하나로 정하기</text><text class="svg-note" x="956" y="212">표 → 별칭 → 오타 → 외부</text><rect class="node" x="940" y="242" width="250" height="56" rx="6"/><text x="956" y="266">정해진 모양 읽기</text><text class="svg-note" x="956" y="286">코드: 시각 · 일차 · 예약번호</text><rect class="node" x="940" y="316" width="250" height="56" rx="6"/><text x="956" y="340">원문 위치 가리키기</text><text class="svg-note" x="956" y="360">AI: 남은 줄만 · 없으면 버림</text><rect class="ext-node" x="940" y="390" width="250" height="56" rx="6"/><text x="956" y="414">사진 받아쓰기</text><text class="svg-note" x="956" y="434">한 줄씩 · 두 번 대조</text><rect class="node" x="40" y="174" width="210" height="62" rx="6"/><g class="icon"><circle cx="65" cy="193" r="5"/><path d="M65 198 V212 M55 204 H75 M65 212 L58 222 M65 212 L72 222"/></g><text x="90" y="200">여행자</text><text class="svg-note" x="90" y="220">국적 무관 자유여행자</text><rect class="node" x="40" y="312" width="210" height="62" rx="6"/><g class="icon"><rect x="54" y="333" width="22" height="19" rx="4"/><path d="M65 326 V333 M60 341 H62 M68 341 H70 M60 347 H70"/></g><text x="90" y="338">개인 AI 비서 앱</text><text class="svg-note" x="90" y="358">우리 API로 연결</text><rect c <text class="svg-note" x="40" y="510">AI 모델 · 장소 정보 · 알림 채널은 같은 행위자를 구역마다 옆에 다시 그렸다. 고객 건을 사람에게 넘기는 유스케이스는 없다 — 운영자는 오류 알림만 받는다. 「AI 모델」은 아직 정하지 않았다(로컬 · API 시험 중).</text></svg></div></div></body></html>
