" y="1170">운영자</text><text class="svg-note" x="90" y="1188">오류 알림만 받는다</text><path class="edge" d="M240.0 206.0 L330.0 206.0"/><path class="edge" d="M240.0 302.0 L330.0 302.0"/><path class="edge" d="M240.0 618.0 L285.0 618.0"/><path class="edge" d="M285 398 V878"/><path class="edge" d="M285.0 398.0 L330.0 398.0"/><path class="edge" d="M285.0 494.0 L330.0 494.0"/><path class="edge" d="M285.0 686.0 L330.0 686.0"/><path class="edge" d="M285.0 782.0 L330.0 782.0"/><path class="edge" d="M285.0 878.0 L330.0 878.0"/><path class="edge" d="M240.0 974.0 L330.0 974.0"/><path class="edge" d="M240.0 1070.0 L330.0 1070.0"/><path class="edge" d="M240.0 1166.0 L330.0 1166.0"/><path class="edge" d="M110.0 240.0 L110.0 271.0" marker-end="url(#tri)"/><path class="edge" d="M40.0 206.0 L22.0 206.0 L22.0 618.0 L39.0 618.0" marker-end="url(#tri)"/><path class="edge" d="M140.0 436.0 L140.0 575.0" marker-end="url(#tri)"/><path class="edge ext" d="M465.0 554.0 L465.0 531.0" marker-end="url(#vee-gold)"/><text class="rel gold" x="459.0" y="546.0" text-anchor="end">«extend»</text><path class="note" d="M650 558 H902 L912 568 V623 H650 Z M902 558 V568 H912"/><text class="svg-note" x="660" y="578">확장점: 계획을 읽은 뒤</text><text class="svg-note" x="660" y="595">조건: 계획이 비었거나</text><text class="svg-note" x="660" y="612">「일정 짜 줘」를 골랐다</text><path class="edge anchor" d="M650 590.5 L465.0 542.0"/><path class="edge inc" d="M594.7 792.0 L625.0 792.0 L625.0 860.0 L668.1 860.0" marker-end="url(#vee)"/><text class="rel" x="621" y="830" text-anchor="end">«include»</text><path class="edge inc" d="M599.2 882.0 L649.8 882.0" marker-end="url(#vee)"/><text class="rel" x="625" y="897" text-anchor="middle">«include»</text><path class="edge ext" d="M785.0 818.0 L785.0 841.0" marker-end="url(#vee-gold)"/><text class="rel gold" x="779.0" y="834.0" text-anchor="end">«extend»</text><path class="note" d="M960 748 H1220 L1230 758 V813 H960 Z M1220 748 V758 H1230"/><text class="svg-note" x="970" y="768">확장점: 변경 저장 직전</text><text 드 — 지금은</text><text class="svg-note" x="1322" y="1110">팀 시연 채널 하나</text><path class="edge" d="M600.0 398.0 L1272.0 398.0"/><path class="edge" d="M581.9 476.0 L1272.0 476.0"/><path class="edge" d="M577.2 514.0 L1272.0 514.0"/><path class="edge" d="M891.9 856.0 L1272.0 856.0"/><path class="edge" d="M897.2 898.0 L1250.0 898.0 L1250.0 1052.0 L1272.0 1052.0"/><path class="edge" d="M585.9 990.0 L1244.0 990.0 A6 6 0 0 1 1256.0 990.0 L1272.0 990.0"/><path class="edge" d="M599.2 1074.0 L1272.0 1074.0"/><path class="edge" d="M599.2 1170.0 L1272.0 1170.0"/><text class="svg-note" x="40" y="1250">실선 = 연관(액터가 그 유스케이스에 참여 — 순서가 아님) · 회색 점선 «include» = 반드시 · 여러 유스케이스가 공통으로(기본 → 포함) · 금색 점선 «extend» = 조건이 맞을 때만(확장 → 기본, 확장점 · 조건은 노트) · 빈 삼각형 = 일반화</text><text class="svg-note" x="40" y="1270">요청자(기울임) = 추상 액터: 여행자와 개인 AI 비서 앱이 같은 일을 한다 · 외부 정보 서비스 앞에서 선이 반원으로 건너뛰는 곳은 서로 이어지지 않는다 · 고객 건을 사람에게 넘기는 유스케이스는 없다</text></svg></div></div></body></html>
