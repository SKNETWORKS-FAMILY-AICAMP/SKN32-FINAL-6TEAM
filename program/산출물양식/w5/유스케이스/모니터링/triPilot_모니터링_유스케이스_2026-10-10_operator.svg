<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" aria-labelledby="monitoring-operator-title monitoring-operator-desc"><title id="monitoring-operator-title">운영자 목표와 참여 액터</title><desc id="monitoring-operator-desc">triPilot 모니터링의 운영자 목표와 외부 액터의 참여 관계를 보여준다. 연결선은 실행 순서가 아니다.</desc><style>
    :root{color-scheme:light dark;--paper:light-dark(#fbfcfd,#141821);--ink:light-dark(#161c28,#e9edf4);--muted:light-dark(#6b7488,#9aa4b6);--rule:light-dark(#dbe0ea,#4c5260);--accent:light-dark(#a8720c,#d9a441)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,'Noto Sans KR','Malgun Gothic',sans-serif;font-size:16px;line-height:1.75}main{max-width:1160px;margin:auto;padding:32px 24px 64px}h1,h2,h3{line-height:1.4}h1{font-family:'Instrument Serif','Noto Serif KR',serif}h2{margin-top:48px;border-top:1px solid var(--rule);padding-top:24px}h3{margin-top:40px;color:var(--accent)}a{color:inherit;text-underline-offset:3px}table{border-collapse:collapse;width:100%;margin:16px 0 24px;font-size:15px}th,td{border-bottom:1px solid var(--rule);padding:12px;text-align:left;vertical-align:top}th{font-weight:600}td:first-child{min-width:120px}li{margin:8px 0}figure{margin:24px 0}svg{display:block;width:100%;height:auto}.boundary{fill:none;stroke:var(--ink);stroke-width:1.2}.actor,.goal{fill:var(--paper);stroke:var(--ink);stroke-width:1}.association{fill:none;stroke:var(--muted);stroke-width:1}.label{fill:var(--ink);font-size:16px;font-weight:500}.uc-id,.actor-type,.legend{fill:var(--muted);font-size:12px}.boundary-name{fill:var(--ink);font-size:16px;font-weight:600}.legend-rule{stroke:var(--rule);stroke-width:1}p,li,td{overflow-wrap:anywhere}@media(max-width:700px){main{padding:16px 12px}table{font-size:14px}th,td{padding:8px}td:first-child{min-width:80px}.diagrams figure{overflow-x:auto}.diagrams svg{width:1120px;max-width:none}}@media print{body{color:#161c28;background:#fbfcfd}main{padding:0}h3{break-after:avoid}tr{break-inside:avoid}.diagrams svg{width:100%;max-width:100%}}
    </style><rect class="boundary" x="280" y="48" width="552" height="552" rx="8"/><text x="296" y="80" class="boundary-name" text-anchor="start">triPilot · 모니터링</text><path class="association" d="M220 148 H348"/><path class="association" d="M220 248 H348"/><path class="association" d="M220 348 H348"/><path class="association" d="M220 448 H348"/><path class="association" d="M764 348 H880"/><path class="association" d="M764 448 H880"/><path class="association" d="M220 548 H548 Q556 548 556 540 V492"/><rect class="actor" x="40" y="108" width="180" height="380" rx="6"/><text x="130" y="270" class="actor-type" text-anchor="middle">«actor»</text><text x="130" y="298" class="label" text-anchor="middle">운영자</text><rect class="actor" x="40" y="508" width="180" height="80" rx="6"/><text x="130" y="520" class="actor-type" text-anchor="middle">«actor»</text><text x="130" y="548" class="label" text-anchor="middle">시간</text><text x="130" y="572" class="label" text-anchor="middle">장애 보고 시점</text><rect class="actor" x="880" y="308" width="200" height="80" rx="6"/><text x="980" y="320" class="actor-type" text-anchor="middle">«actor»</text><text x="980" y="348" class="label" text-anchor="middle">외부 정보 서비스</text><rect class="actor" x="880" y="408" width="200" height="80" rx="6"/><text x="980" y="420" class="actor-type" text-anchor="middle">«actor»</text><text x="980" y="448" class="label" text-anchor="middle">운영 리포트 채널</text><text x="980" y="472" class="label" text-anchor="middle">개발용 Discord 등</text><ellipse class="goal" cx="556" cy="148" rx="208" ry="44"/><text x="556" y="128" class="uc-id" text-anchor="middle">UC-M06</text><text x="556" y="152" class="label" text-anchor="middle">현재와 과거의 감시</text><text x="556" y="172" class="label" text-anchor="middle">상태를 파악한다</text><ellipse class="goal" cx="556" cy="248" rx="208" ry="44"/><text x="556" y="228" class="uc-id" text-anchor="middle">UC-M07</text><text x="556" y="252" class="label" text-anchor="middle">감시에 쓰는 정보의</text><text x="556" y="272" class="label" text-anchor="middle">사용 한도를 파악한다</text><ellipse class="goal" cx="556" cy="348" rx="208" ry="44"/><text x="556" y="328" class="uc-id" text-anchor="middle">UC-M08</text><text x="556" y="352" class="label" text-anchor="middle">재난 상황에서 여행 안내와</text><text x="556" y="372" class="label" text-anchor="middle">대응을 시험한다</text><ellipse class="goal" cx="556" cy="448" rx="208" ry="44"/><text x="556" y="428" class="uc-id" text-anchor="middle">UC-M09</text><text x="556" y="452" class="label" text-anchor="middle">감시 운영의 장애와</text><text x="556" y="472" class="label" text-anchor="middle">복구를 알아챈다</text><path class="legend-rule" d="M40 624 H1080"/><text x="40" y="652" class="legend" text-anchor="start">실선: 액터의 참여 관계 · 타원: 사용자 목표 · 사각 경계: triPilot의 책임 범위</text></svg>