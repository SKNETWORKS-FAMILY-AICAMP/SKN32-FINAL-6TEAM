<title id="ctx-title">triPilot 시스템 전체 관계도 — 누가 쓰고 무엇과 연결되나</title>
<desc id="ctx-desc">고객은 웹으로, 고객의 개인 AI 는 MCP 로 triPilot 에 붙는다. triPilot 은 외부 정보 6종 · 장소 정보 · 언어 모델을 읽어 일정을 검증하고 지키며, 바뀐 것은 디스코드로 알린다.</desc>
