<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ctr-title ctr-desc">
<title id="ctr-title">guguroute 컨테이너도 — 무엇이 따로 뜨고 무엇으로 이어지나</title>
<desc id="ctr-desc">고객의 웹 브라우저와 개인 AI 는 HTTPS 프록시를 거쳐 웹 · API 에 닿는다. API 안에 오케스트레이터 · 에이전트 · 이동 판정기 · MCP 서버가 있고, 백그라운드 워커가 1분마다 모니터링 · 되잡기 · 알림 보내기를 돌린다. 둘 다 같은 PostgreSQL 을 쓴다.</desc>
